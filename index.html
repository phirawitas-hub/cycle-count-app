function testRule() {
  const res = Q('test-result');
  if (!res) return;
  const ohv = Q('test-oh')?.value;
  const oh = ohv === '' ? null : parseFloat(ohv);
  const pick = id => { const v = Q(id)?.value; return (v===undefined||v==='') ? null : parseFloat(v); };
  const r1 = pick('test-r1'), r2 = pick('test-r2'), r3 = pick('test-r3');
  const maxRounds = parseInt(Q('rule-maxrounds')?.value || '3');
  const action = Q('rule-repeataction')?.value || 'recount';
  const st = r1 === null ? '' : computeItemStatus(oh, r1, r2, r3, { maxRounds, repeatMatchAction: action });

  const MAP = {
    OK:      ['✅ ผ่าน (ปิดงานได้เลย)',        '#14532d', '#D4E2D4'],
    PENDING: ['🔄 นับใหม่ (รอนับรอบถัดไป)',      '#92400e', '#FEF3C7'],
    Diff:    ['❌ ไม่ผ่าน — ส่งเคลียร์กับหัวหน้า', '#991b1b', '#FFD0D0'],
    '':      ['— กรอก Count 1 อย่างน้อยก่อน',    '#64748b', '#f1f5f9'],
  };
  const [txt, color, bg] = MAP[st] || [st, '#000', '#fff'];
  res.textContent = txt;
  res.style.color = color;
  res.style.background = bg;
}

function closeRulesModal() {
  Q('rulesModalOverlay')?.remove();
}

async function syncCountingRules() {
  const sid = Q('rules-modal-sess')?.value;
  if (!sid) return;
  const { data } = await sb.from('count_sessions').select('max_rounds,repeat_match_action').eq('id', sid).single();
  const mr = Q('rule-maxrounds'), ra = Q('rule-repeataction');
  if (mr) mr.value = String(data?.max_rounds === 1 ? 1 : data?.max_rounds === 2 ? 2 : 3);
  if (ra) ra.value = data?.repeat_match_action || 'recount';
  onMaxRoundsChange(true);
}

async function saveCountingRules() {
  const sid = Q('rules-modal-sess')?.value;
  const al  = Q('rule-alert');
  if (!sid) return;
  const maxRounds = parseInt(Q('rule-maxrounds')?.value || '3');
  const action    = Q('rule-repeataction')?.value || 'recount';

  const { error } = await sb.from('count_sessions')
    .update({ max_rounds: maxRounds, repeat_match_action: action }).eq('id', sid);

  if (error) {
    if (al) al.innerHTML = `<div class="alert alert-red" style="font-size:12px;margin-bottom:0">❌ บันทึกกติกาไม่สำเร็จ: ${error.message}<br>ลองตรวจสอบว่ารัน migration เพิ่มคอลัมน์ max_rounds/repeat_match_action ในตาราง count_sessions แล้วหรือยัง</div>`;
    return;
  }
  if (al) {
    al.innerHTML = `<div class="alert alert-green" style="font-size:12px;margin-bottom:0">✅ บันทึกกติกาแล้ว — มีผลกับการนับครั้งถัดไป</div>`;
    setTimeout(() => { al.innerHTML = ''; }, 2500);
  }
}

async function refreshR23Preview() {
  const sid    = Q('as-sess')?.value;
  const status = Q('r23-round')?.value || 'round1_done';
  const zone   = Q('r23-zone')?.value || '';
  const row    = Q('r23-row')?.value  || '';
  const prev   = Q('r23-preview'), btn = Q('r23-btn');
  if (!sid || !prev || !btn) return;

  let q = sb.from('assignments')
    .select('id,session_id,location_id,assigned_to,locations(zone,row_no)')
    .eq('session_id', sid).eq('status', status);
  const { data: asgns, error } = await q;

  // Populate zone/row dropdowns from results
  const zones = new Set(), rows = new Set();
  asgns?.forEach(a => { if (a.locations?.zone) zones.add(a.locations.zone); if (a.locations?.row_no) rows.add(a.locations.row_no); });
  const fillSel = (id, vals) => {
    const el = Q(id); if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">ทั้งหมด</option>' + [...vals].sort().map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join('');
  };
  fillSel('r23-zone', zones);
  fillSel('r23-row',  rows);

  const filtered = (asgns||[]).filter(a => {
    if (zone && a.locations?.zone !== zone) return false;
    if (row  && a.locations?.row_no !== row) return false;
    return true;
  });
  window._r23Asgns = filtered;

  if (!filtered.length) {
    prev.innerHTML = `<span style="color:#94a3b8">ไม่มี Location ในสถานะที่เลือก</span>`;
    btn.disabled = true;
  } else {
    const label = { round1_done:'รอบ 2', round2_done:'รอบ 3', round3_done:'รอบ Sup' }[status]||status;
    prev.innerHTML = `📍 พบ <strong>${filtered.length}</strong> locations รอ${label}`;
    btn.disabled = false;
  }
}

async function doR23Assign() {
  const uid   = Q('r23-user')?.value;
  const asgns = window._r23Asgns || [];
  if (!uid || !asgns.length) return;

  Q('r23-btn').disabled = true;
  Q('r23-preview').innerHTML = `<span>⏳ กำลังอัปเดต ${asgns.length} assignments...</span>`;

  const newLabel = Q('r23-user').options[Q('r23-user').selectedIndex]?.textContent || '';
  const BATCH = 200;
  for (let i = 0; i < asgns.length; i += BATCH) {
    const chunk = asgns.slice(i, i+BATCH);
    for (const a of chunk) {
      await sb.from('assignments').update({ assigned_to: uid }).eq('id', a.id);
      logAudit(a.session_id, a.location_id, null, 'reassign', a.assigned_to, newLabel, a.id);
    }
  }
  Q('r23-preview').innerHTML = `<span style="color:var(--vespa-green);font-weight:900">✅ เปลี่ยน Counter เรียบร้อย ${asgns.length} locations</span>`;
  Q('r23-btn').disabled = false;
  window._r23Asgns = [];
  refreshLocs();
}


async function refreshBulkFilters() {
  const sid = Q('as-sess')?.value;
  if (!sid) return;

  const [{ data: snaps }, { data: existing }] = await Promise.all([
    sb.from('stock_snapshot')
      .select('location_id,locations(id,code,zone,row_no,level)')
      .eq('session_id', sid),
    sb.from('assignments')
      .select('location_id').eq('session_id', sid),
  ]);

  const assignedSet = new Set(existing?.map(a => a.location_id) || []);
  const zones = new Set(), rows = new Set(), levels = new Set();
  const seen = new Set();

  for (const s of snaps || []) {
    const l = s.locations;
    if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    seen.add(l.id);
    if (l.zone)   zones.add(l.zone);
    if (l.row_no) rows.add(l.row_no);
    if (l.level)  levels.add(l.level);
  }

  const fill = (id, vals) => {
    const el = Q(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">ทั้งหมด</option>' +
      [...vals].sort().map(v => `<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join('');
  };
  fill('bulk-zone',  zones);
  fill('bulk-row',   rows);
  fill('bulk-level', levels);

  window._bulkSnaps    = snaps || [];
  window._bulkAssigned = assignedSet;
  refreshBulkPreview();
}

function refreshBulkPreview() {
  const zone  = Q('bulk-zone')?.value;
  const row   = Q('bulk-row')?.value;
  const level = Q('bulk-level')?.value;
  const snaps = window._bulkSnaps || [];
  const assignedSet = window._bulkAssigned || new Set();

  const seen = new Set();
  let count = 0;
  for (const s of snaps) {
    const l = s.locations;
    if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone  && l.zone   !== zone)  continue;
    if (row   && l.row_no !== row)   continue;
    if (level && l.level  !== level) continue;
    seen.add(l.id);
    count++;
  }

  const prev = Q('bulk-preview'), btn = Q('bulk-btn');
  if (!prev || !btn) return;
  if (count > 0) {
    prev.innerHTML = `📍 จะ Assign <strong>${count} locations</strong> ให้ Counter ที่เลือก`;
    btn.disabled = false;
  } else {
    prev.innerHTML = `<span style="color:#94a3b8">ไม่มี Location ที่ตรงเงื่อนไข (หรือถูก Assign แล้วทั้งหมด)</span>`;
    btn.disabled = true;
  }
}

async function doBulkAssign() {
  const sid   = Q('as-sess')?.value;
  const uid   = Q('bulk-user')?.value;
  const zone  = Q('bulk-zone')?.value;
  const row   = Q('bulk-row')?.value;
  const level = Q('bulk-level')?.value;
  const al = Q('aa'), btn = Q('bulk-btn');

  if (!sid || !uid) { al.innerHTML = `<div class="alert alert-red">เลือก Session และ Counter ก่อน</div>`; return; }

  const snaps = window._bulkSnaps || [];
  const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set(), toAssign = [];

  for (const s of snaps) {
    const l = s.locations;
    if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone  && l.zone   !== zone)  continue;
    if (row   && l.row_no !== row)   continue;
    if (level && l.level  !== level) continue;
    seen.add(l.id);
    toAssign.push({ session_id: sid, location_id: l.id, assigned_to: uid });
  }

  if (!toAssign.length) { al.innerHTML = `<div class="alert alert-amber">ไม่มี Location ที่จะ Assign</div>`; return; }

  btn.disabled = true;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลัง Assign ${toAssign.length} locations...</div>`;

  const BATCH = 200;
  for (let i = 0; i < toAssign.length; i += BATCH) {
    const { error } = await sb.from('assignments')
      .upsert(toAssign.slice(i, i+BATCH), { onConflict:'session_id,location_id' });
    if (error) { al.innerHTML = `<div class="alert alert-red">❌ ${error.message}</div>`; btn.disabled=false; return; }
  }

  al.innerHTML = `<div class="alert alert-green">✅ Assign ${toAssign.length} locations เรียบร้อย!</div>
    <button class="btn btn-ghost btn-sm" onclick='printCountForm(${JSON.stringify(toAssign.map(a=>a.location_id))},"${sid}")'>🖨️ พิมพ์ฟอร์มนับสำหรับ ${toAssign.length} Locations</button>`;
  setTimeout(() => { refreshLocs(); refreshBulkFilters(); }, 2000);
}

async function refreshLocs() {
  const sid = Q('as-sess')?.value;
  if (!sid) return;

  const [{ data: snaps }, { data: existing }] = await Promise.all([
    sb.from('stock_snapshot').select('location_id,locations(id,code,zone,area)').eq('session_id', sid),
    sb.from('assignments').select('location_id').eq('session_id', sid),
  ]);

  const assignedSet = new Set(existing?.map(a => a.location_id) || []);
  const seen = new Set();
  const locs = [];
  for (const s of snaps || []) {
    if (!seen.has(s.location_id) && s.locations) {
      seen.add(s.location_id);
      locs.push(s.locations);
    }
  }

  const free = locs.filter(l => !assignedSet.has(l.id));
  const sel  = Q('as-loc');
  if (sel) {
    sel.innerHTML = free.length
      ? free.map(l => `<option value="${l.id}">${l.code}${l.zone?' · '+l.zone:''}</option>`).join('')
      : '<option value="">ทุก Location ถูก Assign แล้ว</option>';
  }

  // แสดงรายการที่ Assign แล้ว
  const { data: asgns } = await sb.from('assignments')
    .select('id,status,locations(code),profiles!assigned_to(name)')
    .eq('session_id', sid).order('created_at');

  const al = Q('al');
  if (!al) return;

  if (!asgns?.length) {
    al.innerHTML = `<div class="load" style="padding:16px;font-size:13px;color:#94a3b8">ยังไม่มีการ Assign</div>`;
    return;
  }

  const stuckCount = asgns.filter(a => !['completed','approved'].includes(a.status)).length;
  let html = '';
  if (stuckCount > 0) {
    html += `<div style="padding:10px 14px;background:#fff7ed;border-bottom:1px solid #fed7aa">
      <button class="btn btn-ghost btn-sm" style="color:#c2410c;border-color:#fed7aa"
        onclick="deleteStuckAssignments()">🗑 ลบที่ยังไม่เสร็จทั้งหมด (${stuckCount})</button>
    </div>`;
  }
  html += asgns.map(a => {
    const si = tagInfo(a.status);
    const code = (a.locations?.code || '').replace(/'/g, '');
    return `<div class="row" style="cursor:default">
      <div class="row-body">
        <div class="row-title mono">${a.locations?.code}</div>
        <div class="row-sub">${a.profiles?.name || '?'}</div>
      </div>
      <span class="tag ${si.cls}">${si.lbl}</span>
      <button onclick="deleteAssignment('${a.id}','${code}')" title="ลบ Assignment นี้"
        style="background:none;border:none;color:#cbd5e1;font-size:16px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0">🗑</button>
    </div>`;
  }).join('');
  al.innerHTML = html;
}

async function deleteAssignment(id, code) {
  if (!confirm(`ลบ Assignment ของ "${code}"?\n\nข้อมูลการนับ (ถ้ามี) จะถูกลบไปด้วย — ยอด Stock เดิม (Snapshot) ไม่ถูกลบ\nLocation นี้จะกลับมา "ว่าง" พร้อม Assign ใหม่ได้ทันที`)) return;
  const { error } = await sb.from('assignments').delete().eq('id', id);
  if (error) { alert(error.message); return; }
  refreshLocs();
  refreshBulkFilters();
}

async function deleteStuckAssignments() {
  const sid = Q('as-sess')?.value;
  if (!sid) return;
  if (!confirm('ลบ Assignment ที่ "ยังไม่เสร็จ" ทั้งหมดใน Session นี้?\n\n(เฉพาะที่สถานะไม่ใช่ เสร็จ/อนุมัติแล้ว)\nLocation เหล่านี้จะกลับมาว่าง พร้อม Assign ใหม่ได้ทันที')) return;
  const { error } = await sb.from('assignments')
    .delete()
    .eq('session_id', sid)
    .not('status', 'in', '(completed,approved)');
  if (error) { alert(error.message); return; }
  refreshLocs();
  refreshBulkFilters();
}

function pfEscapeHtml(s) {
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function printCountForm(locationIds, sessionId) {
  if (!locationIds || !locationIds.length) return;

  const { data: sessData } = await sb.from('count_sessions').select('name').eq('id', sessionId).single();
  const sessionName = sessData?.name || 'Cycle Count';

  const [{ data: snaps }, { data: details }] = await Promise.all([
    sb.from('stock_snapshot')
      .select('location_id,item_id,locations(code),items(code,description)')
      .eq('session_id', sessionId).in('location_id', locationIds),
    sb.from('stock_snapshot_detail')
      .select('location_id,item_id,inventory_status')
      .eq('session_id', sessionId).in('location_id', locationIds),
  ]);

  const statusMap = {};
  (details||[]).forEach(d => {
    const key = d.location_id+'|'+d.item_id;
    if (!statusMap[key] && d.inventory_status) statusMap[key] = d.inventory_status;
  });

  const rows = (snaps||[]).map(s => ({
    locCode:  s.locations?.code || '?',
    itemCode: s.items?.code || '',
    desc:     s.items?.description || '',
    status:   statusMap[s.location_id+'|'+s.item_id] || '',
  })).sort((a,b) => a.locCode.localeCompare(b.locCode) || a.itemCode.localeCompare(b.itemCode));

  if (!rows.length) { alert('ไม่พบรายการสินค้าสำหรับ Location ที่เลือก'); return; }

  openPrintFormWindow(rows, sessionName);
}

function openPrintFormWindow(rows, title) {
  const ROWS_PER_PAGE = 24;
  const pages = [];
  for (let i = 0; i < rows.length; i += ROWS_PER_PAGE) pages.push(rows.slice(i, i+ROWS_PER_PAGE));
  if (!pages.length) pages.push([]);
  const totalPages = pages.length;
  const todayStr = new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });

  const pagesHtml = pages.map((pageRows, pIdx) => `
    <section class="pf-page">
      <header class="pf-header">
        <img class="pf-logo" src="${PF_LOGO_B64}" alt="logo">
        <div class="pf-title">${pfEscapeHtml(title)}</div>
        <div class="pf-meta"><div>${todayStr}</div><div>Page ${pIdx+1} / ${totalPages}</div></div>
      </header>
      <table class="pf-table">
        <thead><tr>
          <th style="width:11%">Location</th>
          <th style="width:13%">Item</th>
          <th style="width:23%">Description</th>
          <th style="width:9%">Inventory status</th>
          <th style="width:9%">Storage Template</th>
          <th style="width:8%">Count 1</th>
          <th style="width:8%">Count 2</th>
          <th style="width:8%">Count 3</th>
          <th style="width:11%">Remark</th>
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map(r => `<tr>
            <td>${pfEscapeHtml(r.locCode)}</td>
            <td>${pfEscapeHtml(r.itemCode)}</td>
            <td>${pfEscapeHtml(r.desc)}</td>
            <td>${pfEscapeHtml(r.status)}</td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;color:#888">ไม่มีรายการ</td></tr>`}
        </tbody>
      </table>
      <footer class="pf-footer">
        <div>ผู้ทำรายการ...........................</div>
        <div>เวลาเริ่ม...........................</div>
        <div>เวลาจบ...........................</div>
      </footer>
    </section>`).join('');

  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${pfEscapeHtml(title)}</title>
<style>
  @page { size: A4 landscape; margin: 8mm 6mm; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Arial, 'Sarabun', 'Tahoma', sans-serif; color:#000; }
  .pf-page { page-break-after: always; }
  .pf-page:last-child { page-break-after: auto; }
  .pf-header { display:flex; align-items:center; gap:14px; border-bottom:2.5px solid #000; padding-bottom:6px; margin-bottom:8px; }
  .pf-logo { height:42px; }
  .pf-title { flex:1; text-align:center; font-size:24px; font-weight:bold; }
  .pf-meta { font-size:11px; text-align:right; line-height:1.5; white-space:nowrap; }
  .pf-table { width:100%; border-collapse:collapse; font-size:11px; table-layout:fixed; }
  .pf-table th, .pf-table td { border:1px solid #000; padding:5px 6px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pf-table th { background:#f0f0f0; font-weight:bold; font-size:10.5px; }
  .pf-table td { height:22px; }
  .pf-footer { display:flex; justify-content:space-between; margin-top:12px; font-size:12px; }
  @media print { .pf-noprint { display:none; } }
</style>
</head>
<body>
  <div class="pf-noprint" style="padding:10px;background:#fffbe6;border-bottom:1px solid #ccc;font-family:sans-serif;font-size:13px">
    กำลังเปิดหน้าต่างพิมพ์... ถ้าไม่เด้งอัตโนมัติ กด Ctrl+P (หรือ Cmd+P บน Mac) เพื่อพิมพ์
  </div>
  ${pagesHtml}
  <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  if (!win) { alert('เบราว์เซอร์บล็อกป๊อปอัพ กรุณาอนุญาต popup สำหรับเว็บนี้แล้วลองใหม่'); return; }
  win.document.write(html);
  win.document.close();
}

async function doAssign() {
  const sid = Q('as-sess').value, uid = Q('as-user').value, lid = Q('as-loc').value;
  const al = Q('aa');
  if (!sid || !uid || !lid) { al.innerHTML = `<div class="alert alert-red">เลือกให้ครบก่อน</div>`; return; }

  const { error } = await sb.from('assignments')
    .insert({ session_id:sid, location_id:lid, assigned_to:uid });

  if (error) { al.innerHTML = `<div class="alert alert-red">${error.message}</div>`; return; }

  al.innerHTML = `<div class="alert alert-green">✅ Assign เรียบร้อย</div>
    <button class="btn btn-ghost btn-sm" onclick="printCountForm(['${lid}'],'${sid}')">🖨️ พิมพ์ฟอร์มนับสำหรับ Location นี้</button>`;
  refreshLocs();
  refreshBulkFilters();
}

async function loadAdHistory() {
  if (!['admin','supervisor'].includes(prof?.role)) { go('c-tasks'); return; }

  const { data: sessions } = await sb.from('count_sessions')
    .select('id,name').order('created_at',{ascending:false});

  const sOpts = '<option value="">ทุก Session</option>' +
    (sessions||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const sid = S._histSid || '';
  const cid = S._histCid || '';
  const st  = S._histSt  || '';
  const searchQ = S._histSearch || '';

  // Counter list
  const { data: counters } = await sb.from('profiles').select('id,name').order('name');
  const cOpts = '<option value="">ทุกคน</option>' +
    (counters||[]).map(u=>`<option value="${u.id}" ${u.id===cid?'selected':''}>${u.name}</option>`).join('');

  cnt().innerHTML = `
    <div class="card">
      <div style="font-size:13px;font-weight:900;color:var(--vespa-brown);margin-bottom:10px">🔍 กรองประวัติการนับ</div>
      <div class="fg" style="margin-bottom:10px">
        <label style="font-size:10px">ค้นหา Location / Item / LPN</label>
        <div style="display:flex;gap:8px">
          <input id="hist-search" value="${searchQ}" placeholder="เช่น B-EA-001-A, 2H002981, LPN..."
            onkeydown="if(event.key==='Enter'){S._histSearch=this.value;loadAdHistory();}">
          <button class="btn btn-blue btn-sm" onclick="S._histSearch=Q('hist-search').value;loadAdHistory()" style="flex-shrink:0">ค้นหา</button>
        </div>
      </div>
      <div class="grid-3" style="margin-bottom:8px">
        <div><label style="font-size:10px">SESSION</label>
          <select id="hist-sess" onchange="S._histSid=this.value;loadAdHistory()">${sOpts}</select></div>
        <div><label style="font-size:10px">COUNTER</label>
          <select id="hist-cnt" onchange="S._histCid=this.value;loadAdHistory()">${cOpts}</select></div>
        <div><label style="font-size:10px">สถานะ</label>
          <select id="hist-st" onchange="S._histSt=this.value;loadAdHistory()">
            <option value="">ทั้งหมด</option>
            <option value="completed">เสร็จ</option>
            <option value="approved">อนุมัติแล้ว</option>

            <option value="round2_done">รอรอบ 3</option>
            <option value="round3_done">รอ Supervisor</option>
          </select></div>
      </div>
    </div>
    <div id="hist-list"><div class="load">⏳ กำลังโหลด...</div></div>`;

  // Set initial select values
  if (Q('hist-sess') && sid) Q('hist-sess').value = sid;
  if (Q('hist-cnt')  && cid) Q('hist-cnt').value  = cid;
  if (Q('hist-st')   && st)  Q('hist-st').value   = st;

  let q = sb.from('assignments')
    .select('id,status,created_at,location_id,locations(code,zone),profiles!assigned_to(name),count_sessions(name)')
    .order('created_at',{ascending:false})
    .limit(100);
  if (sid) q = q.eq('session_id', sid);
  if (cid) q = q.eq('assigned_to', cid);
  if (st)  q = q.eq('status', st);

  let { data: asgns, error } = await q;
  const histList = Q('hist-list');
  if (!histList) return;
  if (error) { histList.innerHTML = errBox(error.message); return; }

  // ── กรองเพิ่มด้วยคำค้นหา (Location code / Item code / LPN) ──
  const term = searchQ.trim();
  if (term && asgns?.length) {
    const termLower = term.toLowerCase();
    const candidateLocIds = [...new Set(asgns.map(a => a.location_id).filter(Boolean))];

    const locIdsFromLoc = new Set(
      asgns.filter(a => (a.locations?.code||'').toLowerCase().includes(termLower)).map(a => a.location_id)
    );

    let locIdsFromItem = new Set(), locIdsFromLPN = new Set();
    if (candidateLocIds.length) {
      const { data: matchedItems } = await sb.from('items').select('id').ilike('code', `%${term}%`);
      const itemIds = (matchedItems||[]).map(i => i.id);
      if (itemIds.length) {
        const { data: snapMatches } = await sb.from('stock_snapshot')
          .select('location_id').in('location_id', candidateLocIds).in('item_id', itemIds);
        (snapMatches||[]).forEach(m => locIdsFromItem.add(m.location_id));
      }
      const { data: lpnMatches } = await sb.from('stock_snapshot_detail')
        .select('location_id').in('location_id', candidateLocIds).ilike('license_plate', `%${term}%`);
      (lpnMatches||[]).forEach(m => locIdsFromLPN.add(m.location_id));
    }

    const matchSet = new Set([...locIdsFromLoc, ...locIdsFromItem, ...locIdsFromLPN]);
    asgns = asgns.filter(a => matchSet.has(a.location_id));
  }

  if (!asgns?.length) { histList.innerHTML = `<div class="card" style="text-align:center;padding:32px;color:var(--vespa-brown)">ไม่พบข้อมูลตามเงื่อนไข</div>`; return; }

  histList.innerHTML = '<div class="card card-flush">' +
    asgns.map(a => {
      const si = tagInfo(a.status);
      return `<div class="row click" onclick="go('ad-txlog',{aid:'${a.id}'})">
        <div class="row-body">
          <div class="row-title mono">${a.locations?.code || '?'}</div>
          <div class="row-sub">${a.count_sessions?.name||''} · ${a.profiles?.name||'?'}</div>
          <div class="row-sub">${new Date(a.created_at).toLocaleString('th-TH')}</div>
        </div>
        <span class="tag ${si.cls}">${si.lbl}</span>
        <span class="caret">›</span>
      </div>`;
    }).join('') + '</div>';
}

async function loadAdTxLog() {
  const { aid } = S;
  if (!aid) { go('ad-history'); return; }

  const [{ data: asgn }, { data: recs }, { data: approvals, error: apprErr }] = await Promise.all([
    sb.from('assignments')
      .select('id,status,location_id,session_id,locations(code,zone),profiles!assigned_to(name),count_sessions(name)')
      .eq('id', aid).single(),
    sb.from('count_records')
      .select('item_id,round,count_qty,counted_at,remark,photo_url,counted_by,actual_counter_name,profiles!counted_by(name),actual_counter:profiles!actual_counter_id(name),items(code,description)')
      .eq('assignment_id', aid)
      .order('counted_at'),
    sb.from('variance_approvals')
      .select('item_id,final_qty,variance,resolution,approved_by,created_at,items(code,description),profiles!approved_by(name)')
      .eq('assignment_id', aid)
      .order('created_at'),
  ]);

  if (!asgn) { go('ad-history'); return; }

  const [{ data: snaps }, { data: auditRows, error: auditErr }, rules] = await Promise.all([
    sb.from('stock_snapshot')
      .select('item_id,onhand_qty,al_qty')
      .eq('session_id', asgn.session_id)
      .eq('location_id', asgn.location_id),
    sb.from('audit_log')
      .select('action,old_value,new_value,item_id,created_at,items(code,description),profiles!performed_by(name)')
      .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id)
      .order('created_at'),
    getSessionRules(asgn.session_id),
  ]);
  const ohMap = {};
  (snaps||[]).forEach(s => { ohMap[s.item_id] = { oh: +s.onhand_qty, al: s.al_qty }; });

  // ── เทียบยอดที่บันทึกไว้กับ OH ปัจจุบัน — เผื่อ OH ถูกแก้ทีหลัง หรือเคยปิดงานให้ทั้งที่ยอดไม่ตรง ──
  const byItemRounds = {};
  (recs||[]).forEach(r => {
    byItemRounds[r.item_id] = byItemRounds[r.item_id] || {};
    byItemRounds[r.item_id][r.round] = r.count_qty;
  });
  const mismatchItems = [];
  Object.entries(byItemRounds).forEach(([itemId, v]) => {
    const ohInfo = ohMap[itemId];
    if (!ohInfo) return;
    const st = computeItemStatus(ohInfo.oh, v[1], v[2], v[3], rules);
    if (st === 'PENDING' || st === 'Diff') mismatchItems.push(itemId);
  });
  const showMismatchWarning = asgn.status === 'completed' && mismatchItems.length > 0;

  // ── รวม count_records + variance_approvals + audit_log เป็นไทม์ไลน์เดียว เรียงตามเวลา ──
  //    (apprErr/auditErr อาจเกิดถ้าตาราง/คอลัมน์ยังไม่มี (ยังไม่ได้รัน migration) — ข้ามส่วนนั้นแบบเงียบๆ ไม่ทำให้หน้าพัง)
  const events = [];
  (recs||[]).forEach(r => events.push({ type:'count', at: r.counted_at, data: r }));
  if (!apprErr) (approvals||[]).forEach(a => events.push({ type:'approval', at: a.created_at, data: a }));
  if (!auditErr) (auditRows||[]).forEach(a => events.push({ type:'audit', at: a.created_at, data: a }));
  events.sort((a,b) => new Date(a.at||0) - new Date(b.at||0));

  const si = tagInfo(asgn.status);
  const ACTION_META = {
    oh_edit:  { icon:'✏️', label:'แก้ไขยอด OH' },
    reassign: { icon:'🔄', label:'เปลี่ยนผู้นับ' },
  };
  let rows = '';
  for (const ev of events) {
    if (ev.type === 'count') {
      const r = ev.data;
      const ohInfo = ohMap[r.item_id];
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap">
        <div class="row-body">
          <div class="row-title mono" style="font-size:13px">${r.items?.code||'?'}</div>
          <div class="row-sub">${r.items?.description||''}</div>
          <div class="row-sub">รอบ ${r.round} · นับโดย: ${r.actual_counter_name || r.actual_counter?.name || r.profiles?.name || '?'}</div>
          <div class="row-sub">${r.counted_at ? new Date(r.counted_at).toLocaleString('th-TH') : ''}</div>
          ${r.remark ? `<div class="row-sub" style="color:#7c3aed">📝 ${r.remark}</div>` : ''}
          ${r.photo_url ? `<a href="${r.photo_url}" target="_blank" style="font-size:11px;color:var(--vespa-red)">📷 ดูรูป</a>` : ''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:28px;font-weight:900;font-family:'Fredoka';color:var(--vespa-shadow)">${r.count_qty}</div>
          <span class="tag tag-blue" style="font-size:10px">R${r.round}</span>
          ${ohInfo ? `<div class="oh-chip" style="margin-top:6px;font-size:11px;padding:3px 8px">OH: ${ohInfo.oh}${ohInfo.al!=null?` <span class="al-part">· AL ${ohInfo.al}</span>`:''}</div>` : ''}
        </div>
      </div>`;
    } else if (ev.type === 'approval') {
      const a = ev.data;
      const isOk = a.resolution === 'ok';
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap;background:${isOk?'#f0fdf4':'#fff1f0'}">
        <div class="row-body">
          <div class="row-title mono" style="font-size:13px">${a.items?.code||'?'}</div>
          <div class="row-sub">${a.items?.description||''}</div>
          <div class="row-sub">${isOk?'✅':'❌'} คอนเฟิร์มยอดโดย Supervisor: ${a.profiles?.name||'?'}</div>
          <div class="row-sub">${a.created_at ? new Date(a.created_at).toLocaleString('th-TH') : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:28px;font-weight:900;font-family:'Fredoka';color:var(--vespa-shadow)">${a.final_qty}</div>
          <span class="tag ${isOk?'tag-green':'tag-red'}" style="font-size:10px">${a.variance>0?'+':''}${a.variance}</span>
        </div>
      </div>`;
    } else {
      const a = ev.data;
      const meta = ACTION_META[a.action] || { icon:'📝', label: a.action };
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap;background:#eef6ff">
        <div class="row-body">
          <div class="row-title mono" style="font-size:13px">${a.items?.code || meta.label}</div>
          ${a.items?.code ? `<div class="row-sub">${meta.icon} ${meta.label}</div>` : ''}
          <div class="row-sub">โดย: ${a.profiles?.name||'?'}</div>
          <div class="row-sub">${a.created_at ? new Date(a.created_at).toLocaleString('th-TH') : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:14px;font-weight:900;color:var(--vespa-shadow)">${a.old_value ?? '—'} → ${a.new_value ?? '—'}</div>
          <span class="tag tag-blue" style="font-size:10px">${meta.icon} ${meta.label}</span>
        </div>
      </div>`;
    }
  }

  cnt().innerHTML = `
    <div class="card">
      <div class="mono" style="font-size:18px;font-weight:900">${asgn.locations?.code}</div>
      <div style="font-size:12px;color:var(--vespa-brown);margin-top:4px">${asgn.count_sessions?.name||''} · ${asgn.profiles?.name||'?'}</div>
      <div style="margin-top:8px"><span class="tag ${si.cls}">${si.lbl}</span></div>
      ${showMismatchWarning ? `
      <div class="alert alert-red" style="margin-top:12px">
        ⚠️ พบ ${mismatchItems.length} รายการที่ยอดนับไม่ตรงกับ OH ปัจจุบัน แต่สถานะถูกปิดเป็น "${si.lbl}" ไปแล้ว<br>
        (มักเกิดจาก OH ถูกแก้ไขภายหลัง หรือนับซ้ำ 2 รอบตรงกันเองแต่ไม่ตรงกับ OH)
      </div>
      <button class="btn btn-red btn-sm" onclick="sendBackToVariance('${aid}')">📤 ส่งกลับไปตรวจสอบใน Variance</button>` : ''}
    </div>
    <div class="sec">Transaction Log (${events.length} รายการ)</div>
    <div class="card card-flush">${rows || '<div class="load" style="padding:20px">ยังไม่มีการนับ</div>'}</div>`;
}

async function deleteSess(id, name) {

  if (aIds.length) {
    await sb.from('variance_approvals').delete().in('assignment_id', aIds);
    await sb.from('count_records').delete().in('assignment_id', aIds);
    await sb.from('assignments').delete().eq('session_id', id);
  }
  await sb.from('stock_snapshot_detail').delete().eq('session_id', id);
  await sb.from('stock_snapshot').delete().eq('session_id', id);

}

async function loadDeleteZoneFilters() {
  const [{ data: locData }, { data: sessData }] = await Promise.all([
    sb.from('locations').select('zone,row_no'),
    sb.from('count_sessions').select('id,name').order('created_at',{ascending:false}),
  ]);

  const zones = new Set(), rows = new Set();
  (locData||[]).forEach(l => { if (l.zone) zones.add(l.zone); if (l.row_no) rows.add(l.row_no); });

  const fill = (id, vals) => {
    const el = Q(id); if (!el) return;
    el.innerHTML = '<option value="">ทั้งหมด</option>' +
      [...vals].sort().map(v => `<option value="${v}">${v}</option>`).join('');
  };
  fill('del-zone', zones);
  fill('del-row',  rows);

  const sEl = Q('del-session');
  if (sEl) {
    sEl.innerHTML = '<option value="">ทุก Session (ลบ Location ออกจากระบบจริง)</option>' +
      (sessData||[]).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  }
  refreshDeleteZonePreview();
}

function buildDelLocQuery(zone, row, code, selectCols, selectOpts) {
  let q = sb.from('locations').select(selectCols, selectOpts);
  if (zone) q = q.eq('zone', zone);
  if (row)  q = q.eq('row_no', row);
  if (code) q = q.ilike('code', code);
  return q;
}

async function refreshDeleteZonePreview() {
  const sid  = Q('del-session')?.value || '';
  const zone = Q('del-zone')?.value || '';
  const row  = Q('del-row')?.value || '';
  const code = Q('del-code')?.value.trim() || '';
  const prev = Q('del-preview'), btn = Q('del-btn');
  if (!prev || !btn) return;

  if (!zone && !row && !code) {
    prev.innerHTML = `<span style="color:#94a3b8;font-weight:500">เลือก Zone, Row หรือพิมพ์ Location Code อย่างน้อย 1 อย่าง เพื่อป้องกันการลบทั้งหมดโดยไม่ตั้งใจ</span>`;
    btn.disabled = true;
    return;
  }

  const { count, error } = await buildDelLocQuery(zone, row, code, 'id', { count:'exact', head:true });

  if (error) { prev.innerHTML = `<span style="color:#dc2626">${error.message}</span>`; btn.disabled = true; return; }
  if (!count) {
    prev.innerHTML = `<span style="color:#94a3b8;font-weight:500">ไม่พบ Location ที่ตรงเงื่อนไข</span>`;
    btn.disabled = true;
  } else {
    const scope = sid ? 'เฉพาะ Session ที่เลือก (Location ยังอยู่ ใช้กับ Session อื่นได้)' : 'ทุก Session (ลบ Location ออกจากระบบจริง)';
    prev.innerHTML = `⚠️ จะลบ <strong>${count.toLocaleString()} locations</strong> — ขอบเขต: ${scope}`;
    btn.disabled = false;
  }
}

async function doDeleteByZoneRow() {
  const sid  = Q('del-session')?.value || '';
  const zone = Q('del-zone')?.value || '';
  const row  = Q('del-row')?.value || '';
  const code = Q('del-code')?.value.trim() || '';
  if (!zone && !row && !code) return;

  const label = [zone, row, code].filter(Boolean).join(' / ');
  const scopeLabel = sid ? 'เฉพาะ Session ที่เลือก (Location จะยังอยู่ในระบบ)' : 'ทุก Session (ลบ Location ออกจากระบบจริง)';
  if (!confirm(`ยืนยันลบ: "${label}"\nขอบเขต: ${scopeLabel}\n\nการลบนี้กู้คืนไม่ได้`)) return;

  const btn = Q('del-btn'), al = Q('del-alert');
  btn.disabled = true;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลังค้นหา Location ที่ตรงเงื่อนไข...</div>`;

  const { data: locs, error: e0 } = await buildDelLocQuery(zone, row, code, 'id,code');
  if (e0)             { al.innerHTML = errBox(e0.message); btn.disabled = false; return; }
  if (!locs?.length)  { al.innerHTML = `<div class="alert alert-amber">ไม่พบ Location ที่ตรงเงื่อนไข</div>`; btn.disabled = false; return; }

  const locIds = locs.map(l => l.id);
  const BATCH = 200;

  try {
    al.innerHTML = `<div class="alert alert-blue">⏳ [1/6] ค้นหา Assignment ที่เกี่ยวข้อง...</div>`;
    let asgnIds = [];
    for (let i = 0; i < locIds.length; i += BATCH) {
      let aq = sb.from('assignments').select('id').in('location_id', locIds.slice(i, i+BATCH));
      if (sid) aq = aq.eq('session_id', sid);
      const { data, error } = await aq;
      if (error) throw error;
      asgnIds.push(...(data||[]).map(a => a.id));
    }

    if (asgnIds.length) {
      al.innerHTML = `<div class="alert alert-blue">⏳ [2/6] ลบ Variance Approvals...</div>`;
      for (let i = 0; i < asgnIds.length; i += BATCH) {
        const { error } = await sb.from('variance_approvals').delete().in('assignment_id', asgnIds.slice(i, i+BATCH));
        if (error) throw error;
      }
      al.innerHTML = `<div class="alert alert-blue">⏳ [3/6] ลบผลการนับ (Count Records)...</div>`;
      for (let i = 0; i < asgnIds.length; i += BATCH) {
        const { error } = await sb.from('count_records').delete().in('assignment_id', asgnIds.slice(i, i+BATCH));
        if (error) throw error;
      }
      al.innerHTML = `<div class="alert alert-blue">⏳ [4/6] ลบ Assignment...</div>`;
      for (let i = 0; i < asgnIds.length; i += BATCH) {
        const { error } = await sb.from('assignments').delete().in('id', asgnIds.slice(i, i+BATCH));
        if (error) throw error;
      }
    }

    al.innerHTML = `<div class="alert alert-blue">⏳ [5/6] ลบ Stock Snapshot / Detail (LPN)...</div>`;
    for (let i = 0; i < locIds.length; i += BATCH) {
      let dq = sb.from('stock_snapshot_detail').delete().in('location_id', locIds.slice(i, i+BATCH));
      if (sid) dq = dq.eq('session_id', sid);
      const { error } = await dq;
      if (error) throw error;
    }
    for (let i = 0; i < locIds.length; i += BATCH) {
      let sq = sb.from('stock_snapshot').delete().in('location_id', locIds.slice(i, i+BATCH));
      if (sid) sq = sq.eq('session_id', sid);
      const { error } = await sq;
      if (error) throw error;
    }

    if (!sid) {
      al.innerHTML = `<div class="alert alert-blue">⏳ [6/6] ลบ Location (ทุก Session)...</div>`;
      for (let i = 0; i < locIds.length; i += BATCH) {
        const { error } = await sb.from('locations').delete().in('id', locIds.slice(i, i+BATCH));
        if (error) throw error;
      }
    }

    al.innerHTML = `<div class="alert alert-green">✅ ลบ ${locs.length.toLocaleString()} locations (${label}) เรียบร้อย${sid?' — เฉพาะ Session ที่เลือก':''}</div>`;
    Q('del-zone').value = ''; Q('del-row').value = ''; Q('del-code').value = '';
    loadDeleteZoneFilters();
  } catch(e) {
    al.innerHTML = errBox(e?.message || String(e));
  }
  btn.disabled = false;
}

function likeToRegex(pattern) {
  const esc = pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re  = esc.replace(/%/g, '.*').replace(/_/g, '.');
  return new RegExp('^' + re + '$', 'i');
}

async function readXlsxFile() {
  const file = Q('ixlsx').files[0];
  if (!file) return;
  const al = Q('ia'), prev = Q('ipreview'), btn = Q('ibtn');
  if (!al || !prev || !btn) return;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลังอ่านไฟล์ ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)...</div>`;
  prev.style.display = 'none';
  btn.disabled = true;
  _xlsxRawRows = null;
  _xlsxParsed  = null;

  try {
    const buf = await file.arrayBuffer();
    if (typeof XLSX === 'undefined') throw new Error('SheetJS ยังโหลดไม่เสร็จ รอสักครู่แล้วลองใหม่');

    al.innerHTML = `<div class="alert alert-blue">⏳ กำลัง parse Excel...</div>`;
    await new Promise(r => setTimeout(r, 50));

    const wb  = XLSX.read(buf, { type:'array', dense:true });
    const ws  = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });

    // ── หา header row แบบ flexible: รองรับหลายรูปแบบไฟล์ Export ──
    //    กลยุทธ์: เช็ค "ตรงเป๊ะ" ก่อนเสมอ แล้วค่อย fallback เป็น "มีคำนี้อยู่ในนั้น"
    //    ป้องกันปัญหาเช่น "Locating Zone" ถูกจับผิดเป็น Location (เพราะมีคำว่า "loc" ปนอยู่)
    let headerRow = -1, col = {};

    // exact = ต้องตรงกับข้อความในเซลล์แบบเป๊ะ (หลัง trim+lowercase+ยุบช่องว่าง/ขึ้นบรรทัดใหม่เป็นช่องว่างเดียว)
    // contains = ใช้ตอนหาแบบเป๊ะไม่เจอเลย ค่อย fallback มาเช็คว่ามีคำนี้ปนอยู่ไหม
    // exclude = ถ้าเซลล์มีคำนี้ปนอยู่ ห้ามนับเป็น match ของ field นี้เด็ดขาด (กันจับผิด)
    const FIELDS = {
      loc:  { exact:['location','loc','พิกัด','ตำแหน่ง','location code'],
              contains:['location'], exclude:['zone','type','group'] },
      item: { exact:['item code','item','sku','barcode','รหัสสินค้า','รหัส'],
              contains:['item','sku','barcode'], exclude:[] },
      oh:   { exact:['on hand qty','on hand','onhand','oh','ยอดคงเหลือ','qty oh','qtyoh'],
              contains:['on hand','onhand'], exclude:[] },
      al:   { exact:['al qty','al','allocated','จอง'],
              contains:['allocated'], exclude:[] },
      lp:   { exact:['license plate','lpn no.','lpn no','lpn number','lpn','license plate no'],
              contains:['license plate','lpn'], exclude:['parent'] },
      lot:  { exact:['lot','lot no','lot number','batch'],
              contains:['lot','batch'], exclude:[] },
      stat: { exact:['inventory status','status','สถานะ'],
              contains:['status'], exclude:[] },
      desc: { exact:['description','desc','ชื่อสินค้า','ชื่อ'],
              contains:['description'], exclude:[] },
    };

    // normalize: trim + lowercase + ยุบ whitespace ทุกชนิด (รวมขึ้นบรรทัดใหม่ \n) ให้เหลือช่องว่างเดียว
    const normalizeCell = c => (c==null ? '' : c.toString().trim().toLowerCase().replace(/\s+/g, ' '));

    function findColumn(norm, def) {
      // รอบแรก: หาแบบตรงเป๊ะก่อนเสมอ (ไล่ตามลำดับความสำคัญใน exact[])
      for (const name of def.exact) {
        const idx = norm.indexOf(name);
        if (idx !== -1) return idx;
      }
      // รอบสอง: ถ้าตรงเป๊ะไม่เจอเลย ค่อย fallback เป็นแบบ "มีคำนี้ปนอยู่"
      for (let i = 0; i < norm.length; i++) {
        if (!norm[i]) continue;
        if (def.exclude.some(ex => norm[i].includes(ex))) continue;
        if (def.contains.some(c => norm[i].includes(c))) return i;
      }
      return -1;
    }

    for (let r = 0; r < Math.min(30, raw.length); r++) {
      const row = raw[r];
      if (!row) continue;
      const norm = row.map(normalizeCell);
      const locIdx  = findColumn(norm, FIELDS.loc);
      const itemIdx = findColumn(norm, FIELDS.item);
      // ต้องมีอย่างน้อย loc + item ถือว่านี่คือ header row (คอลัมน์อื่น optional)
      if (locIdx !== -1 && itemIdx !== -1) {
        headerRow = r;
        col.loc  = locIdx;
        col.item = itemIdx;
        col.oh   = findColumn(norm, FIELDS.oh);
        col.al   = findColumn(norm, FIELDS.al);
        col.desc = findColumn(norm, FIELDS.desc);
        col.stat = findColumn(norm, FIELDS.stat);
        col.lot  = findColumn(norm, FIELDS.lot);
        col.lp   = findColumn(norm, FIELDS.lp);
        break;
      }
    }

    if (headerRow === -1 || col.loc===-1 || col.item===-1) {
      throw new Error('ไม่พบคอลัมน์ Location และ Item ในไฟล์\n\nตรวจสอบว่าหัวตารางมีคำว่า "Location" และ "Item" (หรือ SKU/Barcode)\nรองรับทุกรูปแบบ Export ขอแค่มีสองคอลัมน์นี้');
    }

    const rows = [];
    for (let i = headerRow + 1; i < raw.length; i++) {
      const row = raw[i];
      if (!row) continue;
      const loc  = row[col.loc]  ? row[col.loc].toString().trim()  : null;
      const item = row[col.item] ? row[col.item].toString().trim() : null;
      if (!loc || !item) continue;
      const desc  = col.desc!==-1 ? (row[col.desc]||'').toString().trim() : '';
      const oh    = col.oh!==-1  ? (parseFloat(row[col.oh]) || 0) : 0;
      const alQty = col.al!==-1  ? (parseFloat(row[col.al]) || null) : null;
      const stat  = col.stat!==-1 ? (row[col.stat]||'').toString().trim() : '';
      const lot   = col.lot!==-1 ? (row[col.lot]||'').toString().trim() : '';
      const lp    = col.lp!==-1  ? (row[col.lp]||'').toString().trim()  : '';
      rows.push({ loc, item, desc, oh, alQty, stat, lot, lp });
    }

    if (!rows.length) throw new Error('พบ Header แล้ว แต่ไม่มีข้อมูลใต้ header');

    _xlsxRawRows = rows;
    al.innerHTML = `<div class="alert alert-green" style="font-size:12px">
      ✅ อ่านไฟล์สำเร็จ — พบ ${rows.length.toLocaleString()} แถว<br>
      คอลัมน์ที่ตรวจพบ: ${[
        col.loc!==-1?'Location':null, col.item!==-1?'Item':null,
        col.oh!==-1?'OH':null, col.al!==-1?'AL':null,
        col.desc!==-1?'Description':null, col.stat!==-1?'Status':null,
        col.lot!==-1?'Lot':null, col.lp!==-1?'License Plate':null
      ].filter(Boolean).join(', ')}
    </div>`;
    refreshXlsxPreview();

  } catch(e) {
    al.innerHTML = `<div class="alert alert-red">❌ อ่านไฟล์ไม่ได้: ${e.message}</div>`;
  }
}

let _xlsxConflictLocs = new Set();  // locations user chose to SKIP (already exist in session)
let _xlsxAllLocsInScope = [];       // all location codes currently in scope (for conflict UI)

function refreshXlsxPreview() {
  const prev = Q('ipreview'), btn = Q('ibtn');
  if (!_xlsxRawRows) return;

  const patternStr = Q('ilocfilter')?.value.trim() || '';
  const re = patternStr ? likeToRegex(patternStr) : null;

  let inScope = 0;
  const map = {};

  for (const r of _xlsxRawRows) {
    if (re && !re.test(r.loc)) continue;
    inScope++;
    const key = r.loc + '|||' + r.item;
    if (map[key]) {
      map[key].qty += r.oh;
      if (r.alQty !== null) map[key].alQty = (map[key].alQty||0) + r.alQty;
    } else {
      map[key] = { loc:r.loc, item:r.item, desc:r.desc, qty:r.oh, alQty:r.alQty };
    }
  }

  _xlsxParsed = Object.values(map);
  const uLocsArr = [...new Set(_xlsxParsed.map(r => r.loc))];
  const uLocs  = uLocsArr.length;
  const uItems = new Set(_xlsxParsed.map(r => r.item)).size;
  _xlsxAllLocsInScope = uLocsArr;

  prev.style.display = 'block';

  if (!inScope) {
    prev.innerHTML = `<div class="alert alert-amber">
      ⚠️ ไม่พบแถวที่ตรงกับ Location filter "${patternStr}" ในไฟล์นี้ (ทั้งไฟล์มี ${_xlsxRawRows.length.toLocaleString()} แถว)
    </div>`;
    btn.disabled = true;
    return;
  }

  prev.innerHTML = `<div class="alert alert-green">
    ✅ พร้อม Import<br>
    📊 ทั้งไฟล์ <strong>${_xlsxRawRows.length.toLocaleString()}</strong> rows
      ${patternStr ? `→ ตรง filter: <strong>${inScope.toLocaleString()}</strong>` : ''}<br>
    📍 <strong>${uLocs.toLocaleString()}</strong> locations
      · 📦 <strong>${uItems.toLocaleString()}</strong> unique items<br>
    🔢 <strong>${_xlsxParsed.length.toLocaleString()}</strong> loc+item pairs (หลัง aggregate OH)
  </div>
  <div id="conflict-check-area"></div>`;
  btn.disabled = false;

  // ── ตรวจสอบ conflict กับ location ที่มีอยู่แล้วใน session นี้ ──
  checkLocationConflicts(uLocsArr);
}

async function checkLocationConflicts(locCodes) {
  const sid = Q('is')?.value;
  const area = Q('conflict-check-area');
  if (!sid || !area || !locCodes.length) return;

  area.innerHTML = `<div style="font-size:11px;color:#94a3b8;margin-top:8px">⏳ เช็คว่าโลเคชั่นซ้ำกับข้อมูลเดิมใน Session นี้ไหม...</div>`;

  // หา location ids ที่ตรงกับ code ในไฟล์
  const { data: locs } = await sb.from('locations').select('id,code').in('code', locCodes);
  if (!locs?.length) { area.innerHTML = ''; return; }

  const locIdMap = Object.fromEntries(locs.map(l => [l.id, l.code]));
  const { data: existing } = await sb.from('stock_snapshot')
    .select('location_id').eq('session_id', sid).in('location_id', Object.keys(locIdMap));

  const dupSet = new Set((existing||[]).map(e => locIdMap[e.location_id]));
  _xlsxConflictLocs = new Set();

  if (!dupSet.size) {
    area.innerHTML = `<div style="font-size:11px;color:var(--vespa-green);margin-top:8px;font-weight:700">✅ ไม่มี Location ซ้ำกับข้อมูลเดิมใน Session นี้</div>`;
    return;
  }

  const dupList = [...dupSet].sort();
  area.innerHTML = `
    <div style="background:#fff7ed;border:2px solid #f59e0b;border-radius:12px;padding:12px;margin-top:8px">
      <div style="font-size:12px;font-weight:900;color:#92400e;margin-bottom:8px">
        ⚠️ พบ ${dupList.length} Location ที่มีข้อมูลอยู่แล้วใน Session นี้ — เลือกว่าจะ Import ทับหรือข้าม
      </div>
      <div style="max-height:180px;overflow-y:auto;background:#fff;border-radius:8px;padding:8px">
        ${dupList.map(code => `
          <label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;cursor:pointer;font-family:ui-monospace,monospace">
            <input type="checkbox" class="dup-loc-check" data-code="${code}" checked onchange="toggleDupLoc('${code}',this.checked)">
            <span>${code}</span>
            <span style="color:#94a3b8;font-size:10px">(ติ๊ก = import ทับยอดเดิม, ไม่ติ๊ก = ข้าม)</span>
          </label>`).join('')}
      </div>
    </div>`;
}

function toggleDupLoc(code, checked) {
  if (checked) _xlsxConflictLocs.delete(code);
  else _xlsxConflictLocs.add(code);
}

async function doImportXlsx() {
  const sid = Q('is').value, al = Q('ia'), btn = Q('ibtn');
  if (!sid)         { al.innerHTML = `<div class="alert alert-red">เลือก Session ก่อน</div>`; return; }
  if (!_xlsxParsed || !_xlsxParsed.length) { al.innerHTML = `<div class="alert alert-red">ไม่มีข้อมูลที่จะ Import</div>`; return; }

  btn.disabled = true;

  // ── ตัด Location ที่ผู้ใช้เลือก "ข้าม" ออก (จากช่อง conflict checkbox) ──
  const skipSet = _xlsxConflictLocs || new Set();
  const importRows = _xlsxParsed.filter(p => !skipSet.has(p.loc));

  if (!importRows.length) {
    al.innerHTML = `<div class="alert alert-amber">ไม่มีข้อมูลให้ Import (ทุก Location ถูกเลือกให้ข้ามหมด)</div>`;
    btn.disabled = false;
    return;
  }

  async function batchUp(table, rows, conflict, selectCols) {
    const BATCH = 500, map = {};
    for (let i = 0; i < rows.length; i += BATCH) {
      const { data, error } = await sb.from(table)
        .upsert(rows.slice(i, i+BATCH), { onConflict: conflict })
        .select(selectCols);
      if (error) throw error;
      data?.forEach(r => { map[r.code] = r.id; });
    }
    return map;
  }

  try {
    // 1) Locations — zone คำนวณจาก computeZone(), row_no/level แยกจาก code
    al.innerHTML = `<div class="alert alert-blue">⏳ [1/4] สร้าง/อัพเดท Locations...</div>`;
    const seenLocs = {}, locRows = [];
    for (const p of importRows) {
      if (seenLocs[p.loc]) continue;
      seenLocs[p.loc] = true;
      const parts = p.loc.split('-');
      locRows.push({
        code:   p.loc,
        zone:   computeZone(p.loc, p.desc),
        row_no: parts[1] || null,
        level:  parts[3] || null,
      });
    }
    const locMap = await batchUp('locations', locRows, 'code', 'id,code');

    // 2) Items
    al.innerHTML = `<div class="alert alert-blue">⏳ [2/4] สร้าง/อัพเดท Items (${new Set(importRows.map(r=>r.item)).size.toLocaleString()} รายการ)...</div>`;
    const seenItems = {}, itemRows = [];
    for (const p of importRows) {
      if (seenItems[p.item]) continue;
      seenItems[p.item] = true;
      itemRows.push({ code: p.item, description: p.desc });
    }
    const itemMap = await batchUp('items', itemRows, 'code', 'id,code');

    // 3) Stock snapshot (รวม al_qty)
    const BATCH = 500;
    let ok = 0;
    const snapRows = importRows
      .filter(p => locMap[p.loc] && itemMap[p.item])
      .map(p => ({
        session_id:  sid,
        location_id: locMap[p.loc],
        item_id:     itemMap[p.item],
        onhand_qty:  p.qty,
        al_qty:      p.alQty !== null && p.alQty !== undefined ? p.alQty : null,
      }));

    for (let i = 0; i < snapRows.length; i += BATCH) {
      const { error } = await sb.from('stock_snapshot')
        .upsert(snapRows.slice(i, i+BATCH), { onConflict:'session_id,location_id,item_id' });
      if (error) throw error;
      ok += Math.min(BATCH, snapRows.length - i);
      al.innerHTML = `<div class="alert alert-blue">⏳ [3/4] Stock Snapshot: ${ok.toLocaleString()} / ${snapRows.length.toLocaleString()} rows...</div>`;
    }

    // 4) Stock Snapshot Detail (LPN/Lot/Status)
    al.innerHTML = `<div class="alert alert-blue">⏳ [4/4] Stock Snapshot Detail (LPN/Lot)...</div>`;
    const patternStr = Q('ilocfilter')?.value.trim() || '';
    const re = patternStr ? likeToRegex(patternStr) : null;
    const detailRows = [];
    for (const r of _xlsxRawRows) {
      if (re && !re.test(r.loc)) continue;
      if (skipSet.has(r.loc)) continue;
      if (!locMap[r.loc] || !itemMap[r.item]) continue;
      detailRows.push({
        session_id:       sid,
        location_id:      locMap[r.loc],
        item_id:          itemMap[r.item],
        license_plate:    r.lp  || null,
        lot:              r.lot || null,
        inventory_status: r.stat || null,
        qty:              r.oh,
      });
    }

    const importedLocIds = [...new Set(Object.values(locMap))];
    for (let i = 0; i < importedLocIds.length; i += BATCH) {
      const { error } = await sb.from('stock_snapshot_detail')
        .delete().eq('session_id', sid).in('location_id', importedLocIds.slice(i, i+BATCH));
      if (error) throw error;
    }
    let okD = 0;
    for (let i = 0; i < detailRows.length; i += BATCH) {
      const { error } = await sb.from('stock_snapshot_detail').insert(detailRows.slice(i, i+BATCH));
      if (error) throw error;
      okD += Math.min(BATCH, detailRows.length - i);
      al.innerHTML = `<div class="alert alert-blue">⏳ [4/4] Stock Snapshot Detail: ${okD.toLocaleString()} / ${detailRows.length.toLocaleString()} rows...</div>`;
    }

    const skippedMsg = skipSet.size ? `<br>⏭️ ข้าม ${skipSet.size} locations ตามที่เลือก` : '';
    al.innerHTML = `<div class="alert alert-green">
      ✅ Import สำเร็จ!<br>
      📍 ${locRows.length.toLocaleString()} locations
      · 📦 ${itemRows.length.toLocaleString()} items
      · 🔢 ${ok.toLocaleString()} snapshot rows
      · 🏷️ ${okD.toLocaleString()} LPN/Lot detail rows${skippedMsg}
    </div>`;
    _xlsxRawRows = null;
    _xlsxParsed = null;
    _xlsxConflictLocs = new Set();
    Q('ixlsx').value = '';
    Q('ilocfilter').value = '';
    Q('ipreview').style.display = 'none';
    btn.disabled = false;

  } catch(e) {
    al.innerHTML = `<div class="alert alert-red">❌ ${e?.message || String(e)}</div>`;
    btn.disabled = false;
  }
}

    <summary style="cursor:pointer;padding:16px 20px;font-size:15px;font-weight:900;color:var(--vespa-brown);list-style:none;display:flex;align-items:center;gap:6px">
      <span style="font-size:17px">👤</span> รายชื่อ "ผู้นับจริง" ที่ทุกคนเห็นในหน้านับงาน
      <span style="margin-left:auto;font-size:11px;color:#94a3b8;font-weight:600">แตะเพื่อเปิด</span>
    </summary>
    <div style="padding:12px 20px 20px;border-top:3px solid var(--vespa-gray)">
      <div id="cn-list"><div class="load" style="padding:16px">⏳</div></div>
    </div>
  </details>`;

  cnt().innerHTML = html;
  loadCounterNamesList();
}

async function loadCounterNamesList() {
  const listEl = Q('cn-list');
  if (!listEl) return;
  const isAdmin = prof?.role === 'admin';

  const { data: names, error } = await sb.from('counter_names').select('id,name').order('name');
  if (error) { listEl.innerHTML = errBox(error.message); return; }

  let html = '';
  if (!names?.length) {
    html += `<div style="padding:16px 0;color:#94a3b8;font-size:13px">ยังไม่มีชื่อในระบบ — จะถูกเพิ่มอัตโนมัติเมื่อ Counter พิมพ์ชื่อใหม่ตอนนับงาน</div>`;
  } else {
    html += names.map(n => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--vespa-gray)">
        <span style="font-size:14px;font-weight:700">👤 ${n.name}</span>
        <div style="display:flex;gap:4px;flex-shrink:0">
          ${isAdmin ? `<button onclick="editCounterName('${n.id}','${n.name.replace(/'/g,"\\'")}')"
            style="background:none;border:none;color:var(--vespa-brown);font-size:15px;cursor:pointer;padding:2px">✏️</button>` : ''}
          ${isAdmin ? `<button onclick="deleteCounterName('${n.id}','${n.name.replace(/'/g,"\\'")}')"
            style="background:none;border:none;color:var(--vespa-red);font-size:17px;cursor:pointer;padding:2px">🗑️</button>` : ''}
        </div>
      </div>`).join('');
  }

  if (isAdmin) {
    html += `<div style="display:flex;gap:8px;margin-top:12px">
      <input type="text" id="cn-new-input" placeholder="พิมพ์ชื่อผู้นับใหม่..."
        onkeydown="if(event.key==='Enter'){event.preventDefault();addCounterNameFromAdmin();}">
      <button class="btn btn-green btn-sm" onclick="addCounterNameFromAdmin()" style="flex-shrink:0">+ เพิ่ม</button>
    </div>`;
  }

  listEl.innerHTML = html;
}

function editCounterName(id, curName) {
  const newName = prompt('แก้ไขชื่อผู้นับ:', curName);
  if (!newName || !newName.trim() || newName.trim() === curName) return;
  saveCounterNameEdit(id, newName.trim());
}

async function saveCounterNameEdit(id, newName) {
  const { error } = await sb.from('counter_names').update({ name: newName }).eq('id', id);
  if (error) { alert('แก้ไขไม่สำเร็จ: ' + error.message); return; }
  loadCounterNamesList();
}

async function addCounterNameFromAdmin() {
  const input = Q('cn-new-input');
  const name = input?.value.trim();
  if (!name) { alert('กรุณาพิมพ์ชื่อก่อน'); return; }
  const { error } = await sb.from('counter_names')
    .upsert({ name, created_by: me.id }, { onConflict: 'name', ignoreDuplicates: true });
  if (error) { alert('เพิ่มชื่อไม่สำเร็จ: ' + error.message); return; }
  loadCounterNamesList();
}

async function deleteCounterName(id, name) {
  if (!confirm(`ลบชื่อ "${name}" ออกจากรายการ?\n\n(ข้อมูลการนับที่เคยใช้ชื่อนี้ไปแล้วจะยังอยู่ ไม่ถูกลบ)`)) return;
  const { error } = await sb.from('counter_names').delete().eq('id', id);
  if (error) { alert(error.message); return; }
  loadCounterNamesList();
}

async function editUserName(uid) {
  const span = Q('uname_'+uid);
  const cur = span?.textContent || '';
  const newName = prompt('แก้ชื่อ User:', cur);
  if (!newName || newName === cur) return;
  const { error } = await sb.from('profiles').update({ name: newName.trim() }).eq('id', uid);
  if (error) { alert(error.message); return; }
  if (span) span.textContent = newName.trim();
}

async function deleteUser(uid, name, role) {
  if (role === 'admin') { alert('ไม่สามารถลบ Admin ผ่านหน้านี้ได้ครับ (ป้องกันไม่ให้ไม่มี Admin เหลือ)'); return; }
  if (!confirm(`ลบ User "${name}" ออกจากระบบ?\n\nการลบนี้จะลบ Profile แต่ไม่ลบ Auth account — ลบ Auth ได้ใน Supabase Dashboard`)) return;
  const { error } = await sb.from('profiles').delete().eq('id', uid);
  if (error) { alert(error.message); return; }
  loadAdUsers();
}

async function chRole(uid, role) {
  await sb.from('profiles').update({ role }).eq('id', uid);
}

async function addUser() {
  const name = Q('un').value.trim(), email = Q('ue').value.trim();
  const pwd  = Q('up').value,        role  = Q('ur').value;
  const al   = Q('ua');
  if (!name||!email||!pwd) { al.innerHTML=`<div class="alert alert-red">กรอกข้อมูลให้ครบ</div>`; return; }
  if (pwd.length < 6)       { al.innerHTML=`<div class="alert alert-red">Password ต้องมีอย่างน้อย 6 ตัว</div>`; return; }

  const { error } = await sb.auth.signUp({
    email, password: pwd,
    options: { data: { name, role } }
  });
  if (error) { al.innerHTML=`<div class="alert alert-red">${error.message}</div>`; return; }

  al.innerHTML = `<div class="alert alert-green">✅ สร้าง User สำเร็จ — แจ้ง ${name} Login ด้วย ${email}</div>`;
  Q('un').value=''; Q('ue').value=''; Q('up').value='';
  setTimeout(() => loadAdUsers(), 1800);
}

// ══════════════════════════════════════════════════════════
boot();
</script>
</body>
</html>
