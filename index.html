<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Count - Modern Sidebar Layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Mitr:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<!-- SheetJS สำหรับอ่านไฟล์ XLSX -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- html5-qrcode สำหรับสแกน Location -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ── Sidebar Layout & Dashboard Variables ── */
:root {
  --sidebar-bg: #0F172A;
  --sidebar-hover: #1E293B;
  --sidebar-text: #94A3B8;
  --sidebar-active-bg: #2563EB;
  --sidebar-active-text: #FFFFFF;
  --main-bg: #E6EEF8;
  --neu-surface: #E6EEF8;
  --neu-shadow-dark: #C2CDDC;
  --neu-shadow-light: #FFFFFF;
  --primary-blue: #2563EB;
  --primary-grad: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
  --accent-green: #10B981;
  --accent-red: #EF4444;
  --accent-amber: #F59E0B;
  --text-main: #1E293B;
  --text-muted: #64748B;
  --border-radius-lg: 20px;
  --border-radius-md: 14px;
  --border-radius-sm: 8px;
  --sidebar-width: 260px;
  --topbar-height: 64px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Mitr', 'Fredoka', 'Sarabun', sans-serif;
  background: var(--main-bg);
  color: var(--text-main);
  min-height: 100vh;
  font-size: 14px;
  overflow-x: hidden;
}

/* ── App Layout Structure ── */
.app-container {
  display: flex;
  min-height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ── Left Sidebar Navigation ── */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: all 0.3s ease;
  z-index: 200;
  box-shadow: 4px 0 16px rgba(0, 0, 0, 0.1);
}

.sidebar-header {
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.sidebar-logo-icon {
  width: 40px;
  height: 40px;
  background: var(--primary-blue);
  border-radius: var(--border-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: white;
  box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
}
.sidebar-title {
  font-size: 16px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.2;
}
.sidebar-sub {
  font-size: 11px;
  color: var(--sidebar-text);
  font-weight: 400;
}

.sidebar-menu {
  padding: 16px 12px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--border-radius-md);
  color: var(--sidebar-text);
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 14px;
  transition: all 0.2s ease;
}
.nav-item:hover {
  background: var(--sidebar-hover);
  color: #FFFFFF;
}
.nav-item.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}
.nav-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

/* ── Main Content Area Wrapper ── */
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  overflow-y: auto;
}

/* ── Topbar Header ── */
.topbar {
  height: var(--topbar-height);
  background: var(--neu-surface);
  box-shadow: 0 4px 12px var(--neu-shadow-dark);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.toggle-sidebar-btn {
  background: var(--neu-surface);
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: var(--border-radius-sm);
  box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
}
.topbar-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.user-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  background: var(--neu-surface);
  border-radius: 30px;
  box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light);
}
.user-avatar {
  width: 30px;
  height: 30px;
  background: var(--primary-blue);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}
.user-name { font-weight: 600; font-size: 13px; color: var(--text-main); }
.role-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--primary-blue);
  color: #FFFFFF;
  font-weight: 700;
}
.top-out-btn {
  background: var(--neu-surface);
  border: none;
  color: var(--accent-red);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
  transition: all 0.15s ease;
}
.top-out-btn:active {
  box-shadow: inset 2px 2px 4px var(--neu-shadow-dark), inset -2px -2px 4px var(--neu-shadow-light);
}

.page-content {
  padding: 24px;
  flex: 1;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    bottom: 0;
  }
  .sidebar.mobile-open { left: 0; }
  .page-content { padding: 16px; }
  .user-name { display: none; }
}

/* ── Neumorphic Soft UI Cards & Elements ── */
.card {
  background: var(--neu-surface);
  border: none;
  border-radius: var(--border-radius-lg);
  margin-bottom: 20px;
  padding: 20px;
  box-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
  position: relative;
  overflow: hidden;
}
.card-flush { padding: 0; overflow: hidden; }

.sec {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  padding: 16px 20px 8px;
  text-transform: uppercase;
  letter-spacing: .05em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.row {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(194, 205, 220, 0.4);
  gap: 12px;
  transition: background 0.15s;
}
.row:last-child { border-bottom: none; }
.row.click { cursor: pointer; }
.row.click:hover { background: rgba(255, 255, 255, 0.3); }
.tab-row { cursor: pointer; transition: background .12s; border-radius: 16px; }
.tab-row:active { background: rgba(194, 205, 220, 0.3); }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
.row-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
.caret { font-size: 18px; color: var(--text-muted); flex-shrink: 0; font-weight: bold; }

/* Status Badges */
.tag {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
  text-transform: uppercase;
}
.tag-gray  { background: var(--neu-surface); color: var(--text-muted); }
.tag-blue  { background: var(--primary-blue); color: #FFFFFF; }
.tag-amber { background: var(--accent-amber); color: #FFFFFF; }
.tag-red   { background: var(--accent-red); color: #FFFFFF; }
.tag-green { background: var(--accent-green); color: #FFFFFF; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: var(--primary-grad);
  color: #FFFFFF;
  box-shadow: 6px 6px 14px var(--neu-shadow-dark), -6px -6px 14px var(--neu-shadow-light);
  transition: all 0.2s ease;
}
.btn:active:not(:disabled) { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.25); transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }
.btn-blue  { background: var(--primary-grad); color: #FFFFFF; }
.btn-green { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #FFFFFF; }
.btn-red   { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: #FFFFFF; }
.btn-amber { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: #FFFFFF; }
.btn-ghost {
  background: var(--neu-surface); color: var(--text-main);
  box-shadow: 5px 5px 12px var(--neu-shadow-dark), -5px -5px 12px var(--neu-shadow-light);
}
.btn-dark { background: linear-gradient(135deg, #374151, #1F2937); color: #FFFFFF; }
.btn-sm { padding: 8px 16px; font-size: 12px; border-radius: 20px; }
.btn-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Forms & Inputs */
.fg { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
input, select, textarea {
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: var(--border-radius-md);
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  color: var(--text-main);
  background: var(--neu-surface);
  outline: none;
  box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
}
input:focus, select:focus, textarea:focus {
  box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light), 0 0 0 2px var(--primary-blue);
}

.alert {
  padding: 12px 16px; border-radius: var(--border-radius-md); font-size: 13px; margin-bottom: 12px;
  font-weight: 600; box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05);
}
.alert-red   { background: #FEE2E2; color: #991B1B; }
.alert-green { background: #D1FAE5; color: #065F46; }
.alert-blue  { background: #E0F2FE; color: #075985; }
.alert-amber { background: #FEF3C7; color: #92400E; }

/* Stats & Gauges */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat {
  background: var(--neu-surface); border-radius: var(--border-radius-md); padding: 18px 12px; text-align: center;
  box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light);
}
.stat-n { font-size: 32px; font-weight: 800; line-height: 1; color: var(--primary-blue); font-family: 'Fredoka', sans-serif; }
.stat-l { font-size: 12px; color: var(--text-muted); margin-top: 6px; font-weight: 700; }

.gauge-container {
  background: var(--neu-surface); border-radius: var(--border-radius-md); padding: 12px; margin-top: 10px;
  box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
}
.prog { height: 12px; background: var(--neu-surface); border-radius: 10px; box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light); overflow: hidden; }
.prog-fill { height: 100%; background: var(--primary-grad); border-radius: 10px; transition: width .45s ease; }

/* Count Entry & Widgets */
.citem-wrap { border-bottom: 1px solid rgba(194, 205, 220, 0.4); background: var(--neu-surface); }
.citem { display: flex; align-items: center; padding: 16px 18px; gap: 12px; }
.citem-info { flex: 1; min-width: 0; }
.citem-code { font-size: 16px; font-weight: 800; font-family: 'Fredoka', monospace; }
.citem-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.cqty {
  width: 90px; padding: 10px 6px; border: none; border-radius: var(--border-radius-md); font-size: 22px; font-weight: 800; text-align: center;
  font-family: 'Fredoka', monospace; background: var(--neu-surface); box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
}
.cqty.ok { color: var(--accent-green); }

.oh-badge {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px; padding: 4px 8px;
  border-radius: 12px; background: var(--neu-surface); box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
}
.oh-badge-label { font-size: 9px; font-weight: 800; color: var(--primary-blue); }
.oh-badge-val { font-size: 20px; font-weight: 800; color: var(--primary-blue); font-family: 'Fredoka', monospace; }
.oh-badge-al { font-size: 9px; font-weight: 700; color: var(--accent-amber); }

.oh-chip {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 4px 10px; border-radius: 10px;
  background: var(--neu-surface); box-shadow: inset 2px 2px 4px var(--neu-shadow-dark), inset -2px -2px 4px var(--neu-shadow-light); font-size: 12px; font-weight: 800; color: var(--primary-blue);
}
.oh-chip input { width: 45px; border: none; background: transparent; box-shadow: none; padding: 0; font-size: 13px; font-weight: 800; color: var(--primary-blue); text-align: center; }

.cname-pill-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.cname-pill {
  display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  background: var(--neu-surface); color: var(--text-muted); box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
}
.cname-pill.sel { background: var(--primary-grad); color: #FFFFFF; }

.vrow { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(194,205,220,0.4); gap: 10px; }
.vrow.diff { background: rgba(239,68,68,0.06); }
.vrow.exact { background: rgba(16,185,129,0.06); }

/* Login */
.lbox { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.lcard { background: var(--neu-surface); border-radius: 32px; padding: 40px 32px; width: 100%; max-width: 420px; box-shadow: 12px 12px 24px var(--neu-shadow-dark), -12px -12px 24px var(--neu-shadow-light); text-align: center; }

.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.mono { font-family: 'Fredoka', ui-monospace, monospace; }

.item-toggle { background: var(--neu-surface); border: none; border-radius: 12px; padding: 8px; cursor: pointer; box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light); }
.item-extra { display: none; padding: 16px; background: rgba(255,255,255,0.2); border-top: 1px dashed var(--neu-shadow-dark); }
.item-extra.open { display: block; }
.photo-thumb { width: 80px; height: 80px; border-radius: 16px; object-fit: cover; margin-top: 10px; box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light); }

/* Popup Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(45, 55, 72, 0.4); backdrop-filter: blur(4px); z-index: 998; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-card { background: var(--neu-surface); border-radius: 28px; padding: 28px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; box-shadow: 12px 12px 24px rgba(0,0,0,0.15); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-weight: 800; }
.modal-header button { background: var(--neu-surface); border: none; color: var(--accent-red); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light); }

/* Scanner Overlay */
.scan-overlay { position: fixed; inset: 0; background: rgba(20, 25, 35, 0.95); z-index: 999; display: flex; flex-direction: column; }
.scan-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--text-main); color: #fff; }
.scan-header button { background: var(--accent-red); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
#scanReader { flex: 1; display: flex; align-items: center; justify-content: center; }

/* WMS Summary Card */
.wms-summary-card { display: flex; align-items: center; justify-content: space-between; background: var(--neu-surface); border-radius: var(--border-radius-lg); padding: 20px 24px; box-shadow: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light); margin-bottom: 16px; }
.wms-summary-number { font-size: 40px; font-weight: 800; font-family: 'Fredoka', sans-serif; line-height: 1; }
.wms-summary-percent { font-size: 13px; font-weight: 700; color: var(--accent-green); margin-top: 6px; }
.wms-summary-ring { position: relative; width: 86px; height: 86px; flex-shrink: 0; }
.wms-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.wms-ring-bg { fill: none; stroke: var(--neu-shadow-dark); stroke-width: 8; opacity: 0.5; }
.wms-ring-progress { fill: none; stroke: var(--primary-blue); stroke-width: 8; transition: stroke-dashoffset 0.6s ease; }
.wms-ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 17px; font-weight: 800; font-family: 'Fredoka', sans-serif; }

.status-badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.status-badge-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 8px; border-radius: var(--border-radius-lg); background: var(--neu-surface); box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light); text-align: center; }
.status-badge-number { font-size: 32px; font-weight: 800; font-family: 'Fredoka', sans-serif; line-height: 1; }
.status-badge-card.unfixed .status-badge-number { color: var(--accent-red); }
.status-badge-card.fixed .status-badge-number { color: var(--accent-green); }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════════
//   ⚙️ CONFIG & GLOBALS
// ══════════════════════════════════════════════════════════
const SUPA_URL = 'https://uiuaboxsfepyftqjlwil.supabase.co';
const SUPA_KEY = 'sb_publishable_EuJ-IUiXWBLSNvQsG0CJ5w_C2LHJXAL';

let sb, me, prof;
let S = {};

let _html5Qr = null;   
let _xlsxRawRows = null;   
let _xlsxParsed  = null;   
let _svDashOpenVarianceIdx = null;   
let _dashTab = 'summary';

// ══════════════════════════════════════════════════════════
//   APPLICATION BOOT & ROUTER
// ══════════════════════════════════════════════════════════
async function boot() {
  if (typeof supabase === 'undefined') {
    Q('app').innerHTML = `<div class="lbox"><div class="lcard"><div class="alert alert-red">เชื่อมต่อกับระบบฐานข้อมูลไม่ได้จ้า (Supabase SDK missing)</div></div></div>`;
    return;
  }
  sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    me = session.user;
    await loadProf();
    go(home());
  } else {
    go('login');
  }
  sb.auth.onAuthStateChange((e, session) => {
    if (e === 'SIGNED_OUT') { me = null; prof = null; go('login'); }
    if (e === 'PASSWORD_RECOVERY') { me = session?.user || me; go('reset-password'); }
  });
}

async function loadProf() {
  const { data } = await sb.from('profiles').select('*').eq('id', me.id).single();

}

  if (r === 'counter')    return 'c-tasks';
  if (r === 'supervisor') return 'sv-dash';

}

function computeZone(locCode, desc) {
  if (!locCode) return '';
  const A = locCode.toString().trim().toUpperCase();
  const C = (desc || '').toString().trim().toUpperCase();
  const left  = (s,n) => s.substring(0,n);
  const right = (s,n) => s.substring(s.length-n);

  if (left(A,3)==='B-0' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='B-1' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='B-2' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='-CW') return '';
  if (left(A,4)==='ECOM') return 'Overfloor';
  if (left(A,3)==='B-D') return 'Overfloor';
  if (left(A,3)==='B-N') return 'Overfloor';
  if (left(A,3)==='B-L') return 'Overfloor';
  if (left(A,3)==='B-O') return 'Overfloor';
  if (left(C,3)==='PKV') return 'Cool Room Floor';
  if (left(A,2)==='AM' || left(A,2)==='AL') return 'Overfloor';
  if (left(A,2)==='RM') return 'Raw Material';

  if (left(A,4)==='B-A-') return 'Overfloor';
  if (left(A,3)==='B-0') return 'Selective';
  if (left(A,3)==='B-1') return 'Selective';
  if (left(A,3)==='B-2') return 'Selective';
  if (left(A,3)==='PRE') return 'Pre-Transfer';
  if (left(A,2)==='C-') return 'Cool Room Floor';
  if (left(A,2)==='DM') return 'DAMAGE';
  if (left(A,2)==='IS') return 'ISSUE';
  if (left(A,3)==='B-E') return 'Longspand E';
  if (left(A,3)==='B-F') return 'Longspand F';
  if (left(A,3)==='B-C') return 'Cool Room';
  if (left(A,3)==='B-G') return 'Microrack';
  if (left(A,3)==='B-3') return 'Consumable Rack';
  if (left(A,6)==='BORROW') return 'BORROW';
  if (left(A,2)==='LO') return 'LOST';
  return 'Overfloor';
}

function computeItemStatus(oh, r1, r2, r3, rules) {
  const cfg = Object.assign({ maxRounds: 3, repeatMatchAction: 'recount' }, rules || {});
  const has = v => v !== null && v !== undefined && v !== '';
  const num = v => has(v) ? +v : v;
  oh = num(oh); r1 = num(r1); r2 = num(r2); r3 = num(r3);

  if (!has(r1)) return '';

  const rounds = [r1, r2, r3].filter(has).slice(0, cfg.maxRounds);

  if (has(oh) && rounds.some(r => r === oh)) return 'OK';

  let repeatFound = false;
  for (let i = 0; i < rounds.length && !repeatFound; i++) {
    for (let j = i + 1; j < rounds.length; j++) {
      if (rounds[i] === rounds[j]) { repeatFound = true; break; }
    }
  }

  if (repeatFound) {
    if (cfg.repeatMatchAction === 'auto_pass') return 'OK';
    if (cfg.repeatMatchAction === 'send_variance') return 'Diff';
  }

  if (rounds.length < cfg.maxRounds) return 'PENDING';
  return 'Diff';
}

async function getSessionRules(sessionId) {
  const { data } = await sb.from('count_sessions')
    .select('max_rounds,repeat_match_action').eq('id', sessionId).single();
  return {
    maxRounds: data?.max_rounds || 3,
    repeatMatchAction: data?.repeat_match_action || 'recount',
  };
}

function logAudit(sessionId, locationId, itemId, action, oldValue, newValue, assignmentId) {
  sb.from('audit_log').insert({
    session_id: sessionId || null,
    location_id: locationId || null,
    item_id: itemId || null,
    assignment_id: assignmentId || null,
    action,
    old_value: (oldValue===undefined||oldValue===null) ? null : String(oldValue),
    new_value: (newValue===undefined||newValue===null) ? null : String(newValue),
    performed_by: me?.id || null,
  }).then(({error}) => { if (error) console.warn('audit_log insert failed:', error.message); });
}

function tagInfo(s) {
  return ({
    pending:      { cls:'tag-gray',   lbl:'รอสแกนนับ'         },
    in_progress: { cls:'tag-blue',   lbl:'กำลังนับยอด'      },
    round1_done: { cls:'tag-amber',  lbl:'รอแก้นับรอบ 2'       },
    round2_done: { cls:'tag-amber',  lbl:'รอแก้นับรอบ 3'       },
    round3_done: { cls:'tag-red',    lbl:'ส่งเคลียร์กับหัวหน้า' },
    completed:   { cls:'tag-green',  lbl:'นับผ่านสำเร็จ'         },
    approved:    { cls:'tag-green',  lbl:'อนุมัติผ่านสต็อก'  },
  }[s]) || { cls:'tag-gray', lbl: s };
}

async function doResetPassword() {
  const p1 = Q('rp1')?.value, p2 = Q('rp2')?.value;
  const al = Q('rpa');
  if (!p1 || p1.length < 6) { al.innerHTML = `<div class="alert alert-red">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</div>`; return; }
  if (p1 !== p2) { al.innerHTML = `<div class="alert alert-red">รหัสผ่านทั้งสองช่องไม่ตรงกัน</div>`; return; }
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก...</div>`;
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { al.innerHTML = `<div class="alert alert-red">${error.message}</div>`; return; }
  al.innerHTML = `<div class="alert alert-green">✅ ตั้งรหัสผ่านใหม่สำเร็จ กำลังเข้าสู่ระบบ...</div>`;
  setTimeout(async () => { await loadProf(); go(home()); }, 1200);
}

async function doLogin() {
  const email = Q('le').value.trim(), pwd = Q('lp').value;
  if (!email || !pwd) { Q('la').innerHTML = '<div class="alert alert-amber">ใส่รหัสและอีเมลให้ครบถ้วนก่อนน้า 🌸</div>'; return; }
  const btn = Q('lb');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    Q('la').innerHTML = '<div class="alert alert-red">อีเมลหรือรหัสผ่านผิดพลาด ลองใหม่อีกทีนะจ๊ะ</div>';
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  } else {
    me = (await sb.auth.getUser()).data.user;
    await loadProf();
    go(home());
  }
}

async function doLogout() { await sb.auth.signOut(); }

async function loadCTasks() {
  const { data: sess } = await sb.from('count_sessions').select('id').eq('status','active');
  const sids = sess?.map(s => s.id) || [];

  if (!sids.length) {
    cnt().innerHTML = `<div class="card" style="text-align:center;padding:44px">
      <div style="font-size:42px">📭</div>
      <div style="margin-top:14px;color:var(--text-muted);font-weight:500">ยังไม่มี Session ที่เปิดอยู่</div>
    </div>`; return;
  }

  const { data: asgns, error } = await sb.from('assignments')
    .select('id,status,location_id,session_id,locations(code,zone,area,row_no,level),count_sessions(name)')
    .eq('assigned_to', me.id)
    .in('session_id', sids)
    .order('created_at');

  if (error) { cnt().innerHTML = errBox(error.message); return; }

  if (!asgns?.length) {
    cnt().innerHTML = `<div class="card" style="text-align:center;padding:44px">
      <div style="font-size:42px">📋</div>
      <div style="margin-top:14px;color:var(--text-muted);font-weight:500">ยังไม่มีงานที่ได้รับมอบหมาย</div>
    </div>`; return;
  }

  window._myTasks = asgns;

  const rows = new Set(), poss = new Set(), lvls = new Set();
  asgns.forEach(a => {
    const parts = (a.locations?.code || '').split('-');
    if (parts[1]) rows.add(parts[1]);
    if (parts[2]) poss.add(parts[2]);
    if (parts[3]) lvls.add(parts[3]);
  });
  const fillSel = (id, vals) => {
    const el = Q(id); if (!el) return;
    el.innerHTML = '<option value="">ทั้งหมด</option>' +
      [...vals].sort().map(v => `<option value="${v}">${v}</option>`).join('');
  };

  const done = asgns.filter(a => ['completed','approved'].includes(a.status)).length;
  const pct  = Math.round(done / asgns.length * 100);

  cnt().innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:13px;font-weight:600;color:var(--text-muted)">ความคืบหน้า</span>
        <span style="font-size:14px;font-weight:800;color:var(--primary-blue)">${done} / ${asgns.length}</span>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>
      <button class="btn btn-ghost" style="margin-top:14px;width:100%" onclick="openScanner()">📷 สแกน Location</button>
    </div>
    <div class="card">
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">กรองงานของฉัน</div>
      <div class="grid-3">
        <div class="fg" style="margin:0">
          <label style="font-size:10px">ROW</label>
          <select id="mt-row" onchange="renderMyTasks()" style="font-size:12px;padding:7px 9px"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:10px">POSITION</label>
          <select id="mt-pos" onchange="renderMyTasks()" style="font-size:12px;padding:7px 9px"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:10px">LEVEL</label>
          <select id="mt-lvl" onchange="renderMyTasks()" style="font-size:12px;padding:7px 9px"></select>
        </div>
      </div>
    </div>
    <div class="card card-flush" id="mt-list"></div>`;

  fillSel('mt-row', rows);
  fillSel('mt-pos', poss);
  fillSel('mt-lvl', lvls);

  renderMyTasks();
}

function renderMyTasks() {
  const list = Q('mt-list');
  if (!list) return;
  const asgns = window._myTasks || [];
  const rowF = Q('mt-row')?.value || '';
  const posF = Q('mt-pos')?.value || '';
  const lvlF = Q('mt-lvl')?.value || '';

  const filtered = asgns.filter(a => {
    const parts = (a.locations?.code || '').split('-');
    if (rowF && parts[1] !== rowF) return false;
    if (posF && parts[2] !== posF) return false;
    if (lvlF && parts[3] !== lvlF) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="load" style="padding:30px;font-size:13px;color:var(--text-muted);text-align:center">ไม่มีงานที่ตรงกับตัวกรอง</div>`;
    return;
  }

  let html = '';
  for (const a of filtered) {
    const l   = a.locations;
    const si  = tagInfo(a.status);
    const can = !['completed','approved'].includes(a.status);
    const sub = [l.zone, l.area, l.row_no && 'Row '+l.row_no, l.level && 'Lv.'+l.level].filter(Boolean).join(' · ');
    html += `<div class="row ${can?'click':''}" ${can?`onclick="go('c-count',{aid:'${a.id}'})"`:''}>
      <div class="row-body">
        <div class="row-title mono">${l.code}</div>
        <div class="row-sub">${sub}</div>
        <div class="row-sub" style="margin-top:1px">${a.count_sessions.name}</div>
      </div>
      <span class="tag ${si.cls}">${si.lbl}</span>
      ${can ? '<span class="caret">›</span>' : ''}
    </div>`;
  }
  list.innerHTML = html;
}

function openScanner() {
  if (typeof Html5Qrcode === 'undefined') { alert('ตัวสแกนยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'scan-overlay';
  overlay.id = 'scanOverlay';
  overlay.innerHTML = `
    <div class="scan-header">
      <span>📷 สแกน Location</span>
      <button onclick="closeScanner()">✕</button>
    </div>
    <div id="scanReader"></div>`;
  document.body.appendChild(overlay);

  _html5Qr = new Html5Qrcode('scanReader');
  _html5Qr.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 240 },
    (decodedText) => onScanSuccess(decodedText),
    () => {}
  ).catch(err => {
    alert('เปิดกล้องไม่ได้: ' + (err?.message || err));
    closeScanner();
  });
}

function closeScanner() {
  if (_html5Qr) {
    _html5Qr.stop().catch(() => {}).finally(() => { try { _html5Qr.clear(); } catch(e){} _html5Qr = null; });
  }
  const overlay = Q('scanOverlay');
  if (overlay) overlay.remove();
}

function onScanSuccess(text) {
  const code = (text || '').trim().toUpperCase();
  const tasks = window._myTasks || [];
  const match = tasks.find(a => a.locations?.code?.toUpperCase() === code);
  closeScanner();
  if (!match) { alert(`ไม่พบ Location "${code}" ในงานของคุณ`); return; }
  if (['completed','approved'].includes(match.status)) { alert(`Location "${code}" นับเสร็จแล้ว`); return; }
  go('c-count', { aid: match.id });
}

function renderCounterPills() {
  const wrap = Q('counterNamePills');
  if (!wrap) return;
  const names = window._counterNames || [];
  window._selectedCounters = window._selectedCounters || new Set();
  if (!names.length) {
    wrap.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:4px 0">ยังไม่มีชื่อในระบบ — เพิ่มชื่อใหม่ด้านล่างได้เลย</div>`;
    return;
  }
  wrap.innerHTML = names.map(c => {
    const sel = window._selectedCounters.has(c.name);
    const safe = c.name.replace(/'/g,"\\'");
    return `<button type="button" class="cname-pill ${sel?'sel':''}" onclick="toggleCounterName('${safe}')">${sel?'✓ ':''}${c.name}</button>`;
  }).join('');
}

function toggleCounterName(name) {
  window._selectedCounters = window._selectedCounters || new Set();
  if (window._selectedCounters.has(name)) window._selectedCounters.delete(name);
  else window._selectedCounters.add(name);
  window._lastPickedCounterNames = [...window._selectedCounters];
  renderCounterPills();
}

async function confirmNewCounterName() {
  const input = Q('counterNameNewInput');
  const name = input?.value.trim();
  if (!name) { alert('กรุณาพิมพ์ชื่อผู้นับก่อน'); return; }

  const { data, error } = await sb.from('counter_names')
    .upsert({ name, created_by: me.id }, { onConflict: 'name', ignoreDuplicates: true })
    .select('id,name');

  if (error) { alert('เพิ่มชื่อไม่สำเร็จ: ' + error.message); return; }

  window._counterNames = window._counterNames || [];
  if (!window._counterNames.some(c => c.name === name)) {
    window._counterNames.push({ name });
  }
  window._selectedCounters = window._selectedCounters || new Set();
  window._selectedCounters.add(name);
  window._lastPickedCounterNames = [...window._selectedCounters];

  renderCounterPills();
  input.value = '';
}

function toggleExtra(itemId) {
  const el = Q('extra_'+itemId);
  if (el) el.classList.toggle('open');
}

function openCameraFor(itemId)  { Q('cam_'+itemId)?.click(); }
function openGalleryFor(itemId) { Q('gal_'+itemId)?.click(); }

async function handlePhoto(itemId, input) {
  const file = input.files[0];
  if (!file) return;
  const thumb = Q('thumb_'+itemId);
  if (thumb) { thumb.src = URL.createObjectURL(file); thumb.style.display = 'block'; }
  input.disabled = true;
  try {
    const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g,'');
    const fileName = `${Date.now()}_${itemId}.${ext}`;
    const { error } = await sb.storage.from('count-photos').upload(fileName, file, { upsert:true });
    if (error) throw error;
    const { data: urlData } = sb.storage.from('count-photos').getPublicUrl(fileName);
    window._photoMap = window._photoMap || {};
    window._photoMap[itemId] = urlData.publicUrl;
    const tg = Q('tg_'+itemId);
    if (tg) tg.classList.add('has');
  } catch(e) {
    alert('อัปโหลดรูปไม่สำเร็จ: ' + (e?.message || e));
  }
  input.disabled = false;
}

async function submitCount(aid, round, idsStr) {
  const ids = idsStr.split(',');
  const al  = Q('ca'), btn = Q('cb');

  const selectedNames = [...(window._selectedCounters || [])];
  if (!selectedNames.length) {
    al.innerHTML = `<div class="alert alert-red">⚠️ กรุณาเลือก "ผู้นับจริง" อย่างน้อย 1 คนก่อนบันทึกยอดนับ</div>`;
    return;
  }
  const actualCounterName = selectedNames.join(', ');

  const recs = [];
  for (const iid of ids) {
    const v = Q('q_'+iid)?.value;
    if (v === '' || v === undefined || v === null) {
      al.innerHTML = `<div class="alert alert-red">กรอกจำนวนให้ครบทุกรายการ (ถ้าไม่มีสินค้าให้กรอก 0)</div>`;
      return;
    }
    const remark   = Q('rmk_'+iid)?.value?.trim() || null;
    const photoUrl = (window._photoMap && window._photoMap[iid]) || null;
    recs.push({
      assignment_id: aid, item_id: iid, round,
      count_qty: parseFloat(v), counted_by: me.id,
      actual_counter_name: actualCounterName,
      remark, photo_url: photoUrl,
    });
  }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  const { error } = await sb.from('count_records')
    .upsert(recs, { onConflict:'assignment_id,item_id,round' });

  if (error) {
    al.innerHTML = errBox(error.message);
    btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
  }

  const { data: asgn } = await sb.from('assignments')
    .select('location_id,session_id').eq('id', aid).single();

  const [{ data: snaps }, { data: allRounds }, rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty')
      .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('count_records').select('item_id,round,count_qty').eq('assignment_id', aid),
    getSessionRules(asgn.session_id),
  ]);

  const ohMap = Object.fromEntries(snaps?.map(s => [s.item_id, +s.onhand_qty]) || []);
  const byItem = {};
  allRounds?.forEach(r => {
    byItem[r.item_id] = byItem[r.item_id] || {};
    byItem[r.item_id][r.round] = +r.count_qty;
  });

  const itemStatuses = Object.entries(byItem).map(([iid, v]) =>
    computeItemStatus(ohMap[iid], v[1], v[2], v[3], rules));
  const anyPending = itemStatuses.some(st => st === 'PENDING');
  const anyDiff    = itemStatuses.some(st => st === 'Diff');
  const needsMore  = anyPending || anyDiff;

  let newStatus;
  if (anyPending)   newStatus = ['','round1_done','round2_done','round3_done'][round];
  else if (anyDiff) newStatus = 'round3_done';
  else              newStatus = 'completed';

  await sb.from('assignments').update({ status: newStatus }).eq('id', aid);
  window._photoMap = {};

  if (!needsMore) {
    alert('✅ ยอดตรงทุกรายการ! บันทึกสำเร็จ');
    go('c-tasks');
  } else if (anyPending) {
    alert(`⚠️ ยอดไม่ตรงกับระบบ — กรุณานับรอบที่ ${round+1} อีกครั้งอย่างระมัดระวัง`);
    go('c-count', { aid });
  } else {
    alert('⚠️ ยอดไม่ตรงกับระบบ — ส่ง Supervisor ตรวจสอบแล้ว');
    go('c-tasks');
  }
}

function nextRound(st) {
  if (['pending','in_progress'].includes(st)) return 1;
  if (st === 'round1_done') return 2;
  if (st === 'round2_done') return 3;
  return null;
}

//   SUPERVISOR / ADMIN DASHBOARD & VARIANCE

async function loadSvDash() {
  const { data: sessions } = await sb.from('count_sessions')
    .select('id,name').eq('status','active').order('created_at',{ascending:false});

  if (!sessions?.length) {
    cnt().innerHTML = `<div class="card" style="text-align:center;padding:44px">
      <div style="font-size:54px">🌴</div>
      <div style="margin-top:14px;color:var(--text-main);font-weight:700">ยังไม่มี Session ที่เปิดอยู่</div>
      ${ ['admin','supervisor'].includes(prof?.role) ? `<button class="btn btn-blue" style="margin-top:16px" onclick="go('ad-manage')">📂 ไปสร้าง Session</button>` : ''}
    </div>`; return;
  }

  const sessOpts = sessions.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const curSid = S._dashSid || sessions[0].id;
  S._dashSid = curSid;
  const curName = sessions.find(s=>s.id===curSid)?.name || sessions[0].name;

  const { data: asgns } = await sb.from('assignments')
    .select('id,status,assigned_to,location_id,locations(code,zone,row_no,level),profiles!assigned_to(name)')
    .eq('session_id', curSid)
    .order('status');

  if (!asgns?.length) {
    cnt().innerHTML = `
      <div class="card">
        <div class="fg" style="margin-bottom:0">
          <label>Session</label>
          <select onchange="S._dashSid=this.value;loadSvDash()">${sessOpts}</select>
        </div>
      </div>
      <div class="card">
        <div class="alert alert-blue">Session "${curName}" ยังไม่มีการ Assign งาน</div>
        ${ ['admin','supervisor'].includes(prof?.role) ? `<button class="btn btn-blue" style="margin-top:10px" onclick="go('ad-manage')">👥 ไปจ่ายงาน</button>` : ''}
      </div>`; return;
  }

  const total    = asgns.length;
  const done     = asgns.filter(a => ['completed','approved'].includes(a.status)).length;
  const varCount = asgns.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status)).length;
  const pending  = asgns.filter(a => ['pending','in_progress'].includes(a.status)).length;
  const pct      = Math.round(done / total * 100);

  const asgnInfoMap = {};
  asgns.forEach(a => { asgnInfoMap[a.id] = a; });

  const allAsgnIds = asgns.map(a => a.id);
  const [{ data: allCounts }, { data: allSnapshots }, rules] = await Promise.all([
    sb.from('count_records').select('assignment_id,item_id,round,count_qty').in('assignment_id', allAsgnIds),
    sb.from('stock_snapshot').select('location_id,item_id,onhand_qty').eq('session_id', curSid),
    getSessionRules(curSid),
  ]);

  const ohMap = {};
  (allSnapshots||[]).forEach(s => { ohMap[s.location_id + '|' + s.item_id] = +s.onhand_qty; });

  const countByAsgn = {};
  (allCounts||[]).forEach(c => {
    if (!countByAsgn[c.assignment_id]) countByAsgn[c.assignment_id] = {};
    if (!countByAsgn[c.assignment_id][c.item_id]) countByAsgn[c.assignment_id][c.item_id] = {};
    countByAsgn[c.assignment_id][c.item_id][c.round] = +c.count_qty;
  });

  const diffAssignments = [];
  for (const a of asgns) {
    if (!['round1_done','round2_done','round3_done'].includes(a.status)) continue;
    const itemCounts = countByAsgn[a.id] || {};
    const locId = a.location_id;
    let hasDiff = false, hasPending = false;
    for (const [itemId, rounds] of Object.entries(itemCounts)) {
      const oh = ohMap[locId + '|' + itemId];
      if (oh === undefined) continue;
      const st = computeItemStatus(oh, rounds[1], rounds[2], rounds[3], rules);
      if (st === 'Diff') hasDiff = true;
      if (st === 'PENDING') hasPending = true;
    }
    if (hasDiff || hasPending) diffAssignments.push({ ...a, _hasDiff: hasDiff, _hasPending: hasPending });
  }

  let wmsRows = [];
  let vaError = null;

  try {
    const { data: vaData, error: vaErr } = await sb.from('variance_approvals')
      .select('id,assignment_id,item_id,final_qty,variance,resolution,approved_by,wms_fixed,wms_fixed_at,wms_fixed_by')
      .in('assignment_id', allAsgnIds);

    if (vaErr) {
      vaError = vaErr;
      wmsRows = [];
    } else {
      wmsRows = (vaData || []).map(v => ({
        ...v,
        wms_fixed: v.wms_fixed ?? false,
        wms_fixed_at: v.wms_fixed_at ?? null,
        wms_fixed_by: v.wms_fixed_by ?? null,
        created_at: v.created_at ?? null,
        _fromVA: true
      }));
    }
  } catch (e) {
    vaError = e;
  }

  const allItemIds = [...new Set(wmsRows.map(v => v.item_id).filter(Boolean))];
  const allApproverIds = [...new Set(wmsRows.map(v => v.approved_by).filter(Boolean))];
  const [{ data: itemsData }, { data: approversData }] = await Promise.all([
    allItemIds.length ? sb.from('items').select('id,code,description').in('id', allItemIds) : { data: [] },
    allApproverIds.length ? sb.from('profiles').select('id,name').in('id', allApproverIds) : { data: [] },
  ]);
  const itemMap = Object.fromEntries((itemsData||[]).map(i => [i.id, i]));
  const approverMap = Object.fromEntries((approversData||[]).map(p => [p.id, p]));
  wmsRows.forEach(v => {
    v.items = itemMap[v.item_id] || { code: '?', description: '' };
    v.profiles = approverMap[v.approved_by] || { name: '?' };
  });

  const approvedAsgnIds = new Set(wmsRows.filter(v => v.wms_fixed).map(v => v.assignment_id));
  const pendingWmsRows = [];
  for (const a of diffAssignments) {
    if (approvedAsgnIds.has(a.id)) continue;
    const itemCounts = countByAsgn[a.id] || {};
    const locId = a.location_id;
    for (const [itemId, rounds] of Object.entries(itemCounts)) {
      const oh = ohMap[locId + '|' + itemId];
      if (oh === undefined) continue;
      const st = computeItemStatus(oh, rounds[1], rounds[2], rounds[3], rules);
      if (st !== 'Diff' && st !== 'PENDING') continue;
      const latestRound = rounds[3] !== undefined ? 3 : rounds[2] !== undefined ? 2 : 1;
      const countQty = rounds[latestRound];
      const variance = countQty - oh;
      pendingWmsRows.push({
        _isPending: true,
        assignment_id: a.id,
        item_id: itemId,
        final_qty: countQty,
        variance: variance,
        resolution: st === 'Diff' ? 'pending_diff' : 'pending_recount',
        approved_by: null,
        wms_fixed: false,
        wms_fixed_at: null,
        wms_fixed_by: null,
        created_at: null,
        items: { code: '?', description: '' },
        profiles: { name: '(ยังไม่คอนเฟิร์ม)' },
      });
    }
  }

  const pendingItemIds = [...new Set(pendingWmsRows.map(v => v.item_id).filter(Boolean))];
  if (pendingItemIds.length) {
    const { data: pendingItems } = await sb.from('items').select('id,code,description').in('id', pendingItemIds);
    const pItemMap = Object.fromEntries((pendingItems||[]).map(i => [i.id, i]));
    pendingWmsRows.forEach(v => { v.items = pItemMap[v.item_id] || { code: '?', description: '' }; });
  }

  const allWmsRows = [...wmsRows, ...pendingWmsRows];
  window._wmsRows = allWmsRows;
  window._wmsAsgnInfoMap = asgnInfoMap;

  let diffPlus = 0, diffMinus = 0, diffPlusCount = 0, diffMinusCount = 0;
  allWmsRows.forEach(v => {
    const d = +v.variance;
    if (d > 0) { diffPlus += d; diffPlusCount++; }
    else if (d < 0) { diffMinus += Math.abs(d); diffMinusCount++; }
  });

  const byUser = {};
  for (const a of asgns) {
    const uid = a.assigned_to;
    if (!byUser[uid]) byUser[uid] = { name: a.profiles?.name || '?', total:0, done:0, var:0, items:[] };
    byUser[uid].total++;
    if (['completed','approved'].includes(a.status)) byUser[uid].done++;
    if (['round1_done','round2_done','round3_done'].includes(a.status)) byUser[uid].var++;
    byUser[uid].items.push(a);
  }

  let peopleRows = '';
  Object.entries(byUser).forEach(([uid, u], idx) => {
    const p = Math.round(u.done / u.total * 100);
    peopleRows += `<div class="tab-row" style="border-bottom:1px solid rgba(194,205,220,0.4);padding:12px 0" onclick="toggleUserDetail('${idx}')">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700;color:var(--text-main)">👤 ${u.name}</div>
          <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
            <span class="tag tag-green">${u.done} เสร็จ</span>
            ${u.var ? `<span class="tag tag-amber">${u.var} variance</span>` : ''}
            <span class="tag tag-gray">${u.total - u.done - u.var} รอ</span>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:22px;font-weight:800;color:var(--primary-blue);font-family:'Fredoka'">${p}%</div>
          <div style="font-size:11px;color:var(--text-muted);font-weight:600">${u.done}/${u.total}</div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--text-muted);font-weight:600;margin-top:6px">▾ ดูรายการ</div>
    </div>
    <div id="udetail_${idx}" style="display:none;background:rgba(255,255,255,0.4);padding:10px 14px;border-radius:16px;margin:6px 0 10px">
      ${u.items.map(a => {
        const si = tagInfo(a.status);
        const l = a.locations;
        const loc = [l?.zone,l?.row_no,l?.level].filter(Boolean).join(' · ');
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(194,205,220,0.3);gap:8px">
          <div style="min-width:0">
            <div class="mono" style="font-size:12px;font-weight:700">${l?.code||'?'}</div>
            <div style="font-size:10px;color:var(--text-muted)">${loc}</div>
          </div>
          <span class="tag ${si.cls}" style="font-size:10px;flex-shrink:0">${si.lbl}</span>
        </div>`;
      }).join('')}
    </div>`;
  });

  _svDashOpenVarianceIdx = null;
  const needsFollowUp = asgns.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status));
  const varianceRowsHtml = needsFollowUp.length ? needsFollowUp.map((a, i) => {
    const si = tagInfo(a.status);
    const l = a.locations;
    return `<div style="border-bottom:1px solid rgba(194,205,220,0.4);padding:12px 0">
      <div class="tab-row" style="display:flex;align-items:center;gap:10px" onclick="toggleVarianceDetail('${a.id}',${i})">
        <div style="flex:1;min-width:0">
          <div class="mono" style="font-size:15px;font-weight:800;color:var(--text-main)">${l?.code||'?'}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:500">👤 ${a.profiles?.name||'?'} · ${[l?.zone,l?.row_no,l?.level].filter(Boolean).join(' · ')}</div>
        </div>
        <span class="tag ${si.cls}">${si.lbl}</span>
        <span class="caret" style="font-size:16px">▾</span>
      </div>
      <div id="vdetail_${i}" style="display:none;background:rgba(255,255,255,0.4);margin-top:10px;border-radius:16px;overflow:hidden"></div>
    </div>`;
  }).join('') : `<div style="padding:28px 0;text-align:center;color:var(--text-muted);font-size:13px">🎉 ไม่มี Variance ที่ต้องตรวจสอบตอนนี้</div>`;

  const tab = S._dashTab || _dashTab;
  _dashTab = tab;
  const tabBtn = (id, label, icon, badge) => `
    <button onclick="S._dashTab='${id}';_dashTab='${id}';loadSvDash()"
      style="flex:1;padding:10px 6px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;border-bottom:3px solid ${tab===id?'var(--primary-blue)':'transparent'};color:${tab===id?'var(--primary-blue)':'var(--text-muted)'};transition:all .15s">
      ${icon} ${label}${badge ? ` <span style="background:var(--accent-red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:2px">${badge}</span>` : ''}
    </button>`;

  const summaryTabHtml = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px">
      <div class="stat">
        <div class="stat-n">${total}</div>
        <div class="stat-l">ทั้งหมด</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--accent-green)">${done}</div>
        <div class="stat-l">เสร็จแล้ว</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--accent-amber)">${varCount}</div>
        <div class="stat-l">Variance รอตรวจ</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-around;align-items:center;padding:14px;background:var(--neu-surface);border-radius:16px;margin-bottom:8px;box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light)">
      <div style="text-align:center">
        <div style="font-size:20px;font-weight:800;color:var(--accent-green);font-family:'Fredoka'">🔺 +${diffPlus}</div>
        <div style="font-size:10px;color:var(--text-muted);font-weight:700;margin-top:2px">Gain (${diffPlusCount} รายการ)</div>
      </div>
      <div style="width:1px;height:28px;background:var(--neu-shadow-dark)"></div>
      <div style="text-align:center">
        <div style="font-size:20px;font-weight:800;color:var(--accent-red);font-family:'Fredoka'">🔻 −${diffMinus}</div>
        <div style="font-size:10px;color:var(--text-muted);font-weight:700;margin-top:2px">Lost (${diffMinusCount} รายการ)</div>
      </div>
    </div>
    <div style="text-align:center;font-size:10px;color:var(--text-muted);margin-bottom:16px">* ผลรวมจำนวนจริง (ไม่ใช่จำนวนรายการ)</div>
    <div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:13px;font-weight:700;color:var(--text-main)">ความคืบหน้ารวม</span>
        <span style="font-size:16px;font-weight:800;color:var(--primary-blue);font-family:'Fredoka'">${pct}%</span>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:10px">👥 ความคืบหน้าแต่ละคน</div>
      ${peopleRows || `<div style="padding:16px 0;text-align:center;color:var(--text-muted);font-size:12px">ยังไม่มีใครถูก Assign งาน</div>`}
    </div>`;

  const varianceTabHtml = `<div>${varianceRowsHtml}</div>`;

  const wmsFilter = S._wmsFilter || 'unfixed';
  const wmsZone = S._wmsZone || '';
  const wmsLevel = S._wmsLevel || '';
  const wmsUser = S._wmsUser || '';
  const wmsLocSearch = S._wmsLocSearch || '';

  const wmsZones = new Set(), wmsLevels = new Set();
  const wmsUsersMap = {};
  allWmsRows.forEach(v => {
    const loc = asgnInfoMap[v.assignment_id]?.locations;
    if (loc?.zone) wmsZones.add(loc.zone);
    if (loc?.level) wmsLevels.add(loc.level);
    if (v.approved_by) wmsUsersMap[v.approved_by] = v.profiles?.name || '?';
    else if (v._isPending) wmsUsersMap['_pending'] = '(รอคอนเฟิร์ม)';
  });

  const wmsTotalCount = allWmsRows.length;
  const wmsFixedCount = allWmsRows.filter(v => v.wms_fixed).length;
  const wmsUnfixedCount = wmsTotalCount - wmsFixedCount;
  const wmsFixedPercent = wmsTotalCount > 0 ? Math.round((wmsFixedCount / wmsTotalCount) * 100) : 0;

  const errorBanner = vaError 
    ? `<div class="alert alert-red" style="margin-bottom:10px;font-size:12px">⚠️ ไม่สามารถดึงข้อมูลคอนเฟิร์มแล้วได้</div>`
    : '';

  const wmsTabHtml = `
    ${errorBanner}
    <div class="wms-summary-card">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase">ทั้งหมด</div>
        <div class="wms-summary-number">${wmsTotalCount}</div>
        <div class="wms-summary-percent">${wmsFixedPercent}% แก้ไขแล้ว</div>
      </div>
      <div class="wms-summary-ring">
        <svg viewBox="0 0 100 100" class="wms-ring-svg">
          <circle class="wms-ring-bg" cx="50" cy="50" r="42"/>
          <circle class="wms-ring-progress" cx="50" cy="50" r="42" 
            stroke-dasharray="${2 * Math.PI * 42}" 
            stroke-dashoffset="${2 * Math.PI * 42 * (1 - wmsFixedPercent / 100)}"/>
        </svg>
        <div class="wms-ring-text">${wmsFixedPercent}%</div>
      </div>
    </div>
    <div class="status-badge-grid">
      <div class="status-badge-card unfixed">
        <div style="font-size:24px">🔧</div>
        <div class="status-badge-number">${wmsUnfixedCount}</div>
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-top:4px">ยังไม่แก้ WMS</div>
      </div>
      <div class="status-badge-card fixed">
        <div style="font-size:24px">✅</div>
        <div class="status-badge-number">${wmsFixedCount}</div>
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-top:4px">แก้ไขแล้ว</div>
      </div>
    </div>
    <div class="grid-3" style="margin-bottom:10px">
      <div><label style="font-size:10px">ZONE</label>
        <select id="wms-zone" onchange="updateWmsFilter('Zone',this.value)">
          <option value="">ทั้งหมด</option>
          ${[...wmsZones].sort().map(z=>`<option value="${z}" ${wmsZone===z?'selected':''}>${z}</option>`).join('')}
        </select></div>
      <div><label style="font-size:10px">LEVEL</label>
        <select id="wms-level" onchange="updateWmsFilter('Level',this.value)">
          <option value="">ทั้งหมด</option>
          ${[...wmsLevels].sort().map(l=>`<option value="${l}" ${wmsLevel===l?'selected':''}>${l}</option>`).join('')}
        </select></div>
      <div><label style="font-size:10px">ผู้ตรวจนับ</label>
        <select id="wms-user" onchange="updateWmsFilter('User',this.value)">
          <option value="">ทั้งหมด</option>
          <option value="_pending" ${wmsUser==='_pending'?'selected':''}>⏳ รอคอนเฟิร์ม</option>
          ${Object.entries(wmsUsersMap).filter(([k]) => k !== '_pending').sort((a,b)=>a[1].localeCompare(b[1])).map(([id,name])=>`<option value="${id}" ${wmsUser===id?'selected':''}>${name}</option>`).join('')}
        </select></div>
    </div>
    <div class="fg" style="margin-bottom:10px">
      <label style="font-size:10px">ค้นหา Location</label>
      <input id="wms-loc-search" value="${wmsLocSearch}" placeholder="เช่น B-29-001-A" oninput="updateWmsFilter('LocSearch',this.value)">
    </div>
    <div class="fg" style="margin-bottom:12px">
      <select id="wms-status" onchange="updateWmsFilter('Filter',this.value)">
        <option value="unfixed" ${wmsFilter==='unfixed'?'selected':''}>ยังไม่แก้ WMS</option>
        <option value="fixed" ${wmsFilter==='fixed'?'selected':''}>แก้แล้ว</option>
        <option value="pending" ${wmsFilter==='pending'?'selected':''}>⏳ รอคอนเฟิร์ม</option>
        <option value="all" ${wmsFilter==='all'?'selected':''}>ทั้งหมด</option>
      </select>
    </div>
    <div id="wms-list"></div>`;

  const tabContent = tab === 'variance' ? varianceTabHtml : tab === 'wms' ? wmsTabHtml : summaryTabHtml;

  cnt().innerHTML = `
    <div class="card">
      <div class="fg" style="margin-bottom:0">
        <label>Session ที่ดูอยู่</label>
        <select onchange="S._dashSid=this.value;loadSvDash()">${sessOpts}</select>
      </div>
    </div>
    <div class="card card-flush">
      <div style="display:flex;border-bottom:1px solid rgba(194,205,220,0.4)">
        ${tabBtn('summary','สรุป','📊')}
        ${tabBtn('variance','Variance','🧭', needsFollowUp.length || null)}
        ${tabBtn('wms','ปรับยอด WMS','🔧', wmsUnfixedCount || null)}
      </div>
      <div id="dash-content" style="padding:16px">${tabContent}</div>
    </div>`;
  if (tab === 'wms') renderWmsList();
}

function toggleUserDetail(idx) {
  const el = Q('udetail_'+idx);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function toggleWmsFixed(vaId, checked) {
  try {
    if (!vaId || vaId === 'undefined') {
      alert('ไม่พบ ID รายการ');
      return;
    }
    const updates = { wms_fixed: checked };
    if (checked) {
      updates.wms_fixed_at = new Date().toISOString();
      updates.wms_fixed_by = me.id;
    } else {
      updates.wms_fixed_at = null;
      updates.wms_fixed_by = null;
    }
    const { data, error } = await sb.from('variance_approvals')
      .update(updates)
      .eq('id', vaId)
      .select('id,wms_fixed');
    if (error) {
      alert('Error: ' + error.message);
      return;
    }
    if (!data || data.length === 0) {
      alert('Update ไม่สำเร็จ');
      return;
    }
    loadSvDash();
  } catch (e) {
    console.error(e);
    alert('Error: ' + e.message);
  }
}

function updateWmsFilter(key, value) {
  S['_wms'+key] = value;
  renderWmsList();
}

function renderWmsList() {
  const container = Q('wms-list');
  if (!container) return;
  const wmsRows = window._wmsRows || [];
  const asgnInfoMap = window._wmsAsgnInfoMap || {};
  const filterStatus = S._wmsFilter || 'unfixed';
  const filterZone = S._wmsZone || '';
  const filterLevel = S._wmsLevel || '';
  const filterUser = S._wmsUser || '';
  const searchLoc = (S._wmsLocSearch || '').trim().toLowerCase();

  const filtered = wmsRows.filter(v => {
    if (filterStatus === 'unfixed' && v.wms_fixed) return false;
    if (filterStatus === 'fixed' && !v.wms_fixed) return false;
    if (filterStatus === 'pending' && !v._isPending) return false;
    if (filterStatus !== 'all' && filterStatus !== 'pending' && v._isPending) return false;

    const loc = asgnInfoMap[v.assignment_id]?.locations;
    if (filterZone && loc?.zone !== filterZone) return false;
    if (filterLevel && loc?.level !== filterLevel) return false;
    if (filterUser === '_pending' && !v._isPending) return false;
    if (filterUser && filterUser !== '_pending' && v.approved_by !== filterUser) return false;
    if (searchLoc && !(loc?.code||'').toLowerCase().includes(searchLoc)) return false;
    return true;
  });

  if (!filtered.length) {
    const msg = filterStatus==='unfixed' ? '🎉 ไม่มีรายการค้างแก้ WMS' 
      : filterStatus==='fixed' ? 'ยังไม่มีรายการที่แก้แล้ว' 
      : filterStatus==='pending' ? '⏳ ไม่มีรายการที่รอคอนเฟิร์ม'
      : 'ไม่พบรายการตามตัวกรองที่เลือก';
    container.innerHTML = `<div style="padding:28px 0;text-align:center;color:var(--text-muted);font-size:13px">${msg}</div>`;
    return;
  }

  container.innerHTML = filtered.map(v => {
    const loc = asgnInfoMap[v.assignment_id]?.locations;
    const isFixed = !!v.wms_fixed;
    const isPending = !!v._isPending;
    const varAmt = +v.variance;

    const statusBadge = isPending
      ? `<span class="tag tag-amber" style="font-size:10px">⏳ รอคอนเฟิร์ม</span>`
      : `<span class="tag tag-blue" style="font-size:10px">✅ คอนเฟิร์มแล้ว</span>`;

    const wmsButton = isPending
      ? `<button class="btn btn-sm btn-amber" onclick="go('sv-detail',{aid:'${v.assignment_id}'})">🔍 ไปคอนเฟิร์ม</button>`
      : `<button class="btn btn-sm ${isFixed?'btn-green':'btn-ghost'}" onclick="toggleWmsFixed('${v.id}',${!isFixed})">${isFixed?'✅ แก้แล้ว':'⬜ แก้แล้ว?'}</button>`;

    return `<div style="border-bottom:1px solid rgba(194,205,220,0.4);padding:12px 0;display:flex;align-items:center;gap:10px;${isFixed?'opacity:.55':''}">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap">
          <span class="mono" style="font-size:14px;font-weight:800;color:var(--text-main)">${loc?.code||'?'}</span>
          ${statusBadge}
        </div>
        <div style="font-size:12px;color:var(--text-muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.items?.code||''}${v.items?.description?' · '+v.items.description:''}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px">
          ${isPending 
            ? `นับได้: ${v.final_qty} · OH: ${v.final_qty - varAmt} · โดย: ${v.profiles?.name||'?'}`
            : `โดย ${v.profiles?.name||'?'}`
          }
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">

async function doApproveInline(aid, idx) {
  const al = Q('vda_'+idx);
  if (al) al.innerHTML = `<div class="alert alert-blue" style="font-size:11px">⏳ กำลังบันทึก...</div>`;

  const { data: asgn } = await sb.from('assignments')
    .select('location_id,session_id').eq('id', aid).single();

  const { data: snaps } = await sb.from('stock_snapshot').select('item_id,onhand_qty')
    .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id);

  const approvals = [];
  for (const s of snaps || []) {
    const input = Q('confirm_'+s.item_id);
    const val   = input ? parseFloat(input.value) : NaN;
    const finalQty = isNaN(val) ? +s.onhand_qty : val;
    approvals.push({
      assignment_id: aid, item_id: s.item_id, final_qty: finalQty,
      variance: finalQty - +s.onhand_qty, resolution: finalQty === +s.onhand_qty ? 'ok' : 'lost', approved_by: me.id,
    });
  }
  if (approvals.length) {
    await sb.from('variance_approvals').upsert(approvals, { onConflict:'assignment_id,item_id' });
  }
  await sb.from('assignments').update({ status:'approved' }).eq('id', aid);

  if (al) al.innerHTML = `<div class="alert alert-green" style="font-size:11px">✅ คอนเฟิร์มยอดเรียบร้อย</div>`;
  setTimeout(() => loadSvDash(), 1000);
}

async function doReassignCounter(aid, idx, targetRound) {
  const sel = Q('vreassign_'+idx);
  const uid = sel?.value;
  if (!uid) return;
  const { data: before } = await sb.from('assignments')
    .select('session_id,location_id,profiles!assigned_to(name)').eq('id', aid).single();
  const statusForTarget = { 2:'round1_done', 3:'round2_done' }[targetRound];
  const updates = { assigned_to: uid };
  if (statusForTarget) updates.status = statusForTarget;
  await sb.from('assignments').update(updates).eq('id', aid);
  const label = sel.options[sel.selectedIndex]?.textContent || '';
  logAudit(before?.session_id, before?.location_id, null, 'reassign', before?.profiles?.name, label, aid);
  alert(`✅ ส่งงานนี้ให้ ${label} นับรอบที่ ${targetRound||''} ต่อแล้ว`);
  loadSvDash();
}

async function updateOH(sessionId, locationId, itemId, newVal) {
  const val = parseFloat(newVal);
  if (isNaN(val)) return;
  const { data: before } = await sb.from('stock_snapshot').select('onhand_qty')
    .eq('session_id', sessionId).eq('location_id', locationId).eq('item_id', itemId).single();
  await sb.from('stock_snapshot')
    .update({ onhand_qty: val })
    .eq('session_id', sessionId)
    .eq('location_id', locationId)
    .eq('item_id', itemId);
  logAudit(sessionId, locationId, itemId, 'oh_edit', before?.onhand_qty, val);
}

async function refreshZoneDashboard() {
  const sid = Q('as-sess')?.value;
  const box = Q('zone-dash-body');
  if (!sid || !box) return;
  box.innerHTML = `<div class="load" style="padding:16px;font-size:12px;text-align:center">⏳ กำลังคำนวณ...</div>`;

  const [{ data: snaps }, { data: asgns }] = await Promise.all([
    sb.from('stock_snapshot').select('location_id,locations(id,zone)').eq('session_id', sid),
    sb.from('assignments').select('location_id,locations(zone),profiles!assigned_to(name)').eq('session_id', sid),
  ]);

  const zoneTotals = {};
  const seenLoc = new Set();
  (snaps||[]).forEach(s => {
    if (!s.locations || seenLoc.has(s.locations.id)) return;
    seenLoc.add(s.locations.id);
    const z = s.locations.zone || '(ไม่ระบุ Zone)';
    zoneTotals[z] = (zoneTotals[z]||0) + 1;
  });

  const zoneAssigned = {};
  const zoneCounters = {};
  (asgns||[]).forEach(a => {
    const z = a.locations?.zone || '(ไม่ระบุ Zone)';
    zoneAssigned[z] = (zoneAssigned[z]||0) + 1;
    const cname = a.profiles?.name || '?';
    zoneCounters[z] = zoneCounters[z] || {};
    zoneCounters[z][cname] = (zoneCounters[z][cname]||0) + 1;
  });

  const allZones = [...new Set([...Object.keys(zoneTotals), ...Object.keys(zoneAssigned)])].sort();

  if (!allZones.length) {
    box.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">ยังไม่มีข้อมูลใน Session นี้</div>`;
    return;
  }

  box.innerHTML = allZones.map(z => {
    const total = zoneTotals[z] || 0;
    const assigned = zoneAssigned[z] || 0;
    const pct = total ? Math.round(assigned/total*100) : 0;
    const counterList = Object.entries(zoneCounters[z] || {})
      .sort((a,b) => b[1]-a[1])
      .map(([name,c]) => `<span class="tag tag-gray" style="font-size:10px">${name} · ${c}</span>`).join(' ');
    return `<div style="padding:10px 14px;border-bottom:1px solid rgba(194,205,220,0.4)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-size:13px;font-weight:700;color:var(--text-main)">${z}</span>
        <span style="font-size:12px;font-weight:700;color:var(--primary-blue)">${assigned}/${total} จ่ายแล้ว</span>
      </div>
      <div class="gauge-container" style="padding:6px;margin-top:6px">
        <div class="prog" style="height:8px"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      ${counterList ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${counterList}</div>` : ''}
    </div>`;
  }).join('');
}

async function refreshR23Preview() {
  const sid    = Q('as-sess')?.value;
  const status = Q('r23-round')?.value || 'round1_done';
  const zone   = Q('r23-zone')?.value || '';
  const row    = Q('r23-row')?.value  || '';
  const prev   = Q('r23-preview'), btn = Q('r23-btn');
  if (!sid || !prev || !btn) return;

  let q = sb.from('assignments')
    .select('id,session_id,location_id,assigned_to,locations(zone,row_no)')
    .eq('session_id', sid).eq('status', status);
  const { data: asgns, error } = await q;

  const zones = new Set(), rows = new Set();
  asgns?.forEach(a => { if (a.locations?.zone) zones.add(a.locations.zone); if (a.locations?.row_no) rows.add(a.locations.row_no); });
  const fillSel = (id, vals) => {
    const el = Q(id); if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">ทั้งหมด</option>' + [...vals].sort().map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join('');
  };
  fillSel('r23-zone', zones);
  fillSel('r23-row',  rows);

  const filtered = (asgns||[]).filter(a => {
    if (zone && a.locations?.zone !== zone) return false;
    if (row  && a.locations?.row_no !== row) return false;
    return true;
  });
  window._r23Asgns = filtered;

  if (!filtered.length) {
    prev.innerHTML = `<span style="color:var(--text-muted)">ไม่มี Location ในสถานะที่เลือก</span>`;
    btn.disabled = true;
  } else {
    const label = { round1_done:'รอบ 2', round2_done:'รอบ 3', round3_done:'รอบ Sup' }[status]||status;
    prev.innerHTML = `📍 พบ <strong>${filtered.length}</strong> locations รอ${label}`;
    btn.disabled = false;
  }
}

async function doR23Assign() {
  const uid   = Q('r23-user')?.value;
  const asgns = window._r23Asgns || [];
  if (!uid || !asgns.length) return;

  Q('r23-btn').disabled = true;
  Q('r23-preview').innerHTML = `<span>⏳ กำลังอัปเดต ${asgns.length} assignments...</span>`;

  const newLabel = Q('r23-user').options[Q('r23-user').selectedIndex]?.textContent || '';
  const BATCH = 200;
  for (let i = 0; i < asgns.length; i += BATCH) {
    const chunk = asgns.slice(i, i+BATCH);
    for (const a of chunk) {
      await sb.from('assignments').update({ assigned_to: uid }).eq('id', a.id);
      logAudit(a.session_id, a.location_id, null, 'reassign', a.assigned_to, newLabel, a.id);
    }
  }
  Q('r23-preview').innerHTML = `<span style="color:var(--accent-green);font-weight:700">✅ เปลี่ยน Counter เรียบร้อย ${asgns.length} locations</span>`;
  Q('r23-btn').disabled = false;
  window._r23Asgns = [];
  refreshLocs();
}

async function refreshBulkFilters() {
  const sid = Q('as-sess')?.value;
  if (!sid) return;

  const [{ data: snaps }, { data: existing }] = await Promise.all([
    sb.from('stock_snapshot')
      .select('location_id,locations(id,code,zone,row_no,level)')
      .eq('session_id', sid),
    sb.from('assignments')
      .select('location_id').eq('session_id', sid),
  ]);

  const assignedSet = new Set(existing?.map(a => a.location_id) || []);
  const zones = new Set(), rows = new Set(), levels = new Set();
  const seen = new Set();

  for (const s of snaps || []) {
    const l = s.locations;
    if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    seen.add(l.id);
    if (l.zone)   zones.add(l.zone);
    if (l.row_no) rows.add(l.row_no);
    if (l.level)  levels.add(l.level);
  }

  const fill = (id, vals) => {
    const el = Q(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">ทั้งหมด</option>' +
      [...vals].sort().map(v => `<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join('');
  };
  fill('bulk-zone',  zones);
  fill('bulk-row',   rows);
  fill('bulk-level', levels);

  window._bulkSnaps    = snaps || [];
  window._bulkAssigned = assignedSet;
  refreshBulkPreview();
}

function refreshBulkPreview() {
  const zone  = Q('bulk-zone')?.value;
  const row   = Q('bulk-row')?.value;
  const level = Q('bulk-level')?.value;
  const snaps = window._bulkSnaps || [];
  const assignedSet = window._bulkAssigned || new Set();

  const seen = new Set();
  let count = 0;
  for (const s of snaps) {
    const l = s.locations;
    if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone  && l.zone   !== zone)  continue;
    if (row   && l.row_no !== row)   continue;
    if (level && l.level  !== level) continue;
    seen.add(l.id);
    count++;
  }

  const prev = Q('bulk-preview'), btn = Q('bulk-btn');
  if (!prev || !btn) return;
  if (count > 0) {
    prev.innerHTML = `📍 จะ Assign <strong>${count} locations</strong> ให้ Counter ที่เลือก`;
    btn.disabled = false;
  } else {
    prev.innerHTML = `<span style="color:var(--text-muted)">ไม่มี Location ที่ตรงเงื่อนไข</span>`;
    btn.disabled = true;
  }
}

async function doBulkAssign() {
  const sid   = Q('as-sess')?.value;
  const uid   = Q('bulk-user')?.value;
  const zone  = Q('bulk-zone')?.value;
  const row   = Q('bulk-row')?.value;
  const level = Q('bulk-level')?.value;
  const al = Q('aa'), btn = Q('bulk-btn');

  if (!sid || !uid) { al.innerHTML = `<div class="alert alert-red">เลือก Session และ Counter ก่อน</div>`; return; }

  const snaps = window._bulkSnaps || [];
  const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set(), toAssign = [];

  for (const s of snaps) {
    const l = s.locations;
    if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone  && l.zone   !== zone)  continue;
    if (row   && l.row_no !== row)   continue;
    if (level && l.level  !== level) continue;
    seen.add(l.id);
    toAssign.push({ session_id: sid, location_id: l.id, assigned_to: uid });
  }

  if (!toAssign.length) { al.innerHTML = `<div class="alert alert-amber">ไม่มี Location ที่จะ Assign</div>`; return; }

  btn.disabled = true;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลัง Assign ${toAssign.length} locations...</div>`;

  const BATCH = 200;
  for (let i = 0; i < toAssign.length; i += BATCH) {
    const { error } = await sb.from('assignments')
      .upsert(toAssign.slice(i, i+BATCH), { onConflict:'session_id,location_id' });
    if (error) { al.innerHTML = `<div class="alert alert-red">❌ ${error.message}</div>`; btn.disabled=false; return; }
  }

  al.innerHTML = `<div class="alert alert-green">✅ Assign ${toAssign.length} locations เรียบร้อย!</div>
    <button class="btn btn-ghost btn-sm" onclick='printCountForm(${JSON.stringify(toAssign.map(a=>a.location_id))},"${sid}")'>🖨️ พิมพ์ฟอร์มนับสำหรับ ${toAssign.length} Locations</button>`;
  setTimeout(() => { refreshLocs(); refreshBulkFilters(); }, 2000);
}

async function refreshLocs() {
  const sid = Q('as-sess')?.value;
  if (!sid) return;

  const [{ data: snaps }, { data: existing }] = await Promise.all([
    sb.from('stock_snapshot').select('location_id,locations(id,code,zone,area)').eq('session_id', sid),
    sb.from('assignments').select('location_id').eq('session_id', sid),
  ]);

  const assignedSet = new Set(existing?.map(a => a.location_id) || []);
  const seen = new Set();
  const locs = [];
  for (const s of snaps || []) {
    if (!seen.has(s.location_id) && s.locations) {
      seen.add(s.location_id);
      locs.push(s.locations);
    }
  }

  const free = locs.filter(l => !assignedSet.has(l.id));
  const sel  = Q('as-loc');
  if (sel) {
    sel.innerHTML = free.length
      ? free.map(l => `<option value="${l.id}">${l.code}${l.zone?' · '+l.zone:''}</option>`).join('')
      : '<option value="">ทุก Location ถูก Assign แล้ว</option>';
  }

  const { data: asgns } = await sb.from('assignments')
    .select('id,status,locations(code),profiles!assigned_to(name)')
    .eq('session_id', sid).order('created_at');

  const al = Q('al');
  if (!al) return;

  if (!asgns?.length) {
    al.innerHTML = `<div class="load" style="padding:16px;font-size:13px;color:var(--text-muted);text-align:center">ยังไม่มีการ Assign</div>`;
    return;
  }

  const stuckCount = asgns.filter(a => !['completed','approved'].includes(a.status)).length;
  let html = '';
  if (stuckCount > 0) {
    html += `<div style="padding:10px 14px;background:rgba(239,68,68,0.08);border-bottom:1px solid rgba(194,205,220,0.4)">
      <button class="btn btn-ghost btn-sm" style="color:var(--accent-red)"
        onclick="deleteStuckAssignments()">🗑 ลบที่ยังไม่เสร็จทั้งหมด (${stuckCount})</button>
    </div>`;
  }
  html += asgns.map(a => {
    const si = tagInfo(a.status);
    const code = (a.locations?.code || '').replace(/'/g, '');
    return `<div class="row" style="cursor:default">
      <div class="row-body">
        <div class="row-title mono">${a.locations?.code}</div>
        <div class="row-sub">${a.profiles?.name || '?'}</div>
      </div>
      <span class="tag ${si.cls}">${si.lbl}</span>
      <button onclick="deleteAssignment('${a.id}','${code}')" title="ลบ Assignment นี้"
        style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0">🗑</button>
    </div>`;
  }).join('');
  al.innerHTML = html;
}

async function deleteAssignment(id, code) {
  if (!confirm(`ลบ Assignment ของ "${code}"?`)) return;
  const { error } = await sb.from('assignments').delete().eq('id', id);
  if (error) { alert(error.message); return; }
  refreshLocs();
  refreshBulkFilters();
}

async function deleteStuckAssignments() {
  const sid = Q('as-sess')?.value;
  if (!sid) return;
  if (!confirm('ลบ Assignment ที่ "ยังไม่เสร็จ" ทั้งหมดใน Session นี้?')) return;
  const { error } = await sb.from('assignments')
    .delete()
    .eq('session_id', sid)
    .not('status', 'in', '(completed,approved)');
  if (error) { alert(error.message); return; }
  refreshLocs();
  refreshBulkFilters();
}

async function printCountForm(locationIds, sessionId) {
  if (!locationIds || !locationIds.length) return;

  const { data: sessData } = await sb.from('count_sessions').select('name').eq('id', sessionId).single();
  const sessionName = sessData?.name || 'Cycle Count';

  const [{ data: snaps }, { data: details }] = await Promise.all([
    sb.from('stock_snapshot')
      .select('location_id,item_id,locations(code),items(code,description)')
      .eq('session_id', sessionId).in('location_id', locationIds),
    sb.from('stock_snapshot_detail')
      .select('location_id,item_id,inventory_status')
      .eq('session_id', sessionId).in('location_id', locationIds),
  ]);

  const statusMap = {};
  (details||[]).forEach(d => {
    const key = d.location_id+'|'+d.item_id;
    if (!statusMap[key] && d.inventory_status) statusMap[key] = d.inventory_status;
  });

  const rows = (snaps||[]).map(s => ({
    locCode:  s.locations?.code || '?',
    itemCode: s.items?.code || '',
    desc:     s.items?.description || '',
    status:   statusMap[s.location_id+'|'+s.item_id] || '',
  })).sort((a,b) => a.locCode.localeCompare(b.locCode) || a.itemCode.localeCompare(b.itemCode));

  if (!rows.length) { alert('ไม่พบรายการสินค้าสำหรับ Location ที่เลือก'); return; }

  openPrintFormWindow(rows, sessionName);
}
