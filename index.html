async function toggleVarianceDetail(aid, idx) {
  const prevIdx = _svDashOpenVarianceIdx;
  if (prevIdx !== null && prevIdx !== idx) {
    const prevEl = Q('vdetail_' + prevIdx);
    if (prevEl) { prevEl.style.display = 'none'; prevEl.innerHTML = ''; }
  }
  const el = Q('vdetail_' + idx);
  if (!el) return;
  if (_svDashOpenVarianceIdx === idx) {
    el.style.display = 'none'; el.innerHTML = ''; _svDashOpenVarianceIdx = null; return;
  }
  _svDashOpenVarianceIdx = idx;
  el.style.display = 'block';
  el.innerHTML = `<div class="load" style="padding:20px;font-size:13px;font-weight:600;text-align:center">⏳ กำลังโหลดรายละเอียด...</div>`;
  await renderVarianceItemDetail(aid, el, idx);
}

async function renderVarianceItemDetail(aid, container, idx) {
  const { data: asgn } = await sb.from('assignments')
    .select('id,status,location_id,session_id,assigned_to,locations(code,zone,area)')
    .eq('id', aid).single();

  if (!asgn) { container.innerHTML = `<div class="alert alert-red" style="margin:10px">ไม่พบข้อมูล</div>`; return; }

  const [{ data: snaps }, { data: counts }, { data: users }, rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty,al_qty,items(id,code,description)').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('count_records').select('item_id,round,count_qty,remark,photo_url,actual_counter_name').eq('assignment_id', aid),
    sb.from('profiles').select('id,name').order('name'),
    getSessionRules(asgn.session_id),
  ]);

  const byItem = {};
  counts?.forEach(c => { byItem[c.item_id] = byItem[c.item_id] || {}; byItem[c.item_id][c.round] = c; });

  const VS = {
    OK:      { cls:'tag-green',  lbl:'OK'      , row:'exact' },
    Diff:    { cls:'tag-red',    lbl:'Diff'    , row:'diff'  },
    PENDING: { cls:'tag-amber',  lbl:'PENDING' , row:''      },
    '':      { cls:'tag-gray',   lbl:'-'       , row:''      },
  };
  const fmt = x => {
    if (x===undefined || x===null) return '—';
    return `${x.count_qty} · ${escapeWmsText(x.actual_counter_name || 'ไม่ระบุคนนับ')}`;
  };

  let varRows = '';
  for (const s of snaps || []) {
    const it = s.items;
    const v  = byItem[it.id] || {};
    const r1 = v[1]?.count_qty, r2 = v[2]?.count_qty, r3 = v[3]?.count_qty;
    const stKey = computeItemStatus(+s.onhand_qty, r1, r2, r3, rules);
    const st = VS[stKey] || { cls:'tag-gray', lbl:stKey, row:'' };
    const suggested = r3 ?? r2 ?? r1 ?? +s.onhand_qty;
    const alQty = s.al_qty ?? null;

    varRows += `<div class="vrow ${st.row}" style="flex-direction:column;align-items:stretch;padding:16px 20px;gap:8px">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1;min-width:0">
          <div class="mono" style="font-size:15px;font-weight:800; color:var(--text-main);">${it.code}</div>
          <div style="font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; margin-top:4px;">${it.description||''}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px; font-weight:600;">R1: ${fmt(v[1])} · R2: ${fmt(v[2])} · R3: ${fmt(v[3])}</div>
          <div class="oh-chip">OH: <input type="number" id="oh_${it.id}" value="${s.onhand_qty}"
            onchange="updateOH('${asgn.session_id}','${asgn.location_id}','${it.id}',this.value)">
            ${alQty !== null ? `<span class="al-part">AL ${alQty}</span>` : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <span class="tag ${st.cls}">${st.lbl}</span>
          <div style="font-size:10px;color:var(--text-muted);margin-top:10px; font-weight:700;">ยอดยืนยัน</div>
          <input type="number" id="confirm_${it.id}" value="${suggested}"
            style="width:80px;padding:8px 4px;font-size:16px;font-weight:800;text-align:center;margin-top:4px;font-family:inherit">
        </div>
      </div>
    </div>`;
  }

  let maxRoundCounted = 0;
  counts?.forEach(c => { if (c.round > maxRoundCounted) maxRoundCounted = c.round; });
  const nextPhysicalRound = maxRoundCounted + 1;
  const otherUsers = (users||[]).filter(u => u.id !== asgn.assigned_to);
  const userOpts = otherUsers.map(u=>`<option value="${u.id}">${escapeWmsText(u.name)}</option>`).join('');

      <div id="vda_${idx}"></div>
      <button class="btn btn-green" onclick="doApproveInline('${aid}','${idx}')" style="margin-bottom:12px;width:100%">✅ คอนเฟิร์มยอดนับ</button>
      ${nextPhysicalRound <= 3 ? `
      <div style="background:rgba(255,255,255,0.5);border-radius:20px;padding:16px;margin-top:10px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.02)">
        <div style="font-size:13px;font-weight:800;color:var(--primary-blue);margin-bottom:10px">🔄 จ่ายงานรอบที่ ${nextPhysicalRound} ให้ User</div>
        ${otherUsers.length ? `<div style="display:flex;gap:10px">
          <select id="vreassign_${idx}" style="flex:1">${userOpts}</select>
          <button class="btn btn-green btn-sm" onclick="doReassignUser('${aid}','${idx}',${nextPhysicalRound})" style="flex-shrink:0">จ่ายงาน</button>
        </div>` : `<div style="font-size:13px;font-weight:600;color:var(--text-muted)">ไม่มี User อื่นในระบบให้เลือก</div>`}
      </div>` : ''}
    </div>`;
}

async function doApproveInline(aid, idx) {
  const al = Q('vda_'+idx);
  if (al) al.innerHTML = `<div class="alert alert-blue" style="font-size:12px">⏳ กำลังบันทึก...</div>`;
  const { data: asgn } = await sb.from('assignments').select('location_id,session_id').eq('id', aid).single();
  const { data: snaps } = await sb.from('stock_snapshot').select('item_id,onhand_qty').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id);

  const approvals = [];
  for (const s of snaps || []) {
    const input = Q('confirm_'+s.item_id);
    const val   = input ? parseFloat(input.value) : NaN;
    const finalQty = isNaN(val) ? +s.onhand_qty : val;
    approvals.push({
      assignment_id: aid, item_id: s.item_id, final_qty: finalQty,
      variance: finalQty - +s.onhand_qty, resolution: finalQty === +s.onhand_qty ? 'ok' : 'lost', approved_by: me.id,
    });
  }
  if (approvals.length) { await sb.from('variance_approvals').upsert(approvals, { onConflict:'assignment_id,item_id' }); }
  await sb.from('assignments').update({ status:'approved' }).eq('id', aid);

  if (al) al.innerHTML = `<div class="alert alert-green" style="font-size:12px">✅ คอนเฟิร์มยอดเรียบร้อย</div>`;
  setTimeout(() => loadSvDash(), 1000);
}

async function doReassignUser(aid, idx, targetRound) {
  const sel = Q('vreassign_'+idx);
  const uid = sel?.value;
  if (!uid) return;
  const { data: before } = await sb.from('assignments').select('session_id,location_id,profiles!assigned_to(name)').eq('id', aid).single();
  const statusForTarget = { 2:'round1_done', 3:'round2_done' }[targetRound];
  const updates = { assigned_to: uid };
  if (statusForTarget) updates.status = statusForTarget;
  await sb.from('assignments').update(updates).eq('id', aid);
  const label = sel.options[sel.selectedIndex]?.textContent || '';
  logAudit(before?.session_id, before?.location_id, null, 'reassign', before?.profiles?.name, label, aid);
  alert(`✅ จ่ายงานรอบที่ ${targetRound||''} ให้ User ${label} แล้ว`);
  loadSvDash();
}

      <span class="caret">›</span>

  }
  cnt().innerHTML = html + '</div>';

async function updateOH(sessionId, locationId, itemId, newVal) {
  const val = parseFloat(newVal); if (isNaN(val)) return;
  const { data: before } = await sb.from('stock_snapshot').select('onhand_qty').eq('session_id', sessionId).eq('location_id', locationId).eq('item_id', itemId).single();
  await sb.from('stock_snapshot').update({ onhand_qty: val }).eq('session_id', sessionId).eq('location_id', locationId).eq('item_id', itemId);
  logAudit(sessionId, locationId, itemId, 'oh_edit', before?.onhand_qty, val);
}

async function doApprove(aid) {
  const al = Q('sva'); al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก...</div>`;
  const { data: asgn } = await sb.from('assignments').select('location_id,session_id').eq('id', aid).single();
  const { data: snaps } = await sb.from('stock_snapshot').select('item_id,onhand_qty').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id);

  const approvals = [];
  for (const s of snaps || []) {
    const input = Q('confirm_'+s.item_id);
    const val   = input ? parseFloat(input.value) : NaN;
    const finalQty = isNaN(val) ? +s.onhand_qty : val;
    approvals.push({ assignment_id: aid, item_id: s.item_id, final_qty: finalQty, variance: finalQty - +s.onhand_qty, resolution: finalQty === +s.onhand_qty ? 'ok' : 'lost', approved_by: me.id });
  }

  if (approvals.length) { await sb.from('variance_approvals').upsert(approvals, { onConflict:'assignment_id,item_id' }); }
  await sb.from('assignments').update({ status:'approved' }).eq('id', aid);

  al.innerHTML = `<div class="alert alert-green">✅ คอนเฟิร์มยอดเรียบร้อย</div>`;
  setTimeout(() => go('sv-list'), 1500);
}

async function reqRecount(aid, targetRound) {
  const uid = Q('recount-user')?.value; if (!uid) { alert('กรุณาเลือก User ผู้รับงานก่อน'); return; }
  const sel = Q('recount-user');
  const { data: before } = await sb.from('assignments').select('session_id,location_id,profiles!assigned_to(name)').eq('id', aid).single();
  const statusForTarget = { 2:'round1_done', 3:'round2_done' }[targetRound];
  const updates = { assigned_to: uid };
  if (statusForTarget) updates.status = statusForTarget;
  await sb.from('assignments').update(updates).eq('id', aid);
  const label = sel.options[sel.selectedIndex]?.textContent || '';
  logAudit(before?.session_id, before?.location_id, null, 'reassign', before?.profiles?.name, label, aid);
  Q('sva').innerHTML = `<div class="alert alert-green">✅ จ่ายงานให้ User ที่เลือกแล้ว</div>`;
  setTimeout(() => go('sv-list'), 1500);
}

async function refreshZoneDashboard() {
  const sid = Q('as-sess')?.value; const box = Q('zone-dash-body');
  if (!sid || !box) return;
  box.innerHTML = `<div class="load" style="padding:20px;font-size:14px;text-align:center; font-weight:600;">⏳ กำลังคำนวณ...</div>`;

  const [{ data: snaps }, { data: asgns }] = await Promise.all([
    sb.from('stock_snapshot').select('location_id,locations(id,zone)').eq('session_id', sid),
    sb.from('assignments').select('location_id,locations(zone),profiles!assigned_to(name)').eq('session_id', sid),
  ]);

  const zoneTotals = {}; const seenLoc = new Set();
  (snaps||[]).forEach(s => {
    if (!s.locations || seenLoc.has(s.locations.id)) return;
    seenLoc.add(s.locations.id);
    const z = s.locations.zone || '(ไม่ระบุ Zone)';
    zoneTotals[z] = (zoneTotals[z]||0) + 1;
  });

  const zoneAssigned = {}; const zoneUsers = {};
  (asgns||[]).forEach(a => {
    const z = a.locations?.zone || '(ไม่ระบุ Zone)';
    zoneAssigned[z] = (zoneAssigned[z]||0) + 1;
    const userName = a.profiles?.name || 'ไม่ระบุ User';
    zoneUsers[z] = zoneUsers[z] || {};
    zoneUsers[z][userName] = (zoneUsers[z][userName]||0) + 1;
  });

  const allZones = [...new Set([...Object.keys(zoneTotals), ...Object.keys(zoneAssigned)])].sort();
  if (!allZones.length) { box.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:14px; font-weight:600;">ยังไม่มีข้อมูลใน Session นี้</div>`; return; }

  box.innerHTML = allZones.map(z => {
    const total = zoneTotals[z] || 0; const assigned = zoneAssigned[z] || 0; const pct = total ? Math.round(assigned/total*100) : 0;
    const userList = Object.entries(zoneUsers[z] || {}).sort((a,b) => b[1]-a[1]).map(([name,c]) => `<span class="tag tag-gray" style="font-size:11px">User: ${escapeWmsText(name)} · ${c}</span>`).join(' ');
    return `<div style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.4)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span style="font-size:14px;font-weight:800;color:var(--text-main)">${z}</span>
        <span style="font-size:13px;font-weight:800;color:var(--primary-blue)">${assigned}/${total} จ่ายแล้ว</span>
      </div>
      <div class="gauge-container" style="padding:8px;margin-top:8px; background:var(--neu-surface); border-radius:20px; box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);">
        <div class="prog" style="height:10px"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      ${userList ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${userList}</div>` : ''}
    </div>`;
  }).join('');
}

async function refreshBulkFilters() {
  const sid = Q('as-sess')?.value; if (!sid) return;
  const [{ data: snaps }, { data: existing }] = await Promise.all([
    sb.from('stock_snapshot').select('location_id,locations(id,code,zone,row_no,level)').eq('session_id', sid),
    sb.from('assignments').select('location_id').eq('session_id', sid),
  ]);

  const assignedSet = new Set(existing?.map(a => a.location_id) || []);
  window._bulkSnaps = snaps || [];
  window._bulkAssigned = assignedSet;
  refreshBulkDependentFilters();
}

function getBulkAvailableLocations() {
  const snaps = window._bulkSnaps || [];
  const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set();
  const locations = [];
  for (const snap of snaps) {
    const location = snap.locations;
    if (!location || seen.has(location.id) || assignedSet.has(location.id)) continue;
    seen.add(location.id);
    locations.push(location);
  }
  return locations;
}

function refreshBulkDependentFilters() {
  const locations = getBulkAvailableLocations();
  fillDependentSelect('bulk-zone', locations.map(location => location.zone));
  const zone = Q('bulk-zone')?.value || '';
  const zoneLocations = locations.filter(location => !zone || location.zone === zone);

  fillDependentSelect('bulk-row', zoneLocations.map(location => location.row_no));
  const row = Q('bulk-row')?.value || '';
  const rowLocations = zoneLocations.filter(location => !row || location.row_no === row);

  fillDependentSelect('bulk-level', rowLocations.map(location => location.level));
  refreshBulkPreview();
}

function refreshBulkPreview() {
  const zone = Q('bulk-zone')?.value; const row = Q('bulk-row')?.value; const level = Q('bulk-level')?.value;
  const snaps = window._bulkSnaps || []; const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set(); let count = 0;
  for (const s of snaps) {
    const l = s.locations; if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone && l.zone !== zone) continue; if (row && l.row_no !== row) continue; if (level && l.level !== level) continue;
    seen.add(l.id); count++;
  }
  const prev = Q('bulk-preview'), btn = Q('bulk-btn'); if (!prev || !btn) return;
  if (count > 0) { prev.innerHTML = `📍 จะ Assign <strong>${count} locations</strong> ให้ User ที่เลือก`; btn.disabled = false; } 
  else { prev.innerHTML = `<span style="color:var(--text-muted)">ไม่มี Location ที่ตรงเงื่อนไข</span>`; btn.disabled = true; }
}

async function refreshLocs() {

async function printCountForm(locationIds, sessionId) {

    const locIdsFromLoc = new Set(asgns.filter(a => (a.locations?.code||'').toLowerCase().includes(termLower)).map(a => a.location_id));

      const { data: matchedItems } = await sb.from('items').select('id').ilike('code', `%${term}%`);
      const itemIds = (matchedItems||[]).map(i => i.id);
      if (itemIds.length) {
        const { data: snapMatches } = await sb.from('stock_snapshot').select('location_id').in('location_id', candidateLocIds).in('item_id', itemIds);
        (snapMatches||[]).forEach(m => locIdsFromItem.add(m.location_id));
      }
      const { data: lpnMatches } = await sb.from('stock_snapshot_detail').select('location_id').in('location_id', candidateLocIds).ilike('license_plate', `%${term}%`);
      (lpnMatches||[]).forEach(m => locIdsFromLPN.add(m.location_id));
    }
    const matchSet = new Set([...locIdsFromLoc, ...locIdsFromItem, ...locIdsFromLPN]);
    asgns = asgns.filter(a => matchSet.has(a.location_id));
  }

  if (!asgns?.length) { histList.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--text-muted); font-weight:600;">ไม่พบข้อมูลตามเงื่อนไข</div>`; return; }

  const { data: historyCounterRows } = await sb.from('count_records')
    .select('assignment_id,actual_counter_name')
    .in('assignment_id', asgns.map(a => a.id));
  const historyCounterMap = buildActualCounterMap(historyCounterRows || []);
  if (counterName) {
    asgns = asgns.filter(a => (historyCounterMap[a.id] || []).includes(counterName));
  }

  if (!asgns.length) { histList.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--text-muted); font-weight:600;">ไม่พบประวัติของคนนับที่เลือก</div>`; return; }

  histList.innerHTML = '<div class="card card-flush">' + asgns.map(a => {
    const si = tagInfo(a.status);
    const countedBy = (historyCounterMap[a.id] || []).join(', ') || 'ไม่ระบุคนนับ';
    return `<div class="row click" onclick="go('ad-txlog',{aid:'${a.id}'})"><div class="row-body"><div class="row-title mono">${a.locations?.code || '?'}</div><div class="row-sub"><span style="color:var(--primary-blue);font-weight:700;">${a.count_sessions?.name||''}</span> · คนนับจริง: ${escapeWmsText(countedBy)}</div><div class="row-sub">${new Date(a.created_at).toLocaleString('th-TH')}</div></div><span class="tag ${si.cls}">${si.lbl}</span><span class="caret">›</span></div>`;
  }).join('') + '</div>';
}

    sb.from('variance_approvals').select('item_id,final_qty,variance,resolution,approved_by,created_at,items(code,description),profiles!approved_by(name)').eq('assignment_id', aid).order('created_at'),
  ]);

  const byItemRounds = {};

  const mismatchItems = [];

function readXlsxFile(e) {
  const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
  reader.onload = function(evt) {
    const data = new Uint8Array(evt.target.result); const workbook = XLSX.read(data, { type: 'array' });
    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
    _xlsxRawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' }); refreshXlsxPreview();
  };
  reader.readAsArrayBuffer(file);
}

function refreshXlsxPreview() {
  const btn = Q('ibtn'); const prev = Q('ipreview');
  if (!_xlsxRawRows || !_xlsxRawRows.length) { if (prev) prev.style.display = 'none'; if (btn) btn.disabled = true; return; }
  const locFilter = (Q('ilocfilter')?.value || '').trim().toUpperCase(); const parsed = [];
  for (const row of _xlsxRawRows) {
    const keys = Object.keys(row);
    const findVal = (terms) => { const k = keys.find(key => terms.some(t => key.toUpperCase().includes(t))); return k ? String(row[k]).trim() : ''; };
    const findExactVal = (terms) => {
      const normalize = value => String(value).trim().toUpperCase().replace(/[\s_-]+/g, '');
      const wanted = terms.map(normalize);
      const k = keys.find(key => wanted.includes(normalize(key)));
      return k ? String(row[k]).trim() : '';
    };
    const locCode = findVal(['LOCATION', 'LOC_CODE', 'LOC']); const itemCode = findVal(['ITEM_CODE', 'ITEM', 'SKU', 'ARTICLE', 'MATERIAL']);
    const itemDesc = findVal(['ITEM_DESC', 'DESCRIPTION', 'DESC', 'NAME']); const onhand = parseFloat(findVal(['ONHAND', 'OH', 'QTY', 'QUANTITY', 'STOCK'])) || 0;
    const alQty = findVal(['AL', 'ALLOCATED']) ? parseFloat(findVal(['AL', 'ALLOCATED'])) : null;
    const lpn = findVal(['LPN', 'LICENSE_PLATE', 'PALLET']); const lot = findVal(['LOT', 'BATCH']); const invStatus = findVal(['STATUS', 'INV_STATUS', 'INVENTORY_STATUS']);
    const uom = findExactVal(['UOM', 'UNIT', 'UNIT OF MEASURE', 'UNIT_OF_MEASURE', 'หน่วยนับ', 'หน่วย']);
    if (!locCode || !itemCode) continue;
    if (locFilter) { const regex = new RegExp('^' + locFilter.replace(/%/g, '.*'), 'i'); if (!regex.test(locCode)) continue; }
    parsed.push({ locCode, itemCode, itemDesc, onhand, alQty, lpn, lot, invStatus, uom });
  }
  _xlsxParsed = parsed;
  if (prev) { prev.style.display = 'block'; prev.innerHTML = `<div class="alert alert-blue" style="font-size:13px;margin-bottom:0">📊 พบ <strong>${parsed.length}</strong> รายการที่พร้อม Import (จากทั้งหมด ${_xlsxRawRows.length} แถว)</div>`; }
  if (btn) btn.disabled = parsed.length === 0;
}

async function doImportXlsx() {
  const sid = Q('is')?.value; const al = Q('ia'); const btn = Q('ibtn');
  if (!sid) { alert('กรุณาเลือก Session ก่อน'); return; }
  if (!_xlsxParsed || !_xlsxParsed.length) { alert('ไม่มีข้อมูลที่พร้อม Import'); return; }
  btn.disabled = true; al.innerHTML = `<div class="alert alert-blue">⏳ กำลังประมวลผล ${_xlsxParsed.length} รายการ...</div>`;
  try {
    const uniqueLocsMap = new Map(); const uniqueItemsMap = new Map();
    _xlsxParsed.forEach(r => {
      if (!uniqueLocsMap.has(r.locCode)) uniqueLocsMap.set(r.locCode, { code: r.locCode, zone: computeZone(r.locCode, r.itemDesc) });
      if (!uniqueItemsMap.has(r.itemCode)) uniqueItemsMap.set(r.itemCode, { code: r.itemCode, description: r.itemDesc });
    });
    const { data: dbLocs, error: eLoc } = await sb.from('locations').upsert(Array.from(uniqueLocsMap.values()), { onConflict: 'code' }).select('id,code');
    if (eLoc) throw eLoc; const locIdMap = new Map(dbLocs.map(l => [l.code, l.id]));
    const { data: dbItems, error: eItem } = await sb.from('items').upsert(Array.from(uniqueItemsMap.values()), { onConflict: 'code' }).select('id,code');
    if (eItem) throw eItem; const itemIdMap = new Map(dbItems.map(i => [i.code, i.id]));

    const snapMap = new Map(); const detailsList = [];
    _xlsxParsed.forEach(r => {
      const locId = locIdMap.get(r.locCode); const itemId = itemIdMap.get(r.itemCode); if (!locId || !itemId) return;
      const key = `${sid}|${locId}|${itemId}`;
      if (!snapMap.has(key)) snapMap.set(key, { session_id: sid, location_id: locId, item_id: itemId, onhand_qty: 0, al_qty: r.alQty });
      snapMap.get(key).onhand_qty += r.onhand;
      if (r.lpn || r.lot || r.invStatus || r.uom) detailsList.push({ session_id: sid, location_id: locId, item_id: itemId, license_plate: r.lpn || null, lot: r.lot || null, inventory_status: r.invStatus || null, qty: r.onhand, uom: r.uom || null });
    });

    const snapList = Array.from(snapMap.values()); const BATCH = 200;
    al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก Stock Snapshot (${snapList.length} รายการ)...</div>`;
    for (let i = 0; i < snapList.length; i += BATCH) { const { error } = await sb.from('stock_snapshot').upsert(snapList.slice(i, i+BATCH), { onConflict: 'session_id,location_id,item_id' }); if (error) throw error; }
    if (detailsList.length) {
      al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก LPN/Lot Details (${detailsList.length} รายการ)...</div>`;
      for (let i = 0; i < detailsList.length; i += BATCH) { const { error } = await sb.from('stock_snapshot_detail').insert(detailsList.slice(i, i+BATCH)); if (error) console.warn('Detail insert warning:', error); }
    }
    al.innerHTML = `<div class="alert alert-green">✅ Import ข้อมูลสำเร็จเรียบร้อย (${snapList.length} Unique Snapshots)</div>`;
    _xlsxRawRows = null; _xlsxParsed = null; if (Q('ixlsx')) Q('ixlsx').value = ''; if (Q('ipreview')) Q('ipreview').style.display = 'none';
  } catch (err) { al.innerHTML = errBox(err.message || 'เกิดข้อผิดพลาดระหว่าง Import'); } finally { btn.disabled = false; }
}

async function fetchAllBackupRows(table, columns, applyFilter) {
  const output = [];
  for (let from = 0; ; from += 1000) {
    let query = sb.from(table).select(columns.join(',')).order('id').range(from, from + 999);
    if (applyFilter) query = applyFilter(query);
    const { data, error } = await query;
    if (error) throw new Error(`อ่าน ${table} ไม่สำเร็จ: ${error.message}`);
    output.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return output;
}

async function fetchBackupRowsByValues(table, columns, filterColumn, values) {
  const cleanValues = [...new Set((values || []).filter(Boolean))];
  if (!cleanValues.length) return [];
  const output = [];
  for (let start = 0; start < cleanValues.length; start += 50) {
    const batch = cleanValues.slice(start, start + 50);
    const rows = await fetchAllBackupRows(table, columns, query => query.in(filterColumn, batch));
    output.push(...rows);
  }
  return output;
}

async function backupScopeCountsWithItemLocation(sessionIds, counts={}) {
  const output = { ...(counts || {}) };
  const hasItems = Object.prototype.hasOwnProperty.call(output,'Items');
  const hasLocations = Object.prototype.hasOwnProperty.call(output,'Locations');
  if (hasItems && hasLocations) return output;
  const [stockRows,assignmentRows] = await Promise.all([
    hasItems ? Promise.resolve([]) :
      fetchBackupRowsByValues('stock_snapshot',['id','item_id'],'session_id',sessionIds),
    hasLocations ? Promise.resolve([]) :
      fetchBackupRowsByValues('assignments',['id','location_id'],'session_id',sessionIds),
  ]);
  if (!hasItems) output.Items = new Set(stockRows.map(row => row.item_id).filter(Boolean)).size;
  if (!hasLocations) output.Locations = new Set(assignmentRows.map(row => row.location_id).filter(Boolean)).size;
  return output;
}

function backupCanonicalValue(value) {
  if (value === null || value === undefined) return 'N;';
  if (value === true) return 'B:1;';
  if (value === false) return 'B:0;';
  if (typeof value === 'number') {
    return Number.isFinite(value) ? `D:${String(value)};` : 'D:INVALID;';
  }
  const source = String(value).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  return `S:${source.length}:${source};`;
}

function backupCanonicalValueV1(value) {
  if (value === null || value === undefined || value === '') return '<NULL>';
  if (value === true) return '<TRUE>';
  if (value === false) return '<FALSE>';
  if (typeof value === 'number') return Number.isFinite(value) ? String(value) : '<INVALID>';
  return String(value).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function backupRowsChecksum(rows, columns, formatVersion=BACKUP_FORMAT_VERSION) {
  let hash = 2166136261;
  const canonicalValue = String(formatVersion) === '1'
    ? backupCanonicalValueV1
    : backupCanonicalValue;
  const update = text => {
    const source = String(text);
    for (let i = 0; i < source.length; i++) {
      hash ^= source.charCodeAt(i);
      hash = Math.imul(hash, 16777619) >>> 0;
    }
  };
  update(columns.join('\t')); update('\n');
  (rows || []).forEach(row => {
    columns.forEach(column => { update(canonicalValue(row[column])); update('\t'); });
    update('\n');
  });
  return hash.toString(16).padStart(8,'0');
}

function backupSplitExcelText(value, chunkSize=BACKUP_EXCEL_CHUNK_SIZE) {
  const text = String(value ?? '');
  if (!text.length) return [''];
  const chunks = [];
  let offset = 0;
  while (offset < text.length) {
    let end = Math.min(text.length, offset + chunkSize);
    if (end < text.length) {
      const lastCode = text.charCodeAt(end - 1);
      if (lastCode >= 0xD800 && lastCode <= 0xDBFF) end--;
    }
    chunks.push(text.slice(offset,end));
    offset = end;
  }
  return chunks;
}

function backupTeamCellValue(value) {
  if (value === null || value === undefined) return '';
  let output = value;
  if (typeof value === 'object' && !(value instanceof Date)) {
    try { output = JSON.stringify(value); }
    catch (_) { output = String(value); }
  }
  if (typeof output !== 'string' || output.length <= BACKUP_EXCEL_CELL_LIMIT) return output;
  const suffix = '\n[ข้อความยาวเกินข้อจำกัด Excel — ข้อมูลเต็มอยู่ในชีตระบบแบบแบ่งส่วน]';
  return output.slice(0,BACKUP_EXCEL_CELL_LIMIT - suffix.length) + suffix;
}

function backupRowsForExcel(rows, columns, formatVersion=BACKUP_FORMAT_VERSION) {
  if (String(formatVersion) !== '3') return { rows:rows || [], columns:[...columns] };
  const maxParts = Object.fromEntries(columns.map(column => [column,1]));
  const preparedRows = (rows || []).map(row => {
    const output = {};
    columns.forEach(column => {
      const value = row?.[column];
      if (typeof value !== 'string' || value.length <= BACKUP_EXCEL_CHUNK_SIZE) {
        output[column] = value;
        return;
      }
      const parts = backupSplitExcelText(value);
      maxParts[column] = Math.max(maxParts[column],parts.length);
      output[column] = parts[0];
      for (let part = 1; part < parts.length; part++) {
        output[`${column}${BACKUP_CHUNK_MARKER}${part + 1}`] = parts[part];
      }
    });
    return output;
  });
  const excelColumns = columns.flatMap(column => {
    const output = [column];
    for (let part = 2; part <= maxParts[column]; part++) {
      output.push(`${column}${BACKUP_CHUNK_MARKER}${part}`);
    }
    return output;
  });
  return { rows:preparedRows, columns:excelColumns };
}

function backupRowsFromExcel(rows, columns, formatVersion) {
  if (String(formatVersion) !== '3') {
    return (rows || []).map(row => Object.fromEntries(columns.map(column => [column,row?.[column] ?? null])));
  }
  return (rows || []).map(row => Object.fromEntries(columns.map(column => {
    const baseValue = row?.[column] ?? null;
    const partPrefix = `${column}${BACKUP_CHUNK_MARKER}`;
    const partKeys = Object.keys(row || {})
      .filter(key => key.startsWith(partPrefix))
      .sort((a,b) => Number(a.slice(partPrefix.length)) - Number(b.slice(partPrefix.length)));
    const hasContinuation = partKeys.some(key =>
      row[key] !== null && row[key] !== undefined && String(row[key]) !== '');
    if (!hasContinuation) return [column,baseValue];
    const restored = [baseValue ?? '',...partKeys.map(key => row[key] ?? '')].map(String).join('');
    return [column,restored];
  })));
}

function backupManifestRowsForExcel(entries, formatVersion) {
  if (String(formatVersion) !== '3') return entries;
  return (entries || []).flatMap(entry => {
    const parts = backupSplitExcelText(entry.value);
    return parts.map((value,index) => ({
      key:index === 0 ? entry.key : `${entry.key}${BACKUP_CHUNK_MARKER}${index + 1}`,
      value,
    }));
  });
}

function backupManifestRowsFromExcel(entries, formatVersion) {
  if (String(formatVersion) !== '3') return entries;
  const entryMap = new Map((entries || []).map(entry => [entry.key,entry.value]));
  return (entries || [])
    .filter(entry => !entry.key.includes(BACKUP_CHUNK_MARKER))
    .map(entry => {
      let value = String(entry.value ?? '');
      for (let part = 2; ; part++) {
        const key = `${entry.key}${BACKUP_CHUNK_MARKER}${part}`;
        if (!entryMap.has(key)) break;
        value += String(entryMap.get(key) ?? '');
      }
      return { key:entry.key, value };
    });
}

async function collectBackupData(sessionIds) {
  const dataBySheet = {};
  for (let index = 0; index < BACKUP_SHEET_SPECS.length; index++) {
    const spec = BACKUP_SHEET_SPECS[index];
    setBackupProgress(Math.round(index / BACKUP_SHEET_SPECS.length * 72),
      `กำลังอ่าน ${spec.sheet} (${index + 1}/${BACKUP_SHEET_SPECS.length})...`, 'export');
    let rows = [];
    if (spec.scope === 'master' || spec.scope === 'reference') {
      rows = await fetchAllBackupRows(spec.table, spec.columns);
    } else if (spec.scope === 'session') {
      const filterColumn = spec.table === 'count_sessions' ? 'id' : 'session_id';
      rows = await fetchBackupRowsByValues(spec.table, spec.columns, filterColumn, sessionIds);
    } else {
      const assignmentIds = (dataBySheet.Assignments || []).map(row => row.id);
      rows = await fetchBackupRowsByValues(spec.table, spec.columns, 'assignment_id', assignmentIds);
    }
    if (rows.length > 1048575 - 1) {
      throw new Error(`${spec.sheet} มีมากกว่า 1,048,574 แถว เกินขนาดสูงสุดของ Excel กรุณา Backup แยก Session`);
    }
    dataBySheet[spec.sheet] = rows;
  }
  return dataBySheet;
}

function backupSafeFilePart(value) {
  return String(value || 'sessions')
    .replace(/[\\/:*?"<>|]/g,'_')
    .replace(/\s+/g,'_')
    .slice(0,50);
}

function backupTimestampForFile(date=new Date()) {
  const pad = value => String(value).padStart(2,'0');
  return `${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}`;
}

function backupHasValue(value) {
  return value !== null && value !== undefined && value !== '';
}

function backupNumber(value) {
  if (!backupHasValue(value)) return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function backupDateForTeam(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  try {
    return new Intl.DateTimeFormat('sv-SE', {
      timeZone:'Asia/Bangkok',
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit',
      hour12:false,
    }).format(date);
  } catch (_) {
    return date.toISOString().replace('T',' ').slice(0,19);
  }
}

function backupLatestRecord(rows, dateColumn='counted_at') {
  return (rows || []).reduce((latest,row) => {
    if (!latest) return row;
    const latestTime = Date.parse(latest?.[dateColumn] || '') || 0;
    const rowTime = Date.parse(row?.[dateColumn] || '') || 0;
    return rowTime >= latestTime ? row : latest;
  }, null);
}

function buildTeamBackupData(dataBySheet) {
  const sessions = dataBySheet.Sessions || [];
  const locations = dataBySheet.Locations || [];
  const items = dataBySheet.Items || [];
  const assignments = dataBySheet.Assignments || [];
  const stocks = dataBySheet.Stock || [];
  const stockDetails = dataBySheet.Stock_Detail || [];
  const counts = dataBySheet.Counts || [];
  const approvals = dataBySheet.Approvals || [];
  const audits = dataBySheet.Audit || [];
  const profiles = dataBySheet.Profiles || [];
  const counters = dataBySheet.Counters || [];

  const byId = rows => new Map(rows.map(row => [String(row.id),row]));
  const sessionById = byId(sessions);
  const locationById = byId(locations);
  const itemById = byId(items);
  const assignmentById = byId(assignments);
  const profileById = byId(profiles);
  const counterById = byId(counters);
  const profileName = id => profileById.get(String(id || ''))?.name || '';
  const counterName = id => counterById.get(String(id || ''))?.name || '';
  const sessionLocationKey = (sessionId,locationId) => `${sessionId || ''}|${locationId || ''}`;
  const assignmentItemKey = (assignmentId,itemId) => `${assignmentId || ''}|${itemId || ''}`;
  const stockKey = (sessionId,locationId,itemId) => `${sessionId || ''}|${locationId || ''}|${itemId || ''}`;

  const assignmentIdsByLocation = new Map();
  assignments.forEach(assignment => {
    const key = sessionLocationKey(assignment.session_id, assignment.location_id);
    if (!assignmentIdsByLocation.has(key)) assignmentIdsByLocation.set(key,[]);
    assignmentIdsByLocation.get(key).push(String(assignment.id));
  });

  const countGroups = new Map();
  counts.forEach(count => {
    const key = assignmentItemKey(count.assignment_id, count.item_id);
    if (!countGroups.has(key)) countGroups.set(key,[]);
    countGroups.get(key).push(count);
  });
  const approvalGroups = new Map();
  approvals.forEach(approval => {
    const key = assignmentItemKey(approval.assignment_id, approval.item_id);
    if (!approvalGroups.has(key)) approvalGroups.set(key,[]);
    approvalGroups.get(key).push(approval);
  });
  const approvalByWork = new Map([...approvalGroups.entries()].map(([key,rows]) =>
    [key,backupLatestRecord(rows,'approved_at')]));

  const stockByKey = new Map();
  stocks.forEach(stock => stockByKey.set(stockKey(stock.session_id,stock.location_id,stock.item_id),stock));
  const detailsByStock = new Map();
  stockDetails.forEach(detail => {
    const key = stockKey(detail.session_id,detail.location_id,detail.item_id);
    if (!detailsByStock.has(key)) detailsByStock.set(key,[]);
    detailsByStock.get(key).push(detail);
  });

  const workRows = new Map();
  const addWork = (assignment,itemId,stock=null) => {
    const assignmentId = assignment?.id || '';
    const key = assignment
      ? assignmentItemKey(assignmentId,itemId)
      : `NO_ASSIGNMENT|${stockKey(stock?.session_id,stock?.location_id,itemId)}`;
    if (!workRows.has(key)) workRows.set(key,{ assignment, itemId, stock });
    else if (stock) workRows.get(key).stock = stock;
  };

  stocks.forEach(stock => {
    const candidateIds = assignmentIdsByLocation.get(sessionLocationKey(stock.session_id,stock.location_id)) || [];
    const assignmentId = candidateIds.find(id =>
      countGroups.has(assignmentItemKey(id,stock.item_id)) || approvalByWork.has(assignmentItemKey(id,stock.item_id)))
      || candidateIds[0] || '';
    addWork(assignmentById.get(String(assignmentId)) || null, stock.item_id, stock);
  });
  counts.forEach(count => {
    const assignment = assignmentById.get(String(count.assignment_id)) || null;
    const stock = assignment ? stockByKey.get(stockKey(assignment.session_id,assignment.location_id,count.item_id)) : null;
    addWork(assignment,count.item_id,stock || null);
  });
  approvals.forEach(approval => {
    const assignment = assignmentById.get(String(approval.assignment_id)) || null;
    const stock = assignment ? stockByKey.get(stockKey(assignment.session_id,assignment.location_id,approval.item_id)) : null;
    addWork(assignment,approval.item_id,stock || null);
  });

  const actualCounterName = record =>
    record?.actual_counter_name || counterName(record?.actual_counter_id) || profileName(record?.counted_by);
  const countUserName = record => profileName(record?.counted_by);
  const countRound = (rows,round) => backupLatestRecord((rows || []).filter(row => Number(row.round) === round));
  const joinUnique = (rows,column) => [...new Set((rows || []).map(row => String(row?.[column] || '').trim()).filter(Boolean))].join(' | ');

  const dataRows = [...workRows.values()].map(work => {
    const assignment = work.assignment;
    const sessionId = assignment?.session_id || work.stock?.session_id || '';
    const locationId = assignment?.location_id || work.stock?.location_id || '';
    const itemId = work.itemId || work.stock?.item_id || '';
    const session = sessionById.get(String(sessionId)) || {};
    const location = locationById.get(String(locationId)) || {};
    const item = itemById.get(String(itemId)) || {};
    const workKey = assignmentItemKey(assignment?.id,itemId);
    const workCounts = countGroups.get(workKey) || [];
    const approval = approvalByWork.get(workKey) || null;
    const detailRows = detailsByStock.get(stockKey(sessionId,locationId,itemId)) || [];
    const c1 = countRound(workCounts,1);
    const c2 = countRound(workCounts,2);
    const c3 = countRound(workCounts,3);
    const finalCountRecord = [...workCounts].sort((a,b) =>
      (Number(b.round)||0) - (Number(a.round)||0)
      || ((Date.parse(b.counted_at || '')||0) - (Date.parse(a.counted_at || '')||0)))[0] || null;
    const latestPhotoRecord = backupLatestRecord(
      workCounts.filter(record => String(record?.photo_url || '').trim()));
    const latestRemarkRecord = backupLatestRecord(
      workCounts.filter(record => String(record?.remark || '').trim()));
    const stockOnhand = backupNumber(work.stock?.onhand_qty);
    const approvedFinal = backupNumber(approval?.final_qty);
    const physicalCount = approvedFinal !== null ? approvedFinal : backupNumber(finalCountRecord?.count_qty);
    const approvedVariance = backupNumber(approval?.variance);
    const variance = approvedVariance !== null ? approvedVariance
      : (physicalCount !== null && stockOnhand !== null ? physicalCount - stockOnhand : null);
    const result = physicalCount === null ? 'ยังไม่ได้นับ'
      : variance === 0 ? 'Match'
      : variance > 0 ? 'Gain' : 'Lost';
    const countFields = record => ({
      value:backupNumber(record?.count_qty),
      counter:actualCounterName(record),
      time:backupDateForTeam(record?.counted_at),
      user:countUserName(record),
      remark:record?.remark || '',
    });
    const r1 = countFields(c1), r2 = countFields(c2), r3 = countFields(c3);
    return {
      session:session.name || '', sessionStatus:session.status || '', location:location.code || '',
      zone:location.zone || '', area:location.area || '', rowNo:location.row_no || '',
      level:location.level || '', locationType:location.type || '', locationCategory:location.category || '',
      lpn:joinUnique(detailRows,'license_plate'), lot:joinUnique(detailRows,'lot'),
      inventoryStatus:joinUnique(detailRows,'inventory_status'), uom:joinUnique(detailRows,'uom'),
      item:item.code || '', description:item.description || '', itemInventoryType:item.inventory_type || '',
      itemCategory:item.category || '', stockOnhand, alQty:backupNumber(work.stock?.al_qty),
      count1:r1.value, count1Counter:r1.counter, count1Time:r1.time, count1User:r1.user, count1Remark:r1.remark,
      count2:r2.value, count2Counter:r2.counter, count2Time:r2.time, count2User:r2.user, count2Remark:r2.remark,
      count3:r3.value, count3Counter:r3.counter, count3Time:r3.time, count3User:r3.user, count3Remark:r3.remark,
      physicalCount, variance, result, assignmentStatus:assignment?.status || '',
      assignedUser:profileName(assignment?.assigned_to), round2Counter:counterName(assignment?.counter_r2_id),
      round3Counter:counterName(assignment?.counter_r3_id), approvalResolution:approval?.resolution || '',
      supervisorNote:approval?.supervisor_note || '', approvedBy:profileName(approval?.approved_by),
      approvedAt:backupDateForTeam(approval?.approved_at),
      wmsStatus:approval ? (approval.wms_fixed ? 'แก้ไขแล้ว' : 'ยังไม่แก้ WMS') : '',
      wmsFixedBy:profileName(approval?.wms_fixed_by), wmsFixedAt:backupDateForTeam(approval?.wms_fixed_at),
      remark:finalCountRecord?.remark || latestRemarkRecord?.remark || '',
      photoUrl:finalCountRecord?.photo_url || latestPhotoRecord?.photo_url || '',
      sessionId, assignmentId:assignment?.id || '',
      locationId, itemId, hasApproval:Boolean(approval),
    };
  }).sort((a,b) =>
    String(a.session).localeCompare(String(b.session),'th')
    || String(a.zone).localeCompare(String(b.zone),'th')
    || String(a.location).localeCompare(String(b.location),'en',{numeric:true})
    || String(a.item).localeCompare(String(b.item),'en',{numeric:true}));

  const dataByComposite = new Map(dataRows.map(row => [stockKey(row.sessionId,row.locationId,row.itemId),row]));
  const detailCompositeKeys = new Set();
  const dataCountRows = stockDetails.map(detail => {
    const key = stockKey(detail.session_id,detail.location_id,detail.item_id);
    detailCompositeKeys.add(key);
    const session = sessionById.get(String(detail.session_id)) || {};
    const location = locationById.get(String(detail.location_id)) || {};
    const item = itemById.get(String(detail.item_id)) || {};
    const stock = stockByKey.get(key) || {};
    const base = dataByComposite.get(key) || {
      session:session.name || '', sessionStatus:session.status || '',
      location:location.code || '', zone:location.zone || '',
      item:item.code || '', description:item.description || '',
      stockOnhand:backupNumber(stock.onhand_qty), alQty:backupNumber(stock.al_qty),
      sessionId:detail.session_id || '', locationId:detail.location_id || '',
      itemId:detail.item_id || '',
    };
    return {
      ...base,
      lpn:detail.license_plate || '', lot:detail.lot || '',
      inventoryStatus:detail.inventory_status || '', uom:detail.uom || '',
      detailQty:backupNumber(detail.qty), stockDetailId:detail.id || '',
    };
  });
  dataRows.forEach(row => {
    const key = stockKey(row.sessionId,row.locationId,row.itemId);
    if (!detailCompositeKeys.has(key)) dataCountRows.push({ ...row, detailQty:null, stockDetailId:'' });
  });
  dataCountRows.sort((a,b) =>
    String(a.session).localeCompare(String(b.session),'th')
    || String(a.zone).localeCompare(String(b.zone),'th')
    || String(a.location).localeCompare(String(b.location),'en',{numeric:true})
    || String(a.item).localeCompare(String(b.item),'en',{numeric:true})
    || String(a.lpn).localeCompare(String(b.lpn),'en',{numeric:true})
    || String(a.lot).localeCompare(String(b.lot),'en',{numeric:true}));

  const countHistory = counts.map(count => {
    const assignment = assignmentById.get(String(count.assignment_id)) || {};
    const session = sessionById.get(String(assignment.session_id)) || {};
    const location = locationById.get(String(assignment.location_id)) || {};
    const item = itemById.get(String(count.item_id)) || {};
    return {
      session:session.name || '', location:location.code || '', zone:location.zone || '', area:location.area || '',
      item:item.code || '', description:item.description || '', round:backupNumber(count.round),
      countQty:backupNumber(count.count_qty), actualCounter:actualCounterName(count),
      countedBy:countUserName(count), countedAt:backupDateForTeam(count.counted_at),
      remark:count.remark || '', photoUrl:count.photo_url || '', assignmentStatus:assignment.status || '',
      sessionId:assignment.session_id || '', assignmentId:count.assignment_id || '',
      locationId:assignment.location_id || '', itemId:count.item_id || '', countRecordId:count.id || '',
    };
  }).sort((a,b) =>
    String(a.session).localeCompare(String(b.session),'th')
    || String(a.location).localeCompare(String(b.location),'en',{numeric:true})
    || String(a.item).localeCompare(String(b.item),'en',{numeric:true})
    || (Number(a.round)||0) - (Number(b.round)||0)
    || String(a.countedAt).localeCompare(String(b.countedAt)));

  const stockLpn = stockDetails.map(detail => {
    const session = sessionById.get(String(detail.session_id)) || {};
    const location = locationById.get(String(detail.location_id)) || {};
    const item = itemById.get(String(detail.item_id)) || {};
    const stock = stockByKey.get(stockKey(detail.session_id,detail.location_id,detail.item_id)) || {};
    const work = dataByComposite.get(stockKey(detail.session_id,detail.location_id,detail.item_id)) || {};
    return {
      session:session.name || '', location:location.code || '', zone:location.zone || '', area:location.area || '',
      lpn:detail.license_plate || '', lot:detail.lot || '', inventoryStatus:detail.inventory_status || '',
      item:item.code || '', description:item.description || '', detailQty:backupNumber(detail.qty),
      uom:detail.uom || '', stockOnhand:backupNumber(stock.onhand_qty), alQty:backupNumber(stock.al_qty),
      count1:work.count1 ?? null, count2:work.count2 ?? null, count3:work.count3 ?? null,
      physicalCount:work.physicalCount ?? null, variance:work.variance ?? null, result:work.result || '',
      sessionId:detail.session_id || '', locationId:detail.location_id || '', itemId:detail.item_id || '',
      stockDetailId:detail.id || '',
    };
  }).sort((a,b) =>
    String(a.session).localeCompare(String(b.session),'th')
    || String(a.location).localeCompare(String(b.location),'en',{numeric:true})
    || String(a.item).localeCompare(String(b.item),'en',{numeric:true})
    || String(a.lpn).localeCompare(String(b.lpn),'en',{numeric:true}));

  const varianceWms = dataRows.filter(row =>
    row.hasApproval || (row.physicalCount !== null && row.variance !== 0));

  const transactionHistory = audits.map(audit => {
    const assignment = assignmentById.get(String(audit.assignment_id)) || {};
    const sessionId = audit.session_id || assignment.session_id || '';
    const locationId = audit.location_id || assignment.location_id || '';
    const session = sessionById.get(String(sessionId)) || {};
    const location = locationById.get(String(locationId)) || {};
    const item = itemById.get(String(audit.item_id)) || {};
    return {
      createdAt:backupDateForTeam(audit.created_at), action:audit.action || '', session:session.name || '',
      location:location.code || '', zone:location.zone || '', item:item.code || '',
      description:item.description || '', performedBy:profileName(audit.performed_by),
      oldValue:audit.old_value ?? '', newValue:audit.new_value ?? '', sessionId,
      assignmentId:audit.assignment_id || '', locationId, itemId:audit.item_id || '', auditId:audit.id || '',
    };
  }).sort((a,b) => String(a.createdAt).localeCompare(String(b.createdAt)));

  const sessionSummary = sessions.map(session => {
    const sessionAssignments = assignments.filter(row => String(row.session_id) === String(session.id));
    const sessionData = dataRows.filter(row => String(row.sessionId) === String(session.id));
    const sessionDetails = stockDetails.filter(row => String(row.session_id) === String(session.id));
    const sessionExportRows = dataCountRows.filter(row => String(row.sessionId) === String(session.id));
    const sessionCounts = countHistory.filter(row => String(row.sessionId) === String(session.id));
    const countedData = sessionData.filter(row => row.physicalCount !== null);
    const absVariance = countedData.reduce((sum,row) => sum + Math.abs(Number(row.variance || 0)),0);
    const stockBase = countedData.reduce((sum,row) => sum + Math.abs(Number(row.stockOnhand || 0)),0);
    const accuracy = stockBase > 0 ? Math.max(0,100 - absVariance / stockBase * 100) : 100;
    const unique = (rows,key) => new Set(rows.map(row => row[key]).filter(Boolean)).size;
    return {
      session:session.name || '', status:session.status || '', createdAt:backupDateForTeam(session.created_at),
      closedAt:backupDateForTeam(session.closed_at), assignments:sessionAssignments.length,
      locations:unique(sessionAssignments,'location_id'), uniqueItems:unique(sessionData,'itemId'),
      items:sessionData.length, lpnRows:sessionDetails.length, dataCountRows:sessionExportRows.length,
      photoUrls:unique(sessionExportRows.filter(row => row.photoUrl),'photoUrl'),
      countedItems:countedData.length,
      countEvents:sessionCounts.length, countedLocations:unique(countedData,'locationId'),
      stockOnhand:sessionData.reduce((sum,row) => sum + Number(row.stockOnhand || 0),0),
      physicalCount:countedData.reduce((sum,row) => sum + Number(row.physicalCount || 0),0),
      variance:countedData.reduce((sum,row) => sum + Number(row.variance || 0),0),
      diffItems:countedData.filter(row => Number(row.variance || 0) !== 0).length,
      matchItems:countedData.filter(row => Number(row.variance || 0) === 0).length,
      stockAccuracy:Number(accuracy.toFixed(2)),
      wmsPending:varianceWms.filter(row => String(row.sessionId) === String(session.id) && row.wmsStatus === 'ยังไม่แก้ WMS').length,
      wmsFixed:varianceWms.filter(row => String(row.sessionId) === String(session.id) && row.wmsStatus === 'แก้ไขแล้ว').length,
      sessionId:session.id || '',
    };
  });

  return {
    Data_Count:dataCountRows,
    Session_Summary:sessionSummary,
  };
}

function appendTeamBackupSheet(workbook, sheetName, rows, columns) {
  if ((rows || []).length > 1048574) {
    throw new Error(`${sheetName} มีข้อมูลเกินขนาดสูงสุดของ Excel กรุณา Backup แยก Session`);
  }
  const headers = columns.map(column => column.header);
  const output = (rows || []).map(row => Object.fromEntries(columns.map(column =>
    [column.header,backupTeamCellValue(row?.[column.key])])));
  const sheet = XLSX.utils.json_to_sheet(output, { header:headers, skipHeader:false });
  sheet['!cols'] = columns.map(column => ({ wch:column.width }));
  sheet['!rows'] = [{ hpt:28 }];
  sheet['!autofilter'] = { ref:sheet['!ref'] };
  sheet['!freeze'] = { xSplit:0, ySplit:1, topLeftCell:'A2', activePane:'bottomLeft', state:'frozen' };
  headers.forEach((header,columnIndex) => {
    const cell = sheet[XLSX.utils.encode_cell({ r:0, c:columnIndex })];
    if (cell) {
      cell.s = {
        font:{ bold:true, color:{ rgb:'FFFFFF' } },
        fill:{ patternType:'solid', fgColor:{ rgb:'0B7D87' } },
        alignment:{ horizontal:'center', vertical:'center', wrapText:true },
      };
    }
    const column = columns[columnIndex];
    for (let rowIndex = 1; rowIndex <= (rows || []).length; rowIndex++) {
      const dataCell = sheet[XLSX.utils.encode_cell({ r:rowIndex, c:columnIndex })];
      if (!dataCell) continue;
      if (column.type === 'number') dataCell.z = '#,##0.00;[Red]-#,##0.00;0';
      if (column.type === 'url' && dataCell.v) dataCell.l = { Target:String(dataCell.v), Tooltip:'เปิดไฟล์ / รูปถ่าย' };
    }
  });
  XLSX.utils.book_append_sheet(workbook, sheet, sheetName);
}

function buildBackupWorkbook(dataBySheet, sessionIds, fileName, formatVersion=BACKUP_FORMAT_VERSION) {
  if (typeof XLSX === 'undefined') throw new Error('ไม่พบระบบอ่าน/เขียน Excel');
  if (!BACKUP_SUPPORTED_VERSIONS.has(String(formatVersion))) throw new Error('Backup Format ไม่ถูกต้อง');
  formatVersion = String(formatVersion);
  const createdAt = new Date().toISOString();
  const rowCounts = {};
  const sheetHashes = {};
  BACKUP_SHEET_SPECS.forEach(spec => {
    const rows = dataBySheet[spec.sheet] || [];
    rowCounts[spec.sheet] = rows.length;
    sheetHashes[spec.sheet] = backupRowsChecksum(rows, spec.columns, formatVersion);
  });

  const manifestEntries = [
    { key:'backup_format', value:BACKUP_FORMAT },
    { key:'format_version', value:formatVersion },
    { key:'created_at', value:createdAt },
    { key:'app_build', value:window.__CYCLE_COUNT_BUILD__ || 'v62' },
    { key:'project_ref', value:'uiuaboxsfepyftqjlwil' },
    { key:'file_name', value:fileName },
    { key:'session_ids', value:JSON.stringify(sessionIds) },
    { key:'photo_backup_mode', value:'storage_url_preserved' },
    ...BACKUP_SHEET_SPECS.flatMap(spec => [
      { key:`rows:${spec.sheet}`, value:String(rowCounts[spec.sheet]) },
      { key:`hash:${spec.sheet}`, value:sheetHashes[spec.sheet] },
    ]),
  ];
  const manifestHash = backupRowsChecksum(manifestEntries, ['key','value'], formatVersion);
  manifestEntries.push({ key:'manifest_hash', value:manifestHash });

  const workbook = XLSX.utils.book_new();
  workbook.Props = {
    Title: `Cycle Count Backup ${createdAt}`,
    Subject: 'Team-readable and restorable Cycle Count database backup',
    Author: prof?.name || 'Cycle Count Admin',
    CreatedDate: new Date(),
  };
  workbook.Workbook = { Views:[{ activeTab:0 }] };
  const teamData = buildTeamBackupData(dataBySheet);
  const teamColumns = backupTeamSheetColumns();
  ['Data_Count','Session_Summary']
    .forEach(sheetName => appendTeamBackupSheet(workbook,sheetName,teamData[sheetName],teamColumns[sheetName]));

  const readme = [
    ['CYCLE COUNT BACKUP','ไฟล์ข้อมูลการนับที่ทีมอื่นอ่าน ใช้งานต่อ และ Restore กลับเข้าระบบได้'],
    ['Data_Count','ข้อมูล Stock / LPN ทั้งหมดของ Session: 1 แถวต่อ LPN/Lot และเก็บ Stock ที่ไม่มี LPN/Lot ไว้ด้วย โดยไม่กรองเฉพาะ Gain/Lost'],
    ['Count 1–3','แสดง Actual Counter และเวลานับแยกครบทั้ง 3 รอบ'],
    ['Photo URL','ใช้ URL รูปล่าสุดที่มีจริงของงาน แม้ผลนับรอบสุดท้ายจะไม่ได้แนบรูป'],
    ['Session_Summary','สรุป Unique ITEM, Stock Lines, LPN/Lot Rows, จำนวนแถว Data_Count, รูปถ่าย, ผลการนับ, Stock Accuracy และสถานะ WMS แยก Session'],
    ['การใช้งานต่อ','ทีมสามารถกรอง คัดลอก หรือแก้ไข Data_Count และ Session_Summary ได้ เพราะ Restore จะไม่อ่าน 2 ชีตนี้'],
    ['ข้อความยาว','Backup Format v3 จะแบ่งข้อความที่ยาวเกินข้อจำกัด Excel เป็นคอลัมน์ __cc_part_2, 3... และประกอบกลับอัตโนมัติเมื่อ Restore'],
    ['คำเตือน Restore','ชีตข้อมูลระบบที่จำเป็นต่อ Restore ถูกซ่อนไว้ ห้ามเปิด แก้ชื่อ หรือลบชีตเหล่านั้น'],
    ['รูปถ่าย','เก็บเป็น URL และระบบจะรักษาไฟล์รูปใน Storage เมื่อลบผ่านเมนู Backup'],
    ['ข้อมูลระบบ','ข้อมูล Restore ยังอยู่ครบ แต่ซ่อนชีต Manifest, Sessions, Locations, Items, Assignments, Stock, Stock_Detail, Counts, Approvals, Audit, Profiles, Counters และ Remarks'],
    ['User Login','ไฟล์นี้ไม่เก็บรหัสผ่านและไม่สร้างบัญชี Auth ใหม่; Profiles ใช้เป็นข้อมูลอ้างอิง'],
    ['วิธี Restore','เมนู จัดการงาน / Sessions → Backup / Restore → เลือกไฟล์นี้'],
    ['สร้างเมื่อ',createdAt],
    ['จำนวน Session',sessionIds.length],
    ['Manifest checksum',manifestHash],
  ];
  const readmeSheet = XLSX.utils.aoa_to_sheet(readme);
  readmeSheet['!cols'] = [{wch:24},{wch:80}];
  XLSX.utils.book_append_sheet(workbook, readmeSheet, 'README');

  const manifestExcelEntries = backupManifestRowsForExcel(manifestEntries,formatVersion);
  const manifestSheet = XLSX.utils.json_to_sheet(manifestExcelEntries, { header:['key','value'] });
  manifestSheet['!cols'] = [{wch:28},{wch:90}];
  XLSX.utils.book_append_sheet(workbook, manifestSheet, 'Manifest');

  BACKUP_SHEET_SPECS.forEach(spec => {
    const rows = dataBySheet[spec.sheet] || [];
    const excelData = backupRowsForExcel(rows,spec.columns,formatVersion);
    const sheet = XLSX.utils.json_to_sheet(excelData.rows, { header:excelData.columns, skipHeader:false });
    sheet['!cols'] = excelData.columns.map(column => {
      const sourceColumn = column.split(BACKUP_CHUNK_MARKER)[0];
      return ({
      wch: sourceColumn === 'id' || sourceColumn.endsWith('_id') ? 38
        : sourceColumn.includes('_at') ? 26
        : ['description','remark','photo_url','old_value','new_value','supervisor_note'].includes(sourceColumn) ? 46
        : 18,
      });
    });
    if (rows.length) sheet['!autofilter'] = { ref:sheet['!ref'] };
    XLSX.utils.book_append_sheet(workbook, sheet, spec.sheet);
  });

  // Keep the workbook clean for team use while preserving every required Restore sheet.
  // Hidden = 2 means "very hidden": normal Excel users see only the business sheets above.
  const restoreSheetNames = new Set(['Manifest', ...BACKUP_SHEET_SPECS.map(spec => spec.sheet)]);
  workbook.Workbook.Sheets = workbook.SheetNames.map(name => ({
    name,
    Hidden:restoreSheetNames.has(name) ? 2 : 0,
  }));

  const businessCounts = Object.fromEntries(Object.entries(teamData).map(([key,rows]) => [key,rows.length]));
  return { workbook, manifestHash, rowCounts, sheetHashes, businessCounts, createdAt };
}

function backupManifestFromSheet(workbook) {
  const sheet = workbook.Sheets.Manifest;
  if (!sheet) throw new Error('ไม่พบชีต Manifest');
  const values = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:true });
  if (!values.length || values[0][0] !== 'key' || values[0][1] !== 'value') {
    throw new Error('รูปแบบ Manifest ไม่ถูกต้อง');
  }
  const physicalEntries = values.slice(1)
    .filter(row => String(row[0] || '').trim())
    .map(row => ({ key:String(row[0]), value:String(row[1] ?? '') }));
  const physicalMap = Object.fromEntries(physicalEntries.map(entry => [entry.key,entry.value]));
  const entries = backupManifestRowsFromExcel(physicalEntries,physicalMap.format_version);
  const map = Object.fromEntries(entries.map(entry => [entry.key,entry.value]));
  if (map.backup_format !== BACKUP_FORMAT) throw new Error('ไฟล์นี้ไม่ใช่ Cycle Count Backup');
  if (!BACKUP_SUPPORTED_VERSIONS.has(map.format_version)) {
    throw new Error(`ไม่รองรับ Backup Version ${map.format_version || '?'}`);
  }
  const baseEntries = entries.filter(entry => entry.key !== 'manifest_hash');
  const computedHash = backupRowsChecksum(baseEntries, ['key','value'], map.format_version);
  if (!map.manifest_hash || map.manifest_hash !== computedHash) throw new Error('Manifest checksum ไม่ตรง ไฟล์อาจถูกแก้ไข');
  let sessionIds;
  try { sessionIds = JSON.parse(map.session_ids); } catch (_) { throw new Error('รายการ Session ใน Manifest ไม่ถูกต้อง'); }
  if (!Array.isArray(sessionIds) || !sessionIds.length) throw new Error('ไม่พบ Session ใน Manifest');
  return { map, entries, sessionIds, manifestHash:computedHash };
}

async function readBackupExcelFile(event) {
  const file = event?.target?.files?.[0];
  const preview = Q('backup-import-preview');
  const button = Q('backup-restore-btn');
  const alertBox = Q('backup-restore-alert');
  _backupParsed = null;
  if (button) button.disabled = true;
  if (alertBox) alertBox.innerHTML = '';
  if (!file) {
    if (preview) preview.innerHTML = `<div class="load" style="padding:18px">ยังไม่ได้เลือกไฟล์</div>`;
    return;
  }
  try {
    if (!/\.xlsx$/i.test(file.name || '')) throw new Error('รองรับเฉพาะไฟล์ .xlsx จากเมนู Backup');
    if (Number(file.size || 0) > 250 * 1024 * 1024) {
      throw new Error('ไฟล์ใหญ่เกิน 250 MB กรุณา Backup/Restore แยก Session');
    }
    if (preview) preview.innerHTML = `<div class="load" style="padding:18px">กำลังตรวจไฟล์และ checksum...</div>`;
    setBackupProgress(5,'กำลังอ่านไฟล์ Excel...');
    const workbook = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:false });
    const manifest = backupManifestFromSheet(workbook);
    const dataBySheet = {};
    const rowCounts = {};
    let manifestTotalRows = 0;

    for (let index = 0; index < BACKUP_SHEET_SPECS.length; index++) {
      const spec = BACKUP_SHEET_SPECS[index];
      const sheet = workbook.Sheets[spec.sheet];
      if (!sheet) throw new Error(`ไม่พบชีต ${spec.sheet}`);
      if (!sheet['!ref']) throw new Error(`ชีต ${spec.sheet} ไม่มีหัวคอลัมน์`);
      const sheetRange = XLSX.utils.decode_range(sheet['!ref']);
      const expectedRows = Number(manifest.map[`rows:${spec.sheet}`]);
      if (!Number.isInteger(expectedRows) || expectedRows < 0 || expectedRows > 1048574) {
        throw new Error(`${spec.sheet} ระบุจำนวนแถวไม่ถูกต้อง`);
      }
      manifestTotalRows += expectedRows;
      if (manifestTotalRows > 2000000) {
        throw new Error('ไฟล์มีข้อมูลรวมเกิน 2,000,000 แถว กรุณา Restore แยก Session');
      }
      const physicalDataRows = Math.max(0, sheetRange.e.r - sheetRange.s.r);
      if (physicalDataRows !== expectedRows) {
        throw new Error(`${spec.sheet} โครงสร้างแถวไม่ตรงกับ Manifest`);
      }
      const headers = [];
      for (let column = sheetRange.s.c; column <= sheetRange.e.c; column++) {
        const cell = sheet[XLSX.utils.encode_cell({ r:sheetRange.s.r, c:column })];
        headers.push(String(cell?.v ?? ''));
      }
      const missingColumns = spec.columns.filter(column => !headers.includes(column));
      if (missingColumns.length) throw new Error(`${spec.sheet} ขาดคอลัมน์: ${missingColumns.join(', ')}`);
      const physicalRows = XLSX.utils.sheet_to_json(sheet, { defval:null, raw:true })
        .filter(row => row.id !== null && row.id !== undefined && String(row.id).trim() !== '');
      const rows = backupRowsFromExcel(physicalRows,spec.columns,manifest.map.format_version);
      if (rows.length !== expectedRows) {
        throw new Error(`${spec.sheet} จำนวนแถวไม่ตรง: พบ ${rows.length}, Manifest ${expectedRows}`);
      }
      const checksum = backupRowsChecksum(rows, spec.columns, manifest.map.format_version);
      if (checksum !== manifest.map[`hash:${spec.sheet}`]) {
        throw new Error(`${spec.sheet} checksum ไม่ตรง ไฟล์อาจถูกแก้ไขหรือเสียหาย`);
      }
      dataBySheet[spec.sheet] = rows;
      rowCounts[spec.sheet] = rows.length;
      setBackupProgress(5 + Math.round((index + 1) / BACKUP_SHEET_SPECS.length * 45),
        `ตรวจ ${spec.sheet} แล้ว (${rows.length.toLocaleString()} แถว)`);
    }

    _backupParsed = {
      fileName:file.name,
      sessionIds:manifest.sessionIds,
      manifestHash:manifest.manifestHash,
      rowCounts,
      dataBySheet,
    };
    const totalRows = Object.values(rowCounts).reduce((sum,value)=>sum+Number(value||0),0);
    if (preview) preview.innerHTML = `
      <div class="alert alert-green" style="line-height:1.6">
        ✅ ไฟล์ถูกต้อง · ${manifest.sessionIds.length} Session · ${totalRows.toLocaleString()} แถว<br>
        สร้างเมื่อ ${manifest.map.created_at ? new Date(manifest.map.created_at).toLocaleString('th-TH') : '-'}
      </div>
      ${backupCountCards(rowCounts)}`;
    setBackupProgress(50,'ตรวจไฟล์ผ่าน พร้อม Restore');
    if (button) button.disabled = false;
  } catch (error) {
    console.error(error);
    setBackupProgress(0,'ไฟล์ไม่ผ่านการตรวจ');
    if (preview) preview.innerHTML = errBox(error.message || error);
  }
}

async function restoreBackupExcel() {
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  if (!_backupParsed) { alert('กรุณาเลือกและตรวจไฟล์ Backup ก่อน'); return; }
  if (!confirm(`Restore ข้อมูลจากไฟล์ "${_backupParsed.fileName}"?\n\nข้อมูล ID เดิมจะถูกกู้คืน และรายการที่มีอยู่แล้วจะถูกอัปเดตโดยไม่สร้างซ้ำ`)) return;
  const button = Q('backup-restore-btn');
  const alertBox = Q('backup-restore-alert');
  if (button) button.disabled = true;
  try {
    const totalRows = BACKUP_RESTORE_ORDER.reduce((sum,sheet) =>
      sum + (_backupParsed.dataBySheet[sheet]?.length || 0), 0);
    let completed = 0;
    for (const sheetName of BACKUP_RESTORE_ORDER) {
      const spec = BACKUP_SHEET_SPECS.find(item => item.sheet === sheetName);
      const rows = _backupParsed.dataBySheet[sheetName] || [];
      for (let start = 0; start < rows.length; start += BACKUP_BATCH_SIZE) {
        const batch = rows.slice(start, start + BACKUP_BATCH_SIZE);
        await invokeAdminBackup('restore_batch', { table:spec.table, rows:batch });
        completed += batch.length;
        setBackupProgress(50 + Math.round(completed / Math.max(1,totalRows) * 47),
          `Restore ${sheetName}: ${Math.min(start + batch.length, rows.length).toLocaleString()} / ${rows.length.toLocaleString()}`);
        await new Promise(resolve => requestAnimationFrame(resolve));
      }
    }
    setBackupProgress(98,'กำลังตรวจจำนวนข้อมูลหลัง Restore...');
    const result = await invokeAdminBackup('complete_restore', {
      session_ids:_backupParsed.sessionIds,
      file_name:_backupParsed.fileName,
      manifest_hash:_backupParsed.manifestHash,
      row_counts:_backupParsed.rowCounts,
    });
    setBackupProgress(100,'Restore สำเร็จและตรวจจำนวนครบ');
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-green" style="line-height:1.65">
      ✅ Restore สำเร็จ ข้อมูล Session และความสัมพันธ์กลับมาครบ<br>
      ${backupCountCards(result.actual)}
    </div>`;
    if (Q('backup-import-file')) Q('backup-import-file').value = '';
    _backupParsed = null;
  } catch (error) {
    console.error(error);
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-red" style="line-height:1.65">
      ❌ ${escapeWmsText(error.message || error)}<br>
      สามารถเลือกไฟล์เดิมแล้ว Restore ซ้ำได้ ระบบจะทำต่อโดยไม่สร้างข้อมูลซ้ำ
    </div>`;
  } finally {
    if (button) button.disabled = !_backupParsed;
  }
}

function syncThemeColorField(key, source) {
  const picker = Q(`theme_picker_${key}`);
  const hex = Q(`theme_hex_${key}`);
  if (!picker || !hex) return;
  if (source === 'picker') hex.value = String(picker.value || '').toUpperCase();
  const value = String(hex.value || '').trim().toUpperCase();
  hex.value = value;
  const valid = /^#[0-9A-F]{6}$/.test(value);
  hex.style.borderColor = valid ? '' : 'var(--brand-danger)';
  if (!valid) return;
  picker.value = value;
  previewBrandingDraft();
}

function collectBrandingDraft() {

    draft[key] = value;

  } catch (_) {}
}

function resizeBrandLogo(file, maxSide = 420, quality = .88) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์โลโก้ไม่สำเร็จ'));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพที่รองรับ'));
      image.onload = () => {
        const ratio = Math.min(1, maxSide / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
        const width = Math.max(1, Math.round(image.naturalWidth * ratio));
        const height = Math.max(1, Math.round(image.naturalHeight * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.clearRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);
        resolve(canvas.toDataURL('image/webp', quality));
      };
      image.src = String(reader.result || '');
    };
    reader.readAsDataURL(file);
  });
}

async function handleBrandLogoFile(input) {
  const file = input?.files?.[0];
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/i.test(file.type || '')) {
    alert('รองรับเฉพาะไฟล์ PNG, JPG และ WEBP');
    input.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    alert('ไฟล์โลโก้ต้องมีขนาดไม่เกิน 5 MB');
    input.value = '';
    return;
  }
  try {
    let dataUrl = await resizeBrandLogo(file);
    if (dataUrl.length > 900000) dataUrl = await resizeBrandLogo(file, 300, .76);
    _brandingDraftLogo = normalizeLogoDataUrl(dataUrl);
    if (!_brandingDraftLogo) throw new Error('โลโก้หลังย่อยังมีขนาดใหญ่เกินไป');
    const logoPreview = Q('branding-logo-preview');
    const sidebarPreview = Q('branding-preview-sidebar-logo');
    if (logoPreview) {
      logoPreview.classList.add('has-custom-logo');
      logoPreview.innerHTML = brandingLogoPreviewHtml();
    }
    if (sidebarPreview) {
      sidebarPreview.classList.add('has-custom-logo');
      sidebarPreview.innerHTML = brandingLogoPreviewHtml();
    }
    previewBrandingDraft();
  } catch (error) {
    alert(error.message || 'เตรียมโลโก้ไม่สำเร็จ');
    input.value = '';
  }
}

function removeBrandLogo() {
  _brandingDraftLogo = '';
  const logoPreview = Q('branding-logo-preview');
  const sidebarPreview = Q('branding-preview-sidebar-logo');
  if (logoPreview) {
    logoPreview.classList.remove('has-custom-logo');
    logoPreview.innerHTML = brandingLogoPreviewHtml('');
  }
  if (sidebarPreview) {
    sidebarPreview.classList.remove('has-custom-logo');
    sidebarPreview.innerHTML = brandingLogoPreviewHtml('');

  previewBrandingDraft();
}

function resetBrandingDraft() {
  BRANDING_COLOR_FIELDS.forEach(({ key }) => {
    const picker = Q(`theme_picker_${key}`);
    const hex = Q(`theme_hex_${key}`);
    if (picker) picker.value = DEFAULT_BRANDING[key];
    if (hex) {
      hex.value = DEFAULT_BRANDING[key];
      hex.style.borderColor = '';
    }
  });
  if (Q('branding-system-name')) Q('branding-system-name').value = DEFAULT_BRANDING.systemName;
  if (Q('branding-system-subtitle')) Q('branding-system-subtitle').value = DEFAULT_BRANDING.systemSubtitle;
  _brandingDraftLogo = '';
  removeBrandLogo();
  previewBrandingDraft();
}

async function saveBrandingSettings() {

    const result = await invokeAdminSettings('branding_save', { settings });

  }
