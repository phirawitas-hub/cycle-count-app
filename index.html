    <div class="row" style="cursor:default;gap:10px">
      <input id="admin_counter_name_${c.id}" value="${escapeWmsText(c.name)}" maxlength="120"
        style="flex:1;min-width:160px">
      <button class="btn btn-blue btn-sm" onclick="saveCounterName('${c.id}')">บันทึก</button>
      <button class="btn btn-red btn-sm admin-delete-icon" onclick="deleteCounterName('${c.id}')"
        title="ลบคนนับ" aria-label="ลบคนนับ">${adminTrashIconSvg()}</button>
    </div>`).join('');

  const remarkSection = (context, title) => {
    const contextRemarks = (remarks || []).filter(r => r.context === context);
    const rows = contextRemarks.map(r => `
      <div class="row" style="cursor:default;gap:10px">
        <input id="admin_remark_${r.id}" value="${escapeWmsText(r.label)}" maxlength="120"
          style="flex:1;min-width:160px">
        <button class="btn btn-blue btn-sm" onclick="saveRemarkOption('${r.id}')">บันทึก</button>
        <button class="btn btn-red btn-sm admin-delete-icon" onclick="deleteRemarkOption('${r.id}')"
          title="ลบหมายเหตุ" aria-label="ลบหมายเหตุ">${adminTrashIconSvg()}</button>
      </div>`).join('');
    const body = `
      ${rows || `<div class="load" style="padding:20px">ยังไม่มีรายการ</div>`}
      <div style="display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap">
        <input id="admin_remark_new_${context}" placeholder="เพิ่มรายการใหม่..." maxlength="120" style="flex:1;min-width:180px">
        <button class="btn btn-green btn-sm" onclick="addRemarkOption('${context}')">＋ เพิ่ม</button>
      </div>`;
    return masterGroup(context === 'count' ? '📝' : '🛠️', title, contextRemarks.length, body);
  };

  cnt().innerHTML = `
    <div class="alert alert-blue" style="line-height:1.7">
      🔒 หน้านี้ใช้ได้เฉพาะ Admin<br>
      Admin สามารถสร้าง แก้ไข ตั้งรหัสผ่าน และลบบัญชีได้ ส่วนประวัติการทำงานเดิมจะยังคงอยู่
    </div>
    <section class="admin-settings-card" style="margin-bottom:18px">
      <div class="admin-settings-head">
        <div>
          <h2>สร้าง User ใหม่</h2>
          <p>กำหนด User ID สำหรับเข้าสู่ระบบโดยไม่ต้องใช้อีเมล · รูปประจำตัวแก้ไขภายหลังได้</p>
        </div>
      </div>
      <div class="admin-user-create-grid">
        <div class="admin-user-field">
          <label for="admin_user_new_name">ชื่อ User</label>
          <input id="admin_user_new_name" maxlength="120" placeholder="เช่น Somchai">
        </div>
        <div class="admin-user-field">
          <label for="admin_user_new_login_id">User ID</label>
          <input type="text" id="admin_user_new_login_id" maxlength="40" autocapitalize="none"
            spellcheck="false" placeholder="เช่น VPW64054">
        </div>
        <div class="admin-user-field">
          <label for="admin_user_new_role">ระดับสิทธิ์</label>
          <select id="admin_user_new_role" onchange="updateNewUserPasswordHint()">
            <option value="counter">User (รับงาน)</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="admin-user-field">
          <label for="admin_user_new_password">รหัสผ่านเริ่มต้น</label>
          <div class="password-input-wrap">
            <input type="password" id="admin_user_new_password" minlength="10" maxlength="72"
              placeholder="อย่างน้อย 10 ตัว มี A-Z, a-z และตัวเลข"
              onkeydown="if(event.key==='Enter')createLoginUser()">
            ${passwordEyeButtonHtml('admin_user_new_password','แสดงรหัสผ่านเริ่มต้น')}
          </div>
          <div class="admin-user-meta" id="admin_user_new_password_hint">User/Supervisor: อย่างน้อย 10 ตัว มี A-Z, a-z และตัวเลข</div>
        </div>
        <div class="admin-user-field">
          <label>รูปประจำตัว</label>
          <div class="admin-avatar-editor">
            <div class="admin-avatar-preview" id="admin_user_avatar_preview_new">U</div>
            <div class="admin-avatar-controls">
              <input class="admin-avatar-file" type="file" id="admin_user_avatar_file_new"
                accept="image/png,image/jpeg,image/webp"
                onchange="handleUserAvatarFile(this,'new')">
              <button class="btn btn-ghost btn-sm admin-avatar-remove" type="button"
                onclick="removeUserAvatar('new')">ลบรูป</button>
            </div>
          </div>
        </div>
        <button class="btn btn-green" id="admin_user_create_btn" onclick="createLoginUser()">＋ สร้าง User</button>
      </div>
      <div id="admin_user_create_alert" style="margin-top:12px"></div>
    </section>
    ${masterGroup('🔑','User ที่ใช้ล็อกอินและรับงาน',users?.length || 0,
      userRows || `<div class="load" style="padding:24px">ยังไม่มี User</div>`)}
    ${masterGroup('👥','คนนับจริง',counters?.length || 0,`
      ${counterRows || `<div class="load" style="padding:24px">ยังไม่มีคนนับ</div>`}
      <div style="display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap">
        <input id="admin_counter_new" placeholder="เพิ่มชื่อคนนับใหม่..." maxlength="120" style="flex:1;min-width:180px">
        <button class="btn btn-green btn-sm" onclick="addCounterName()">＋ เพิ่ม</button>
      </div>`)}
    ${remarkSection('count','หมายเหตุหน้าบันทึกการนับ')}
    ${remarkSection('wms','หมายเหตุปรับยอด WMS')}`;
}

function updateNewUserPasswordHint() {
  const role = Q('admin_user_new_role')?.value || 'counter';
  const hint = Q('admin_user_new_password_hint');
  const input = Q('admin_user_new_password');
  if (hint) hint.textContent = passwordRequirementText(role);
  if (input) input.placeholder = role === 'admin'
    ? 'อย่างน้อย 12 ตัว มี A-Z, a-z, ตัวเลข และอักขระพิเศษ'
    : 'อย่างน้อย 10 ตัว มี A-Z, a-z และตัวเลข';
}

async function createLoginUser() {
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const name = Q('admin_user_new_name')?.value.trim();
  const loginId = Q('admin_user_new_login_id')?.value.trim().toLowerCase();
  const role = Q('admin_user_new_role')?.value;
  const password = Q('admin_user_new_password')?.value || '';
  const avatarDataUrl = normalizeLogoDataUrl(_userAvatarDrafts.new);
  const alertBox = Q('admin_user_create_alert');
  const button = Q('admin_user_create_btn');
  if (!name || !loginId || !password) {
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-amber">กรอกชื่อ User ID และรหัสผ่านให้ครบ</div>`;
    return;
  }
  if (!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(loginId)) {
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-red">User ID ต้องมี 3–40 ตัว และใช้ได้เฉพาะ a-z, 0-9, จุด, ขีดกลาง หรือขีดล่าง</div>`;
    return;
  }
  const passwordError = validateManagedPassword(password, role);
  if (passwordError) {
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-red">${escapeWmsText(passwordError)}</div>`;
    return;
  }
  try {
    if (button) { button.disabled = true; button.textContent = 'กำลังสร้าง...'; }
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-blue">⏳ กำลังสร้างบัญชี...</div>`;
    await invokeAdminSettings('user_create', {
      name,
      login_id: loginId,
      role,
      password,
      avatar_data_url: avatarDataUrl,
    });
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-green">✅ สร้าง User สำเร็จ</div>`;
    setTimeout(() => loadAdUsers(), 500);
  } catch (error) {
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-red">❌ ${escapeWmsText(error.message || error)}</div>`;
    if (button) { button.disabled = false; button.textContent = '＋ สร้าง User'; }
  }
}

async function saveLoginUser(id) {
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const name = Q(`admin_user_name_${id}`)?.value.trim();
  const loginId = Q(`admin_user_login_id_${id}`)?.value.trim().toLowerCase();
  const role = Q(`admin_user_role_${id}`)?.value;
  const roleInput = Q(`admin_user_role_${id}`);
  const previousRole = roleInput?.dataset.originalRole || role;
  const passwordInput = Q(`admin_user_password_${id}`);
  const password = passwordInput?.value || '';
  const avatarDataUrl = normalizeLogoDataUrl(_userAvatarDrafts[id]);
  if (!name || !loginId) { alert('กรุณากรอกชื่อและ User ID ให้ครบ'); return; }
  if (!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(loginId)) {
    alert('User ID ต้องมี 3–40 ตัว และใช้ได้เฉพาะ a-z, 0-9, จุด, ขีดกลาง หรือขีดล่าง');
    return;
  }
  if (previousRole !== 'admin' && role === 'admin' && !password) {
    alert('การเพิ่มสิทธิ์เป็น Admin ต้องกำหนดรหัสผ่าน Admin ใหม่พร้อมกัน');
    passwordInput?.focus();
    return;
  }
  if (password) {
    const passwordError = validateManagedPassword(password, role);
    if (passwordError) {
      alert(passwordError);
      passwordInput?.focus();
      return;
    }
  }
  try {
    await invokeAdminSettings('user_update', {
      id,
      name,
      login_id: loginId,
      role,
      password,
      avatar_data_url: avatarDataUrl,
    });
    if (passwordInput) passwordInput.value = '';
    alert('✅ บันทึกข้อมูล User เรียบร้อยแล้ว');
    if (id === me?.id) {
      await loadProf();
      render();
    } else {
      loadAdUsers();
    }
  } catch (error) {
    alert('แก้ไข User ไม่สำเร็จ: ' + error.message);
  }
}

function toggleUserPassword(id) {
  Q(`admin_user_password_box_${id}`)?.classList.toggle('open');
  Q(`admin_user_password_${id}`)?.focus();
}

async function resetLoginUserPassword(id) {
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const input = Q(`admin_user_password_${id}`);
  const password = input?.value || '';
  const role = Q(`admin_user_role_${id}`)?.dataset.originalRole || Q(`admin_user_role_${id}`)?.value || 'counter';
  const passwordError = validateManagedPassword(password, role);
  if (passwordError) {
    alert(passwordError);
    return;
  }
  if (!confirm('ยืนยันการตั้งรหัสผ่านใหม่ให้ User นี้?')) return;
  try {
    await invokeAdminSettings('user_password', { id, password });
    if (input) input.value = '';
    Q(`admin_user_password_box_${id}`)?.classList.remove('open');
    alert('✅ ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว');
  } catch (error) {
    alert('ตั้งรหัสผ่านใหม่ไม่สำเร็จ: ' + error.message);
  }
}

async function deleteLoginUser(id) {
  if (id === me?.id) { alert('ไม่สามารถลบบัญชีที่กำลังใช้งานอยู่'); return; }
  if (!confirm('ลบ User นี้แบบถาวร?\n\nบัญชีจะเข้าสู่ระบบไม่ได้อีก งานและประวัติการนับเดิมจะยังอยู่ แต่ช่อง User ผู้รับงานเดิมจะแสดงเป็น “ไม่ระบุ User”')) return;
  try {
    await invokeAdminSettings('user_delete', { id });
    alert('✅ ลบ User แบบถาวรแล้ว');
    loadAdUsers();
  } catch (error) {
    alert('ลบ User ไม่สำเร็จ: ' + error.message);
  }
}

}
