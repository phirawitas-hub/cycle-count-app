function prepareCountPhoto(file, maxSide = 1600, quality = .82) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//i.test(file.type || '')) {
      reject(new Error('กรุณาเลือกไฟล์รูปภาพ'));
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      reject(new Error('รูปภาพต้องมีขนาดไม่เกิน 25 MB'));
      return;
    }
    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error('ไม่สามารถอ่านรูปภาพนี้ได้'));
    };
    image.onload = () => {
      try {
        const ratio = Math.min(1, maxSide / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
        const context = canvas.getContext('2d');
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(objectUrl);
          if (!blob) reject(new Error('ย่อรูปภาพไม่สำเร็จ'));
          else resolve(blob);
        }, 'image/jpeg', quality);
      } catch (error) {
        URL.revokeObjectURL(objectUrl);
        reject(error);
      }
    };
    image.src = objectUrl;
  });
}

async function handlePhoto(itemId, input) {
  const file = input.files[0];
  if (!file) return;
  const thumb = Q('thumb_'+itemId);
  if (thumb) { thumb.src = URL.createObjectURL(file); thumb.style.display = 'block'; }
  input.disabled = true;
  try {
    if (!me?.id) throw new Error('Session หมดอายุ กรุณาเข้าสู่ระบบใหม่');
    const preparedPhoto = await prepareCountPhoto(file);
    const fileName = `${me.id}/${Date.now()}_${itemId}.jpg`;
    const { error } = await sb.storage.from('count-photos').upload(fileName, preparedPhoto, {
      upsert:false,
      contentType:'image/jpeg',
      cacheControl:'3600',
    });
    if (error) throw error;
    const { data: urlData } = sb.storage.from('count-photos').getPublicUrl(fileName);
    window._photoMap = window._photoMap || {};
    window._photoMap[itemId] = urlData.publicUrl;
    const tg = Q('tg_'+itemId);
    if (tg) tg.classList.add('has');
  } catch(e) {
    alert('อัปโหลดรูปไม่สำเร็จ: ' + (e?.message || e));
  }
  input.disabled = false;
}

async function submitCount(aid, round, idsStr, annualJobId='') {
  const ids = idsStr.split(',');
  const al  = Q('ca'), btn = Q('cb');

  const selectedNames = [...(window._selectedCounters || [])];
  if (!selectedNames.length) {
    al.innerHTML = `<div class="alert alert-red">⚠️ กรุณาเลือก "ผู้นับจริง" อย่างน้อย 1 คนก่อนบันทึกยอดนับ</div>`;
    return;
  }
  const actualCounterName = selectedNames.join(', ');

  const recs = [];
  const foundPayloads = [];
  for (const iid of ids) {
    const v = Q('q_'+iid)?.value;
    if (v === '' || v === undefined || v === null) {
      al.innerHTML = `<div class="alert alert-red">กรอกจำนวนให้ครบทุกรายการ (ถ้าไม่มีสินค้าให้กรอก 0)</div>`;
      return;
    }
    const numericQty = Number(v);
    if (!Number.isFinite(numericQty) || numericQty < 0) {
      al.innerHTML = '<div class="alert alert-red">QTY ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป</div>';
      return;
    }
    const remark   = getSelectedCountRemarks(iid).join('\n') || null;
    const photoUrl = (window._photoMap && window._photoMap[iid]) || null;
    const isEmptyRow = window._emptyCountItemIds?.has(String(iid));

    if (isEmptyRow) {
      const expectedLocation = importCodeKey(window._countFoundContext?.locationCode);
      const locationCode = importCodeKey(Q(`empty_location_${iid}`)?.value);
      const rawItemCode = importCodeKey(Q(`empty_item_${iid}`)?.value);
      if (locationCode !== expectedLocation) {
        al.innerHTML = `<div class="alert alert-red">Location ที่สแกน (${escapeWmsText(locationCode || 'ว่าง')}) ไม่ตรงกับงานที่เปิด (${escapeWmsText(expectedLocation)})</div>`;
        return;
      }
      const emptyLpn = normalizeImportText(Q(`empty_lpn_${iid}`)?.value);
      if (numericQty > 0 && (!emptyLpn || !rawItemCode)) {
        al.innerHTML = '<div class="alert alert-red">พบสินค้าและ QTY มากกว่า 0 กรุณาสแกนหรือกรอก LPN และ Item ให้ครบ</div>';
        return;
      }
      if (numericQty === 0 && rawItemCode) {
        al.innerHTML = '<div class="alert alert-red">กรอก Item แล้ว กรุณากรอก QTY มากกว่า 0 หรือเคลียร์ Item หาก Location ยังว่าง</div>';
        return;
      }
      if (numericQty > 0) {
        const info = await findDataInfo(rawItemCode);
        const itemCode = importCodeKey(info?.item_code || rawItemCode);
        const itemResult = await sb.from('items').select('id,code,description,uom').eq('code',itemCode).maybeSingle();
        if (itemResult.error) {
          al.innerHTML = errBox(itemResult.error.message);
          return;
        }
        foundPayloads.push({
          session_id:window._countFoundContext.sessionId,
          assignment_id:aid,
          location_id:window._countFoundContext.locationId,
          location_code:expectedLocation,
          license_plate:emptyLpn,
          item_id:itemResult.data?.id || null,
          item_code:itemCode,
          description:info?.description || itemResult.data?.description || Q(`empty_desc_${iid}`)?.value || null,
          uom:info?.uom || itemResult.data?.uom || Q(`empty_uom_${iid}`)?.value || null,
          qty:numericQty,
          remark,
          photo_url:photoUrl,
          actual_counter_name:actualCounterName,
          source_type:'empty_location',
          status:'pending_review',
          discovered_by:me.id,
        });
      }
    }
    recs.push({
      assignment_id: aid, item_id: iid, round,
      count_qty: isEmptyRow ? 0 : numericQty, counted_by: me.id,
      actual_counter_name: actualCounterName,
      remark, photo_url: photoUrl,
    });
  }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  const { error } = await sb.from('count_records')
    .upsert(recs, { onConflict:'assignment_id,item_id,round' });

  if (error) {
    al.innerHTML = errBox(error.message);
    btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
  }

  try {
    for (const payload of foundPayloads) await createFoundItemRecord(payload);
  } catch (foundError) {
    al.innerHTML = errBox(`บันทึกยอดว่างแล้ว แต่ส่งงานที่พบเพิ่มไม่สำเร็จ: ${foundError.message || foundError}`);
    btn.disabled = false;
    btn.textContent = `✅ ยืนยันรอบที่ ${round}`;
    return;
  }

  const { data: asgn, error:assignmentReadError } = await sb.from('assignments')
    .select('location_id,session_id').eq('id', aid).single();
  if (assignmentReadError || !asgn) {
    al.innerHTML = errBox(assignmentReadError?.message || 'ไม่พบ Assignment หลังบันทึกยอด');
    btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
  }

  const [snapshotResult,roundResult,rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty')
      .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('count_records').select('item_id,round,count_qty').eq('assignment_id', aid),
    getSessionRules(asgn.session_id),
  ]);
  if (snapshotResult.error || roundResult.error) {
    al.innerHTML = errBox((snapshotResult.error || roundResult.error).message);
    btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
  }
  const rawSnaps = snapshotResult.data;
  const rawAllRounds = roundResult.data;
  const countingItemIds = new Set(ids);
  const snaps = (rawSnaps || []).filter(row => !annualJobId || countingItemIds.has(String(row.item_id)));
  const allRounds = (rawAllRounds || []).filter(row => !annualJobId || countingItemIds.has(String(row.item_id)));

  const ohMap = Object.fromEntries(snaps?.map(s => [s.item_id, +s.onhand_qty]) || []);
  const byItem = {};
  allRounds?.forEach(r => {
    byItem[r.item_id] = byItem[r.item_id] || {};
    byItem[r.item_id][r.round] = +r.count_qty;
  });

  const itemStatuses = Object.entries(byItem).map(([iid, v]) =>
    computeItemStatus(ohMap[iid], v[1], v[2], v[3], rules));
  const anyPending = itemStatuses.some(st => st === 'PENDING');
  const anyDiff    = itemStatuses.some(st => st === 'Diff');
  const needsMore  = anyPending || anyDiff;

  let newStatus;
  if (anyPending)   newStatus = ['','round1_done','round2_done','round3_done'][round];
  else if (anyDiff) newStatus = 'round3_done';
  else              newStatus = 'completed';

  if (annualJobId) {
    const { data:startedRows,error:startError } = await sb.from('assignments')
      .update({ status:'in_progress' })
      .eq('id',aid)
      .select('id,status');
    if (startError || !startedRows?.length) {
      al.innerHTML = errBox(startError?.message || 'อัปเดตสถานะ Assignment ไม่สำเร็จ');
      btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
    }
    try {
      await refreshAnnualJobsForLocation(asgn.session_id,asgn.location_id,annualJobId);
    } catch (statusError) {
      al.innerHTML = errBox(`บันทึกยอดแล้ว แต่สรุปสถานะงานไม่สำเร็จ: ${statusError.message || statusError}`);
      btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
    }
  } else {
    const { data:updatedRows,error:updateError } = await sb.from('assignments')
      .update({ status:newStatus })
      .eq('id',aid)
      .select('id,status');
    if (updateError || !updatedRows?.length) {
      al.innerHTML = errBox(updateError?.message || 'อัปเดตสถานะ Assignment ไม่สำเร็จ');
      btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
    }
  }
  window._photoMap = {};

  if (!needsMore) {
    alert(foundPayloads.length
      ? '✅ บันทึกสำเร็จ · งานที่พบเพิ่มถูกส่งให้ Supervisor ตรวจสอบแล้ว'
      : '✅ ยอดตรงทุกรายการ! บันทึกสำเร็จ');
    go('c-tasks');
  } else if (anyPending) {
    alert(`⚠️ ยอดไม่ตรงกับระบบ — กรุณานับรอบที่ ${round+1} อีกครั้งอย่างระมัดระวัง`);
    go('c-count', annualJobId
      ? { aid,jid:annualJobId,jitemid:S.jitemid }
      : { aid });
  } else {
    alert('⚠️ ยอดไม่ตรงกับระบบ — ส่ง Supervisor ตรวจสอบแล้ว');
    go('c-tasks');
  }
}

function nextRound(st) {
  if (['pending','in_progress'].includes(st)) return 1;
  if (st === 'round1_done') return 2;
  if (st === 'round2_done') return 3;
  return null;
}

async function refreshAnnualJobsForLocation(sessionId,locationId,fallbackJobId='') {
  const result = await fetchPagedSupabaseRows(
    'annual_count_job_items',
    'job_id,session_id,location_id',
    query => query.eq('session_id',sessionId).eq('location_id',locationId),
  );
  const jobIds = new Set([fallbackJobId].filter(Boolean));
  if (!result.error) {
    (result.data || []).forEach(item => { if (item.job_id) jobIds.add(item.job_id); });
  }
  for (const jobId of jobIds) await refreshAnnualJobProgress(jobId);
}

async function refreshAnnualJobProgress(jobId) {
  try {
    const [jobResult,itemResult] = await Promise.all([
      sb.from('annual_count_jobs').select('id,session_id').eq('id',jobId).maybeSingle(),
      fetchPagedSupabaseRows(
        'annual_count_job_items',
        'job_id,session_id,location_id,item_id',
        query => query.eq('job_id',jobId),
      ),
    ]);
    if (jobResult.error || itemResult.error || !jobResult.data) {
      throw (jobResult.error || itemResult.error || new Error('ไม่พบ Annual JOB'));
    }
    const job = jobResult.data;
    const items = itemResult.data || [];
    if (!items.length) return;
    const locationIds = [...new Set(items.map(item => item.location_id).filter(Boolean))];
    const assignmentsResult = await fetchSupabaseRowsByValues(
      'assignments',
      'id,session_id,location_id,status',
      'location_id',
      locationIds,
    );
    if (assignmentsResult.error) throw assignmentsResult.error;
    const assignments = (assignmentsResult.data || []).filter(row => row.session_id === job.session_id);
    const assignmentByLocation = Object.fromEntries(assignments.map(row => [row.location_id,row]));
    const assignmentIds = assignments.map(row => row.id);
    const [snapshotResult,countResult,rules] = await Promise.all([
      fetchSupabaseRowsByValues(
        'stock_snapshot',
        'session_id,location_id,item_id,onhand_qty',
        'location_id',
        locationIds,
      ),
      fetchSupabaseRowsByValues(
        'count_records',
        'assignment_id,item_id,round,count_qty',
        'assignment_id',
        assignmentIds,
      ),
      getSessionRules(job.session_id),
    ]);
    if (snapshotResult.error || countResult.error) throw (snapshotResult.error || countResult.error);
    const snapshotMap = {};
    (snapshotResult.data || [])
      .filter(row => row.session_id === job.session_id)
      .forEach(row => { snapshotMap[`${row.location_id}|${row.item_id}`] = row; });
    const countMap = {};
    (countResult.data || []).forEach(row => {
      countMap[`${row.assignment_id}|${row.item_id}`] = countMap[`${row.assignment_id}|${row.item_id}`] || {};
      countMap[`${row.assignment_id}|${row.item_id}`][row.round] = Number(row.count_qty);
    });
    let started = false;
    const statuses = items.map(item => {
      const assignment = assignmentByLocation[item.location_id];
      const rounds = assignment ? (countMap[`${assignment.id}|${item.item_id}`] || {}) : {};
      if (rounds[1] !== undefined || rounds[2] !== undefined || rounds[3] !== undefined) started = true;
      const snapshot = snapshotMap[`${item.location_id}|${item.item_id}`];
      return computeItemStatus(snapshot?.onhand_qty,rounds[1],rounds[2],rounds[3],rules);
    });
    const completed = statuses.length > 0 && statuses.every(status => status === 'OK' || status === 'Diff');
    const nextStatus = completed ? 'completed' : (started ? 'in_progress' : 'pending');

    for (const assignment of assignments) {
      const locationSnapshots = (snapshotResult.data || []).filter(row =>
        row.session_id === job.session_id && row.location_id === assignment.location_id
      );
      const locationRounds = {};
      locationSnapshots.forEach(snapshot => {
        locationRounds[snapshot.item_id] = countMap[`${assignment.id}|${snapshot.item_id}`] || {};
      });
      const workflow = deriveAssignmentWorkflowStatus(
        locationSnapshots,
        locationRounds,
        rules,
        assignment.status,
      );
      const assignmentStatus = workflow.effectiveStatus;
      if (assignment.status !== assignmentStatus) {
        const { data:updatedRows,error:assignmentUpdateError } = await sb.from('assignments')
          .update({ status:assignmentStatus })
          .eq('id',assignment.id)
          .select('id,status');
        if (assignmentUpdateError) throw assignmentUpdateError;
        if (!updatedRows?.length) throw new Error(`อัปเดตสถานะ Assignment ${assignment.id} ไม่สำเร็จ`);
      }
    }
    const { error:updateError } = await sb.from('annual_count_jobs')
      .update({ status:nextStatus })
      .eq('id',jobId);
    if (updateError) {
      // Counter อาจไม่มีสิทธิ์แก้ master JOB ตาม RLS แต่สถานะ Assignment
      // ซึ่งใช้กับ Variance/Dashboard ถูกบันทึกเรียบร้อยแล้ว จึงไม่ควรกลืน Diff ทิ้ง
      if (['admin','supervisor'].includes(prof?.role)) throw updateError;
      console.warn('Annual JOB status update skipped:',updateError.message);
    }
  } catch (error) {
    console.warn('Annual JOB progress update failed:',error?.message || error);
    throw error;
  }
}

const SUPABASE_READ_PAGE_SIZE = 1000;
const SUPABASE_READ_CONCURRENCY = 4;
const SUPABASE_IN_BATCH_SIZE = 80;

async function fetchPagedSupabaseRows(table, columns, applyFilters = query => query) {
  const rows = [];
  const readPage = async from => {
    let query = sb.from(table).select(columns);
    query = applyFilters(query);
    return query.range(from, from + SUPABASE_READ_PAGE_SIZE - 1);
  };

  const first = await readPage(0);
  if (first.error) return { data:null, error:first.error };
  rows.push(...(first.data || []));
  if (!first.data || first.data.length < SUPABASE_READ_PAGE_SIZE) {
    return { data:rows, error:null };
  }

  // Once a result exceeds one page, fetch the following pages in small
  // parallel waves. This keeps large Dashboard reads fast without flooding
  // the API with one request per click.
  for (let from = SUPABASE_READ_PAGE_SIZE; ; from += SUPABASE_READ_PAGE_SIZE * SUPABASE_READ_CONCURRENCY) {
    const starts = Array.from(
      { length:SUPABASE_READ_CONCURRENCY },
      (_, index) => from + (index * SUPABASE_READ_PAGE_SIZE),
    );
    const pages = await Promise.all(starts.map(readPage));
    const failed = pages.find(page => page.error);
    if (failed) return { data:null, error:failed.error };
    for (const page of pages) {
      rows.push(...(page.data || []));
      if (!page.data || page.data.length < SUPABASE_READ_PAGE_SIZE) {
        return { data:rows, error:null };
      }
    }
  }
}

async function fetchSupabaseRowsByValues(table, columns, filterColumn, values) {
  const uniqueValues = [...new Set((values || []).filter(Boolean))];
  if (!uniqueValues.length) return { data: [], error: null };

  const rows = [];
  for (let start = 0; start < uniqueValues.length; start += SUPABASE_IN_BATCH_SIZE) {
    const batch = uniqueValues.slice(start, start + SUPABASE_IN_BATCH_SIZE);
    const result = await fetchPagedSupabaseRows(
      table,
      columns,
      query => query.in(filterColumn, batch),
    );
    if (result.error) return result;
    rows.push(...(result.data || []));
  }
  return { data: rows, error: null };
}

async function fetchSnapshotsForAssignmentScopes(assignments,columns='session_id,location_id,item_id,onhand_qty') {
  const locationsBySession = new Map();
  (assignments || []).forEach(row => {
    if (!row?.session_id || !row?.location_id) return;
    if (!locationsBySession.has(row.session_id)) locationsBySession.set(row.session_id,new Set());
    locationsBySession.get(row.session_id).add(row.location_id);
  });
  if (!locationsBySession.size) return { data:[],error:null };

  const rows = [];
  for (const [sessionId,locationSet] of locationsBySession) {
    const locationIds = [...locationSet];
    for (let start=0; start<locationIds.length; start+=SUPABASE_IN_BATCH_SIZE) {
      const locationBatch = locationIds.slice(start,start+SUPABASE_IN_BATCH_SIZE);
      const result = await fetchPagedSupabaseRows(
        'stock_snapshot',
        columns,
        query => query.eq('session_id',sessionId).in('location_id',locationBatch),
      );
      if (result.error) return result;
      rows.push(...(result.data || []));
    }
  }
  return { data:rows,error:null };
}

async function loadSvDash() {
  if (!['admin','supervisor'].includes(prof?.role)) {
    goPrimary('c-tasks');
    return;
  }
  const loadScope = _activePageRequestController;
  const isStaleLoad = () =>
    loadScope !== _activePageRequestController ||
    loadScope?.signal?.aborted ||
    S?.page !== 'sv-dash';

  const { data: sessions, error:sessionsError } = await sb.from('count_sessions')
    .select('id,name').eq('status','active').order('created_at',{ascending:false});
  if (isStaleLoad()) return;
  if (sessionsError) throw sessionsError;

  if (!sessions?.length) {
    cnt().innerHTML = `<div class="card" style="text-align:center;padding:60px 40px">
      <div style="font-size:60px">🌴</div>
      <div style="margin-top:20px;color:var(--text-main);font-weight:700; font-size:16px;">ยังไม่มี Session ที่เปิดอยู่</div>
      ${ ['admin','supervisor'].includes(prof?.role) ? `<button class="btn btn-blue" style="margin-top:24px" onclick="go('ad-manage')">📂 ไปสร้าง Session</button>` : ''}
    </div>`; return;
  }

  const requestedSessionId = String(S._dashSid || '');
  const curSid = sessions.some(session => session.id === requestedSessionId)
    ? requestedSessionId
    : sessions[0].id;
  S._dashSid = curSid;
  const curName = sessions.find(s=>s.id===curSid)?.name || sessions[0].name;
  const sessOpts = sessions.map(s=>`<option value="${s.id}" ${s.id===curSid?'selected':''}>${escapeWmsText(s.name)}</option>`).join('');

  const [
    { data: asgns, error:assignmentsError },
    { data: wmsRemarkRows, error:wmsRemarksError },
  ] = await Promise.all([
    sb.from('assignments')
      .select('id,status,assigned_to,location_id,locations(code,zone,row_no,level)')
      .eq('session_id', curSid)
      .order('status'),
    sb.from('remark_options').select('id,label').eq('context','wms').order('label'),
  ]);
  if (isStaleLoad()) return;
  if (assignmentsError) throw assignmentsError;
  if (wmsRemarksError) console.warn('โหลดตัวเลือกหมายเหตุ WMS ไม่สำเร็จ:', wmsRemarksError);
  window._wmsNoteOptions = wmsRemarkRows?.length
    ? wmsRemarkRows
    : WMS_NOTE_PRESETS.map(label => ({ id:null, label }));

  if (!asgns?.length) {
    cnt().innerHTML = `
      <div class="card dashboard-filter-strip">${dashboardFiltersHtml(sessOpts, (S._dashTab || _dashTab) !== 'summary')}</div>
      <div class="card">
        <div class="alert alert-blue">Session "${curName}" ยังไม่มีการ Assign งาน</div>
        ${ ['admin','supervisor'].includes(prof?.role) ? `<button class="btn btn-blue" style="margin-top:14px" onclick="go('ad-manage')">👥 ไปจ่ายงาน</button>` : ''}
      </div>`; return;
  }

  let total    = asgns.length;
  let done     = asgns.filter(a => ['completed','approved'].includes(a.status)).length;
  let varCount = asgns.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status)).length;
  let pending  = asgns.filter(a => ['pending','in_progress'].includes(a.status)).length;
  let pct      = Math.round(done / total * 100);

  const asgnInfoMap = {};
  asgns.forEach(a => { asgnInfoMap[a.id] = a; });

  const allAsgnIds = asgns.map(a => a.id);
  const [countResult, snapshotResult, rules] = await Promise.all([
    fetchSupabaseRowsByValues(
      'count_records',
      'assignment_id,item_id,round,count_qty,counted_at,actual_counter_name',
      'assignment_id',
      allAsgnIds,
    ),
    fetchPagedSupabaseRows(
      'stock_snapshot',
      'location_id,item_id,onhand_qty,items(code)',
      query => query.eq('session_id', curSid),
    ),
    getSessionRules(curSid),
  ]);
  if (isStaleLoad()) return;
  if (countResult.error || snapshotResult.error) {
    cnt().innerHTML = errBox((countResult.error || snapshotResult.error).message);
    return;
  }
  const rawCounts = countResult.data || [];
  const activeDateFilter = dashboardDateRange();
  const allCounts = filterRowsByDashboardDate(rawCounts, 'counted_at');
  const dateCountedAssignmentIds = new Set(allCounts.map(row => row.assignment_id).filter(Boolean));
  const dashboardDataAsgnIds = activeDateFilter ? [...dateCountedAssignmentIds] : allAsgnIds;
  if (activeDateFilter) {
    const periodAssignments = asgns.filter(assignment => dateCountedAssignmentIds.has(assignment.id));
    total = periodAssignments.length;
    done = periodAssignments.filter(a => ['completed','approved'].includes(a.status)).length;
    varCount = periodAssignments.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status)).length;
    pending = Math.max(0, total - done - varCount);
    pct = total ? Math.round((done / total) * 100) : 0;
  }
  const allSnapshots = snapshotResult.data || [];
  const emptyLocationItemIds = new Set(
    allSnapshots
      .filter(snapshot => isEmptyLocationItem(snapshot.items?.code))
      .map(snapshot => snapshot.item_id)
      .filter(Boolean)
  );

  const ohMap = {};
  (allSnapshots||[]).forEach(s => { ohMap[s.location_id + '|' + s.item_id] = +s.onhand_qty; });

  const countByAsgn = {};
  (allCounts||[]).forEach(c => {
    if (!countByAsgn[c.assignment_id]) countByAsgn[c.assignment_id] = {};
    if (!countByAsgn[c.assignment_id][c.item_id]) countByAsgn[c.assignment_id][c.item_id] = {};
    countByAsgn[c.assignment_id][c.item_id][c.round] = +c.count_qty;
  });
  const snapshotsByLocation = {};
  (allSnapshots || []).forEach(snapshot => {
    snapshotsByLocation[snapshot.location_id] = snapshotsByLocation[snapshot.location_id] || [];
    snapshotsByLocation[snapshot.location_id].push(snapshot);
  });
  asgns.forEach(assignment => {
    const storedStatus = assignment.status;
    const workflow = deriveAssignmentWorkflowStatus(
      snapshotsByLocation[assignment.location_id] || [],
      countByAsgn[assignment.id] || {},
      rules,
      storedStatus,
    );
    assignment._storedStatus = storedStatus;
    assignment._workflow = workflow;
    assignment.status = workflow.effectiveStatus;
  });
  const dashboardAssignments = activeDateFilter
    ? asgns.filter(assignment => dateCountedAssignmentIds.has(assignment.id))
    : asgns;
  total = dashboardAssignments.length;
  done = dashboardAssignments.filter(assignment => ['completed','approved'].includes(assignment.status)).length;
  varCount = dashboardAssignments.filter(assignment =>
    ['round1_done','round2_done','round3_done'].includes(assignment.status)
  ).length;
  pending = Math.max(0,total - done - varCount);
  pct = total ? Math.round((done / total) * 100) : 0;
  const actualCountersByAssignment = buildActualCounterMap(allCounts || []);

  const diffAssignments = [];
  for (const a of asgns) {
    const workflow = a._workflow || {};
    if (workflow.hasDiff || workflow.hasPending) {
      diffAssignments.push({
        ...a,
        _hasDiff:Boolean(workflow.hasDiff),
        _hasPending:Boolean(workflow.hasPending),
      });
    }
  }

  let wmsRows = [];
  let vaError = null;

  try {
    const { data: vaData, error: vaErr } = await fetchSupabaseRowsByValues(
      'variance_approvals',
      'id,assignment_id,item_id,final_qty,variance,resolution,approved_by,approved_at,wms_fixed,wms_fixed_at,wms_fixed_by',
      'assignment_id',
      dashboardDataAsgnIds,
    );

    if (vaErr) {
      vaError = vaErr;
      wmsRows = [];
    } else {
      wmsRows = (vaData || [])
        .filter(v => Number(v.variance) !== 0)
        .map(v => ({
          ...v,
          wms_fixed: v.wms_fixed ?? false,
          wms_fixed_at: v.wms_fixed_at ?? null,
          wms_fixed_by: v.wms_fixed_by ?? null,
          created_at: v.created_at ?? null,
          _fromVA: true
        }));
    }
  } catch (e) {
    vaError = e;
  }
  if (isStaleLoad()) return;

  const allItemIds = [...new Set(wmsRows.map(v => v.item_id).filter(Boolean))];
  const allApproverIds = [...new Set(wmsRows.map(v => v.approved_by).filter(Boolean))];
  const [{ data: itemsData }, { data: approversData }, { data: wmsNoteRows, error: wmsNoteError }] = await Promise.all([
    fetchSupabaseRowsByValues('items', 'id,code,description', 'id', allItemIds),
    fetchSupabaseRowsByValues('profiles', 'id,name', 'id', allApproverIds),
    sb.from('audit_log')
      .select('id,assignment_id,item_id,new_value,created_at')
      .eq('session_id', curSid)
      .eq('action', 'wms_note')
      .order('created_at', { ascending: true }),
  ]);
  if (isStaleLoad()) return;
  const itemMap = Object.fromEntries((itemsData||[]).map(i => [i.id, i]));
  const approverMap = Object.fromEntries((approversData||[]).map(p => [p.id, p]));
  const wmsNoteMap = {};
  if (wmsNoteError) console.warn('โหลดหมายเหตุ WMS ไม่สำเร็จ:', wmsNoteError.message);
  (wmsNoteRows||[]).forEach(n => {
    const key = `${n.assignment_id}|${n.item_id}`;
    if (!wmsNoteMap[key]) wmsNoteMap[key] = [];
    wmsNoteMap[key].push({ id:n.id, text:n.new_value || '', created_at:n.created_at });
  });
  wmsRows.forEach(v => {
    v.items = itemMap[v.item_id] || { code: '?', description: '' };
    v.profiles = approverMap[v.approved_by] || { name: '?' };
    v.wms_notes = wmsNoteMap[`${v.assignment_id}|${v.item_id}`] || [];
  });

  // An approved item must never be recreated as "รอคอนเฟิร์ม".
  // Use the assignment + item key because one assignment can contain several items.
  const approvedItemKeys = new Set(
    wmsRows.map(v => `${v.assignment_id || ''}|${v.item_id || ''}`)
  );
  const pendingWmsRows = [];
  for (const a of diffAssignments) {
    const itemCounts = countByAsgn[a.id] || {};
    const locId = a.location_id;
    for (const [itemId, rounds] of Object.entries(itemCounts)) {
      if (approvedItemKeys.has(`${a.id}|${itemId}`)) continue;
      const oh = ohMap[locId + '|' + itemId];
      if (oh === undefined) continue;
      const st = computeItemStatus(oh, rounds[1], rounds[2], rounds[3], rules);
      if (st !== 'Diff' && st !== 'PENDING') continue;
      const latestRound = rounds[3] !== undefined ? 3 : rounds[2] !== undefined ? 2 : 1;
      const countQty = rounds[latestRound];
      const variance = countQty - oh;
      if (Number(variance) === 0) continue;
      pendingWmsRows.push({
        _isPending: true,
        assignment_id: a.id,
        item_id: itemId,
        final_qty: countQty,
        variance: variance,
        resolution: st === 'Diff' ? 'pending_diff' : 'pending_recount',
        approved_by: null,
        wms_fixed: false,
        wms_fixed_at: null,
        wms_fixed_by: null,
        created_at: null,
        items: { code: '?', description: '' },
        profiles: { name: '(ยังไม่คอนเฟิร์ม)' },
        wms_notes: wmsNoteMap[`${a.id}|${itemId}`] || [],
      });
    }
  }

  const pendingItemIds = [...new Set(pendingWmsRows.map(v => v.item_id).filter(Boolean))];
  if (pendingItemIds.length) {
    const { data: pendingItems } = await fetchSupabaseRowsByValues(
      'items',
      'id,code,description',
      'id',
      pendingItemIds,
    );
    const pItemMap = Object.fromEntries((pendingItems||[]).map(i => [i.id, i]));
    pendingWmsRows.forEach(v => { v.items = pItemMap[v.item_id] || { code: '?', description: '' }; });
  }
  if (isStaleLoad()) return;

  const allWmsRows = [...wmsRows, ...pendingWmsRows];
  allWmsRows.forEach(v => {
    const assignment = asgnInfoMap[v.assignment_id];
    const rounds = countByAsgn[v.assignment_id]?.[v.item_id] || {};
    const ohKey = `${assignment?.location_id || ''}|${v.item_id || ''}`;
    v._oh = ohMap[ohKey];
    v._count1 = rounds[1];
    v._count2 = rounds[2];
    v._count3 = rounds[3];
  });
  window._wmsRows = allWmsRows;
  window._wmsAsgnInfoMap = asgnInfoMap;
  window._actualCountersByAssignment = actualCountersByAssignment;

  let diffPlus = 0, diffMinus = 0;
  const gainItemKeys = new Set();
  const lostItemKeys = new Set();
  allWmsRows.forEach(v => {
    const d = +v.variance;
    const itemKey = `${v.assignment_id || ''}|${v.item_id || ''}`;
    if (d > 0) {
      diffPlus += d;
      if (!emptyLocationItemIds.has(v.item_id)) gainItemKeys.add(itemKey);
    } else if (d < 0) {
      diffMinus += Math.abs(d);
      if (!emptyLocationItemIds.has(v.item_id)) lostItemKeys.add(itemKey);
    }
  });
  const gainItemCount = gainItemKeys.size;
  const lostItemCount = lostItemKeys.size;
  const okItemKeys = new Set();
  let okQty = 0;
  Object.entries(countByAsgn).forEach(([assignmentId, itemRows]) => {
    const assignment = asgnInfoMap[assignmentId];
    if (!assignment) return;
    Object.entries(itemRows || {}).forEach(([itemId, rounds]) => {
      if (emptyLocationItemIds.has(itemId)) return;
      const oh = ohMap[`${assignment.location_id}|${itemId}`];
      if (oh === undefined) return;
      if (computeItemStatus(oh, rounds[1], rounds[2], rounds[3], rules) !== 'OK') return;
      const key = `${assignmentId}|${itemId}`;
      if (okItemKeys.has(key)) return;
      okItemKeys.add(key);
      const finalCount = rounds[3] ?? rounds[2] ?? rounds[1] ?? oh;
      okQty += Number(finalCount) || 0;
    });
  });
  const okItemCount = okItemKeys.size;

  let totalOHQty = 0;
  Object.values(ohMap).forEach(qty => totalOHQty += qty);

  let uniqueSKUs = new Set();
  let uniqueLocations = new Set();
  (allSnapshots||[]).forEach(s => {
    if (!emptyLocationItemIds.has(s.item_id)) uniqueSKUs.add(s.item_id);
    uniqueLocations.add(s.location_id);
  });
  let totalSKUs = uniqueSKUs.size;
  let totalLocations = uniqueLocations.size;

  let absVariance = diffPlus + diffMinus; 
  let stockAccuracy = totalOHQty > 0 ? Math.max(0, 100 - (absVariance / totalOHQty * 100)).toFixed(2) : 100;
  let stockAccuracyNum = Number(stockAccuracy) || 0;
  const diffPct = totalOHQty > 0 ? ((absVariance / totalOHQty) * 100).toFixed(2) : '0.00';
  const diffPctNum = Number(diffPct) || 0;

  const varianceRowsOnly = allWmsRows.filter(v => Number(v.variance) !== 0);
  const diffLocationSet = new Set();
  const diffItemSet = new Set();
  varianceRowsOnly.forEach(v => {
    const locKey = asgnInfoMap[v.assignment_id]?.location_id || asgnInfoMap[v.assignment_id]?.locations?.code || v.assignment_id;
    if (locKey) diffLocationSet.add(locKey);
    if (v.item_id && !emptyLocationItemIds.has(v.item_id)) diffItemSet.add(v.item_id);
  });
  const diffLocationPct = totalLocations > 0 ? ((diffLocationSet.size / totalLocations) * 100).toFixed(2) : '0.00';
  const diffItemPct = totalSKUs > 0 ? ((diffItemSet.size / totalSKUs) * 100).toFixed(2) : '0.00';

  const countedAssignmentIds = new Set((allCounts || []).map(c => c.assignment_id).filter(Boolean));
  const countedAssignments = asgns.filter(a => countedAssignmentIds.has(a.id));
  const countedLocationSet = new Set();
  const countedCounterSet = new Set();
  countedAssignments.forEach(a => {
    if (a.location_id) countedLocationSet.add(a.location_id);
    else if (a.locations?.code) countedLocationSet.add(a.locations.code);
  });
  (allCounts || []).forEach(c => {
    splitActualCounterNames(c.actual_counter_name).forEach(name => countedCounterSet.add(name));
  });
  const countedItemSet = new Set();
  const countedOhKeys = new Set();
  (allCounts || []).forEach(c => {
    const asgn = asgnInfoMap[c.assignment_id];
    if (!asgn) return;
    if (c.item_id && !emptyLocationItemIds.has(c.item_id)) countedItemSet.add(c.item_id);
    const locKey = asgn.location_id || asgn.locations?.code;
    if (locKey && c.item_id) countedOhKeys.add(locKey + '|' + c.item_id);
  });
  totalLocations = countedLocationSet.size;
  totalSKUs = countedItemSet.size;
  totalOHQty = 0;
  countedOhKeys.forEach(key => {
    if (ohMap[key] !== undefined) totalOHQty += Number(ohMap[key]) || 0;
  });
  if (activeDateFilter) {
    stockAccuracy = totalOHQty > 0
      ? Math.max(0, 100 - ((absVariance / totalOHQty) * 100)).toFixed(2)
      : '0.00';
    stockAccuracyNum = Number(stockAccuracy) || 0;
  }
  const totalCounters = countedCounterSet.size;

  // Dashboard summary: Zone progress by unique locations.
  const zoneMap = {};
  asgns.forEach(a => {
    const zone = a.locations?.zone || 'ไม่ระบุ Zone';
    const locKey = a.location_id || a.locations?.code || a.id;
    if (!zoneMap[zone]) zoneMap[zone] = { all: new Set(), done: new Set() };
    zoneMap[zone].all.add(locKey);
    const countedInSelectedRange = activeDateFilter
      ? dateCountedAssignmentIds.has(a.id)
      : ['completed','approved'].includes(a.status);
    if (countedInSelectedRange) zoneMap[zone].done.add(locKey);
  });

  const zoneAccuracyMap = {};
  (allCounts || []).forEach(c => {
    const asgn = asgnInfoMap[c.assignment_id];
    if (!asgn) return;
    const zone = asgn.locations?.zone || 'ไม่ระบุ Zone';
    if (!zoneAccuracyMap[zone]) zoneAccuracyMap[zone] = { countedItems: new Set(), diffItems: new Set() };
    if (c.item_id && !emptyLocationItemIds.has(c.item_id)) {
      zoneAccuracyMap[zone].countedItems.add(`${c.assignment_id}|${c.item_id}`);
    }
  });
  (allWmsRows || []).forEach(v => {
    const asgn = asgnInfoMap[v.assignment_id];
    if (!asgn) return;
    const zone = asgn.locations?.zone || 'ไม่ระบุ Zone';
    if (!zoneAccuracyMap[zone]) zoneAccuracyMap[zone] = { countedItems: new Set(), diffItems: new Set() };
    if (v.item_id && !emptyLocationItemIds.has(v.item_id)) {
      const itemKey = `${v.assignment_id}|${v.item_id}`;
      zoneAccuracyMap[zone].countedItems.add(itemKey);
      zoneAccuracyMap[zone].diffItems.add(itemKey);
    }
  });

  const zoneStats = Object.entries(zoneMap).map(([zone, z]) => {
    const acc = zoneAccuracyMap[zone] || { countedItems: new Set(), diffItems: new Set() };
    const countedItems = acc.countedItems.size;
    const diffItems = acc.diffItems.size;
    const accuracyPct = countedItems ? Math.max(0, Math.round(((countedItems - diffItems) / countedItems) * 100)) : 0;
    return {
      zone,
      total: z.all.size,
      done: z.done.size,
      pct: z.all.size ? Math.round((z.done.size / z.all.size) * 100) : 0,
      countedItems,
      diffItems,
      accuracyPct,
    };

  // Hourly chart: count each assignment once, using its latest count time on the latest counting date.
  const validCountRows = (allCounts || []).filter(c => c.counted_at && !Number.isNaN(new Date(c.counted_at).getTime()));
  const localDateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let latestCountDateKey = '';
  let latestCountDate = null;
  validCountRows.forEach(c => {

  const firstCountByLocation = {};

  const hourlyRaw = Array(24).fill(0);

  const nonZeroHours = hourlyRaw.map((n,h) => n ? h : -1).filter(h => h >= 0);
  let chartStartHour = 8, chartEndHour = 19;
  if (nonZeroHours.length) {
    chartStartHour = Math.max(0, Math.min(...nonZeroHours) - 1);
    chartEndHour = Math.min(23, Math.max(...nonZeroHours) + 1);
    while (chartEndHour - chartStartHour < 7) {
      if (chartEndHour < 23) chartEndHour++;
      else if (chartStartHour > 0) chartStartHour--;
      else break;

  const chartHours = Array.from({length: chartEndHour - chartStartHour + 1}, (_,i) => chartStartHour + i);
  const dayCountTotal = Object.keys(firstCountByLocation).length;
  const regularCount = hourlyRaw.slice(0, 17).reduce((a,b) => a + b, 0);

  const stepX = chartHours.length > 1 ? plotW / (chartHours.length - 1) : plotW;
  const maxHourly = Math.max(...chartHours.map(h => hourlyRaw[h] || 0), 1);
  const points = chartHours.map((h, i) => {
    const v = hourlyRaw[h] || 0;
    const x = m.left + (i * stepX);
    const y = m.top + plotH - ((v / maxHourly) * (plotH - 8));
    return { h, v, x, y };
  });
  // Catmull-Rom → cubic Bézier: gentle curve that still passes through every real data point.
  const smoothHourlyPath = chartPoints => {
    if (!chartPoints.length) return '';
    if (chartPoints.length === 1) return `M ${chartPoints[0].x} ${chartPoints[0].y}`;
    const curveStrength = .16;
    const clampY = value => Math.max(m.top, Math.min(m.top + plotH, value));
    let path = `M ${chartPoints[0].x} ${chartPoints[0].y}`;
    for (let i = 0; i < chartPoints.length - 1; i++) {
      const p0 = chartPoints[i - 1] || chartPoints[i];
      const p1 = chartPoints[i];
      const p2 = chartPoints[i + 1];
      const p3 = chartPoints[i + 2] || p2;
      const c1x = p1.x + ((p2.x - p0.x) * curveStrength);
      const c1y = clampY(p1.y + ((p2.y - p0.y) * curveStrength));
      const c2x = p2.x - ((p3.x - p1.x) * curveStrength);
      const c2y = clampY(p2.y - ((p3.y - p1.y) * curveStrength));
      path += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;

function updateWmsOverview() {
  const rows = (window._wmsRows || []).filter(v => Number(v.variance) !== 0);
  const pendingCount = rows.filter(v => v._isPending).length;
  const confirmedRows = rows.filter(v => !v._isPending);
  const fixedCount = confirmedRows.filter(v => v.wms_fixed).length;
  const unfixedCount = confirmedRows.length - fixedCount;
  const percent = confirmedRows.length ? Math.round((fixedCount / confirmedRows.length) * 100) : 0;
  const values = {
    'wms-total-count': rows.length,
    'wms-pending-count': pendingCount,
    'wms-unfixed-count': unfixedCount,
    'wms-fixed-count': fixedCount,
    'wms-fixed-percent': `${percent}%`,
  };
  Object.entries(values).forEach(([id, value]) => {
    const element = Q(id);
    if (element) element.textContent = value;
  });
  const progress = Q('wms-fixed-progress');
  if (progress) progress.style.width = `${percent}%`;
}

async function toggleWmsFixed(vaId, checked, button) {
  const target = (window._wmsRows || []).find(row => row.id === vaId);
  const previous = target ? {
    wms_fixed: !!target.wms_fixed,
    wms_fixed_at: target.wms_fixed_at,
    wms_fixed_by: target.wms_fixed_by,
  } : null;
  try {
    if (!vaId || vaId === 'undefined') {
      showWmsFeedback('ไม่พบ ID รายการ กรุณารีเฟรชแล้วลองใหม่', 'error');
      return;
    }
    if (button) {
      button.disabled = true;
      button.classList.add('is-saving');
      button.querySelector('span')?.replaceChildren(document.createTextNode('กำลังบันทึก...'));
    }
    showWmsFeedback('กำลังบันทึกสถานะการตรวจสอบ...');
    const updates = { wms_fixed: checked };
    if (checked) { updates.wms_fixed_at = new Date().toISOString(); updates.wms_fixed_by = me.id; } 
    else { updates.wms_fixed_at = null; updates.wms_fixed_by = null; }
    const { data, error } = await sb.from('variance_approvals').update(updates).eq('id', vaId).select('id,wms_fixed');
    if (error) throw error;
    if (!data || data.length === 0) throw new Error('ไม่พบรายการที่ต้องการอัปเดต');
    if (target) Object.assign(target, updates);
    updateWmsOverview();
    renderWmsList();
    showWmsFeedback(checked
      ? 'บันทึกแล้ว: ตรวจสอบรายการเรียบร้อย — เปิดกล่อง “ตรวจสอบแล้ว” เพื่อแก้ไขอีกครั้งได้'
      : 'เปิดแก้ไขอีกครั้งแล้ว: รายการย้ายกลับไปที่ “ยังไม่ได้ตรวจสอบ”');
    invalidateDashboardCache();
    refreshDashboardData();
  } catch (e) {
    if (target && previous) Object.assign(target, previous);
    updateWmsOverview();
    renderWmsList();
    console.error(e);
    showWmsFeedback('บันทึกสถานะไม่สำเร็จ: ' + (e.message || e), 'error');
  }
}

function openWmsReturnConfirm(locationCode) {
  return new Promise(resolve => {
    document.querySelector('.wms-return-confirm-backdrop')?.remove();
    const previousOverflow = document.body.style.overflow;
    const backdrop = document.createElement('div');
    backdrop.className = 'wms-return-confirm-backdrop';
    backdrop.setAttribute('role', 'dialog');
    backdrop.setAttribute('aria-modal', 'true');
    backdrop.setAttribute('aria-labelledby', 'wms-return-confirm-title');
    backdrop.innerHTML = `
      <div class="wms-return-confirm-modal">
        <div class="wms-return-confirm-icon">${wmsIconSvg('review',34)}</div>
        <h2 id="wms-return-confirm-title">ส่งกลับให้หัวหน้าตรวจใหม่?</h2>
        <p>รายการนี้จะออกจากขั้นตอนปรับยอด WMS<br>และกลับไปหน้า Variance เพื่อคอนเฟิร์มยอดอีกครั้ง</p>
        <div class="wms-return-confirm-location">${escapeWmsText(locationCode || 'รายการที่เลือก')}</div>
        <div class="wms-return-confirm-actions">
          <button type="button" class="btn btn-ghost" data-action="cancel">ยกเลิก</button>
          <button type="button" class="btn btn-amber" data-action="confirm">ส่งตรวจใหม่</button>
        </div>
      </div>`;

    let settled = false;
    const finish = result => {
      if (settled) return;
      settled = true;
      document.removeEventListener('keydown', onKeyDown);
      backdrop.remove();
      document.body.style.overflow = previousOverflow;
      resolve(result);
    };
    const onKeyDown = event => {
      if (event.key === 'Escape') finish(false);
    };

    backdrop.querySelector('[data-action="cancel"]')?.addEventListener('click', () => finish(false));
    backdrop.querySelector('[data-action="confirm"]')?.addEventListener('click', () => finish(true));
    backdrop.addEventListener('click', event => {
      if (event.target === backdrop) finish(false);
    });
    document.addEventListener('keydown', onKeyDown);
    document.body.appendChild(backdrop);
    document.body.style.overflow = 'hidden';
    setTimeout(() => backdrop.querySelector('[data-action="confirm"]')?.focus(), 30);
  });
}

async function returnWmsForReview(vaId, assignmentId, itemId, button) {
  const target = (window._wmsRows || []).find(row => row.id === vaId);
  const assignment = window._wmsAsgnInfoMap?.[assignmentId];
  const locationCode = assignment?.locations?.code || 'รายการนี้';
  const previousStatus = assignment?.status || 'approved';

  if (!vaId || !assignmentId) {
    showWmsFeedback('ไม่พบข้อมูลรายการสำหรับส่งตรวจใหม่ กรุณารีเฟรชแล้วลองอีกครั้ง', 'error');
    return;
  }
  if (button?.dataset.wmsReturnConfirmOpen === '1') return;
  if (button) button.dataset.wmsReturnConfirmOpen = '1';
  const confirmed = await openWmsReturnConfirm(locationCode);
  if (button) delete button.dataset.wmsReturnConfirmOpen;
  if (!confirmed) {
    return;
  }

  try {
    if (button) {
      button.disabled = true;
      button.classList.add('is-saving');
      button.querySelector('span')?.replaceChildren(document.createTextNode('กำลังส่ง...'));
    }
    showWmsFeedback('กำลังส่งรายการกลับให้หัวหน้าตรวจสอบใหม่...');

    const { data: assignmentRows, error: assignmentError } = await sb.from('assignments')
      .update({ status:'round3_done' })
      .eq('id', assignmentId)
      .select('id,status');
    if (assignmentError) throw assignmentError;
    if (!assignmentRows?.length) throw new Error('อัปเดตสถานะงานไม่สำเร็จ');

    const { data: deletedRows, error: deleteError } = await sb.from('variance_approvals')
      .delete()
      .eq('id', vaId)
      .select('id');
    if (deleteError || !deletedRows?.length) {
      await sb.from('assignments').update({ status:previousStatus }).eq('id', assignmentId);
      throw deleteError || new Error('นำรายการออกจากขั้นตอน WMS ไม่สำเร็จ');
    }

    if (assignment) assignment.status = 'round3_done';
    window._wmsRows = (window._wmsRows || []).filter(row => row.id !== vaId);
    logAudit(
      S._dashSid || assignment?.session_id,
      assignment?.location_id,
      itemId,
      'wms_return_review',
      'WMS Adjust',
      'Variance Review',
      assignmentId,
    );
    updateWmsOverview();
    renderWmsList();
    showWmsFeedback(`ส่ง ${locationCode} กลับให้หัวหน้าตรวจสอบใหม่แล้ว`);
    invalidateDashboardCache();
    refreshDashboardData();
  } catch (error) {
    console.error(error);
    renderWmsList();
    showWmsFeedback('ส่งตรวจใหม่ไม่สำเร็จ: ' + (error.message || error), 'error');
  }
}

function toggleWmsNoteMenu(event, key) {

  const willOpen = menu.hidden;

function updateWmsNoteSelectionPreview(key) {
  const menu = Q(`wms_note_menu_${key}`);
  const preview = Q(`wms_note_selection_${key}`);
  const inline = Q(`wms_note_inline_${key}`);
  if (!menu || !preview) return;
  const selected = [...menu.querySelectorAll('.wms-note-option input[type="checkbox"]:checked')]
    .map(box => box.value.trim())
    .filter(Boolean);
  preview.textContent = selected.length
    ? `เลือกแล้ว: ${selected.join(' · ')}`
    : 'ยังไม่ได้เลือกหมายเหตุ';
  preview.classList.toggle('has-selection', selected.length > 0);
  if (inline) {
    inline.hidden = selected.length === 0;
    inline.classList.add('is-draft');
    const label = inline.querySelector('span');
    const value = inline.querySelector('strong');
    if (label) label.textContent = 'หมายเหตุที่กำลังเลือก (ยังไม่บันทึก)';
    if (value) value.textContent = selected.join(' · ');
  }
}

async function addCustomWmsNoteOption(event, key) {
  event?.preventDefault();
  event?.stopPropagation();
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const input = Q(`wms_note_custom_${key}`);
  const list = Q(`wms_note_options_${key}`);
  const text = (input?.value || '').trim();
  if (!text || !list) return;
  const exists = [...list.querySelectorAll('input[type="checkbox"]')]
    .some(box => box.value.toLocaleLowerCase('th-TH') === text.toLocaleLowerCase('th-TH'));
  try {
    if (exists) {
      const existing = [...list.querySelectorAll('input[type="checkbox"]')]
        .find(box => box.value.toLocaleLowerCase('th-TH') === text.toLocaleLowerCase('th-TH'));
      if (existing) existing.checked = true;
    } else {
      const result = await invokeAdminMaster('remark_create', { context:'wms', label:text });
      window._wmsNoteOptions = window._wmsNoteOptions || [];
      window._wmsNoteOptions.push(result.row);
      const label = document.createElement('label');
      label.className = 'wms-note-option';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = result.row.label;
      checkbox.checked = true;
      checkbox.addEventListener('change', () => updateWmsNoteSelectionPreview(key));
      const span = document.createElement('span');
      span.textContent = result.row.label;
      label.append(checkbox, span);
      list.appendChild(label);
    }
    input.value = '';
    updateWmsNoteSelectionPreview(key);
    input.focus();
  } catch (error) {
    alert('เพิ่มหมายเหตุไม่สำเร็จ: ' + error.message);
  }
}

  if (!menu) return;
  const notes = [...new Set(
    [...menu.querySelectorAll('.wms-note-option input[type="checkbox"]')]
      .filter(box => box.checked)
      .map(box => box.value.trim())
      .filter(Boolean)
  )];
  if (!notes.length) {
    alert('กรุณาเลือกหรือเพิ่มหมายเหตุอย่างน้อย 1 ข้อ');
    return;
  }

  const assignment = window._wmsAsgnInfoMap?.[assignmentId];
  const target = (window._wmsRows || [])
    .find(v => v.assignment_id === assignmentId && v.item_id === itemId);
  const existingNoteTexts = new Set(
    (target?.wms_notes || []).map(note => String(note.text || note.new_value || '').trim()).filter(Boolean)
  );
  const newNotes = notes.filter(note => !existingNoteTexts.has(note));
  if (!newNotes.length) {
    showWmsFeedback('หมายเหตุที่เลือกแสดงอยู่ในรายการแล้ว');
    renderWmsList();
    return;
  }
  const rows = newNotes.map(note => ({
    session_id: S._dashSid || assignment?.session_id || null,
    location_id: assignment?.location_id || null,
    item_id: itemId || null,
    assignment_id: assignmentId || null,
    action: 'wms_note',
    old_value: null,
    new_value: note,
    performed_by: me?.id || null,
  }));

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = 'กำลังบันทึก...';
    }
    const { error } = await sb.from('audit_log').insert(rows);
    if (error) throw error;

    if (target) {
      target.wms_notes = [
        ...(target.wms_notes || []),
        ...rows.map((n, index) => ({
          id: n.id || `new_${Date.now()}_${index}`,
          text: n.new_value,
          created_at: n.created_at || new Date().toISOString(),
        })),
      ];
    }
    renderWmsList();
    showWmsFeedback(`บันทึกหมายเหตุแล้ว ${newNotes.length} รายการ`);
  } catch (error) {
    console.error(error);
    showWmsFeedback('บันทึกหมายเหตุไม่สำเร็จ: ' + (error.message || error), 'error');
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = `${wmsIconSvg('reviewed', 17)} บันทึกหมายเหตุ`;
    }
  }
}

function refreshWmsDependentFilters() {
  const rows = (window._wmsRows || []).filter(v => Number(v.variance) !== 0);
  const asgnInfoMap = window._wmsAsgnInfoMap || {};
  const zone = fillDependentSelect(
    'wms-zone',
    rows.map(row => asgnInfoMap[row.assignment_id]?.locations?.zone),
    'ทั้งหมด',
    S._wmsZone,
  );
  S._wmsZone = zone;
  const rowValues = rows
    .map(row => asgnInfoMap[row.assignment_id]?.locations)
    .filter(location => location && (!zone || location.zone === zone))
    .map(location => location.row_no);
  const selectedRow = fillDependentSelect('wms-row', rowValues, 'ทั้งหมด', S._wmsRow);
  S._wmsRow = selectedRow;
  const levels = rows
    .map(row => asgnInfoMap[row.assignment_id]?.locations)
    .filter(location => location
      && (!zone || location.zone === zone)
      && (!selectedRow || String(location.row_no ?? '') === String(selectedRow)))
    .map(location => location.level);
  const selectedLevel = fillDependentSelect('wms-level', levels, 'ทั้งหมด', S._wmsLevel);
  S._wmsLevel = selectedLevel;

  const locationScopedRows = rows.filter(item => {
    const location = asgnInfoMap[item.assignment_id]?.locations;
    if (zone && location?.zone !== zone) return false;
    if (selectedRow && String(location?.row_no ?? '') !== String(selectedRow)) return false;
    if (selectedLevel && String(location?.level ?? '') !== String(selectedLevel)) return false;
    return true;
  });
  const userOptions = [];
  const seenUsers = new Set();
  locationScopedRows.forEach(item => {
    const value = item._isPending ? '_pending' : item.approved_by;
    if (!value || seenUsers.has(value)) return;
    seenUsers.add(value);
    userOptions.push({
      value,
      label:item._isPending ? 'รอคอนเฟิร์ม' : (item.profiles?.name || 'ไม่ระบุ User'),
    });
  });
  const selectedUser = fillDependentOptionSelect(
    'wms-user',
    userOptions,
    'ทั้งหมด',
    S._wmsUser,
  );
  S._wmsUser = selectedUser;

  const userScopedRows = locationScopedRows.filter(item => {
    if (selectedUser === '_pending') return item._isPending;
    if (selectedUser) return item.approved_by === selectedUser;
    return true;
  });
  const availableStatuses = new Set(userScopedRows.map(item =>
    item._isPending ? 'pending' : (item.wms_fixed ? 'fixed' : 'unfixed')
  ));
  const statusSelect = Q('wms-status');
  if (statusSelect) {
    [...statusSelect.options].forEach(option => {
      option.disabled = option.value !== 'all' && !availableStatuses.has(option.value);
    });
    const preferredStatus = S._wmsFilter || 'unfixed';
    S._wmsFilter = preferredStatus === 'all' || availableStatuses.has(preferredStatus)
      ? preferredStatus
      : 'all';
    statusSelect.value = S._wmsFilter;
    document.querySelectorAll('[data-wms-kpi]').forEach(card => {
      card.classList.toggle('active', card.dataset.wmsKpi === S._wmsFilter);
    });
  }
}

function updateWmsFilter(key, value) {
  S['_wms'+key] = value;
  if (key === 'Zone') {
    S._wmsRow = '';
    S._wmsLevel = '';
    S._wmsUser = '';
    S._wmsFilter = 'all';
  } else if (key === 'Row') {
    S._wmsLevel = '';
    S._wmsUser = '';
    S._wmsFilter = 'all';
  } else if (key === 'Level') {
    S._wmsUser = '';
    S._wmsFilter = 'all';
  } else if (key === 'User') {
    S._wmsFilter = 'all';
  }
  if (key !== 'Filter' && key !== 'LocSearch') refreshWmsDependentFilters();
  if (key === 'Filter') {
    document.querySelectorAll('[data-wms-kpi]').forEach(card => {
      card.classList.toggle('active', card.dataset.wmsKpi === value);
    });
  }
  renderWmsList();
}

function renderWmsList() {
  const container = Q('wms-list');
  if (!container) return;
  const wmsRows = (window._wmsRows || []).filter(v => Number(v.variance) !== 0);
  const asgnInfoMap = window._wmsAsgnInfoMap || {};
  const filterStatus = S._wmsFilter || 'unfixed';
  const filterZone = S._wmsZone || '';
  const filterRow = S._wmsRow || '';
  const filterLevel = S._wmsLevel || '';
  const filterUser = S._wmsUser || '';
  const searchLoc = (S._wmsLocSearch || '').trim().toLowerCase();

  const filtered = sortRowsByLocation(wmsRows.filter(v => {
    if (filterStatus === 'unfixed' && v.wms_fixed) return false;
    if (filterStatus === 'fixed' && !v.wms_fixed) return false;
    if (filterStatus === 'pending' && !v._isPending) return false;
    if (filterStatus !== 'all' && filterStatus !== 'pending' && v._isPending) return false;
    const loc = asgnInfoMap[v.assignment_id]?.locations;
    if (filterZone && loc?.zone !== filterZone) return false;
    if (filterRow && String(loc?.row_no ?? '') !== String(filterRow)) return false;
    if (filterLevel && String(loc?.level ?? '') !== String(filterLevel)) return false;
    if (filterUser === '_pending' && !v._isPending) return false;
    if (filterUser && filterUser !== '_pending' && v.approved_by !== filterUser) return false;
    if (searchLoc) {
      const haystack = [loc?.code, v.items?.code, v.items?.description]
        .filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(searchLoc)) return false;
    }
    return true;
  }), row => asgnInfoMap[row.assignment_id]?.locations?.code);

  const visibleCount = Q('wms-visible-count');
  if (visibleCount) visibleCount.textContent = `${filtered.length.toLocaleString('th-TH')} รายการ`;
  if (!filtered.length) {
    const msg = filterStatus==='unfixed' ? '🎉 ไม่มีรายการที่ยังไม่ได้ตรวจสอบ' 
      : filterStatus==='fixed' ? 'ยังไม่มีรายการที่ตรวจสอบแล้ว' 
      : filterStatus==='pending' ? '⏳ ไม่มีรายการที่รอคอนเฟิร์ม'
      : 'ไม่พบรายการตามตัวกรองที่เลือก';
    container.innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--text-muted);font-size:14px; font-weight:600;">${msg}</div>`;
    return;
  }

  container.innerHTML = filtered.map(v => {
    const loc = asgnInfoMap[v.assignment_id]?.locations;
    const isFixed = !!v.wms_fixed;
    const isPending = !!v._isPending;
    const varAmt = +v.variance;
    const noteKey = wmsDomKey(v.assignment_id, v.item_id);
    const notes = Array.isArray(v.wms_notes) ? v.wms_notes : [];
    const actualCounterText = escapeWmsText(
      (window._actualCountersByAssignment?.[v.assignment_id] || []).join(', ') || 'ไม่ระบุคนนับ'
    );
    const assignmentArg = JSON.stringify(v.assignment_id || '');
    const itemArg = JSON.stringify(v.item_id || '');
    const statusBadge = isPending ? `<span class="tag tag-amber" style="font-size:10px">⏳ รอคอนเฟิร์ม</span>` : `<span class="tag tag-blue" style="font-size:10px">✅ คอนเฟิร์มแล้ว</span>`;
    const returnReviewButton = isPending ? '' : `
      <button class="btn btn-sm btn-amber wms-action-btn wms-return-review-btn"
        onclick='returnWmsForReview(${JSON.stringify(v.id || '')},${assignmentArg},${itemArg},this)'
        title="ส่ง Location นี้กลับไปหน้า Variance ให้หัวหน้าตรวจสอบและคอนเฟิร์มใหม่">
        ${wmsIconSvg('review')}<span>ส่งตรวจใหม่</span>
      </button>`;
    const wmsButton = isPending
      ? `<button class="btn btn-sm btn-amber wms-action-btn" onclick='go("sv-detail",{aid:${assignmentArg}})'>${wmsIconSvg('search')}<span>ไปคอนเฟิร์ม</span></button>`
      : `<button class="btn btn-sm ${isFixed?'btn-blue':'btn-ghost'} wms-action-btn"
          onclick='toggleWmsFixed(${JSON.stringify(v.id || '')},${!isFixed},this)'
          title="${isFixed?'เปลี่ยนกลับเป็นยังไม่ได้ตรวจสอบเพื่อแก้ไขใหม่':'ยืนยันว่าตรวจสอบรายการแล้ว'}">
          ${wmsIconSvg(isFixed?'reviewed':'pending')}<span>${isFixed?'แก้ไขอีกครั้ง':'ยืนยันตรวจสอบแล้ว'}</span>
        </button>`;
    const savedNoteTexts = new Set(notes.map(note => String(note.text || note.new_value || '').trim()));
    const noteOptions = (window._wmsNoteOptions || WMS_NOTE_PRESETS.map(label => ({ label }))).map(option => `
      <label class="wms-note-option">
        <input type="checkbox" value="${escapeWmsText(option.label)}"
          ${savedNoteTexts.has(String(option.label || '').trim()) ? 'checked' : ''}
          onchange="updateWmsNoteSelectionPreview('${noteKey}')">
        <span>${escapeWmsText(option.label)}</span>
      </label>`).join('');
    const noteButton = `
      <div class="wms-note-control">
        <button class="btn btn-sm btn-ghost wms-action-btn wms-note-btn ${notes.length?'has-notes':''}"
          onclick="toggleWmsNoteMenu(event,'${noteKey}')" aria-haspopup="true"
          aria-controls="wms_note_menu_${noteKey}">
          ${wmsIconSvg('note')}
          <span>${notes.length ? `หมายเหตุ ${notes.length}` : 'เพิ่มหมายเหตุ'}</span>
          ${notes.length ? `<span class="wms-note-count">${notes.length}</span>` : ''}
        </button>
        <div class="wms-note-menu" id="wms_note_menu_${noteKey}" hidden onclick="event.stopPropagation()">
          <div class="wms-note-menu-title">
            <span>เลือกได้หลายข้อ</span>
            <button type="button" class="btn btn-ghost" style="width:32px;height:32px;padding:0;border-radius:10px"
              onclick="toggleWmsNoteMenu(event,'${noteKey}')" aria-label="ปิด">${wmsIconSvg('close',16)}</button>
          </div>
          <div class="wms-note-option-list" id="wms_note_options_${noteKey}">${noteOptions}</div>
          <div class="wms-note-selection ${notes.length?'has-selection':''}" id="wms_note_selection_${noteKey}">
            ${notes.length ? `แสดงแล้ว: ${notes.map(note => escapeWmsText(note.text || note.new_value || '')).join(' · ')}` : 'ยังไม่ได้เลือกหมายเหตุ'}
          </div>
          ${prof?.role === 'admin' ? `<div class="wms-note-add-row">
            <input id="wms_note_custom_${noteKey}" type="text" maxlength="120"
              placeholder="พิมพ์หมายเหตุใหม่..."
              onkeydown="if(event.key==='Enter'){addCustomWmsNoteOption(event,'${noteKey}')}">
            <button type="button" class="btn btn-blue wms-note-plus"
              onclick="addCustomWmsNoteOption(event,'${noteKey}')" aria-label="เพิ่มหมายเหตุใหม่">+</button>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px"
            onclick="go('ad-users')">⚙️ แก้ไข / ลบรายการหมายเหตุ</button>` : ''}
          <button type="button" class="btn btn-green btn-sm wms-action-btn wms-note-save"
            id="wms_note_save_${noteKey}"
            onclick='saveWmsNotes(${assignmentArg},${itemArg},"${noteKey}")'>
            ${wmsIconSvg('reviewed',17)} <span>บันทึกหมายเหตุ</span>
          </button>
        </div>
      </div>`;
    const noteInline = `
      <div class="wms-note-inline" id="wms_note_inline_${noteKey}" ${notes.length ? '' : 'hidden'}>
        <span>หมายเหตุที่บันทึกแล้ว</span>
        <strong>${notes.map(note => escapeWmsText(note.text || note.new_value || '')).join(' · ')}</strong>
      </div>`;

    const countCell = (label, value, extraClass='') => `<div class="wms-count-cell ${extraClass}">
      <span>${label}</span><strong>${value === undefined || value === null ? '—' : Number(value).toLocaleString('th-TH')}</strong>
    </div>`;

    return `<div class="wms-row ${isFixed?'is-checked':''} ${isPending?'is-pending':''}" data-location-sort-code="${escapeWmsText(loc?.code || '')}">
      <div class="wms-row-main">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
          <span class="mono" style="font-size:15px;font-weight:800;color:var(--text-main)">${loc?.code||'?'}</span>
          ${statusBadge}
        </div>
        <div class="wms-item-description">${
          isEmptyLocationItem(v.items?.code)
            ? 'Location ว่าง'
            : `${escapeWmsText(v.items?.code||'')}${v.items?.description?' · '+escapeWmsText(v.items.description):''}`
        }</div>
        <div class="wms-row-meta">
          Zone ${escapeWmsText(loc?.zone || '—')} · ROW ${escapeWmsText(loc?.row_no ?? '—')} · Level ${escapeWmsText(loc?.level ?? '—')}<br>
          ${isPending 
            ? `คนนับจริง: ${actualCounterText}`
            : `ยืนยันโดย User: ${escapeWmsText(v.profiles?.name||'?')}`
          }
        </div>

        <div class="wms-actions">${returnReviewButton}${wmsButton}${noteButton}</div>
        ${noteInline}
      </div>
    </div>`;
  }).join('');

async function toggleVarianceDetail(aid, idx) {
  const prevIdx = _svDashOpenVarianceIdx;
  if (prevIdx !== null && prevIdx !== idx) {
    const prevEl = Q('vdetail_' + prevIdx);
    if (prevEl) { prevEl.style.display = 'none'; prevEl.innerHTML = ''; }
  }
  const el = Q('vdetail_' + idx);
  if (!el) return;
  if (_svDashOpenVarianceIdx === idx) {
    el.style.display = 'none'; el.innerHTML = ''; _svDashOpenVarianceIdx = null; return;
  }
  _svDashOpenVarianceIdx = idx;
  el.style.display = 'block';
  el.innerHTML = `<div class="load" style="padding:20px;font-size:13px;font-weight:600;text-align:center">⏳ กำลังโหลดรายละเอียด...</div>`;
  await renderVarianceItemDetail(aid, el, idx);
}

async function renderVarianceItemDetail(aid, container, idx) {
  const { data: asgn } = await sb.from('assignments')
    .select('id,status,location_id,session_id,assigned_to,locations(code,zone,area)')
    .eq('id', aid).single();

  if (!asgn) { container.innerHTML = `<div class="alert alert-red" style="margin:10px">ไม่พบข้อมูล</div>`; return; }

  const [{ data: snaps }, { data: counts }, { data: users }, rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty,al_qty,items(id,code,description)').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('count_records').select('item_id,round,count_qty,remark,photo_url,actual_counter_name').eq('assignment_id', aid),
    sb.from('profiles').select('id,name').order('name'),
    getSessionRules(asgn.session_id),
  ]);

  const byItem = {};
  counts?.forEach(c => { byItem[c.item_id] = byItem[c.item_id] || {}; byItem[c.item_id][c.round] = c; });

  const VS = {
    OK:      { cls:'tag-green',  lbl:'OK'      , row:'exact' },
    Diff:    { cls:'tag-red',    lbl:'Diff'    , row:'diff'  },
    PENDING: { cls:'tag-amber',  lbl:'PENDING' , row:''      },
    '':      { cls:'tag-gray',   lbl:'-'       , row:''      },
  };
  const fmt = x => {
    if (x===undefined || x===null) return '—';
    return `${x.count_qty} · ${escapeWmsText(x.actual_counter_name || 'ไม่ระบุคนนับ')}`;
  };

  let varRows = '';
  for (const s of snaps || []) {
    const it = s.items;
    const emptyLocation = isEmptyLocationItem(it?.code);
    const v  = byItem[it.id] || {};
    const r1 = v[1]?.count_qty, r2 = v[2]?.count_qty, r3 = v[3]?.count_qty;
    const stKey = computeItemStatus(+s.onhand_qty, r1, r2, r3, rules);
    const st = VS[stKey] || { cls:'tag-gray', lbl:stKey, row:'' };
    const suggested = r3 ?? r2 ?? r1 ?? +s.onhand_qty;
    const alQty = s.al_qty ?? null;

    varRows += `<div class="vrow ${st.row}" style="flex-direction:column;align-items:stretch;padding:16px 20px;gap:8px">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1;min-width:0">
          <div class="mono" style="font-size:15px;font-weight:800; color:var(--text-main);">${
            emptyLocation ? '<span class="tag tag-blue">Location ว่าง</span>' : escapeWmsText(it?.code || '')
          }</div>
          <div style="font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; margin-top:4px;">${
            emptyLocation ? 'Item ว่างจาก WMS' : escapeWmsText(it?.description || '')
          }</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px; font-weight:600;">R1: ${fmt(v[1])} · R2: ${fmt(v[2])} · R3: ${fmt(v[3])}</div>
          <div class="oh-chip">OH: <input type="number" id="oh_${it.id}" value="${s.onhand_qty}"
            onchange="updateOH('${asgn.session_id}','${asgn.location_id}','${it.id}',this.value)">
            ${alQty !== null ? `<span class="al-part">AL ${alQty}</span>` : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <span class="tag ${st.cls}">${st.lbl}</span>
          <div style="font-size:10px;color:var(--text-muted);margin-top:10px; font-weight:700;">ยอดยืนยัน</div>
          <input type="number" id="confirm_${it.id}" value="${suggested}"
            style="width:80px;padding:8px 4px;font-size:16px;font-weight:800;text-align:center;margin-top:4px;font-family:inherit">
        </div>
      </div>
    </div>`;
  }

  let maxRoundCounted = 0;
  counts?.forEach(c => { if (c.round > maxRoundCounted) maxRoundCounted = c.round; });
  const nextPhysicalRound = maxRoundCounted + 1;
  const otherUsers = (users||[]).filter(u => u.id !== asgn.assigned_to);
  const userOpts = otherUsers.map(u=>`<option value="${u.id}">${escapeWmsText(u.name)}</option>`).join('');

  container.innerHTML = `
    <div>${varRows}</div>
    <div style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.4)">
      <div class="alert alert-blue" style="font-size:12px;margin-bottom:14px">✏️ แก้ "ยอดยืนยัน" หรือ OH ก่อนกดคอนเฟิร์ม</div>
      <div id="vda_${idx}"></div>
      <button class="btn btn-green" onclick="doApproveInline('${aid}','${idx}')" style="margin-bottom:12px;width:100%">✅ คอนเฟิร์มยอดนับ</button>
      ${nextPhysicalRound <= 3 ? `
      <div style="background:rgba(255,255,255,0.5);border-radius:20px;padding:16px;margin-top:10px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.02)">
        <div style="font-size:13px;font-weight:800;color:var(--primary-blue);margin-bottom:10px">🔄 จ่ายงานรอบที่ ${nextPhysicalRound} ให้ User</div>
        ${otherUsers.length ? `<div style="display:flex;gap:10px">

async function persistVarianceApprovalDecision(aid,approvals) {
  if (!approvals?.length) throw new Error('ไม่พบรายการสำหรับคอนเฟิร์ม');
  const { data:approvalRows,error:approvalError } = await sb.from('variance_approvals')
    .upsert(approvals,{ onConflict:'assignment_id,item_id' })
    .select('id,assignment_id,item_id');
  if (approvalError) throw approvalError;
  if ((approvalRows || []).length !== approvals.length) {
    throw new Error(`บันทึกผลตรวจสอบไม่ครบ: ต้องได้ ${approvals.length} แต่ได้ ${(approvalRows || []).length}`);
  }
  const { data:assignmentRows,error:assignmentError } = await sb.from('assignments')
    .update({ status:'approved' })
    .eq('id',aid)
    .select('id,status');
  if (assignmentError) throw assignmentError;
  if (!assignmentRows?.length) throw new Error('อัปเดต Assignment เป็น approved ไม่สำเร็จ');
  return approvalRows;
}

async function doApproveInline(aid, idx) {
  const al = Q('vda_'+idx);
  if (al) al.innerHTML = `<div class="alert alert-blue" style="font-size:12px">⏳ กำลังบันทึก...</div>`;
  try {
    const { data:asgn,error:assignmentError } = await sb.from('assignments')
      .select('location_id,session_id').eq('id',aid).single();
    if (assignmentError || !asgn) throw (assignmentError || new Error('ไม่พบ Assignment'));
    const { data:snaps,error:snapshotError } = await sb.from('stock_snapshot')
      .select('item_id,onhand_qty')
      .eq('session_id',asgn.session_id)
      .eq('location_id',asgn.location_id);
    if (snapshotError) throw snapshotError;

    const approvals = [];
    for (const snapshot of snaps || []) {
      const input = Q('confirm_'+snapshot.item_id);
      const value = input ? parseFloat(input.value) : NaN;
      const finalQty = isNaN(value) ? +snapshot.onhand_qty : value;
      approvals.push({
        assignment_id:aid,
        item_id:snapshot.item_id,
        final_qty:finalQty,
        variance:finalQty - +snapshot.onhand_qty,
        resolution:finalQty === +snapshot.onhand_qty ? 'ok' : 'lost',
        approved_by:me.id,
      });
    }
    await persistVarianceApprovalDecision(aid,approvals);
    if (al) al.innerHTML = `<div class="alert alert-green" style="font-size:12px">✅ คอนเฟิร์มยอดเรียบร้อย</div>`;
    invalidateDashboardCache();
    setTimeout(() => refreshDashboardData(),1000);
  } catch (error) {
    if (al) al.innerHTML = `<div class="alert alert-red" style="font-size:12px">❌ ${escapeWmsText(error.message || error)}</div>`;
  }
}

async function doReassignUser(aid, idx, targetRound) {
  const sel = Q('vreassign_'+idx);
  const uid = sel?.value;
  if (!uid) return;
  const { data: before } = await sb.from('assignments').select('session_id,location_id,profiles!assigned_to(name)').eq('id', aid).single();
  const statusForTarget = { 2:'round1_done', 3:'round2_done' }[targetRound];
  const updates = { assigned_to: uid };
  if (statusForTarget) updates.status = statusForTarget;
  await sb.from('assignments').update(updates).eq('id', aid);
  const label = sel.options[sel.selectedIndex]?.textContent || '';
  logAudit(before?.session_id, before?.location_id, null, 'reassign', before?.profiles?.name, label, aid);
  refreshDashboardData();
  showAssignmentSuccessModal({
    count:1,
    unit:'Location',
    userName:label,
    detail:`จ่ายงานรอบที่ ${targetRound || ''} เรียบร้อยแล้ว`,
    printAction:() => printCountForm([before?.location_id],before?.session_id),
  });
}

async function approveFoundWork(foundId) {
  const alertBox = Q('found_review_alert');
  const approveButton = Q('found_approve_btn');
  const rejectButton = Q('found_reject_btn');
  const locationCode = importCodeKey(Q('found_review_location')?.value);
  const itemCode = importCodeKey(Q('found_review_item')?.value);
  const licensePlate = normalizeImportText(Q('found_review_lpn')?.value);
  const qty = Number(Q('found_review_qty')?.value);
  if (!locationCode || !licensePlate || !itemCode || !Number.isFinite(qty) || qty <= 0) {
    alertBox.innerHTML = '<div class="alert alert-red">Location, LPN, Item และ QTY มากกว่า 0 ต้องครบก่อนอนุมัติ</div>';
    return;
  }
  approveButton.disabled = true;
  if (rejectButton) rejectButton.disabled = true;
  alertBox.innerHTML = '<div class="alert alert-blue">⏳ กำลังอนุมัติและเชื่อมเข้าระบบ Count / Variance...</div>';
  try {
    const updates = {
      location_code:locationCode,
      license_plate:licensePlate,
      item_code:itemCode,
      qty,
      description:normalizeImportText(Q('found_review_description')?.value) || null,
      uom:normalizeImportText(Q('found_review_uom')?.value) || null,
    };
    const { data:updated,error:updateError } = await sb.from('found_items')
      .update(updates).eq('id',foundId).eq('status','pending_review').select('id');
    if (updateError) throw updateError;
    if (!updated?.length) throw new Error('รายการถูกตรวจสอบโดยคนอื่นแล้ว กรุณาโหลดใหม่');

    const { data,error } = await sb.rpc('approve_found_item',{
      p_found_id:foundId,
      p_supervisor_note:normalizeImportText(Q('found_review_note')?.value) || null,
    });
    if (error) throw error;
    if (!data?.ok) throw new Error('ระบบอนุมัติงานพบเพิ่มไม่สำเร็จ');
    invalidateDashboardCache();
    alertBox.innerHTML = `<div class="alert alert-green">✅ อนุมัติแล้ว · Variance ${Number(data.variance || 0).toLocaleString('th-TH')} ส่งต่อไปเมนู WMS</div>`;
    setTimeout(() => go('sv-list'),1100);
  } catch (error) {
    alertBox.innerHTML = errBox(error.message || error);
    approveButton.disabled = false;
    if (rejectButton) rejectButton.disabled = false;
  }
}

  if (!confirm('ยืนยันไม่อนุมัติงานพบเพิ่มรายการนี้?')) return;

  Q('found_reject_btn').disabled = true;
  try {

      status:'rejected',
      supervisor_note:note,
      reviewed_by:me.id,
      reviewed_at:new Date().toISOString(),

    Q('found_reject_btn').disabled = false;
  }
}

  if (!asgn) { go('sv-list'); return; }

  const l = asgn.locations;
  const isAdminOrSup = ['admin','supervisor'].includes(prof?.role);

  const [{ data: snaps }, { data: counts }, { data: users }, rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty,al_qty,items(id,code,description)').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('count_records').select('item_id,round,count_qty,remark,photo_url,actual_counter_name').eq('assignment_id', aid),
    sb.from('profiles').select('id,name').order('name'),
    getSessionRules(asgn.session_id),
  ]);

  const byItem = {};
  counts?.forEach(c => { byItem[c.item_id] = byItem[c.item_id] || {}; byItem[c.item_id][c.round] = c; });

  let maxRoundCounted = 0;
  counts?.forEach(c => { if (c.round > maxRoundCounted) maxRoundCounted = c.round; });
  const roundNum = maxRoundCounted || 1;
  const nextPhysicalRound = maxRoundCounted + 1;
  const otherUsers = (users||[]).filter(u => u.id !== asgn.assigned_to);

  const VS = { OK: { cls:'tag-green', lbl:'OK', row:'exact' }, Diff: { cls:'tag-red', lbl:'Diff', row:'diff' }, PENDING: { cls:'tag-amber', lbl:'PENDING', row:'' }, '': { cls:'tag-gray', lbl:'-', row:'' } };
  let hasVar = false; let varRows = '';
  const fmt = x => {
    if (x===undefined || x===null) return '—';
    return `${x.count_qty} · ${escapeWmsText(x.actual_counter_name || 'ไม่ระบุคนนับ')}`;
  };
  const actualCounterDisplay = escapeWmsText(actualCounterLabel(counts || []));

  for (const s of snaps || []) {
    const it = s.items; const v = byItem[it.id] || {};
    const emptyLocation = isEmptyLocationItem(it?.code);
    const r1 = v[1]?.count_qty, r2 = v[2]?.count_qty, r3 = v[3]?.count_qty;
    const stKey = computeItemStatus(+s.onhand_qty, r1, r2, r3, rules);
    const st = VS[stKey] || { cls:'tag-gray', lbl:stKey, row:'' };
