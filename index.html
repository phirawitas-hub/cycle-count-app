async function updateOH(sessionId, locationId, itemId, newVal) {
  const val = parseFloat(newVal); if (isNaN(val)) return;
  const { data: before } = await sb.from('stock_snapshot').select('onhand_qty').eq('session_id', sessionId).eq('location_id', locationId).eq('item_id', itemId).single();
  await sb.from('stock_snapshot').update({ onhand_qty: val }).eq('session_id', sessionId).eq('location_id', locationId).eq('item_id', itemId);
  logAudit(sessionId, locationId, itemId, 'oh_edit', before?.onhand_qty, val);
}

async function doApprove(aid) {
  const al = Q('sva'); al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก...</div>`;
  try {
    const { data:asgn,error:assignmentError } = await sb.from('assignments')
      .select('location_id,session_id').eq('id',aid).single();
    if (assignmentError || !asgn) throw (assignmentError || new Error('ไม่พบ Assignment'));
    const { data:snaps,error:snapshotError } = await sb.from('stock_snapshot')
      .select('item_id,onhand_qty')
      .eq('session_id',asgn.session_id)
      .eq('location_id',asgn.location_id);
    if (snapshotError) throw snapshotError;

    const approvals = [];
    for (const snapshot of snaps || []) {
      const input = Q('confirm_'+snapshot.item_id);
      const value = input ? parseFloat(input.value) : NaN;
      const finalQty = isNaN(value) ? +snapshot.onhand_qty : value;
      approvals.push({
        assignment_id:aid,
        item_id:snapshot.item_id,
        final_qty:finalQty,
        variance:finalQty - +snapshot.onhand_qty,
        resolution:finalQty === +snapshot.onhand_qty ? 'ok' : 'lost',
        approved_by:me.id,
      });
    }
    await persistVarianceApprovalDecision(aid,approvals);
    al.innerHTML = `<div class="alert alert-green">✅ คอนเฟิร์มยอดเรียบร้อย</div>`;
    invalidateDashboardCache();
    setTimeout(() => go('sv-list'),1500);
  } catch (error) {
    al.innerHTML = `<div class="alert alert-red">❌ ${escapeWmsText(error.message || error)}</div>`;
  }
}

async function reqRecount(aid, targetRound) {
  const uid = Q('recount-user')?.value; if (!uid) { alert('กรุณาเลือก User ผู้รับงานก่อน'); return; }
  const sel = Q('recount-user');
  const { data: before } = await sb.from('assignments').select('session_id,location_id,profiles!assigned_to(name)').eq('id', aid).single();
  const statusForTarget = { 2:'round1_done', 3:'round2_done' }[targetRound];
  const updates = { assigned_to: uid };
  if (statusForTarget) updates.status = statusForTarget;
  await sb.from('assignments').update(updates).eq('id', aid);
  const label = sel.options[sel.selectedIndex]?.textContent || '';
  logAudit(before?.session_id, before?.location_id, null, 'reassign', before?.profiles?.name, label, aid);
  Q('sva').innerHTML = '';
  go('sv-list');
  showAssignmentSuccessModal({
    count:1,
    unit:'Location',
    userName:label,
    detail:`จ่ายงานรอบที่ ${targetRound || ''} เรียบร้อยแล้ว`,
    printAction:() => printCountForm([before?.location_id],before?.session_id),
  });
}

const COUNT_RULE_PRESETS = Object.freeze({
  standard: { maxRounds:3, repeatMatchAction:'recount' },
  quick: { maxRounds:2, repeatMatchAction:'send_variance' },
  repeatPass: { maxRounds:3, repeatMatchAction:'auto_pass' },
  strict: { maxRounds:3, repeatMatchAction:'send_variance' },
});

function normalizeCountingRules(maxRounds, repeatMatchAction) {
  const rounds = [1,2,3].includes(Number(maxRounds)) ? Number(maxRounds) : 3;
  const action = ['recount','auto_pass','send_variance'].includes(repeatMatchAction)
    ? repeatMatchAction : 'recount';
  return { maxRounds:rounds, repeatMatchAction:action };
}

function countRuleActionLabel(action) {
  return ({
    recount:'นับต่อจนกว่าจะครบจำนวนรอบ',
    auto_pass:'ถือว่าผ่านเมื่อยอดนับซ้ำกัน',
    send_variance:'ส่ง Variance ทันทีเมื่อยอดนับซ้ำกัน',
  })[action] || 'นับต่อจนกว่าจะครบจำนวนรอบ';
}

function describeCountingRules(maxRounds, repeatMatchAction) {
  const rules = normalizeCountingRules(maxRounds, repeatMatchAction);
  return `${rules.maxRounds} รอบ · ${countRuleActionLabel(rules.repeatMatchAction)}`;
}

function readCountingRuleInput(id, key) {
  const raw = Q(`rule_${key}_${id}`)?.value;
  if (raw === undefined || raw === null || String(raw).trim() === '') return undefined;
  const value = Number(raw);
  return Number.isFinite(value) ? value : undefined;
}

function countingRuleReason(oh, counts, roundIndex, status, rules) {
  const observed = counts.slice(0, roundIndex + 1).filter(value => value !== undefined);
  if (!observed.length) return 'รอกรอกยอดนับรอบนี้';
  if (oh !== undefined && observed.some(value => value === oh)) return 'ยอดนับตรง OH — จบงานทันที';
  const repeated = observed.some((value, index) => observed.indexOf(value) !== index);
  if (repeated && rules.repeatMatchAction === 'auto_pass') return 'ยอดนับซ้ำกัน — ผ่านตามกติกา';
  if (repeated && rules.repeatMatchAction === 'send_variance') return 'ยอดนับซ้ำกัน — ส่งตรวจสอบทันที';
  if (status === 'Diff') return 'ครบจำนวนรอบแล้วยังไม่ตรง OH';
  if (repeated) return `ยอดซ้ำแต่กติกาให้ไป Count ${Math.min(roundIndex + 2, rules.maxRounds)}`;
  return `ยังไม่ตรง OH — ไป Count ${roundIndex + 2}`;
}

function refreshCountingRulePreview(id) {
  const maxRounds = Number(Q(`rule_max_${id}`)?.value || 3);
  const repeatMatchAction = Q(`rule_repeat_${id}`)?.value || 'recount';
  const rules = normalizeCountingRules(maxRounds, repeatMatchAction);
  const oh = readCountingRuleInput(id, 'oh');
  const counts = [1,2,3].map(round => readCountingRuleInput(id, `c${round}`));
  let finalStatus = '';
  let finalRound = 0;

  [1,2,3].forEach(round => {
    const input = Q(`rule_c${round}_${id}`);
    const box = Q(`rule_result_${round}_${id}`);
    const disabled = round > rules.maxRounds;
    if (input) input.disabled = disabled;
    if (!box) return;
    if (disabled) {
      box.className = 'count-rule-result is-disabled';
      box.innerHTML = `<span class="round">COUNT ${round}</span><span class="decision">ไม่ใช้งาน</span><span class="reason">กติกาจบที่ ${rules.maxRounds} รอบ</span>`;
      return;
    }

    const status = computeItemStatus(
      oh,
      counts[0],
      round >= 2 ? counts[1] : undefined,
      round >= 3 ? counts[2] : undefined,
      rules
    );
    const decision = status === 'OK' ? 'OK · ผ่าน'
      : status === 'Diff' ? 'DIFF · Variance'
      : status === 'PENDING' ? `ไป Count ${round + 1}`
      : 'รอกรอก';
    const statusClass = status === 'OK' ? 'is-ok' : status === 'Diff' ? 'is-diff' : status === 'PENDING' ? 'is-pending' : '';
    box.className = `count-rule-result ${statusClass}`;
    box.innerHTML = `<span class="round">หลัง COUNT ${round}</span><span class="decision">${decision}</span><span class="reason">${countingRuleReason(oh,counts,round-1,status,rules)}</span>`;
    if (counts[round-1] !== undefined) {
      finalStatus = status;
      finalRound = round;
    }
  });

  const finalBox = Q(`rule_final_${id}`);
  if (finalBox) {
    const finalText = !finalRound ? 'กรอก Count 1 เพื่อเริ่มทดลอง'
      : finalStatus === 'OK' ? `ผลล่าสุดหลัง Count ${finalRound}: ✅ OK — จบงาน`
      : finalStatus === 'Diff' ? `ผลล่าสุดหลัง Count ${finalRound}: ⚠️ ส่ง Variance`
      : finalStatus === 'PENDING' ? `ผลล่าสุดหลัง Count ${finalRound}: 🔄 ต้องนับรอบถัดไป`
      : `ผลล่าสุดหลัง Count ${finalRound}: รอข้อมูล Count 1`;
    finalBox.textContent = finalText;
  }
}

function applyCountingRulePreset(id, presetName) {
  const preset = COUNT_RULE_PRESETS[presetName];
  if (!preset) return;
  const maxEl = Q(`rule_max_${id}`), repeatEl = Q(`rule_repeat_${id}`);
  if (maxEl) maxEl.value = String(preset.maxRounds);
  if (repeatEl) repeatEl.value = preset.repeatMatchAction;
  refreshCountingRulePreview(id);
}

function loadCountingRuleExample(id, type) {
  const examples = {
    match:[100,100,'',''],
    repeat:[100,98,98,99],
    different:[100,97,98,99],
  };
  const values = examples[type] || examples.repeat;
  ['oh','c1','c2','c3'].forEach((key,index) => {
    const input = Q(`rule_${key}_${id}`);
    if (input) input.value = values[index];
  });
  refreshCountingRulePreview(id);
}

function clearCountingRuleExample(id) {
  ['oh','c1','c2','c3'].forEach(key => {
    const input = Q(`rule_${key}_${id}`);
    if (input) input.value = '';
  });
  refreshCountingRulePreview(id);
}

async function saveSessionCountingRules(id) {
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const maxRounds = Number(Q(`rule_max_${id}`)?.value);
  const repeatMatchAction = Q(`rule_repeat_${id}`)?.value;
  const rules = normalizeCountingRules(maxRounds, repeatMatchAction);
  const button = Q(`rule_save_${id}`);
  const alertBox = Q(`rule_alert_${id}`);
  if (button) { button.disabled = true; button.textContent = '⏳ กำลังบันทึก...'; }
  if (alertBox) alertBox.innerHTML = '';
  try {
    await invokeAdminSessionRules('session_rules_update', {
      id,
      max_rounds:rules.maxRounds,
      repeat_match_action:rules.repeatMatchAction,
    });
    const summary = Q(`count_rule_summary_${id}`);
    if (summary) summary.textContent = describeCountingRules(rules.maxRounds,rules.repeatMatchAction);
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-green" style="margin-top:12px">✅ บันทึกกติกาแล้ว งานนับใน Session นี้จะใช้กติกาใหม่ทันที</div>`;
  } catch (error) {
    if (alertBox) alertBox.innerHTML = errBox(`บันทึกกติกาไม่สำเร็จ: ${error.message}`);
  } finally {
    if (button) { button.disabled = false; button.textContent = '💾 บันทึกกติกา Session นี้'; }
  }
}

    .order('created_at',{ascending:false});
  if (error) { container.innerHTML = errBox(error.message); return; }

let _assignWorkspaceCache = null;

function invalidateAssignmentWorkspaceCache(sessionId) {
  if (!sessionId || _assignWorkspaceCache?.sessionId === sessionId) _assignWorkspaceCache = null;
}

async function loadAssignmentWorkspaceData(sessionId) {
  if (_assignWorkspaceCache?.sessionId === sessionId && _assignWorkspaceCache.promise) {
    return _assignWorkspaceCache.promise;
  }
  const promise = Promise.all([
    fetchPagedSupabaseRows(
      'stock_snapshot',
      'location_id,locations(id,code,zone,row_no,level,area)',
      query => query.eq('session_id',sessionId).order('id'),
    ),
    fetchPagedSupabaseRows(
      'assignments',
      'id,session_id,location_id,assigned_to,status,created_at,locations(code,zone,row_no),profiles!assigned_to(name)',
      query => query.eq('session_id',sessionId).order('id'),
    ),
  ]).then(([snapshotResult,assignmentResult]) => {
    if (snapshotResult.error) throw snapshotResult.error;
    if (assignmentResult.error) throw assignmentResult.error;
    return {
      snapshots:snapshotResult.data || [],
      assignments:(assignmentResult.data || []).sort((a,b) => String(a.created_at || '').localeCompare(String(b.created_at || ''))),
    };
  }).catch(error => {
    if (_assignWorkspaceCache?.sessionId === sessionId) _assignWorkspaceCache = null;
    throw error;
  });
  _assignWorkspaceCache = { sessionId, promise };
  return promise;
}

function selectedAssignSessionConfig() {

    countMode:option?.dataset?.countMode === 'annual' ? 'annual' : 'cycle',

  };

function currentRound1AssignMode() {
  return S._round1AssignMode === 'annual' ? 'annual' : 'normal';
}

function syncAssignWorkspaceMode(preferredMode) {
  const config = selectedAssignSessionConfig();
  const mode = preferredMode === 'annual' || preferredMode === 'normal'
    ? preferredMode
    : currentRound1AssignMode();
  const annual = mode === 'annual';
  S._round1AssignMode = mode;
  const normalPanel = Q('normal-first-round-panel');
  const annualPanel = Q('annual-first-round-panel');
  const normalButton = Q('round1-mode-normal');
  const annualButton = Q('round1-mode-annual');
  const roundBadge = Q('round1-mode-badge');
  const totalLabel = Q('assign-stat-total-label');
  const assignedLabel = Q('assign-stat-assigned-label');
  const remainingLabel = Q('assign-stat-remaining-label');
  const badge = Q('assign-mode-badge');
  if (normalPanel) normalPanel.hidden = annual;
  if (annualPanel) annualPanel.hidden = !annual;
  if (normalButton) {
    normalButton.classList.toggle('active',!annual);
    normalButton.setAttribute('aria-selected',String(!annual));
  }
  if (annualButton) {
    annualButton.classList.toggle('active',annual);
    annualButton.setAttribute('aria-selected',String(annual));
  }
  if (totalLabel) totalLabel.textContent = annual ? 'ITEM ทั้งหมด' : 'LOCATIONS ทั้งหมด';
  if (assignedLabel) assignedLabel.textContent = annual ? 'JOBS ที่จ่ายแล้ว' : 'LOCATIONS ที่จ่ายแล้ว';
  if (remainingLabel) remainingLabel.textContent = annual ? 'JOBS ยังไม่จ่าย' : 'LOCATIONS คงเหลือ';
  if (roundBadge) roundBadge.textContent = annual ? 'ROUND 1 · ANNUAL JOB' : 'ROUND 1 · NORMAL';
  if (badge) {
    badge.textContent = 'ROUND 1 เลือกได้ 2 แบบ';
    badge.className = 'assign-step-badge';
  }
  if (Q('annual-build-size')) Q('annual-build-size').value = config.itemsPerJob;
  if (Q('annual-build-prefix')) Q('annual-build-prefix').value = config.prefix;
  return { ...config, round1Mode:mode };
}

function setRound1AssignMode(mode, options={}) {
  const config = selectedAssignSessionConfig();
  const nextMode = mode === 'annual' ? 'annual' : 'normal';
  S._round1ModeBySession = S._round1ModeBySession || {};
  if (config.sessionId) S._round1ModeBySession[config.sessionId] = nextMode;
  const synced = syncAssignWorkspaceMode(nextMode);
  if (options.skipLoad) return synced;
  if (nextMode === 'annual') {
    loadAnnualJobWorkspace();
  } else {
    refreshLocs();
    refreshBulkFilters();
  }
  return synced;
}

function updateAssignWorkspaceStats(total, assigned, remaining) {
  const totalEl = Q('assign-stat-total');
  const assignedEl = Q('assign-stat-assigned');
  const remainingEl = Q('assign-stat-remaining');
  if (totalEl) totalEl.textContent = Number(total || 0).toLocaleString('th-TH');
  if (assignedEl) assignedEl.textContent = Number(assigned || 0).toLocaleString('th-TH');
  if (remainingEl) remainingEl.textContent = Number(remaining || 0).toLocaleString('th-TH');
}

let _annualWorkspaceJobs = [];
let _annualWorkspaceItemCounts = {};
let _normalFreeSelectedLocationIds = new Set();
let _normalFreeVisibleLocationIds = [];
let _normalFreeFilteredLocationCount = 0;

async function loadAnnualJobWorkspace() {
  const config = selectedAssignSessionConfig();
  const list = Q('annual-job-list');
  if (!config.sessionId || !list || currentRound1AssignMode() !== 'annual') return;
  list.innerHTML = `<div class="annual-empty">⏳ กำลังโหลด Annual JOB...</div>`;
  const [jobsResult,itemsResult,snapshotResult] = await Promise.all([
    fetchPagedSupabaseRows(
      'annual_count_jobs',
      'id,session_id,job_no,job_code,assigned_to,status,assigned_at,created_at,profiles!assigned_to(name)',
      query => query.eq('session_id',config.sessionId).order('job_no'),
    ),
    fetchPagedSupabaseRows(
      'annual_count_job_items',
      'job_id',
      query => query.eq('session_id',config.sessionId),
    ),
    sb.from('stock_snapshot').select('id',{ count:'exact',head:true }).eq('session_id',config.sessionId),
  ]);
  if (selectedAssignSessionConfig().sessionId !== config.sessionId) return;
  if (jobsResult.error || itemsResult.error || snapshotResult.error) {
    list.innerHTML = errBox((jobsResult.error || itemsResult.error || snapshotResult.error).message);
    return;
  }
  _annualWorkspaceJobs = jobsResult.data || [];
  _annualWorkspaceItemCounts = {};
  (itemsResult.data || []).forEach(row => {
    _annualWorkspaceItemCounts[row.job_id] = (_annualWorkspaceItemCounts[row.job_id] || 0) + 1;
  });
  const totalItems = Number(snapshotResult.count || 0);
  const assignedJobs = _annualWorkspaceJobs.filter(job => job.assigned_to).length;
  if (Q('annual-stat-items')) Q('annual-stat-items').textContent = totalItems.toLocaleString('th-TH');
  if (Q('annual-stat-jobs')) Q('annual-stat-jobs').textContent = _annualWorkspaceJobs.length.toLocaleString('th-TH');
  if (Q('annual-stat-assigned')) Q('annual-stat-assigned').textContent = assignedJobs.toLocaleString('th-TH');
  updateAssignWorkspaceStats(totalItems,assignedJobs,Math.max(0,_annualWorkspaceJobs.length-assignedJobs));
  renderAnnualJobList();
}

function renderAnnualJobList() {
  const list = Q('annual-job-list');
  if (!list) return;

    [...document.querySelectorAll('.annual-job-checkbox:checked')].map(input => input.value)
  );

  const jobs = (_annualWorkspaceJobs || []).filter(job => {
    if (filter === 'unassigned') return !job.assigned_to;
    if (filter === 'assigned') return Boolean(job.assigned_to);
    if (['pending','in_progress','completed'].includes(filter)) {
      return Boolean(job.assigned_to) && job.status === filter;
    }
    return true;
  });
  if (!jobs.length) {
    list.innerHTML = `<div class="annual-empty">${_annualWorkspaceJobs.length ? 'ไม่มี JOB ในสถานะที่เลือก' : 'ยังไม่มี JOB · กด “สร้าง / แบ่ง Annual JOB” ก่อน'}</div>`;
    syncAnnualJobSelection();
    return;
  }
  const statusInfo = {
    pending:{ cls:'tag-gray',label:'รอเริ่มงาน' },
    in_progress:{ cls:'tag-amber',label:'กำลังนับ' },
    completed:{ cls:'tag-green',label:'เสร็จแล้ว' },
  };
  list.innerHTML = jobs.map(job => {
    const status = statusInfo[job.status] || statusInfo.pending;
    const checked = selectedIds.has(job.id) ? 'checked' : '';
    return `<div class="annual-job-row">
      <input class="annual-job-checkbox" type="checkbox" value="${job.id}" ${checked}

  });

function annualJobUuid() {
  if (typeof crypto?.randomUUID === 'function') return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = [...bytes].map(value => value.toString(16).padStart(2,'0')).join('');
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}

function isAnnualJobPermissionError(error) {
  const code = String(error?.code || '');
  const message = String(error?.message || error || '');
  return code === '42501' || /permission denied|row-level security/i.test(message);
}

function setAnnualJobGenerationProgress(alertBox,message) {
  if (!alertBox) return;
  alertBox.innerHTML = `<div class="alert alert-blue" style="margin-top:12px">⏳ ${escapeWmsText(message)}</div>`;
}

async function writeAnnualJobGenerationRows(table,rows) {
  if (!rows.length) return;
  const { error } = await sb.from(table).insert(rows);
  if (!error) return;
  if (prof?.role === 'admin' && isAnnualJobPermissionError(error)) {
    await invokeAdminBackup('restore_batch',{ table,rows });
    return;
  }
  throw error;
}

async function generateAnnualJobsClientSide({ sessionId,size,prefix,alertBox }) {
  setAnnualJobGenerationProgress(alertBox,'กำลังอ่านและเรียง Stock Snapshot...');
  const snapshotResult = await fetchPagedSupabaseRows(
    'stock_snapshot',
    'id,location_id,item_id,locations(code),items(code)',
    query => query.eq('session_id',sessionId).order('id'),
  );
  if (snapshotResult.error) throw snapshotResult.error;
  const snapshots = snapshotResult.data || [];
  if (!snapshots.length) throw new Error('Session นี้ยังไม่มี Stock Snapshot สำหรับสร้าง JOB');

  const collator = new Intl.Collator('en',{ numeric:true,sensitivity:'base' });
  snapshots.sort((left,right) =>
    collator.compare(String(left.locations?.code || ''),String(right.locations?.code || ''))
    || collator.compare(String(left.items?.code || ''),String(right.items?.code || ''))
    || collator.compare(String(left.id || ''),String(right.id || ''))
  );

  if ((_annualWorkspaceJobs || []).length) {
    setAnnualJobGenerationProgress(alertBox,'กำลังล้าง Annual JOB เดิม...');
    const itemDelete = await sb.from('annual_count_job_items').delete().eq('session_id',sessionId);
    if (itemDelete.error) throw new Error(`ล้างรายการ JOB เดิมไม่สำเร็จ: ${itemDelete.error.message}`);
    const jobDelete = await sb.from('annual_count_jobs').delete().eq('session_id',sessionId);
    if (jobDelete.error) throw new Error(`ล้าง JOB เดิมไม่สำเร็จ: ${jobDelete.error.message}`);
  }

  const jobCount = Math.ceil(snapshots.length / size);
  const jobRows = Array.from({ length:jobCount },(_,index) => ({
    id:annualJobUuid(),
    session_id:sessionId,
    job_no:index + 1,
    job_code:`${prefix}-${String(index + 1).padStart(4,'0')}`,
    assigned_to:null,
    status:'pending',
    created_by:me?.id || null,
  }));
  const writeBatchSize = 200;
  for (let start=0; start<jobRows.length; start+=writeBatchSize) {
    setAnnualJobGenerationProgress(
      alertBox,
      `กำลังสร้าง JOB ${Math.min(start + writeBatchSize,jobRows.length).toLocaleString('th-TH')} / ${jobRows.length.toLocaleString('th-TH')}`,
    );
    await writeAnnualJobGenerationRows('annual_count_jobs',jobRows.slice(start,start+writeBatchSize));
  }

  const itemRows = snapshots.map((snapshot,index) => {
    const jobIndex = Math.floor(index / size);
    return {
      id:annualJobUuid(),
      job_id:jobRows[jobIndex].id,
      session_id:sessionId,
      stock_snapshot_id:snapshot.id,
      location_id:snapshot.location_id,
      item_id:snapshot.item_id,
      sort_order:(index % size) + 1,
    };
  });
  for (let start=0; start<itemRows.length; start+=writeBatchSize) {
    if (start === 0 || start % 1000 === 0 || start + writeBatchSize >= itemRows.length) {
      setAnnualJobGenerationProgress(
        alertBox,
        `กำลังบันทึกรายการ ${Math.min(start + writeBatchSize,itemRows.length).toLocaleString('th-TH')} / ${itemRows.length.toLocaleString('th-TH')}`,
      );
    }
    await writeAnnualJobGenerationRows('annual_count_job_items',itemRows.slice(start,start+writeBatchSize));
  }
  return { job_count:jobRows.length,item_count:itemRows.length,permission_fallback:true };
}

async function generateAnnualJobs() {
  const config = selectedAssignSessionConfig();
  const size = Math.max(1,Math.min(200,Math.floor(Number(Q('annual-build-size')?.value) || config.itemsPerJob || 20)));
  const prefix = String(Q('annual-build-prefix')?.value || config.prefix || 'JOB').trim().slice(0,20) || 'JOB';
  const alertBox = Q('annual-generate-alert');
  const button = Q('annual-generate-btn');
  if (!config.sessionId) {
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-amber" style="margin-top:12px">กรุณาเลือก Session ก่อนสร้าง JOB</div>`;
    return;
  }
  if (_annualWorkspaceJobs.length && !confirm(`สร้าง JOB ใหม่ทั้งหมด?\n\nJOB เดิม ${_annualWorkspaceJobs.length} งานและ User ที่เคยได้รับมอบหมายจะถูกล้าง แล้วแบ่งใหม่เป็น ${size} รายการต่อ JOB`)) return;
  if (button) { button.disabled = true; button.textContent = '⏳ กำลังสร้าง Annual JOB...'; }
  setAnnualJobGenerationProgress(alertBox,'กำลังเรียงและแบ่ง Stock Snapshot เป็น JOB...');
  try {
    const rpcResult = await sb.rpc('generate_annual_count_jobs',{
      p_session_id:config.sessionId,
      p_items_per_job:size,
      p_prefix:prefix,
    });
    let summary;
    if (rpcResult.error) {
      const deniedSessionTable = /permission denied for table count_sessions/i.test(String(rpcResult.error.message || ''));
      if (!deniedSessionTable) throw rpcResult.error;
      setAnnualJobGenerationProgress(alertBox,'สิทธิ์แก้ Session ถูกปฏิเสธ กำลังสร้าง JOB ด้วยวิธีสำรอง...');
      summary = await generateAnnualJobsClientSide({
        sessionId:config.sessionId,
        size,
        prefix,
        alertBox,
      });
    } else {
      summary = Array.isArray(rpcResult.data) ? rpcResult.data[0] : rpcResult.data;
    }

    const option = Q('as-sess')?.options?.[Q('as-sess').selectedIndex];
    if (option) {
      option.dataset.countMode = 'annual';
      option.dataset.annualSize = String(size);
      option.dataset.annualPrefix = prefix;
    }
    if (alertBox) {
      const fallbackNote = summary?.permission_fallback ? '<br><span style="font-size:10px">ใช้โหมดสำรองโดยไม่แก้ตาราง Session</span>' : '';
      alertBox.innerHTML = `<div class="alert alert-green" style="margin-top:12px">✅ สร้าง ${Number(summary?.job_count||0).toLocaleString('th-TH')} JOB จาก ${Number(summary?.item_count||0).toLocaleString('th-TH')} รายการแล้ว${fallbackNote}</div>`;
    }
    await loadAnnualJobWorkspace();
  } catch (error) {
    console.error('Annual JOB generation failed:',error);
    if (alertBox) {
      const permissionHelp = isAnnualJobPermissionError(error)
        ? '<br><span style="font-size:10px">บัญชีนี้ยังไม่มีสิทธิ์เขียนตาราง Annual JOB กรุณาใช้บัญชี Admin หรือตรวจสิทธิ์ฐานข้อมูล</span>'
        : '';
      alertBox.innerHTML = `<div class="alert alert-red" style="margin-top:12px">❌ สร้าง Annual JOB ไม่สำเร็จ: ${escapeWmsText(error.message || error)}${permissionHelp}</div>`;
    }
  } finally {
    if (button) { button.disabled = false; button.textContent = '⚙️ สร้าง / แบ่ง Annual JOB'; }
  }
}

async function assignSelectedAnnualJobs() {
  const jobIds = selectedAnnualJobIds();
  const userId = Q('annual-assign-user')?.value;
  if (!jobIds.length || !userId) { alert('กรุณาเลือก JOB และ User ผู้รับงาน'); return; }
  const userName = Q('annual-assign-user')?.options?.[Q('annual-assign-user').selectedIndex]?.textContent || 'User';
  const jobCodes = jobIds.map(id =>
    _annualWorkspaceJobs.find(job => job.id === id)?.job_code || id
  );
  if (!confirm(`จ่าย ${jobIds.length} JOB ให้ ${userName}?`)) return;
  const button = Q('annual-assign-btn');
  if (button) { button.disabled = true; button.textContent = 'กำลังจ่ายงาน...'; }
  const batchSize = 80;
  for (let start=0; start<jobIds.length; start+=batchSize) {
    const { error } = await sb.from('annual_count_jobs').update({
      assigned_to:userId,
      assigned_at:new Date().toISOString(),
      status:'pending',
    }).in('id',jobIds.slice(start,start+batchSize));

      alert('จ่าย Annual JOB ไม่สำเร็จ: ' + error.message);
      if (button) { button.disabled = false; button.textContent = '✓ จ่าย JOB ที่เลือก'; }
      return;
    }
  }
  try {
    await ensureAnnualJobAssignments(jobIds,userId);
  } catch (error) {
    alert(`จ่าย JOB แล้ว แต่สร้างงานสำหรับหน้า "บันทึกการนับ" ไม่สำเร็จ: ${error.message || error}\n\nกรุณาลองกดจ่าย JOB ชุดนี้อีกครั้ง`);
    if (button) { button.disabled = false; button.textContent = '✓ จ่าย JOB ที่เลือก'; }
    return;
  }
  if (button) button.textContent = '✓ จ่าย JOB ที่เลือก';
  await loadAnnualJobWorkspace();
  showAssignmentSuccessModal({
    count:jobIds.length,
    unit:'Annual JOB',
    userName,
    detail:'พร้อมพิมพ์ Form Count ของ JOB ที่เพิ่งจ่าย',
    jobCodes,
    printAction:() => printAnnualJobForms(jobIds),
  });
}

async function refreshZoneDashboard() {
  const sid = Q('as-sess')?.value; const box = Q('zone-dash-body');
  if (!sid || !box) return;
  box.innerHTML = `<div class="load" style="padding:20px;font-size:14px;text-align:center; font-weight:600;">⏳ กำลังคำนวณ...</div>`;

  let snaps = [], asgns = [];
  try {
    const workspace = await loadAssignmentWorkspaceData(sid);
    if (Q('as-sess')?.value !== sid) return;
    snaps = workspace.snapshots;
    asgns = workspace.assignments;
  } catch (error) {
    box.innerHTML = errBox(error.message);
    return;
  }

  const zoneTotals = {}; const seenLoc = new Set();
  (snaps||[]).forEach(s => {
    if (!s.locations || seenLoc.has(s.locations.id)) return;
    seenLoc.add(s.locations.id);
    const z = s.locations.zone || '(ไม่ระบุ Zone)';
    zoneTotals[z] = (zoneTotals[z]||0) + 1;
  });

  const zoneAssigned = {}; const zoneUsers = {};
  (asgns||[]).forEach(a => {
    const z = a.locations?.zone || '(ไม่ระบุ Zone)';
    zoneAssigned[z] = (zoneAssigned[z]||0) + 1;
    const userName = a.profiles?.name || 'ไม่ระบุ User';
    zoneUsers[z] = zoneUsers[z] || {};
    zoneUsers[z][userName] = (zoneUsers[z][userName]||0) + 1;
  });

  const allZones = [...new Set([...Object.keys(zoneTotals), ...Object.keys(zoneAssigned)])].sort();
  if (!allZones.length) { box.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:14px; font-weight:600;">ยังไม่มีข้อมูลใน Session นี้</div>`; return; }

  box.innerHTML = allZones.map(z => {
    const total = zoneTotals[z] || 0; const assigned = zoneAssigned[z] || 0; const pct = total ? Math.round(assigned/total*100) : 0;

const XLSX_INFO_COLUMN_RULES = Object.freeze({
  item:{
    label:'Item',
    exact:['ITEM','ITEMCODE','ITEMNUMBER','SKU','ARTICLE','MATERIAL','MATERIALNUMBER','PRODUCTNUMBER'],
    contains:['ITEMCODE','ITEMNUMBER','MATERIALNUMBER','PRODUCTNUMBER'],
  },
  description:{
    label:'Description',
    exact:['ITEMDESC','ITEMDESCRIPTION','DESCRIPTION','PRODUCTNAME','ITEMNAME','NAME'],
    contains:['ITEMDESCRIPTION','DESCRIPTION','PRODUCTNAME'],
  },
  uom:{
    label:'UOM',
    exact:['UOM','OUM','UNIT','UNITOFMEASURE','STOCKUNIT','INVENTORYUNIT'],
    contains:['UNITOFMEASURE','INVENTORYUNIT'],
  },
  category:{
    label:'CATEGORY',
    exact:['CATEGORY','ITEMCATEGORY','PRODUCTCATEGORY','PRODUCTGROUP','ITEMCLASS'],
    contains:['CATEGORY','PRODUCTGROUP','ITEMCLASS'],
  },
});

let _infoSourceFileName = '';

function mergeDataInfoAttribute(target,key,value) {
  const text = normalizeImportText(value);
  if (!text) return;
  const current = target[key];
  if (current === undefined) {
    target[key] = text;
    return;
  }
  const values = Array.isArray(current) ? current : [current];
  if (!values.includes(text)) values.push(text);
  target[key] = values.length === 1 ? values[0] : values;
}

function analyzeDataInfoRows(rows) {
  const headers = [...new Set((rows || []).flatMap(row => Object.keys(row || {})))];
  const columns = Object.fromEntries(
    Object.entries(XLSX_INFO_COLUMN_RULES).map(([key,rule]) => [key,resolveImportColumn(headers,rule)])
  );
  const errors = columns.item ? [] : ['ไม่พบคอลัมน์ Item / Item Code'];
  const grouped = new Map();
  const rejected = [];

  (rows || []).forEach((row,index) => {
    const itemCode = columns.item ? importCodeKey(row?.[columns.item]) : '';
    const hasAnyValue = headers.some(header => normalizeImportText(row?.[header]));
    if (!hasAnyValue) return;
    if (!itemCode) {
      rejected.push({ rowNumber:index + 2, reason:'Item ว่าง' });
      return;
    }
    if (!grouped.has(itemCode)) {
      grouped.set(itemCode,{
        item_code:itemCode,
        description:'',
        uom:'',
        category:'',
        attributes:{},
        sourceRows:[],
      });
    }
    const info = grouped.get(itemCode);
    info.sourceRows.push(index + 2);
    const value = key => columns[key] ? normalizeImportText(row?.[columns[key]]) : '';
    if (!info.description && value('description')) info.description = value('description');
    if (!info.uom && value('uom')) info.uom = value('uom');
    if (!info.category && value('category')) info.category = value('category');
    headers.forEach(header => {
      if (!isDataInfoBarcodeAttribute(header)) {
        mergeDataInfoAttribute(info.attributes,header,row?.[header]);
      }
    });
  });

  const parsed = [...grouped.values()];
  const mappedHeaders = new Set(Object.values(columns).filter(Boolean));
  return {
    headers,
    columns,
    errors,
    rejected,
    parsed,
    unknownHeaders:headers.filter(header => !mappedHeaders.has(header) && !isDataInfoBarcodeAttribute(header)),
    metrics:{
      rows:(rows || []).length,
      items:parsed.length,
      duplicates:parsed.reduce((sum,row) => sum + Math.max(0,row.sourceRows.length - 1),0),
      descriptions:parsed.filter(row => row.description).length,
      uoms:parsed.filter(row => row.uom).length,
      categories:parsed.filter(row => row.category).length,
    },
  };
}

function readDataInfoFile(event) {
  const file = event.target.files?.[0];
  _infoSourceFileName = file?.name || '';
  _infoRawRows = null;
  _infoImportAnalysis = null;
  _infoWorksheetName = '';
  const preview = Q('data-info-preview');
  const button = Q('data-info-import-btn');
  if (button) button.disabled = true;
  if (!file) {
    if (preview) preview.innerHTML = '';
    return;
  }
  if (file.size > 80 * 1024 * 1024) {
    if (preview) preview.innerHTML = errBox('ไฟล์ Item Master ต้องมีขนาดไม่เกิน 80 MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = loaded => {
    try {
      const workbook = XLSX.read(new Uint8Array(loaded.target.result),{ type:'array',cellDates:false });
      const candidates = workbook.SheetNames.map((sheetName,index) => {
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{
          defval:'',raw:false,blankrows:false,
        });
        const analysis = analyzeDataInfoRows(rows);
        const score = (analysis.errors.length ? -1000000 : 0) + analysis.parsed.length;
        return { sheetName,rows,analysis,score,index };
      }).sort((left,right) => right.score-left.score || left.index-right.index);
      const selected = candidates[0];
      if (!selected?.rows?.length) throw new Error('ไม่พบข้อมูลในไฟล์');
      _infoWorksheetName = selected.sheetName;
      _infoRawRows = selected.rows;
      _infoImportAnalysis = selected.analysis;
      if (preview) preview.innerHTML = renderDataInfoPreview(selected.analysis);
      if (button) {
        button.disabled = !selected.analysis.parsed.length
          || Boolean(selected.analysis.errors.length)
          || Boolean(selected.analysis.rejected.length);
      }
    } catch (error) {
      if (preview) preview.innerHTML = errBox(error.message || 'อ่านไฟล์ Item Master ไม่สำเร็จ');
    }
  };
  reader.onerror = () => {
    if (preview) preview.innerHTML = errBox('อ่านไฟล์ Item Master ไม่สำเร็จ');
  };
  reader.readAsArrayBuffer(file);
}

async function importDataInfoFile() {
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const analysis = _infoImportAnalysis;
  const button = Q('data-info-import-btn');
  const alertBox = Q('data-info-alert');
  if (!analysis?.parsed?.length || analysis.errors.length || analysis.rejected.length) {
    alert('ไฟล์ Item Master ยังไม่ผ่านการตรวจ');
    return;
  }
  const replaceAll = Q('data-info-replace')?.checked === true;
  if (replaceAll && !confirm('ยืนยันแทนที่ Item Master เดิมทั้งหมดด้วยไฟล์นี้?')) return;

  button.disabled = true;
  alertBox.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก ${analysis.parsed.length.toLocaleString('th-TH')} Item...</div>`;
  try {
    const rows = analysis.parsed.map(row => ({
      item_code:row.item_code,
      description:row.description || null,
      uom:row.uom || null,
      barcode:null,
      attributes:sanitizeDataInfoAttributes(row.attributes),
      source_file:_infoSourceFileName || null,
      source_sheet:_infoWorksheetName || null,
      updated_by:me.id,
      updated_at:new Date().toISOString(),
    }));
    if (replaceAll) {
      const { error } = await sb.from('data_info_items').delete().neq('item_code','');
      if (error) throw error;
    }
    const batchSize = 200;
    for (let start=0; start<rows.length; start+=batchSize) {
      const { error } = await sb.from('data_info_items')
        .upsert(rows.slice(start,start+batchSize),{ onConflict:'item_code' });
      if (error) throw error;
    }
    const verifyResult = await fetchSupabaseRowsByValues(
      'data_info_items','item_code','item_code',rows.map(row => row.item_code)
    );
    if (verifyResult.error) throw verifyResult.error;
    if (new Set((verifyResult.data || []).map(row => row.item_code)).size !== rows.length) {
      throw new Error('ตรวจสอบหลังอัปโหลดไม่ผ่าน: จำนวน Item ไม่ครบ');
    }
    _dataInfoMatchCache.clear();
    _dataInfoMatchCacheTime.clear();
    alertBox.innerHTML = `<div class="alert alert-green">✅ อัปโหลด Item Master สำเร็จ ${rows.length.toLocaleString('th-TH')} Item</div>`;
    _infoRawRows = null;
    _infoImportAnalysis = null;
    _infoWorksheetName = '';
    _infoSourceFileName = '';
    if (Q('data-info-file')) Q('data-info-file').value = '';
    if (Q('data-info-preview')) Q('data-info-preview').innerHTML = '';
    await loadDataInfoSummary();
  } catch (error) {
    alertBox.innerHTML = errBox(error.message || error);
    button.disabled = false;
  }
}

let _ohSyncRequestId = 0;

function paintOHToggle(value, disabled=false) {
  const tog = Q('oh-toggle');
  const st = Q('oh-status');
  if (tog) {
    tog.checked = Boolean(value);
    tog.disabled = Boolean(disabled);
  }
  if (st) {
    st.textContent = value ? '🔓 เห็น OH' : '🔒 Blind Count';
    st.className = `tag ${value?'tag-green':'tag-gray'}`;
  }
}

async function syncOHToggle() {
  const select = Q('as-sess');
  const sid = select?.value;
  if (!sid) return;
  const requestId = ++_ohSyncRequestId;
  const option = [...(select?.options || [])].find(row => row.value === sid);
  const cachedValue = option?.dataset?.showOh === 'true';
  paintOHToggle(cachedValue,true);
  const { data, error } = await sb.from('count_sessions').select('show_oh').eq('id', sid).maybeSingle();
  if (requestId !== _ohSyncRequestId || Q('as-sess')?.value !== sid) return;
  if (error) {
    paintOHToggle(cachedValue,false);
    alert('❌ โหลดสถานะ OH ของ Session นี้ไม่สำเร็จ: ' + error.message);
    return;
  }
  const value = data?.show_oh === true;
  if (option) option.dataset.showOh = String(value);
  paintOHToggle(value,false);
}

async function toggleOH() {
  const select = Q('as-sess');
  const sid = select?.value;
  const tog = Q('oh-toggle');
  if (!sid || !tog) return;
  const requestId = ++_ohSyncRequestId;
  const option = [...(select?.options || [])].find(row => row.value === sid);
  const previousValue = option?.dataset?.showOh === 'true';
  const value = Boolean(tog.checked);
  paintOHToggle(value,true);
  const { error } = await sb.from('count_sessions').update({ show_oh:value }).eq('id',sid);
  if (error) {
    if (requestId === _ohSyncRequestId && Q('as-sess')?.value === sid) {
      paintOHToggle(previousValue,false);
      alert('❌ บันทึก OH ของ Session นี้ไม่สำเร็จ: ' + error.message);
    }
    return;
  }
  if (option) option.dataset.showOh = String(value);
  if (requestId === _ohSyncRequestId && Q('as-sess')?.value === sid) {
    paintOHToggle(value,false);
  }
}

    btn.disabled = true;
    return;
  }

  fillDependentSelect('r23-zone', (asgns||[]).map(a => a.locations?.zone));
  const zone = Q('r23-zone')?.value || '';
  const zoneAssignments = (asgns||[]).filter(a => !zone || a.locations?.zone === zone);
  fillDependentSelect('r23-row', zoneAssignments.map(a => a.locations?.row_no));
  const row = Q('r23-row')?.value || '';

  const filtered = zoneAssignments.filter(a => {
    if (row && String(a.locations?.row_no ?? '') !== String(row)) return false;
    return true;
  });
  window._r23Asgns = filtered;

  if (!filtered.length) { prev.innerHTML = `<span style="color:var(--text-muted)">ไม่มี Location ในสถานะที่เลือก</span>`; btn.disabled = true; } 
  else { const label = { round1_done:'รอบ 2', round2_done:'รอบ 3', round3_done:'รอบ Sup' }[status]||status; prev.innerHTML = `📍 พบ <strong>${filtered.length}</strong> locations รอ${label}`; btn.disabled = false; }
}

async function doR23Assign() {
  const uid = Q('r23-user')?.value; const asgns = window._r23Asgns || [];
  if (!uid || !asgns.length) return;
  Q('r23-btn').disabled = true; Q('r23-preview').innerHTML = `<span>⏳ กำลังเปลี่ยน User ผู้รับงาน ${asgns.length} assignments...</span>`;
  const newLabel = Q('r23-user').options[Q('r23-user').selectedIndex]?.textContent || '';
  const previousUserIds = [...new Set(asgns.map(a => a.assigned_to).filter(Boolean))];
  const { data: previousUsers } = previousUserIds.length
    ? await sb.from('profiles').select('id,name').in('id', previousUserIds)
    : { data: [] };
  const previousUserMap = Object.fromEntries((previousUsers || []).map(user => [user.id, user.name]));
  const BATCH = 200;
  for (let i = 0; i < asgns.length; i += BATCH) {
    const chunk = asgns.slice(i, i+BATCH);
    for (const a of chunk) {
      await sb.from('assignments').update({ assigned_to: uid }).eq('id', a.id);
      logAudit(a.session_id, a.location_id, null, 'reassign', previousUserMap[a.assigned_to] || 'ไม่ระบุ User', newLabel, a.id);
    }
  }
  const sid = Q('as-sess')?.value;
  const locationIds = [...new Set(asgns.map(assignment => assignment.location_id).filter(Boolean))];
  Q('r23-preview').innerHTML = '';
  invalidateAssignmentWorkspaceCache(sid);
  Q('r23-btn').disabled = false; window._r23Asgns = []; refreshLocs(); refreshBulkFilters();
  showAssignmentSuccessModal({
    count:locationIds.length,
    unit:'Location',
    userName:newLabel,
    detail:'เปลี่ยน User ผู้รับงานในรอบถัดไปเรียบร้อยแล้ว',
    printAction:() => printCountForm(locationIds,sid),
  });
}

function getNormalLocationRows() {
  const assignmentsByLocation = new Map(
    (window._bulkAssignments || []).map(assignment => [assignment.location_id,assignment])
  );
  const seen = new Set();
  const rows = [];
  (window._bulkSnaps || []).forEach(snapshot => {
    const location = snapshot.locations;
    if (!location || seen.has(location.id)) return;
    seen.add(location.id);
    rows.push({
      location,
      assignment:assignmentsByLocation.get(location.id) || null,
    });
  });
  return sortRowsByLocation(rows,row => row.location?.code);
}

function handleR23FilterChange(key) {
  if (key === 'round') {
    if (Q('r23-zone')) Q('r23-zone').value = '';
    if (Q('r23-row')) Q('r23-row').value = '';
  } else if (key === 'zone') {
    if (Q('r23-row')) Q('r23-row').value = '';
  }
  refreshR23Preview();
}

function normalFreeSearchMatches(entry, search) {
  if (!search) return true;
  const status = entry.assignment?.status || 'unassigned';
  const location = entry.location || {};
  const searchable = [
    location.code,location.zone,location.area,location.row_no,location.level,
    entry.assignment?.profiles?.name,status,
  ].filter(Boolean).join(' ').toLowerCase();
  return searchable.includes(search);
}

function handleNormalFreeFilterChange(key) {
  const downstream = {
    search:['normal-free-zone','normal-free-row','normal-free-level','normal-free-status'],
    zone:['normal-free-row','normal-free-level','normal-free-status'],
    row:['normal-free-level','normal-free-status'],
    level:['normal-free-status'],
  };
  (downstream[key] || []).forEach(id => {
    const select = Q(id);
    if (!select) return;
    select.value = id === 'normal-free-status' ? 'all' : '';
  });
  refreshNormalFreeDependentFilters();
}

function refreshNormalFreeStatusAvailability(scopedRows) {
  const select = Q('normal-free-status');
  if (!select) return;
  const available = new Set(scopedRows.map(entry => entry.assignment?.status || 'unassigned'));
  [...select.options].forEach(option => {
    option.disabled = option.value !== 'all' && !available.has(option.value);
  });
  if (select.value !== 'all' && !available.has(select.value)) select.value = 'all';
}

function refreshNormalFreeDependentFilters() {
  const search = String(Q('normal-free-search')?.value || '').trim().toLowerCase();
  const sourceRows = getNormalLocationRows().filter(entry => normalFreeSearchMatches(entry,search));
  const locations = sourceRows.map(row => row.location);
  const zone = fillDependentSelect(
    'normal-free-zone',
    locations.map(location => location.zone),
    'ทั้งหมด',
    Q('normal-free-zone')?.value,
  );
  const zoneLocations = locations.filter(location => !zone || location.zone === zone);
  const row = fillDependentSelect(
    'normal-free-row',
    zoneLocations.map(location => location.row_no),
    'ทั้งหมด',
    Q('normal-free-row')?.value,
  );
  const rowLocations = zoneLocations.filter(location =>
    !row || String(location.row_no ?? '') === String(row)
  );
  fillDependentSelect(
    'normal-free-level',
    rowLocations.map(location => location.level),
    'ทั้งหมด',
    Q('normal-free-level')?.value,
  );
  const level = Q('normal-free-level')?.value || '';
  const statusScopedRows = sourceRows.filter(entry => {
    const location = entry.location;
    if (zone && location.zone !== zone) return false;
    if (row && String(location.row_no ?? '') !== String(row)) return false;
    if (level && String(location.level ?? '') !== String(level)) return false;
    return true;
  });
  refreshNormalFreeStatusAvailability(statusScopedRows);
  renderNormalFreeLocationList();
}

function renderNormalFreeLocationList() {
  const list = Q('normal-free-location-list');
  if (!list) return;
  const rows = getNormalLocationRows();
  const availableIds = new Set(
    rows.filter(row => !row.assignment).map(row => row.location.id)
  );
  _normalFreeSelectedLocationIds = new Set(
    [..._normalFreeSelectedLocationIds].filter(id => availableIds.has(id))
  );
  const zone = Q('normal-free-zone')?.value || '';
  const row = Q('normal-free-row')?.value || '';
  const level = Q('normal-free-level')?.value || '';
  const statusFilter = Q('normal-free-status')?.value || 'unassigned';
  const search = String(Q('normal-free-search')?.value || '').trim().toLowerCase();
  const filtered = rows.filter(entry => {
    const location = entry.location;
    const status = entry.assignment?.status || 'unassigned';
    if (zone && location.zone !== zone) return false;
    if (row && String(location.row_no ?? '') !== String(row)) return false;
    if (level && String(location.level ?? '') !== String(level)) return false;
    if (statusFilter !== 'all' && status !== statusFilter) return false;
    if (!normalFreeSearchMatches(entry,search)) return false;
    return true;
  });
  const renderLimit = 300;
  const displayed = filtered.slice(0,renderLimit);
  _normalFreeFilteredLocationCount = filtered.length;
  _normalFreeVisibleLocationIds = displayed
    .filter(entry => !entry.assignment)
    .map(entry => entry.location.id);
  if (!filtered.length) {
    list.innerHTML = `<div class="annual-empty">${rows.length ? 'ไม่พบ Location ที่ตรงกับตัวกรองหรือสถานะงาน' : 'Session นี้ยังไม่มี Location'}</div>`;
    syncNormalFreeSelection();
    return;
  }
  const limitNote = filtered.length > renderLimit
    ? `<div class="alert alert-blue" style="margin:10px 12px;font-size:10px">แสดง ${renderLimit.toLocaleString('th-TH')} จาก ${filtered.length.toLocaleString('th-TH')} Location · ใช้ตัวกรองหรือช่องค้นหาเพื่อเลือกงานส่วนที่เหลือ</div>`
    : '';
  list.innerHTML = limitNote + displayed.map(entry => {
    const location = entry.location;
    const assignment = entry.assignment;
    const available = !assignment;
    const checked = _normalFreeSelectedLocationIds.has(location.id) ? 'checked' : '';
    const detail = [
      location.zone,location.area,
      location.row_no ? `Row ${location.row_no}` : '',
      location.level ? `Lv.${location.level}` : '',
    ].filter(Boolean).join(' · ');
    const status = available
      ? { cls:'tag-gray',lbl:'ยังไม่จ่ายงาน' }
      : tagInfo(assignment.status);
    const assignmentMeta = available
      ? 'เลือกอิสระ · ไม่จำกัดจำนวน'
      : `User: ${assignment.profiles?.name || 'ไม่ระบุ'}`;
    return `<label class="normal-free-row ${available?'':'is-assigned'}">
      <input class="normal-free-checkbox" type="checkbox" value="${location.id}" ${checked} ${available?'':'disabled'}
        onchange="toggleNormalFreeLocation('${location.id}',this.checked)">
      <span>
        <span class="normal-free-code">${escapeWmsText(location.code || '?')}</span>
        <span class="normal-free-meta" style="display:block;margin-top:3px">${escapeWmsText(detail || 'ไม่ระบุรายละเอียด')}</span>
      </span>
      <span class="normal-free-meta">${escapeWmsText(assignmentMeta)} <span class="tag ${status.cls}" style="margin-left:6px">${escapeWmsText(status.lbl)}</span></span>
    </label>`;
  }).join('');
  syncNormalFreeSelection();
}

function toggleNormalFreeLocation(locationId,checked) {
  if (checked) _normalFreeSelectedLocationIds.add(locationId);
  else _normalFreeSelectedLocationIds.delete(locationId);
  syncNormalFreeSelection();
}

function selectNormalFreeLocations(mode) {
  if (mode === 'visible') {
    _normalFreeVisibleLocationIds.forEach(id => _normalFreeSelectedLocationIds.add(id));
  } else {
    _normalFreeSelectedLocationIds.clear();
  }
  renderNormalFreeLocationList();
}

function syncNormalFreeSelection() {
  const count = Q('normal-free-count');
  const button = Q('normal-free-assign-btn');
  const selectedCount = _normalFreeSelectedLocationIds.size;
  if (count) count.textContent = `เลือก ${selectedCount.toLocaleString('th-TH')} Location · แสดง ${_normalFreeVisibleLocationIds.length.toLocaleString('th-TH')} / ${_normalFreeFilteredLocationCount.toLocaleString('th-TH')}`;
  if (button) button.disabled = selectedCount === 0;
}

async function assignSelectedNormalLocations() {
  const sid = Q('as-sess')?.value;
  const userId = Q('normal-free-user')?.value;
  const availableIds = new Set(getBulkAvailableLocations().map(location => location.id));
  const locationIds = [..._normalFreeSelectedLocationIds].filter(id => availableIds.has(id));
  const alertBox = Q('aa');
  const button = Q('normal-free-assign-btn');
  if (!sid || !userId || !locationIds.length) {
    if (alertBox) alertBox.innerHTML = `<div class="alert alert-amber">กรุณาเลือก User และ Location ที่ต้องการจ่ายงาน</div>`;
    return;
  }
  const userName = Q('normal-free-user')?.options?.[Q('normal-free-user').selectedIndex]?.textContent || 'User';
  if (!confirm(`จ่าย ${locationIds.length} Location ให้ ${userName}?`)) return;
  if (button) { button.disabled = true; button.textContent = '⏳ กำลังจ่ายงาน...'; }
  const rows = locationIds.map(locationId => ({
    session_id:sid,
    location_id:locationId,
    assigned_to:userId,
  }));
  const batchSize = 200;
  for (let start=0; start<rows.length; start+=batchSize) {
    const { error } = await sb.from('assignments')
      .upsert(rows.slice(start,start+batchSize),{
        onConflict:'session_id,location_id',
        ignoreDuplicates:true,
      });
    if (error) {
      if (alertBox) alertBox.innerHTML = `<div class="alert alert-red">❌ ${escapeWmsText(error.message)}</div>`;
      if (button) { button.disabled = false; button.textContent = '✓ จ่าย Location ที่เลือก'; }
      return;
    }
  }
  if (alertBox) alertBox.innerHTML = '';
  _normalFreeSelectedLocationIds.clear();
  invalidateAssignmentWorkspaceCache(sid);
  if (button) button.textContent = '✓ จ่าย Location ที่เลือก';
  await Promise.all([refreshLocs(),refreshBulkFilters()]);
  showAssignmentSuccessModal({
    count:locationIds.length,
    unit:'Location',
    userName,
    detail:'พร้อมพิมพ์ Form Count ของ Location ที่เพิ่งจ่าย',
    printAction:() => printCountForm(locationIds,sid),
  });
}

async function refreshBulkFilters() {
  const sid = Q('as-sess')?.value; if (!sid) return;
  let snaps = [], existing = [];
  try {
    const workspace = await loadAssignmentWorkspaceData(sid);
    if (Q('as-sess')?.value !== sid) return;
    snaps = workspace.snapshots;
    existing = workspace.assignments;
  } catch (error) {
    const preview = Q('bulk-preview');
    const button = Q('bulk-btn');
    if (preview) preview.innerHTML = `<span style="color:var(--accent-red)">${escapeWmsText(error.message)}</span>`;
    if (button) button.disabled = true;
    return;
  }

  const assignedSet = new Set(existing?.map(a => a.location_id) || []);
  window._bulkSnaps = snaps || [];
  window._bulkAssigned = assignedSet;
  window._bulkAssignments = existing || [];
  refreshBulkDependentFilters();
  refreshNormalFreeDependentFilters();
}

function getBulkAvailableLocations() {
  const snaps = window._bulkSnaps || [];
  const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set();
  const locations = [];
  for (const snap of snaps) {
    const location = snap.locations;
    if (!location || seen.has(location.id) || assignedSet.has(location.id)) continue;
    seen.add(location.id);
    locations.push(location);
  }
  return sortRowsByLocation(locations, location => location.code);
}

function refreshBulkDependentFilters() {
  const locations = getBulkAvailableLocations();
  fillDependentSelect('bulk-zone', locations.map(location => location.zone));
  const zone = Q('bulk-zone')?.value || '';
  const zoneLocations = locations.filter(location => !zone || location.zone === zone);

  fillDependentSelect('bulk-row', zoneLocations.map(location => location.row_no));
  const row = Q('bulk-row')?.value || '';
  const rowLocations = zoneLocations.filter(location =>
    !row || String(location.row_no ?? '') === String(row)
  );

  fillDependentSelect('bulk-level', rowLocations.map(location => location.level));
  refreshBulkPreview();
}

function refreshBulkPreview() {
  const zone = Q('bulk-zone')?.value; const row = Q('bulk-row')?.value; const level = Q('bulk-level')?.value;
  const snaps = window._bulkSnaps || []; const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set(); let count = 0;
  for (const s of snaps) {
    const l = s.locations; if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone && l.zone !== zone) continue;
    if (row && String(l.row_no ?? '') !== String(row)) continue;
    if (level && String(l.level ?? '') !== String(level)) continue;
    seen.add(l.id); count++;
  }
  const prev = Q('bulk-preview'), btn = Q('bulk-btn'); if (!prev || !btn) return;
  if (count > 0) { prev.innerHTML = `📍 จะ Assign <strong>${count} locations</strong> ให้ User ที่เลือก`; btn.disabled = false; } 
  else { prev.innerHTML = `<span style="color:var(--text-muted)">ไม่มี Location ที่ตรงเงื่อนไข</span>`; btn.disabled = true; }
}

async function doBulkAssign() {
  const sid = Q('as-sess')?.value; const uid = Q('bulk-user')?.value; const zone = Q('bulk-zone')?.value; const row = Q('bulk-row')?.value; const level = Q('bulk-level')?.value;
  const al = Q('aa'), btn = Q('bulk-btn');
  if (!sid || !uid) { al.innerHTML = `<div class="alert alert-red">เลือก Session และ User ผู้รับงานก่อน</div>`; return; }

  const snaps = window._bulkSnaps || []; const assignedSet = window._bulkAssigned || new Set();
  const seen = new Set(), toAssign = [];
  for (const s of snaps) {
    const l = s.locations; if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
    if (zone && l.zone !== zone) continue;
    if (row && String(l.row_no ?? '') !== String(row)) continue;
    if (level && String(l.level ?? '') !== String(level)) continue;
    seen.add(l.id); toAssign.push({ session_id: sid, location_id: l.id, assigned_to: uid });
  }

  if (!toAssign.length) { al.innerHTML = `<div class="alert alert-amber">ไม่มี Location ที่จะ Assign</div>`; return; }
  btn.disabled = true; al.innerHTML = `<div class="alert alert-blue">⏳ กำลัง Assign ${toAssign.length} locations...</div>`;
  const BATCH = 200;
  for (let i = 0; i < toAssign.length; i += BATCH) {
    const { error } = await sb.from('assignments').upsert(toAssign.slice(i, i+BATCH), { onConflict:'session_id,location_id' });
    if (error) { al.innerHTML = `<div class="alert alert-red">❌ ${error.message}</div>`; btn.disabled=false; return; }
  }
  const userName = Q('bulk-user')?.options?.[Q('bulk-user').selectedIndex]?.textContent || 'User';
  const locationIds = toAssign.map(assignment => assignment.location_id);
  al.innerHTML = '';
  invalidateAssignmentWorkspaceCache(sid);
  btn.disabled = false;
  await Promise.all([refreshLocs(),refreshBulkFilters()]);
  showAssignmentSuccessModal({
    count:locationIds.length,
    unit:'Location',
    userName,
    detail:'พร้อมพิมพ์ Form Count ของ Location ที่เพิ่งจ่าย',
    printAction:() => printCountForm(locationIds,sid),
  });
}

async function refreshLocs() {
  const sid = Q('as-sess')?.value; if (!sid) return;
  let snaps = [], asgns = [];
  try {
    const workspace = await loadAssignmentWorkspaceData(sid);
    if (Q('as-sess')?.value !== sid) return;
    snaps = workspace.snapshots;
    asgns = workspace.assignments;
  } catch (error) {
    const al = Q('al');
    if (al) al.innerHTML = errBox(error.message);
    return;
  }

  const assignedSet = new Set(asgns.map(a => a.location_id)); const seen = new Set(); const locs = [];
  for (const s of snaps || []) { if (!seen.has(s.location_id) && s.locations) { seen.add(s.location_id); locs.push(s.locations); } }
  const free = sortRowsByLocation(locs.filter(l => !assignedSet.has(l.id)), location => location.code);
  const sortedAssignments = sortRowsByLocation(asgns, assignment => assignment.locations?.code);
  const sel = Q('as-loc');
  if (sel) {
    sel.setAttribute('data-location-sort-select','');
    sel.innerHTML = free.length
      ? free.map(l => `<option value="${l.id}" data-location-code="${escapeWmsText(l.code || '')}">${l.code}${l.zone?' · '+l.zone:''}</option>`).join('')
      : '<option value="" data-location-sort-fixed="true">ทุก Location ถูก Assign แล้ว</option>';
  }

  const al = Q('al'); if (!al) return;
  window._printableAssignments = sortedAssignments;
  updateAssignWorkspaceStats(locs.length, (asgns || []).length, free.length);
  if (!asgns?.length) { al.innerHTML = `<div class="load" style="padding:20px;font-size:14px;color:var(--text-muted);text-align:center; font-weight:600;">ยังไม่มีการ Assign</div>`; return; }

  const stuckCount = asgns.filter(a => !['completed','approved'].includes(a.status)).length;
  let html = `<div class="assign-print-toolbar">
    <label class="assign-print-check">
      <input type="checkbox" id="assign-print-all-check" onchange="toggleAllAssignedPrint(this.checked)">
      <span>เลือกทั้งหมด</span>
    </label>
    <span class="assign-print-count" id="assign-print-count">เลือก 0 จาก ${asgns.length} Locations</span>
    <button class="btn btn-ghost btn-sm" id="assign-print-selected-btn" onclick="printSelectedAssignedWork()" disabled>🖨️ พิมพ์ที่เลือก</button>
    <button class="btn btn-blue btn-sm" onclick="printAllAssignedWork()">🖨️ พิมพ์ทั้งหมด (${asgns.length})</button>
  </div>`;
  if (stuckCount > 0) { html += `<div style="padding:14px 20px;background:rgba(251, 113, 133,0.05);border-bottom:1px solid rgba(255,255,255,0.4)"><button class="btn btn-ghost btn-sm admin-delete-icon" style="color:var(--accent-red)" onclick="deleteStuckAssignments()">${adminTrashIconSvg()} <span>ลบที่ยังไม่เสร็จทั้งหมด (${stuckCount})</span></button></div>`; }
  html += sortedAssignments.map(a => {
    const si = tagInfo(a.status); const code = (a.locations?.code || '').replace(/'/g, '');
    return `<div class="row assignment-print-row assign-list-row" data-location-sort-code="${escapeWmsText(a.locations?.code || '')}" style="cursor:default">
      <input class="assignment-print-select" type="checkbox" value="${a.location_id}" onchange="syncAssignedPrintSelection()" aria-label="เลือกพิมพ์ Location ${escapeWmsText(a.locations?.code || '')}">
      <div class="row-body"><div class="row-title mono">${a.locations?.code}</div><div class="row-sub">User ผู้รับงาน: ${escapeWmsText(a.profiles?.name || 'ไม่ระบุ')}</div></div>
      <span class="tag ${si.cls}">${si.lbl}</span>
      <button class="assignment-print-button" onclick='printCountForm(["${a.location_id}"],"${sid}")'
        title="พิมพ์ฟอร์ม Location นี้" aria-label="พิมพ์ฟอร์ม Location ${escapeWmsText(a.locations?.code || '')}">🖨️</button>
      <button class="admin-delete-icon" onclick="deleteAssignment('${a.id}','${code}')"
        title="ลบ Assignment นี้" aria-label="ลบ Assignment นี้"
        style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:8px;line-height:1;flex-shrink:0;transition:0.2s;">
        ${adminTrashIconSvg(18)}
      </button>
    </div>`;
  }).join('');
  al.innerHTML = html;
}

function selectedAssignedLocationIds() {
  return [...document.querySelectorAll('.assignment-print-select:checked')]
    .map(input => input.value)
    .filter(Boolean);
}

function syncAssignedPrintSelection() {
  const all = [...document.querySelectorAll('.assignment-print-select')];
  const selected = all.filter(input => input.checked);
  const allCheck = Q('assign-print-all-check');
  const count = Q('assign-print-count');
  const button = Q('assign-print-selected-btn');
  if (allCheck) {
    allCheck.checked = all.length > 0 && selected.length === all.length;
    allCheck.indeterminate = selected.length > 0 && selected.length < all.length;
  }
  if (count) count.textContent = `เลือก ${selected.length} จาก ${all.length} Locations`;
  if (button) button.disabled = selected.length === 0;
}

async function doAssign() {
  const sid = Q('as-sess')?.value; const uid = Q('as-user')?.value; const locId = Q('as-loc')?.value;
  const al = Q('aa');
  if (!sid || !uid || !locId) { al.innerHTML = `<div class="alert alert-amber">กรุณาเลือกให้ครบถ้วน</div>`; return; }
  const { error } = await sb.from('assignments').insert({ session_id: sid, location_id: locId, assigned_to: uid });
  if (error) { al.innerHTML = `<div class="alert alert-red">${error.message}</div>`; return; }
  const userName = Q('as-user')?.options?.[Q('as-user').selectedIndex]?.textContent || 'User';

  invalidateAssignmentWorkspaceCache(sid);
  await Promise.all([refreshLocs(),refreshBulkFilters()]);

    count:1,
    unit:'Location',
    userName,
    detail:'พร้อมพิมพ์ Form Count ของ Location ที่เพิ่งจ่าย',
    printAction:() => printCountForm([locId],sid),
  });
}

function pfEscapeHtml(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function fetchPrintSourceRows(table, columns, sessionId, locationIds) {
  const output = [];
  const uniqueIds = [...new Set((locationIds || []).filter(Boolean))];
  const ID_CHUNK = 80;
  const PAGE_SIZE = 1000;
  const chunks = [];
  for (let start=0;start<uniqueIds.length;start+=ID_CHUNK) {
    chunks.push(uniqueIds.slice(start,start+ID_CHUNK));
  }
  const fetchChunk = async ids => {
    const rows = [];
    for (let from = 0; ; from += PAGE_SIZE) {
      const { data, error } = await sb.from(table)
        .select(columns)
        .eq('session_id', sessionId)
        .in('location_id', ids)
        .range(from, from + PAGE_SIZE - 1);
      if (error) throw error;
      rows.push(...(data || []));
      if (!data || data.length < PAGE_SIZE) break;
    }
    return rows;
  };
  for (let start=0;start<chunks.length;start+=SUPABASE_READ_CONCURRENCY) {
    const wave = await Promise.all(
      chunks.slice(start,start+SUPABASE_READ_CONCURRENCY).map(fetchChunk)
    );
    wave.forEach(rows => output.push(...rows));
  }
  return output;
}

let _printCountRequestRunning = false;
let _printAnnualRequestRunning = false;

async function printCountForm(locationIds, sessionId) {
  if (!locationIds || !locationIds.length) return;
  if (_printCountRequestRunning) {
    alert('ระบบกำลังเตรียมฟอร์มพิมพ์อยู่ กรุณารอสักครู่');
    return;
  }
  _printCountRequestRunning = true;
  const printWindow = window.open('', '_blank');
  if (!printWindow) {
    _printCountRequestRunning = false;
    alert('เบราว์เซอร์บล็อกป๊อปอัพ กรุณาอนุญาตป๊อปอัพแล้วลองใหม่');
    return;
  }
  printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>กำลังเตรียมฟอร์มพิมพ์</title></head><body style="font-family:Arial,'Sarabun',sans-serif;padding:32px;color:#264653"><h3>⏳ กำลังเตรียมฟอร์มนับ...</h3><p>กรุณารอสักครู่</p></body></html>`);
  printWindow.document.close();
  try {
    await new Promise(resolve => setTimeout(resolve,0));
    const [{ data: sessData, error: sessionError }, snaps, details] = await Promise.all([
      sb.from('count_sessions').select('name,show_oh,annual_form_title,annual_form_logo_data_url').eq('id', sessionId).maybeSingle(),
      fetchPrintSourceRows('stock_snapshot','location_id,item_id,onhand_qty,locations(code),items(code,description)',sessionId,locationIds),
      fetchPrintSourceRows('stock_snapshot_detail','location_id,item_id,license_plate,lot,inventory_status,qty,uom',sessionId,locationIds),
    ]);
    if (sessionError) throw sessionError;
    const sessionName = uiBranding.printFormTitle || sessData?.annual_form_title || sessData?.name || 'Cycle Count';
    const detailMap = {};
    (details||[]).forEach(detail => {
      const key = detail.location_id+'|'+detail.item_id;
      detailMap[key] = detailMap[key] || [];
      detailMap[key].push(detail);
    });
    const rows = (snaps||[])
      .map(s => {
        const itemDetails = detailMap[s.location_id+'|'+s.item_id] || [];
        return {
          locCode:s.locations?.code || '?',
          itemCode:s.items?.code || '',
          desc:s.items?.description || '',
          status:[...new Set(itemDetails.map(detail => detail.inventory_status).filter(Boolean))].join(', '),
          ohQty:Number(s.onhand_qty) || 0,
          uom:itemDetails.find(detail => detail.uom)?.uom || '',
          details:itemDetails,
        };
      })
      .sort((a,b) => compareLocationCodes(a.locCode,b.locCode) || a.itemCode.localeCompare(b.itemCode,'en',{numeric:true,sensitivity:'base'}));
    if (!rows.length) {
      printWindow.document.open();
      printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ไม่พบรายการ</title></head><body style="font-family:Arial,'Sarabun',sans-serif;padding:32px"><h3>ไม่พบรายการสินค้าสำหรับ Location ที่เลือก</h3><button onclick="window.close()">ปิดหน้าต่าง</button></body></html>`);
      printWindow.document.close();
      return;
    }
    openPrintFormWindow(rows, sessionName, printWindow, {
      showOH:sessData?.show_oh === true,
    });
  } catch (error) {
    printWindow.document.open();
    printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>เตรียมฟอร์มไม่สำเร็จ</title></head><body style="font-family:Arial,'Sarabun',sans-serif;padding:32px;color:#9f412d"><h3>❌ เตรียมฟอร์มพิมพ์ไม่สำเร็จ</h3><p>${pfEscapeHtml(error.message || 'เกิดข้อผิดพลาด')}</p><button onclick="window.close()">ปิดหน้าต่าง</button></body></html>`);
    printWindow.document.close();
  } finally {
    _printCountRequestRunning = false;
  }
}
function printPageSettings(style = uiBranding.printFormStyle) {
  const paper = ['A4','A3','Letter'].includes(uiBranding.printPaperSize) ? uiBranding.printPaperSize : 'A4';
  const orientation = uiBranding.printOrientation === 'auto'
    ? (style === 'detailed' ? 'portrait' : 'landscape')
    : uiBranding.printOrientation;
  return {
    paper,
    orientation,
    margin:Math.max(3,Math.min(20,Number(uiBranding.printMarginMm) || 7)),
    accent:normalizeHexColor(uiBranding.printAccentColor,DEFAULT_BRANDING.printAccentColor),
  };
}

function printWindowScript() {
  const autoPrint = uiBranding.printAutoOpenDialog === true;
  return `<script>(function(){
    var printRequested=false;
    var printMediaEntered=false;
    var cleanupStarted=false;
    function finishPrint(){
      if(cleanupStarted)return;
      cleanupStarted=true;
      try{
        if(window.opener&&!window.opener.closed){
          window.opener.focus();
        }
      }catch(_){}
      setTimeout(function(){try{window.close();}catch(_){}},80);
    }
    function finishSoon(){setTimeout(finishPrint,180);}
    window.addEventListener('afterprint',finishSoon,{once:true});
    try{
      var printMedia=window.matchMedia('print');
      var onPrintMediaChange=function(event){
        if(event.matches){
          printMediaEntered=true;
        }else if(printMediaEntered){
          finishSoon();
        }
      };
      if(printMedia.addEventListener)printMedia.addEventListener('change',onPrintMediaChange);
      else if(printMedia.addListener)printMedia.addListener(onPrintMediaChange);
    }catch(_){}
    window.addEventListener('focus',function(){
      if(printRequested){
        setTimeout(function(){
          if(!printMediaEntered)finishPrint();
        },700);
      }
    });
    window.addEventListener('load',function(){
      ${autoPrint ? `var images=Array.from(document.images||[]);
      Promise.all(images.map(function(img){
        return img.complete?Promise.resolve():new Promise(function(done){
          img.addEventListener('load',done,{once:true});
          img.addEventListener('error',done,{once:true});
        });
      })).then(function(){
        setTimeout(function(){
          printRequested=true;
          window.print();
        },250);
      });` : ''}
    },{once:true});
  })();<\/script>`;
}

function detailedPageContentHeight() {
  const settings = printPageSettings('detailed');
  const paperDimensions = {
    A4:[210,297],
    A3:[297,420],
    Letter:[215.9,279.4],
  };
  const dimensions = paperDimensions[settings.paper] || paperDimensions.A4;
  const pageHeightMm = settings.orientation === 'landscape' ? dimensions[0] : dimensions[1];
  const printableHeightPx = Math.max(0,pageHeightMm-(settings.margin*2)) * (96/25.4);
  const headerAndSafetyPx = uiBranding.printShowSignatures ? 132 : 100;
  return Math.max(500,Math.floor(printableHeightPx-headerAndSafetyPx));
}

function paginateDetailedRows(rows,maxPageHeight = detailedPageContentHeight()) {
  const pages = [];
  let page = [];
  let usedHeight = 0;
  (rows || []).forEach(row => {
    const detailCount = Math.max(1,(row.details || []).length);
    const estimatedHeight = 112 + (detailCount * 22);
    if (page.length && usedHeight + estimatedHeight > maxPageHeight) {
      pages.push(page);
      page = [];
      usedHeight = 0;
    }
    page.push(row);
    usedHeight += estimatedHeight;
  });
  if (page.length || !pages.length) pages.push(page);
  return pages;
}

async function printAnnualJobForms(jobIds) {
  const uniqueJobIds = [...new Set((jobIds || []).filter(Boolean))];
  if (!uniqueJobIds.length) return;
  if (_printAnnualRequestRunning) {
    alert('ระบบกำลังเตรียม Annual Form Count อยู่ กรุณารอสักครู่');
    return;
  }
  _printAnnualRequestRunning = true;
  const printWindow = window.open('','_blank');
  if (!printWindow) {
    _printAnnualRequestRunning = false;
    alert('เบราว์เซอร์บล็อกป๊อปอัพ กรุณาอนุญาตป๊อปอัพแล้วลองใหม่');
    return;
  }
  printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>กำลังเตรียม Annual Form Count</title></head><body style="font-family:Arial,'Sarabun',sans-serif;padding:32px;color:#264653"><h3>⏳ กำลังเตรียม Annual JOB...</h3><p>กรุณารอสักครู่</p></body></html>`);
  printWindow.document.close();
  try {
    await new Promise(resolve => setTimeout(resolve,0));
    const [jobsResult,itemsResult] = await Promise.all([
      fetchSupabaseRowsByValues(
        'annual_count_jobs',
        'id,session_id,job_no,job_code,assigned_to,status,count_sessions(name,show_oh,annual_items_per_job,annual_job_prefix,annual_form_title,annual_form_logo_data_url)',
        'id',
        uniqueJobIds,
      ),
      fetchSupabaseRowsByValues(
        'annual_count_job_items',
        'job_id,session_id,location_id,item_id,sort_order,locations(code),items(code,description)',
        'job_id',
        uniqueJobIds,
      ),
    ]);
    if (jobsResult.error || itemsResult.error) throw (jobsResult.error || itemsResult.error);
    const jobs = (jobsResult.data || []).sort((a,b) => a.job_no-b.job_no);
    if (!jobs.length) throw new Error('ไม่พบ Annual JOB ที่เลือก');
    const sessionId = jobs[0].session_id;
    const validJobIds = new Set(jobs.filter(job => job.session_id === sessionId).map(job => job.id));
    const itemRows = (itemsResult.data || []).filter(row => validJobIds.has(row.job_id));
    const locationIds = [...new Set(itemRows.map(row => row.location_id).filter(Boolean))];
    const [detailRows,snapshotRows] = await Promise.all([
      fetchPrintSourceRows(
        'stock_snapshot_detail',
        'location_id,item_id,license_plate,lot,inventory_status,qty,uom',
        sessionId,
        locationIds,
      ),
      fetchPrintSourceRows(
        'stock_snapshot',
        'location_id,item_id,onhand_qty',
        sessionId,
        locationIds,
      ),
    ]);
    const detailMap = {};
    (detailRows || []).forEach(detail => {
      const key = `${detail.location_id}|${detail.item_id}`;
      detailMap[key] = detailMap[key] || [];
      detailMap[key].push(detail);
    });
    const ohMap = {};
    (snapshotRows || []).forEach(snapshot => {
      ohMap[`${snapshot.location_id}|${snapshot.item_id}`] = Number(snapshot.onhand_qty) || 0;
    });
    const itemsByJob = {};
    itemRows.forEach(row => {
      const details = detailMap[`${row.location_id}|${row.item_id}`] || [];
      itemsByJob[row.job_id] = itemsByJob[row.job_id] || [];
      itemsByJob[row.job_id].push({
        sortOrder:Number(row.sort_order) || 0,
        locCode:row.locations?.code || '?',
        itemCode:row.items?.code || '',
        description:row.items?.description || '',
        uom:details.find(detail => detail.uom)?.uom || '',
        inventoryStatus:[...new Set(details.map(detail => detail.inventory_status).filter(Boolean))].join(', '),
        ohQty:ohMap[`${row.location_id}|${row.item_id}`] ?? 0,
        details,
      });
    });
    const packs = jobs.map(job => ({
      job,
      rows:(itemsByJob[job.id] || []).sort((a,b) => a.sortOrder-b.sortOrder),
    }));
    openAnnualJobPrintWindow(packs,printWindow);
  } catch (error) {
    printWindow.document.open();
    printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>เตรียมฟอร์มไม่สำเร็จ</title></head><body style="font-family:Arial,'Sarabun',sans-serif;padding:32px;color:#9f412d"><h3>❌ เตรียม Annual Form Count ไม่สำเร็จ</h3><p>${pfEscapeHtml(error.message || 'เกิดข้อผิดพลาด')}</p><button onclick="window.close()">ปิดหน้าต่าง</button></body></html>`);
    printWindow.document.close();
  } finally {
    _printAnnualRequestRunning = false;
  }
}
