                  <div style="font-size:10px;color:#6b7280">${it.description||''}</div>
                  <div style="font-size:9px;color:#9ca3af">R1: ${fmt(v[1])} · R2: ${fmt(v[2])} · R3: ${fmt(v[3])}</div>
                  ${ohCell}
                  ${notes}
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <span class="tag ${st.cls}">${st.lbl}</span>
                  <div style="font-size:8px;color:#9ca3af;margin-top:4px">ยืนยัน</div>
                  <input type="number" id="confirm_${it.id}" value="${suggested}" style="width:60px;padding:4px 2px;font-size:14px;font-weight:800;text-align:center;border:1.5px solid #e5e7eb;border-radius:10px;margin-top:2px;font-family:inherit">
                </div>
              </div>
            </div>`;
            }

            cnt().innerHTML = `
            <div class="card">
              <div class="mono" style="font-size:18px;font-weight:800">${l.code}</div>
              <div style="font-size:12px;color:#6b7280">${[l.zone,l.area].filter(Boolean).join(' · ')} · ${asgn.profiles?.name||'?'}</div>
              <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
                <span class="tag tag-blue">รอบ ${roundNum}</span>
                ${hasVar?`<span class="tag tag-red">⚠️ Variance</span>`:`<span class="tag tag-green">✅ ตรง</span>`}
              </div>
            </div>
            <div class="card card-flush">${varRows}</div>
            <div style="padding:0 0 12px">
              <div id="sva"></div>
              <button class="btn btn-dark" onclick="doApprove('${aid}')" style="margin-bottom:6px">✅ คอนเฟิร์มยอด</button>
              ${nextPhysicalRound<=3?`
              <div style="background:#f0fdf4;border:1px solid #14532d;border-radius:14px;padding:12px;margin-top:4px">
                <div style="font-size:12px;font-weight:700;color:#14532d;margin-bottom:4px">🔄 ส่งนับรอบ ${nextPhysicalRound} ต่อ</div>
                ${otherCounters.length?`<div style="display:flex;gap:6px">
                  <select id="recount-user" style="flex:1;font-size:12px;padding:6px 8px">${otherCounters.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select>

                </div>`:`<div style="font-size:11px;color:#9ca3af">ไม่มีผู้นับคนอื่น</div>`}
              </div>`:''}
            </div>`;
        }

        async function updateOH(sessionId, locationId, itemId, newVal) {
            const val = parseFloat(newVal);
            if (isNaN(val)) return;
            const { data: before } = await sb.from('stock_snapshot').select('onhand_qty')
                .eq('session_id', sessionId).eq('location_id', locationId).eq('item_id', itemId).single();
            await sb.from('stock_snapshot')
                .update({ onhand_qty: val })
                .eq('session_id', sessionId)
                .eq('location_id', locationId)
                .eq('item_id', itemId);
            logAudit(sessionId, locationId, itemId, 'oh_edit', before?.onhand_qty, val);
        }

        async function doApprove(aid) {
            const al = Q('sva');
            al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก...</div>`;
            const { data: asgn } = await sb.from('assignments')
                .select('location_id,session_id').eq('id', aid).single();
            const { data: snaps } = await sb.from('stock_snapshot').select('item_id,onhand_qty')
                .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id);
            const approvals = [];
            for (const s of snaps || []) {
                const input = Q('confirm_' + s.item_id);
                const val = input ? parseFloat(input.value) : NaN;
                const finalQty = isNaN(val) ? +s.onhand_qty : val;
                approvals.push({
                    assignment_id: aid,
                    item_id: s.item_id,
                    final_qty: finalQty,
                    variance: finalQty - +s.onhand_qty,
                    resolution: finalQty === +s.onhand_qty ? 'ok' : 'lost',
                    approved_by: me.id,
                });
            }
            if (approvals.length) {
                await sb.from('variance_approvals').upsert(approvals, { onConflict: 'assignment_id,item_id' });
            }
            await sb.from('assignments').update({ status: 'approved' }).eq('id', aid);
            al.innerHTML = `<div class="alert alert-green">✅ คอนเฟิร์มยอดเรียบร้อย</div>`;
            setTimeout(() => go('sv-list'), 1200);
        }

            Q('sva').innerHTML = `<div class="alert alert-green">✅ ส่งงานให้ ${label} แล้ว</div>`;

        }

                const total = zoneTotals[z] || 0;

                const counterList = Object.entries(zoneCounters[z] || {})

                    .map(([name, c]) => `<span class="tag tag-gray" style="font-size:8px;padding:1px 8px">${name} · ${c}</span>`)

              ${counterList?`<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:2px">${counterList}</div>`:''}
            </div>`;
            }).join('');
        }

        async function refreshBulkFilters() {
            const sid = Q('as-sess')?.value;
            if (!sid) return;
            const [{ data: snaps }, { data: existing }] = await Promise.all([
                sb.from('stock_snapshot')
                .select('location_id,locations(id,code,zone,row_no,level)')

            ]);
            const assignedSet = new Set(existing?.map(a => a.location_id) || []);
            const zones = new Set(),
                rows = new Set(),
                levels = new Set();
            const seen = new Set();
            for (const s of snaps || []) {
                const l = s.locations;
                if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
                seen.add(l.id);
                if (l.zone) zones.add(l.zone);
                if (l.row_no) rows.add(l.row_no);
                if (l.level) levels.add(l.level);
            }
            const fill = (id, vals) => {
                const el = Q(id);
                if (!el) return;
                const cur = el.value;
                el.innerHTML = '<option value="">ทั้งหมด</option>' + [...vals].sort().map(v =>
                    `<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join('');
            };
            fill('bulk-zone', zones);
            fill('bulk-row', rows);
            fill('bulk-level', levels);
            _bulkSnaps = snaps || [];
            _bulkAssigned = assignedSet;
            refreshBulkPreview();
        }

        function refreshBulkPreview() {
            const zone = Q('bulk-zone')?.value;
            const row = Q('bulk-row')?.value;
            const level = Q('bulk-level')?.value;
            const snaps = _bulkSnaps || [];
            const assignedSet = _bulkAssigned || new Set();
            const seen = new Set();
            let count = 0;
            for (const s of snaps) {
                const l = s.locations;
                if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
                if (zone && l.zone !== zone) continue;
                if (row && l.row_no !== row) continue;
                if (level && l.level !== level) continue;
                seen.add(l.id);
                count++;
            }
            const prev = Q('bulk-preview'),
                btn = Q('bulk-btn');
            if (!prev || !btn) return;
            if (count > 0) { prev.innerHTML = `📍 จะ Assign <strong>${count}</strong> locations`;
                btn.disabled = false; } else { prev.innerHTML =
                    `<span style="color:#9ca3af">ไม่มี Location ที่ตรงเงื่อนไข</span>`;
                btn.disabled = true; }
        }

            const snaps = _bulkSnaps || [];
            const assignedSet = _bulkAssigned || new Set();
            const seen = new Set(),
                toAssign = [];
            for (const s of snaps) {
                const l = s.locations;
                if (!l || seen.has(l.id) || assignedSet.has(l.id)) continue;
                if (zone && l.zone !== zone) continue;
                if (row && l.row_no !== row) continue;
                if (level && l.level !== level) continue;

        // ═══════════════════════════════════════════════════════════════
        //  ADMIN: IMPORT
        // ═══════════════════════════════════════════════════════════════
        async function readXlsxFile() {
            const file = Q('ixlsx').files[0];
            if (!file) return;
            const al = Q('ia'),
                prev = Q('ipreview'),
                btn = Q('ibtn');
            if (!al || !prev || !btn) return;
            al.innerHTML =
                `<div class="alert alert-blue">⏳ อ่านไฟล์ ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)...</div>`;
            prev.style.display = 'none';
            btn.disabled = true;
            _xlsxRawRows = null;
            _xlsxParsed = null;
            try {
                const buf = await file.arrayBuffer();
                if (typeof XLSX === 'undefined') throw new Error('SheetJS ยังโหลดไม่เสร็จ');
                al.innerHTML = `<div class="alert alert-blue">⏳ Parse Excel...</div>`;
                await new Promise(r => setTimeout(r, 50));
                const wb = XLSX.read(buf, { type: 'array', dense: true });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

                const FIELDS = {
                    loc: { exact: ['location', 'loc', 'พิกัด', 'ตำแหน่ง', 'location code'],
                    contains: ['location'], exclude: ['zone', 'type', 'group'] },
                    item: { exact: ['item code', 'item', 'sku', 'barcode', 'รหัสสินค้า', 'รหัส'], contains: ['item',
                            'sku', 'barcode'
                        ], exclude: [] },
                    oh: { exact: ['on hand qty', 'on hand', 'onhand', 'oh', 'ยอดคงเหลือ', 'qty oh', 'qtyoh'],
                        contains: ['on hand', 'onhand'], exclude: [] },
                    al: { exact: ['al qty', 'al', 'allocated', 'จอง'], contains: ['allocated'], exclude: [] },
                    lp: { exact: ['license plate', 'lpn no.', 'lpn no', 'lpn number', 'lpn', 'license plate no'],
                        contains: ['license plate', 'lpn'], exclude: ['parent'] },
                    lot: { exact: ['lot', 'lot no', 'lot number', 'batch'], contains: ['lot', 'batch'], exclude: [] },
                    stat: { exact: ['inventory status', 'status', 'สถานะ'], contains: ['status'], exclude: [] },
                    desc: { exact: ['description', 'desc', 'ชื่อสินค้า', 'ชื่อ'], contains: ['description'],
                    exclude: [] },
                };
                const normalizeCell = c => (c == null ? '' : c.toString().trim().toLowerCase().replace(/\s+/g,
                ' '));

                function findColumn(norm, def) {
                    for (const name of def.exact) { const idx = norm.indexOf(name); if (idx !== -1) return idx; }
                    for (let i = 0; i < norm.length; i++) {
                        if (!norm[i]) continue;
                        if (def.exclude.some(ex => norm[i].includes(ex))) continue;
                        if (def.contains.some(c => norm[i].includes(c))) return i;
                    }
                    return -1;
                }

                let headerRow = -1,
                    col = {};
                for (let r = 0; r < Math.min(30, raw.length); r++) {
                    const row = raw[r];
                    if (!row) continue;
                    const norm = row.map(normalizeCell);
                    const locIdx = findColumn(norm, FIELDS.loc);
                    const itemIdx = findColumn(norm, FIELDS.item);
                    if (locIdx !== -1 && itemIdx !== -1) {
                        headerRow = r;
                        col.loc = locIdx;
                        col.item = itemIdx;
                        col.oh = findColumn(norm, FIELDS.oh);
                        col.al = findColumn(norm, FIELDS.al);
                        col.desc = findColumn(norm, FIELDS.desc);
                        col.stat = findColumn(norm, FIELDS.stat);
                        col.lot = findColumn(norm, FIELDS.lot);
                        col.lp = findColumn(norm, FIELDS.lp);
                        break;
                    }
                }
                if (headerRow === -1 || col.loc === -1 || col.item === -1) {
                    throw new Error('ไม่พบคอลัมน์ Location และ Item ในไฟล์');
                }
                const rows = [];
                for (let i = headerRow + 1; i < raw.length; i++) {
                    const row = raw[i];
                    if (!row) continue;
                    const loc = row[col.loc] ? row[col.loc].toString().trim() : null;
                    const item = row[col.item] ? row[col.item].toString().trim() : null;
                    if (!loc || !item) continue;
                    const desc = col.desc !== -1 ? (row[col.desc] || '').toString().trim() : '';
                    const oh = col.oh !== -1 ? (parseFloat(row[col.oh]) || 0) : 0;
                    const alQty = col.al !== -1 ? (parseFloat(row[col.al]) || null) : null;
                    const stat = col.stat !== -1 ? (row[col.stat] || '').toString().trim() : '';
                    const lot = col.lot !== -1 ? (row[col.lot] || '').toString().trim() : '';
                    const lp = col.lp !== -1 ? (row[col.lp] || '').toString().trim() : '';
                    rows.push({ loc, item, desc, oh, alQty, stat, lot, lp });
                }
                if (!rows.length) throw new Error('ไม่พบข้อมูลใต้ header');
                _xlsxRawRows = rows;
                al.innerHTML = `<div class="alert alert-green" style="font-size:11px">✅ อ่านไฟล์สำเร็จ — ${rows.length.toLocaleString()} แถว</div>`;
                refreshXlsxPreview();
            } catch (e) { al.innerHTML = `<div class="alert alert-red">❌ ${e.message}</div>`; }
        }

        function refreshXlsxPreview() {
            const prev = Q('ipreview'),
                btn = Q('ibtn');
            if (!_xlsxRawRows) return;
            const patternStr = Q('ilocfilter')?.value.trim() || '';
            const re = patternStr ? likeToRegex(patternStr) : null;
            let inScope = 0;
            const map = {};
            for (const r of _xlsxRawRows) {
                if (re && !re.test(r.loc)) continue;
                inScope++;
                const key = r.loc + '|||' + r.item;
                if (map[key]) { map[key].qty += r.oh; if (r.alQty !== null) map[key].alQty = (map[key].alQty || 0) +
                        r.alQty; } else { map[key] = { loc: r.loc, item: r.item, desc: r.desc, qty: r.oh,
                        alQty: r.alQty }; }
            }
            _xlsxParsed = Object.values(map);
            const uLocsArr = [...new Set(_xlsxParsed.map(r => r.loc))];
            const uLocs = uLocsArr.length;
            const uItems = new Set(_xlsxParsed.map(r => r.item)).size;
            _xlsxAllLocsInScope = uLocsArr;
            prev.style.display = 'block';
            if (!inScope) {
                prev.innerHTML =
                    `<div class="alert alert-amber">⚠️ ไม่พบแถวที่ตรงกับ Location filter</div>`;
                btn.disabled = true;
                return;
            }
            prev.innerHTML =
                `<div class="alert alert-green" style="font-size:11px">✅ พร้อม Import · 📍 ${uLocs} locations · 📦 ${uItems} items · 🔢 ${_xlsxParsed.length} pairs</div><div id="conflict-check-area"></div>`;
            btn.disabled = false;
            checkLocationConflicts(uLocsArr);
        }

        async function checkLocationConflicts(locCodes) {
            const sid = Q('is')?.value;
            const area = Q('conflict-check-area');
            if (!sid || !area || !locCodes.length) return;
            area.innerHTML =
                `<div style="font-size:10px;color:#9ca3af;margin-top:6px">⏳ เช็ค Location ซ้ำ...</div>`;
            const { data: locs } = await sb.from('locations').select('id,code').in('code', locCodes);
            if (!locs?.length) { area.innerHTML = ''; return; }
            const locIdMap = Object.fromEntries(locs.map(l => [l.id, l.code]));
            const { data: existing } = await sb.from('stock_snapshot')
                .select('location_id').eq('session_id', sid).in('location_id', Object.keys(locIdMap));
            const dupSet = new Set((existing || []).map(e => locIdMap[e.location_id]));
            _xlsxConflictLocs = new Set();
            if (!dupSet.size) {
                area.innerHTML =
                    `<div style="font-size:10px;color:#14532d;margin-top:6px;font-weight:600">✅ ไม่มี Location ซ้ำ</div>`;
                return;
            }
            const dupList = [...dupSet].sort();
            area.innerHTML =
                `<div style="background:#fef3c7;border-radius:10px;padding:8px;margin-top:6px;border:1px solid #fde68a">
              <div style="font-size:10px;font-weight:700;color:#92400e;margin-bottom:4px">⚠️ ${dupList.length} Location ซ้ำ — ติ๊ก = Import ทับ, ไม่ติ๊ก = ข้าม</div>
              <div style="max-height:120px;overflow-y:auto">${dupList.map(code=>`
                <label style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;font-family:monospace;cursor:pointer">
                  <input type="checkbox" class="dup-loc-check" data-code="${code}" checked onchange="toggleDupLoc('${code}',this.checked)" style="width:14px;height:14px">
                  ${code}
                </label>`).join('')}</div>
            </div>`;
        }

        function toggleDupLoc(code, checked) {
            if (checked) _xlsxConflictLocs.delete(code);
            else _xlsxConflictLocs.add(code);
        }

        async function doImportXlsx() {
            const sid = Q('is').value,
                al = Q('ia'),
                btn = Q('ibtn');
            if (!sid) { al.innerHTML = `<div class="alert alert-red">เลือก Session ก่อน</div>`; return; }
            if (!_xlsxParsed || !_xlsxParsed.length) { al.innerHTML =
                `<div class="alert alert-red">ไม่มีข้อมูลที่จะ Import</div>`; return; }
            btn.disabled = true;
            const skipSet = _xlsxConflictLocs || new Set();
            const importRows = _xlsxParsed.filter(p => !skipSet.has(p.loc));
            if (!importRows.length) { al.innerHTML =
                `<div class="alert alert-amber">ทุก Location ถูกเลือกให้ข้าม</div>`; btn.disabled = false; return; }

            async function batchUp(table, rows, conflict, selectCols) {
                const BATCH = 500,
                    map = {};
                for (let i = 0; i < rows.length; i += BATCH) {
                    const { data, error } = await sb.from(table)
                        .upsert(rows.slice(i, i + BATCH), { onConflict: conflict })
                        .select(selectCols);
                    if (error) throw error;
                    data?.forEach(r => { map[r.code] = r.id; });
                }
                return map;
            }

            try {
                const seenLocs = {},
                    locRows = [];
                for (const p of importRows) {
                    if (seenLocs[p.loc]) continue;
                    seenLocs[p.loc] = true;
                    const parts = p.loc.split('-');
                    locRows.push({ code: p.loc, zone: computeZone(p.loc, p.desc), row_no: parts[1] || null,
                        level: parts[3] || null });
                }
                al.innerHTML =
                    `<div class="alert alert-blue">⏳ [1/4] Locations (${locRows.length})...</div>`;
                const locMap = await batchUp('locations', locRows, 'code', 'id,code');

                const seenItems = {},
                    itemRows = [];
                for (const p of importRows) {
                    if (seenItems[p.item]) continue;
                    seenItems[p.item] = true;
                    itemRows.push({ code: p.item, description: p.desc });
                }
                al.innerHTML =
                    `<div class="alert alert-blue">⏳ [2/4] Items (${itemRows.length})...</div>`;
                const itemMap = await batchUp('items', itemRows, 'code', 'id,code');

                const BATCH = 500;
                let ok = 0;
                const snapRows = importRows
                    .filter(p => locMap[p.loc] && itemMap[p.item])
                    .map(p => ({
                        session_id: sid,
                        location_id: locMap[p.loc],
                        item_id: itemMap[p.item],
                        onhand_qty: p.qty,
                        al_qty: p.alQty !== null && p.alQty !== undefined ? p.alQty : null,
                    }));
                for (let i = 0; i < snapRows.length; i += BATCH) {
                    const { error } = await sb.from('stock_snapshot')
                        .upsert(snapRows.slice(i, i + BATCH), { onConflict: 'session_id,location_id,item_id' });
                    if (error) throw error;
                    ok += Math.min(BATCH, snapRows.length - i);
                    al.innerHTML =
                        `<div class="alert alert-blue">⏳ [3/4] Snapshot: ${ok.toLocaleString()}/${snapRows.length.toLocaleString()}</div>`;
                }

                al.innerHTML = `<div class="alert alert-blue">⏳ [4/4] Detail (LPN/Lot)...</div>`;
                const patternStr = Q('ilocfilter')?.value.trim() || '';
                const re = patternStr ? likeToRegex(patternStr) : null;
                const detailRows = [];
                for (const r of _xlsxRawRows) {
                    if (re && !re.test(r.loc)) continue;
                    if (skipSet.has(r.loc)) continue;
                    if (!locMap[r.loc] || !itemMap[r.item]) continue;
                    detailRows.push({
                        session_id: sid,
                        location_id: locMap[r.loc],
                        item_id: itemMap[r.item],
                        license_plate: r.lp || null,
                        lot: r.lot || null,
                        inventory_status: r.stat || null,
                        qty: r.oh,
                    });
                }
                const importedLocIds = [...new Set(Object.values(locMap))];
                for (let i = 0; i < importedLocIds.length; i += BATCH) {
                    const { error } = await sb.from('stock_snapshot_detail')
                        .delete().eq('session_id', sid).in('location_id', importedLocIds.slice(i, i + BATCH));
                    if (error) throw error;
                }
                let okD = 0;
                for (let i = 0; i < detailRows.length; i += BATCH) {
                    const { error } = await sb.from('stock_snapshot_detail').insert(detailRows.slice(i, i + BATCH));
                    if (error) throw error;
                    okD += Math.min(BATCH, detailRows.length - i);
                    al.innerHTML =
                        `<div class="alert alert-blue">⏳ [4/4] Detail: ${okD.toLocaleString()}/${detailRows.length.toLocaleString()}</div>`;
                }
                const skippedMsg = skipSet.size ? `<br>⏭️ ข้าม ${skipSet.size} locations` : '';
                al.innerHTML =
                    `<div class="alert alert-green">✅ Import สำเร็จ! 📍 ${locRows.length} locations · 📦 ${itemRows.length} items · 🔢 ${ok} snapshot rows · 🏷️ ${okD} detail rows${skippedMsg}</div>`;
                _xlsxRawRows = null;
                _xlsxParsed = null;
                _xlsxConflictLocs = new Set();
                Q('ixlsx').value = '';
                Q('ilocfilter').value = '';
                Q('ipreview').style.display = 'none';
                btn.disabled = false;
            } catch (e) { al.innerHTML = `<div class="alert alert-red">❌ ${e?.message||String(e)}</div>`; btn.disabled =
                    false; }
        }

        async function loadDeleteZoneFilters() {
            const [{ data: locData }, { data: sessData }] = await Promise.all([
                sb.from('locations').select('zone,row_no'),
                sb.from('count_sessions').select('id,name').order('created_at', { ascending: false }),
            ]);

                const el = Q(id);
                if (!el) return;
                el.innerHTML = '<option value="">ทั้งหมด</option>' + [...vals].sort().map(v =>
                    `<option value="${v}">${v}</option>`).join('');

            fill('del-row', rows);

                sEl.innerHTML = '<option value="">ทุก Session (ลบ Location ออกจากระบบจริง)</option>' +

        function buildDelLocQuery(zone, row, code, selectCols, selectOpts) {

            if (row) q = q.eq('row_no', row);
            if (code) q = q.ilike('code', code);
            return q;
        }

                    if (itemIds.length) {
                        const { data: snapMatches } = await sb.from('stock_snapshot')
                            .select('location_id').in('location_id', candidateLocIds).in('item_id', itemIds);
                        (snapMatches || []).forEach(m => locIdsFromItem.add(m.location_id));
                    }
                    const { data: lpnMatches } = await sb.from('stock_snapshot_detail')
                        .select('location_id').in('location_id', candidateLocIds).ilike('license_plate', `%${term}%`);
                    (lpnMatches || []).forEach(m => locIdsFromLPN.add(m.location_id));
                }
                const matchSet = new Set([...locIdsFromLoc, ...locIdsFromItem, ...locIdsFromLPN]);
                asgns = asgns.filter(a => matchSet.has(a.location_id));
            }
            if (!asgns?.length) { histList.innerHTML =
                    `<div class="card text-center" style="padding:32px 16px;color:#9ca3af">ไม่พบข้อมูล</div>`; return; }
            histList.innerHTML = '<div class="card card-flush">' +
                asgns.map(a => {
                    const si = tagInfo(a.status);
                    return `<div class="row click" onclick="go('ad-txlog',{aid:'${a.id}'})">
                <div class="row-body">
                  <div class="row-title mono" style="font-size:13px">${a.locations?.code||'?'}</div>
                  <div class="row-sub">${a.count_sessions?.name||''} · ${a.profiles?.name||'?'}</div>
                  <div class="row-sub" style="font-size:10px;color:#9ca3af">${new Date(a.created_at).toLocaleString('th-TH')}</div>
                </div>
                <span class="tag ${si.cls}">${si.lbl}</span>
                <span class="caret">›</span>
              </div>`;
                }).join('') + '</div>';
        }

        // ═══════════════════════════════════════════════════════════════
        //  ADMIN: TX LOG
        // ═══════════════════════════════════════════════════════════════
        async function loadAdTxLog() {
            const { aid } = S;
            if (!aid) { go('ad-history'); return; }
            const [{ data: asgn }, { data: recs }, { data: approvals, error: apprErr }] = await Promise.all([
                sb.from('assignments')
                .select('id,status,location_id,session_id,locations(code,zone),profiles!assigned_to(name),count_sessions(name)')
                .eq('id', aid).single(),
                sb.from('count_records')
                .select('item_id,round,count_qty,counted_at,remark,photo_url,counted_by,actual_counter_name,profiles!counted_by(name),actual_counter:profiles!actual_counter_id(name),items(code,description)')
                .eq('assignment_id', aid).order('counted_at'),
                sb.from('variance_approvals')
                .select('item_id,final_qty,variance,resolution,approved_by,created_at,items(code,description),profiles!approved_by(name)')
                .eq('assignment_id', aid).order('created_at'),
            ]);
            if (!asgn) { go('ad-history'); return; }
            const [{ data: snaps }, { data: auditRows, error: auditErr }, rules] = await Promise.all([
                sb.from('stock_snapshot').select('item_id,onhand_qty,al_qty')
                .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
                sb.from('audit_log')
                .select('action,old_value,new_value,item_id,created_at,items(code,description),profiles!performed_by(name)')
                .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id).order('created_at'),
                getSessionRules(asgn.session_id),
            ]);
            const ohMap = {};
            (snaps || []).forEach(s => { ohMap[s.item_id] = { oh: +s.onhand_qty, al: s.al_qty }; });
            const byItemRounds = {};
            (recs || []).forEach(r => {
                byItemRounds[r.item_id] = byItemRounds[r.item_id] || {};
                byItemRounds[r.item_id][r.round] = r.count_qty;
            });
            const mismatchItems = [];
            Object.entries(byItemRounds).forEach(([itemId, v]) => {
                const ohInfo = ohMap[itemId];
                if (!ohInfo) return;
                const st = computeItemStatus(ohInfo.oh, v[1], v[2], v[3], rules);
                if (st === 'PENDING' || st === 'Diff') mismatchItems.push(itemId);
            });
            const showMismatchWarning = asgn.status === 'completed' && mismatchItems.length > 0;

            const events = [];
            (recs || []).forEach(r => events.push({ type: 'count', at: r.counted_at, data: r }));
            if (!apprErr)(approvals || []).forEach(a => events.push({ type: 'approval', at: a.created_at, data: a }));
            if (!auditErr)(auditRows || []).forEach(a => events.push({ type: 'audit', at: a.created_at, data: a }));
            events.sort((a, b) => new Date(a.at || 0) - new Date(b.at || 0));

            const si = tagInfo(asgn.status);
            const ACTION_META = { oh_edit: { icon: '✏️', label: 'แก้ไข OH' }, reassign: { icon: '🔄',
                    label: 'เปลี่ยนผู้นับ' } };
            let rows = '';
            for (const ev of events) {
                if (ev.type === 'count') {
                    const r = ev.data;
                    const ohInfo = ohMap[r.item_id];
                    rows += `<div class="row" style="cursor:default;flex-wrap:wrap;padding:10px 12px">
                <div class="row-body">
                  <div class="row-title mono" style="font-size:12px">${r.items?.code||'?'}</div>
                  <div class="row-sub" style="font-size:10px">${r.items?.description||''}</div>
                  <div class="row-sub" style="font-size:10px">รอบ ${r.round} · ${r.actual_counter_name||r.actual_counter?.name||r.profiles?.name||'?'}</div>
                  <div class="row-sub" style="font-size:9px;color:#9ca3af">${r.counted_at?new Date(r.counted_at).toLocaleString('th-TH'):''}</div>
                  ${r.remark?`<div class="row-sub" style="font-size:10px;color:#7c3aed">📝 ${r.remark}</div>`:''}
                  ${r.photo_url?`<a href="${r.photo_url}" target="_blank" style="font-size:10px;color:#0f0f1a">📷 รูป</a>`:''}
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <div style="font-size:24px;font-weight:900;font-family:'Inter'">${r.count_qty}</div>
                  <span class="tag tag-blue" style="font-size:8px;padding:1px 8px">R${r.round}</span>
                  ${ohInfo?`<div class="oh-chip" style="font-size:9px;padding:2px 8px;margin-top:4px">OH: ${ohInfo.oh}${ohInfo.al!=null?` <span class="al-part">· AL ${ohInfo.al}</span>`:''}</div>`:''}
                </div>
              </div>`;
                } else if (ev.type === 'approval') {
                    const a = ev.data;
                    const isOk = a.resolution === 'ok';
                    rows += `<div class="row" style="cursor:default;flex-wrap:wrap;padding:10px 12px;background:${isOk?'#f0fdf4':'#fef2f2'}">
                <div class="row-body">
                  <div class="row-title mono" style="font-size:12px">${a.items?.code||'?'}</div>
                  <div class="row-sub" style="font-size:10px">${a.items?.description||''}</div>
                  <div class="row-sub" style="font-size:10px">${isOk?'✅':'❌'} คอนเฟิร์มโดย ${a.profiles?.name||'?'}</div>
                  <div class="row-sub" style="font-size:9px;color:#9ca3af">${a.created_at?new Date(a.created_at).toLocaleString('th-TH'):''}</div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <div style="font-size:24px;font-weight:900;font-family:'Inter'">${a.final_qty}</div>
                  <span class="tag ${isOk?'tag-green':'tag-red'}" style="font-size:8px;padding:1px 8px">${a.variance>0?'+':''}${a.variance}</span>
                </div>
              </div>`;
                } else {
                    const a = ev.data;
                    const meta = ACTION_META[a.action] || { icon: '📝', label: a.action };
                    rows += `<div class="row" style="cursor:default;flex-wrap:wrap;padding:10px 12px;background:#f8f9fb">
                <div class="row-body">
                  <div class="row-title mono" style="font-size:12px">${a.items?.code||meta.label}</div>
                  ${a.items?.code?`<div class="row-sub" style="font-size:10px">${meta.icon} ${meta.label}</div>`:''}
                  <div class="row-sub" style="font-size:10px">โดย ${a.profiles?.name||'?'}</div>
                  <div class="row-sub" style="font-size:9px;color:#9ca3af">${a.created_at?new Date(a.created_at).toLocaleString('th-TH'):''}</div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <div style="font-size:13px;font-weight:700">${a.old_value??'—'} → ${a.new_value??'—'}</div>
                  <span class="tag tag-blue" style="font-size:8px;padding:1px 8px">${meta.icon} ${meta.label}</span>
                </div>
              </div>`;
                }
            }

            cnt().innerHTML = `
            <div class="card">
              <div class="mono" style="font-size:18px;font-weight:800">${asgn.locations?.code}</div>
              <div style="font-size:12px;color:#6b7280">${asgn.count_sessions?.name||''} · ${asgn.profiles?.name||'?'}</div>
              <div style="margin-top:4px"><span class="tag ${si.cls}">${si.lbl}</span></div>
              ${showMismatchWarning?`
              <div class="alert alert-red" style="margin-top:10px;font-size:11px">⚠️ พบ ${mismatchItems.length} รายการยอดไม่ตรง OH ปัจจุบัน</div>
              <button class="btn btn-red btn-sm" onclick="sendBackToVariance('${aid}')">📤 ส่งกลับ Variance</button>`:''}
            </div>
            <div class="card card-flush">${rows||'<div class="load" style="padding:16px;font-size:12px">ยังไม่มีการนับ</div>'}</div>`;
        }

        async function sendBackToVariance(aid) {
            if (!confirm('ส่งงานนี้กลับไปให้ Supervisor ตรวจสอบใน Variance?')) return;
            const { error } = await sb.from('assignments').update({ status: 'round3_done' }).eq('id', aid);
            if (error) { alert(error.message); return; }
            alert('✅ ส่งกลับไปตรวจสอบแล้ว');
            loadAdTxLog();
        }

                <div style="display:flex;gap:2px;flex-shrink:0">

        function editCounterName(id, curName) {
            const newName = prompt('แก้ไขชื่อผู้นับ:', curName);
            if (!newName || !newName.trim() || newName.trim() === curName) return;
            saveCounterNameEdit(id, newName.trim());
        }

        async function saveCounterNameEdit(id, newName) {
            const { error } = await sb.from('counter_names').update({ name: newName }).eq('id', id);
            if (error) { alert('แก้ไขไม่สำเร็จ: ' + error.message); return; }
            loadCounterNamesList();
        }

        async function addCounterNameFromAdmin() {
            const input = Q('cn-new-input');
            const name = input?.value.trim();
            if (!name) { alert('กรุณาพิมพ์ชื่อก่อน'); return; }
            const { error } = await sb.from('counter_names')
                .upsert({ name, created_by: me.id }, { onConflict: 'name', ignoreDuplicates: true });
            if (error) { alert('เพิ่มชื่อไม่สำเร็จ: ' + error.message); return; }
            loadCounterNamesList();
        }

        async function deleteCounterName(id, name) {
            if (!confirm(`ลบชื่อ "${name}" ?`)) return;
            const { error } = await sb.from('counter_names').delete().eq('id', id);
            if (error) { alert(error.message); return; }
            loadCounterNamesList();
        }

        async function editUserName(uid) {
            const span = Q('uname_' + uid);
            const cur = span?.textContent || '';
            const newName = prompt('แก้ชื่อ User:', cur);
            if (!newName || newName === cur) return;
            const { error } = await sb.from('profiles').update({ name: newName.trim() }).eq('id', uid);
            if (error) { alert(error.message); return; }
            if (span) span.textContent = newName.trim();
        }

        async function deleteUser(uid, name, role) {
            if (role === 'admin') { alert('ไม่สามารถลบ Admin ผ่านหน้านี้ได้'); return; }
            if (!confirm(`ลบ User "${name}" ?`)) return;
            const { error } = await sb.from('profiles').delete().eq('id', uid);
            if (error) { alert(error.message); return; }
            loadAdUsers();
        }

        async function chRole(uid, role) {
            await sb.from('profiles').update({ role }).eq('id', uid);
        }

        async function addUser() {
            const name = Q('un').value.trim(),
                email = Q('ue').value.trim();
            const pwd = Q('up').value,
                role = Q('ur').value;
            const al = Q('ua');
            if (!name || !email || !pwd) { al.innerHTML =
                `<div class="alert alert-red">กรอกข้อมูลให้ครบ</div>`; return; }
            if (pwd.length < 6) { al.innerHTML =
                `<div class="alert alert-red">Password ต้องมีอย่างน้อย 6 ตัว</div>`; return; }
            const { error } = await sb.auth.signUp({
                email,
                password: pwd,
                options: { data: { name, role } }
            });
            if (error) { al.innerHTML = `<div class="alert alert-red">${error.message}</div>`; return; }
            al.innerHTML = `<div class="alert alert-green">✅ สร้าง User สำเร็จ — แจ้ง ${name} Login ด้วย ${email}</div>`;
            Q('un').value = '';
            Q('ue').value = '';
            Q('up').value = '';
            setTimeout(() => loadAdUsers(), 1600);
        }

                <div style="font-size:11px;font-weight:700;margin-bottom:6px">🧪 ทดสอบ</div>
                <div class="grid-3" style="margin-bottom:4px">
                  <div><label style="font-size:9px">OH</label><input type="number" id="test-oh" value="22" oninput="testRule()" style="font-size:12px;padding:4px 6px"></div>
                  <div><label style="font-size:9px">Count 1</label><input type="number" id="test-r1" oninput="testRule()" style="font-size:12px;padding:4px 6px"></div>
                  <div><label style="font-size:9px">Count 2</label><input type="number" id="test-r2" oninput="testRule()" style="font-size:12px;padding:4px 6px"></div>
                </div>
                <div class="fg" style="margin:0"><label style="font-size:9px">Count 3</label><input type="number" id="test-r3" oninput="testRule()" style="font-size:12px;padding:4px 6px"></div>
                <div id="test-result" style="text-align:center;padding:8px;border-radius:8px;font-weight:700;font-size:12px;background:#f1f3f6;color:#6b7280;margin-top:6px">กรอกตัวเลข</div>
              </div>
            </div>`;
            document.body.appendChild(overlay);
            onMaxRoundsChange(true);
        }

        function onMaxRoundsChange(skipSave) {
            const mr = parseInt(Q('rule-maxrounds')?.value || '3');
            const wrap = Q('rule-repeataction-wrap');
            if (wrap) wrap.style.display = mr <= 1 ? 'none' : '';
            if (!skipSave) saveCountingRules();
            testRule();
        }

        function testRule() {
            const res = Q('test-result');
            if (!res) return;
            const ohv = Q('test-oh')?.value;
            const oh = ohv === '' ? null : parseFloat(ohv);
            const pick = id => { const v = Q(id)?.value; return (v === undefined || v === '') ? null : parseFloat(v); };
            const r1 = pick('test-r1'),
                r2 = pick('test-r2'),
                r3 = pick('test-r3');
            const maxRounds = parseInt(Q('rule-maxrounds')?.value || '3');
            const action = Q('rule-repeataction')?.value || 'recount';
            const st = r1 === null ? '' : computeItemStatus(oh, r1, r2, r3, { maxRounds, repeatMatchAction: action });
            const MAP = {
                OK: ['✅ ผ่าน', '#14532d', '#dcfce7'],
                PENDING: ['🔄 นับใหม่', '#92400e', '#fef3c7'],
                Diff: ['❌ ไม่ผ่าน — ส่งเคลียร์', '#991b1b', '#fee2e2'],
                '': ['— กรอก Count 1', '#6b7280', '#f1f3f6'],
            };
            const [txt, color, bg] = MAP[st] || [st, '#000', '#fff'];
            res.textContent = txt;
            res.style.color = color;
            res.style.background = bg;
        }

        function closeRulesModal() { Q('rulesModalOverlay')?.remove(); }

        async function syncCountingRules() {
            const sid = Q('rules-modal-sess')?.value;
            if (!sid) return;
            const { data } = await sb.from('count_sessions').select('max_rounds,repeat_match_action').eq('id', sid)
                .single();
            const mr = Q('rule-maxrounds'),
                ra = Q('rule-repeataction');
            if (mr) mr.value = String(data?.max_rounds === 1 ? 1 : data?.max_rounds === 2 ? 2 : 3);
            if (ra) ra.value = data?.repeat_match_action || 'recount';
            onMaxRoundsChange(true);
        }

        async function saveCountingRules() {
            const sid = Q('rules-modal-sess')?.value;
            const al = Q('rule-alert');
            if (!sid) return;
            const maxRounds = parseInt(Q('rule-maxrounds')?.value || '3');
            const action = Q('rule-repeataction')?.value || 'recount';
            const { error } = await sb.from('count_sessions')
                .update({ max_rounds: maxRounds, repeat_match_action: action }).eq('id', sid);
            if (error) {
                if (al) al.innerHTML =
                    `<div class="alert alert-red" style="font-size:11px;padding:8px 10px;margin:0">❌ ${error.message}</div>`;
                return;
            }
            if (al) {
                al.innerHTML =
                    `<div class="alert alert-green" style="font-size:11px;padding:8px 10px;margin:0">✅ บันทึกแล้ว</div>`;
                setTimeout(() => { al.innerHTML = ''; }, 2000);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  BOOT
        // ═══════════════════════════════════════════════════════════════
        boot();
    </script>
</body>
</html>
