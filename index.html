  if (Q('hist-sess') && sid) Q('hist-sess').value = sid;
  if (Q('hist-cnt')  && cid) Q('hist-cnt').value  = cid;
  if (Q('hist-st')   && st)  Q('hist-st').value   = st;

  let q = sb.from('assignments')
    .select('id,status,created_at,location_id,locations(code,zone),profiles!assigned_to(name),count_sessions(name)')
    .order('created_at',{ascending:false})
    .limit(100);
  if (sid) q = q.eq('session_id', sid);
  if (cid) q = q.eq('assigned_to', cid);
  if (st)  q = q.eq('status', st);

  let { data: asgns, error } = await q;
  const histList = Q('hist-list');
  if (!histList) return;
  if (error) { histList.innerHTML = errBox(error.message); return; }

  const term = searchQ.trim();
  if (term && asgns?.length) {
    const termLower = term.toLowerCase();
    const candidateLocIds = [...new Set(asgns.map(a => a.location_id).filter(Boolean))];

    const locIdsFromLoc = new Set(
      asgns.filter(a => (a.locations?.code||'').toLowerCase().includes(termLower)).map(a => a.location_id)
    );

    let locIdsFromItem = new Set(), locIdsFromLPN = new Set();
    if (candidateLocIds.length) {
      const { data: matchedItems } = await sb.from('items').select('id').ilike('code', `%${term}%`);
      const itemIds = (matchedItems||[]).map(i => i.id);
      if (itemIds.length) {
        const { data: snapMatches } = await sb.from('stock_snapshot')
          .select('location_id').in('location_id', candidateLocIds).in('item_id', itemIds);
        (snapMatches||[]).forEach(m => locIdsFromItem.add(m.location_id));
      }
      const { data: lpnMatches } = await sb.from('stock_snapshot_detail')
        .select('location_id').in('location_id', candidateLocIds).ilike('license_plate', `%${term}%`);
      (lpnMatches||[]).forEach(m => locIdsFromLPN.add(m.location_id));
    }

    const matchSet = new Set([...locIdsFromLoc, ...locIdsFromItem, ...locIdsFromLPN]);
    asgns = asgns.filter(a => matchSet.has(a.location_id));
  }

  if (!asgns?.length) { histList.innerHTML = `<div class="card" style="text-align:center;padding:32px;color:var(--text-muted)">ไม่พบข้อมูลตามเงื่อนไข</div>`; return; }

  histList.innerHTML = '<div class="card card-flush">' +
    asgns.map(a => {
      const si = tagInfo(a.status);
      return `<div class="row click" onclick="go('ad-txlog',{aid:'${a.id}'})">

          <div class="row-title mono">${a.locations?.code || '?'}</div>

          <div class="row-sub">${new Date(a.created_at).toLocaleString('th-TH')}</div>
        </div>
        <span class="tag ${si.cls}">${si.lbl}</span>
        <span class="caret">›</span>
      </div>`;
    }).join('') + '</div>';
}

async function loadAdTxLog() {
  const { aid } = S;
  if (!aid) { go('ad-history'); return; }

  const [{ data: asgn }, { data: recs }, { data: approvals, error: apprErr }] = await Promise.all([
    sb.from('assignments')
      .select('id,status,location_id,session_id,locations(code,zone),profiles!assigned_to(name),count_sessions(name)')
      .eq('id', aid).single(),
    sb.from('count_records')
      .select('item_id,round,count_qty,counted_at,remark,photo_url,counted_by,actual_counter_name,profiles!counted_by(name),actual_counter:profiles!actual_counter_id(name),items(code,description)')
      .eq('assignment_id', aid)
      .order('counted_at'),
    sb.from('variance_approvals')
      .select('item_id,final_qty,variance,resolution,approved_by,created_at,items(code,description),profiles!approved_by(name)')
      .eq('assignment_id', aid)
      .order('created_at'),
  ]);

  if (!asgn) { go('ad-history'); return; }

  const [{ data: snaps }, { data: auditRows, error: auditErr }, rules] = await Promise.all([
    sb.from('stock_snapshot')
      .select('item_id,onhand_qty,al_qty')
      .eq('session_id', asgn.session_id)
      .eq('location_id', asgn.location_id),
    sb.from('audit_log')
      .select('action,old_value,new_value,item_id,created_at,items(code,description),profiles!performed_by(name)')
      .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id)
      .order('created_at'),
    getSessionRules(asgn.session_id),
  ]);
  const ohMap = {};
  (snaps||[]).forEach(s => { ohMap[s.item_id] = { oh: +s.onhand_qty, al: s.al_qty }; });

  const byItemRounds = {};
  (recs||[]).forEach(r => {
    byItemRounds[r.item_id] = byItemRounds[r.item_id] || {};
    byItemRounds[r.item_id][r.round] = r.count_qty;
  });
  const mismatchItems = [];
  Object.entries(byItemRounds).forEach(([itemId, v]) => {
    const ohInfo = ohMap[itemId];
    if (!ohInfo) return;
    const st = computeItemStatus(ohInfo.oh, v[1], v[2], v[3], rules);
    if (st === 'PENDING' || st === 'Diff') mismatchItems.push(itemId);
  });
  const showMismatchWarning = asgn.status === 'completed' && mismatchItems.length > 0;

  const events = [];
  (recs||[]).forEach(r => events.push({ type:'count', at: r.counted_at, data: r }));
  if (!apprErr) (approvals||[]).forEach(a => events.push({ type:'approval', at: a.created_at, data: a }));
  if (!auditErr) (auditRows||[]).forEach(a => events.push({ type:'audit', at: a.created_at, data: a }));
  events.sort((a,b) => new Date(a.at||0) - new Date(b.at||0));

  const si = tagInfo(asgn.status);
  const ACTION_META = {
    oh_edit:  { icon:'✏️', label:'แก้ไขยอด OH' },
    reassign: { icon:'🔄', label:'เปลี่ยนผู้นับ' },
  };
  let rows = '';
  for (const ev of events) {
    if (ev.type === 'count') {
      const r = ev.data;
      const ohInfo = ohMap[r.item_id];
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap">
        <div class="row-body">
          <div class="row-title mono" style="font-size:13px">${r.items?.code||'?'}</div>
          <div class="row-sub">${r.items?.description||''}</div>
          <div class="row-sub">รอบ ${r.round} · นับโดย: ${r.actual_counter_name || r.actual_counter?.name || r.profiles?.name || '?'}</div>
          <div class="row-sub">${r.counted_at ? new Date(r.counted_at).toLocaleString('th-TH') : ''}</div>
          ${r.remark ? `<div class="row-sub" style="color:var(--primary-blue)">📝 ${r.remark}</div>` : ''}
          ${r.photo_url ? `<a href="${r.photo_url}" target="_blank" style="font-size:11px;color:var(--accent-red)">📷 ดูรูป</a>` : ''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:26px;font-weight:800;font-family:'Fredoka';color:var(--text-main)">${r.count_qty}</div>
          <span class="tag tag-blue" style="font-size:10px">R${r.round}</span>
          ${ohInfo ? `<div class="oh-chip" style="margin-top:6px;font-size:11px;padding:3px 8px">OH: ${ohInfo.oh}${ohInfo.al!=null?` <span class="al-part">· AL ${ohInfo.al}</span>`:''}</div>` : ''}
        </div>
      </div>`;
    } else if (ev.type === 'approval') {
      const a = ev.data;
      const isOk = a.resolution === 'ok';
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap;background:${isOk?'rgba(16,185,129,0.06)':'rgba(239,68,68,0.06)'}">
        <div class="row-body">
          <div class="row-title mono" style="font-size:13px">${a.items?.code||'?'}</div>
          <div class="row-sub">${a.items?.description||''}</div>
          <div class="row-sub">${isOk?'✅':'❌'} คอนเฟิร์มยอดโดย: ${a.profiles?.name||'?'}</div>
          <div class="row-sub">${a.created_at ? new Date(a.created_at).toLocaleString('th-TH') : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:26px;font-weight:800;font-family:'Fredoka';color:var(--text-main)">${a.final_qty}</div>
          <span class="tag ${isOk?'tag-green':'tag-red'}" style="font-size:10px">${a.variance>0?'+':''}${a.variance}</span>
        </div>
      </div>`;
    } else {
      const a = ev.data;
      const meta = ACTION_META[a.action] || { icon:'📝', label: a.action };
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap;background:rgba(42,107,242,0.06)">
        <div class="row-body">
          <div class="row-title mono" style="font-size:13px">${a.items?.code || meta.label}</div>
          ${a.items?.code ? `<div class="row-sub">${meta.icon} ${meta.label}</div>` : ''}
          <div class="row-sub">โดย: ${a.profiles?.name||'?'}</div>
          <div class="row-sub">${a.created_at ? new Date(a.created_at).toLocaleString('th-TH') : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:14px;font-weight:700;color:var(--text-main)">${a.old_value ?? '—'} → ${a.new_value ?? '—'}</div>
          <span class="tag tag-blue" style="font-size:10px">${meta.icon} ${meta.label}</span>
        </div>
      </div>`;
    }
  }

  cnt().innerHTML = `
    <div class="card">
      <div class="mono" style="font-size:18px;font-weight:800">${asgn.locations?.code}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${asgn.count_sessions?.name||''} · ${asgn.profiles?.name||'?'}</div>
      <div style="margin-top:8px"><span class="tag ${si.cls}">${si.lbl}</span></div>
      ${showMismatchWarning ? `
      <div class="alert alert-red" style="margin-top:12px">
        ⚠️ พบ ${mismatchItems.length} รายการที่ยอดนับไม่ตรงกับ OH ปัจจุบัน
      </div>
      <button class="btn btn-red btn-sm" onclick="sendBackToVariance('${aid}')">📤 ส่งกลับไปตรวจสอบใน Variance</button>` : ''}
    </div>
    <div class="sec">Transaction Log (${events.length} รายการ)</div>
    <div class="card card-flush">${rows || '<div class="load" style="padding:20px;text-align:center">ยังไม่มีการนับ</div>'}</div>`;
}

async function sendBackToVariance(aid) {

  const { error } = await sb.from('assignments').update({ status: 'round3_done' }).eq('id', aid);
  if (error) { alert(error.message); return; }
  alert('✅ ส่งกลับไปตรวจสอบใน Variance เรียบร้อยแล้ว');

}

async function createSess() {
  const name = Q('nn').value.trim();
  if (!name) return;
  const { error } = await sb.from('count_sessions').insert({ name, created_by:me.id });
  if (error) { Q('na').innerHTML = errBox(error.message); return; }
  Q('na').innerHTML = `<div class="alert alert-green">✅ สร้างเรียบร้อย</div>`;
  setTimeout(() => go('ad-manage'), 1200);
}

async function activateSess(id) {
  await sb.from('count_sessions').update({ status:'active' }).eq('id', id);
  loadAdSess();
}

async function closeSess(id) {
  if (!confirm('ปิด Session นี้? Counter จะนับเพิ่มไม่ได้แล้ว')) return;
  await sb.from('count_sessions').update({ status:'closed', closed_at:new Date().toISOString() }).eq('id', id);
  loadAdSess();
}

async function reopenSess(id) {
  if (!confirm('เปิด Session นี้ใหม่อีกครั้ง?')) return;
  await sb.from('count_sessions').update({ status:'active', closed_at:null }).eq('id', id);
  loadAdSess();
}

async function deleteSess(id, name) {
  if (!confirm(`ลบ Session "${name}" ?`)) return;
  const { data: asgns } = await sb.from('assignments').select('id').eq('session_id', id);
  const aIds = (asgns||[]).map(a=>a.id);
  if (aIds.length) {
    await sb.from('variance_approvals').delete().in('assignment_id', aIds);
    await sb.from('count_records').delete().in('assignment_id', aIds);
    await sb.from('assignments').delete().eq('session_id', id);
  }
  await sb.from('stock_snapshot_detail').delete().eq('session_id', id);
  await sb.from('stock_snapshot').delete().eq('session_id', id);
  await sb.from('count_sessions').delete().eq('id', id);
  loadAdSess();
}

async function loadDeleteZoneFilters() {
  const [{ data: locData }, { data: sessData }] = await Promise.all([
    sb.from('locations').select('zone,row_no'),
    sb.from('count_sessions').select('id,name').order('created_at',{ascending:false}),
  ]);

  const zones = new Set(), rows = new Set();
  (locData||[]).forEach(l => { if (l.zone) zones.add(l.zone); if (l.row_no) rows.add(l.row_no); });

  const fill = (id, vals) => {
    const el = Q(id); if (!el) return;
    el.innerHTML = '<option value="">ทั้งหมด</option>' +
      [...vals].sort().map(v => `<option value="${v}">${v}</option>`).join('');
  };
  fill('del-zone', zones);
  fill('del-row',  rows);

  const sEl = Q('del-session');
  if (sEl) {
    sEl.innerHTML = '<option value="">ทุก Session (ลบ Location ออกจากระบบจริง)</option>' +
      (sessData||[]).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  }
  refreshDeleteZonePreview();
}

function buildDelLocQuery(zone, row, code, selectCols, selectOpts) {
  let q = sb.from('locations').select(selectCols, selectOpts);
  if (zone) q = q.eq('zone', zone);
  if (row)  q = q.eq('row_no', row);
  if (code) q = q.ilike('code', code);
  return q;
}

async function refreshDeleteZonePreview() {
  const sid  = Q('del-session')?.value || '';
  const zone = Q('del-zone')?.value || '';
  const row  = Q('del-row')?.value || '';
  const code = Q('del-code')?.value.trim() || '';
  const prev = Q('del-preview'), btn = Q('del-btn');
  if (!prev || !btn) return;

  if (!zone && !row && !code) {
    prev.innerHTML = `<span style="color:var(--text-muted);font-weight:500">เลือกอย่างน้อย 1 เงื่อนไข</span>`;
    btn.disabled = true;
    return;
  }

  const { count, error } = await buildDelLocQuery(zone, row, code, 'id', { count:'exact', head:true });

  if (error) { prev.innerHTML = `<span style="color:var(--accent-red)">${error.message}</span>`; btn.disabled = true; return; }
  if (!count) {
    prev.innerHTML = `<span style="color:var(--text-muted);font-weight:500">ไม่พบ Location ที่ตรงเงื่อนไข</span>`;
    btn.disabled = true;
  } else {
    const scope = sid ? 'เฉพาะ Session ที่เลือก' : 'ทุก Session (ลบออกจากระบบจริง)';
    prev.innerHTML = `⚠️ จะลบ <strong>${count.toLocaleString()} locations</strong> — ${scope}`;
    btn.disabled = false;
  }
}

async function doDeleteByZoneRow() {
  const sid  = Q('del-session')?.value || '';
  const zone = Q('del-zone')?.value || '';
  const row  = Q('del-row')?.value || '';
  const code = Q('del-code')?.value.trim() || '';
  if (!zone && !row && !code) return;

  const label = [zone, row, code].filter(Boolean).join(' / ');
  if (!confirm(`ยืนยันลบ: "${label}"`)) return;

  const btn = Q('del-btn'), al = Q('del-alert');
  btn.disabled = true;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลังค้นหา Location ที่ตรงเงื่อนไข...</div>`;

  const { data: locs, error: e0 } = await buildDelLocQuery(zone, row, code, 'id,code');
  if (e0)             { al.innerHTML = errBox(e0.message); btn.disabled = false; return; }
  if (!locs?.length)  { al.innerHTML = `<div class="alert alert-amber">ไม่พบ Location ที่ตรงเงื่อนไข</div>`; btn.disabled = false; return; }

  const locIds = locs.map(l => l.id);
  const BATCH = 200;

  try {
    al.innerHTML = `<div class="alert alert-blue">⏳ [1/6] ค้นหา Assignment...</div>`;
    let asgnIds = [];
    for (let i = 0; i < locIds.length; i += BATCH) {
      let aq = sb.from('assignments').select('id').in('location_id', locIds.slice(i, i+BATCH));
      if (sid) aq = aq.eq('session_id', sid);
      const { data, error } = await aq;
      if (error) throw error;
      asgnIds.push(...(data||[]).map(a => a.id));
    }

    if (asgnIds.length) {
      al.innerHTML = `<div class="alert alert-blue">⏳ [2/6] ลบ Variance Approvals...</div>`;
      for (let i = 0; i < asgnIds.length; i += BATCH) {
        const chunk = asgnIds.slice(i, i + BATCH);
        await sb.from('variance_approvals').delete().in('assignment_id', chunk);
      }

      al.innerHTML = `<div class="alert alert-blue">⏳ [3/6] ลบ Count Records...</div>`;
      for (let i = 0; i < asgnIds.length; i += BATCH) {
        const chunk = asgnIds.slice(i, i + BATCH);
        await sb.from('count_records').delete().in('assignment_id', chunk);
      }

      al.innerHTML = `<div class="alert alert-blue">⏳ [4/6] ลบ Assignments...</div>`;
      for (let i = 0; i < asgnIds.length; i += BATCH) {
        const chunk = asgnIds.slice(i, i + BATCH);
        await sb.from('assignments').delete().in('id', chunk);
      }
    }

    al.innerHTML = `<div class="alert alert-blue">⏳ [5/6] ลบ Stock Snapshot...</div>`;
    for (let i = 0; i < locIds.length; i += BATCH) {
      const chunk = locIds.slice(i, i + BATCH);
      let qDet = sb.from('stock_snapshot_detail').delete().in('location_id', chunk);
      let qSnap = sb.from('stock_snapshot').delete().in('location_id', chunk);
      if (sid) {
        qDet = qDet.eq('session_id', sid);
        qSnap = qSnap.eq('session_id', sid);
      }
      await qDet;
      await qSnap;
    }

    if (!sid) {
      al.innerHTML = `<div class="alert alert-blue">⏳ [6/6] ลบ Locations ออกจากระบบ...</div>`;
      for (let i = 0; i < locIds.length; i += BATCH) {
        const chunk = locIds.slice(i, i + BATCH);
        await sb.from('locations').delete().in('id', chunk);
      }
    }

    al.innerHTML = `<div class="alert alert-green">✅ ลบข้อมูลเรียบร้อยแล้ว (${locs.length} locations)</div>`;
    setTimeout(() => { loadDeleteZoneFilters(); }, 1500);
  } catch (err) {
    al.innerHTML = errBox(err.message || 'เกิดข้อผิดพลาดในการลบ');
  } finally {
    btn.disabled = false;
  }
}

function readXlsxFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    _xlsxRawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
    refreshXlsxPreview();
  };
  reader.readAsArrayBuffer(file);
}

function refreshXlsxPreview() {
  const btn = Q('ibtn');
  const prev = Q('ipreview');
  if (!_xlsxRawRows || !_xlsxRawRows.length) {
    if (prev) prev.style.display = 'none';
    if (btn) btn.disabled = true;
    return;
  }

  const locFilter = (Q('ilocfilter')?.value || '').trim().toUpperCase();
  const parsed = [];

  for (const row of _xlsxRawRows) {
    const keys = Object.keys(row);
    const findVal = (terms) => {
      const k = keys.find(key => terms.some(t => key.toUpperCase().includes(t)));
      return k ? String(row[k]).trim() : '';
    };

    const locCode = findVal(['LOCATION', 'LOC_CODE', 'LOC']);
    const itemCode = findVal(['ITEM_CODE', 'ITEM', 'SKU', 'ARTICLE', 'MATERIAL']);
    const itemDesc = findVal(['ITEM_DESC', 'DESCRIPTION', 'DESC', 'NAME']);
    const onhand = parseFloat(findVal(['ONHAND', 'OH', 'QTY', 'QUANTITY', 'STOCK'])) || 0;
    const alQty = findVal(['AL', 'ALLOCATED']) ? parseFloat(findVal(['AL', 'ALLOCATED'])) : null;
    const lpn = findVal(['LPN', 'LICENSE_PLATE', 'PALLET']);
    const lot = findVal(['LOT', 'BATCH']);
    const invStatus = findVal(['STATUS', 'INV_STATUS', 'INVENTORY_STATUS']);

    if (!locCode || !itemCode) continue;

    if (locFilter) {
      const pattern = locFilter.replace(/%/g, '.*');
      const regex = new RegExp('^' + pattern, 'i');
      if (!regex.test(locCode)) continue;
    }

    parsed.push({ locCode, itemCode, itemDesc, onhand, alQty, lpn, lot, invStatus });
  }

  _xlsxParsed = parsed;

  if (prev) {
    prev.style.display = 'block';
    prev.innerHTML = `<div class="alert alert-blue" style="font-size:12px;margin-bottom:0">
      📊 พบ <strong>${parsed.length}</strong> รายการที่พร้อม Import (จากทั้งหมด ${_xlsxRawRows.length} แถว)
    </div>`;
  }
  if (btn) btn.disabled = parsed.length === 0;
}

async function doImportXlsx() {
  const sid = Q('is')?.value;
  const al = Q('ia');
  const btn = Q('ibtn');

  if (!sid) { alert('กรุณาเลือก Session ก่อน'); return; }
  if (!_xlsxParsed || !_xlsxParsed.length) { alert('ไม่มีข้อมูลที่พร้อม Import'); return; }

  btn.disabled = true;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลังประมวลผล ${_xlsxParsed.length} รายการ...</div>`;

  try {
    const uniqueLocsMap = new Map();
    const uniqueItemsMap = new Map();

    _xlsxParsed.forEach(r => {
      if (!uniqueLocsMap.has(r.locCode)) {
        uniqueLocsMap.set(r.locCode, {
          code: r.locCode,
          zone: computeZone(r.locCode, r.itemDesc)
        });
      }
      if (!uniqueItemsMap.has(r.itemCode)) {
        uniqueItemsMap.set(r.itemCode, {
          code: r.itemCode,
          description: r.itemDesc
        });
      }
    });

    // 1. Upsert Locations
    const locList = Array.from(uniqueLocsMap.values());
    const { data: dbLocs, error: eLoc } = await sb.from('locations')
      .upsert(locList, { onConflict: 'code' })
      .select('id,code');
    if (eLoc) throw eLoc;

    const locIdMap = new Map(dbLocs.map(l => [l.code, l.id]));

    // 2. Upsert Items
    const itemList = Array.from(uniqueItemsMap.values());
    const { data: dbItems, error: eItem } = await sb.from('items')
      .upsert(itemList, { onConflict: 'code' })
      .select('id,code');
    if (eItem) throw eItem;

    const itemIdMap = new Map(dbItems.map(i => [i.code, i.id]));

    // 3. Group Snapshots
    const snapMap = new Map();
    const detailsList = [];

    _xlsxParsed.forEach(r => {
      const locId = locIdMap.get(r.locCode);
      const itemId = itemIdMap.get(r.itemCode);
      if (!locId || !itemId) return;

      const key = `${sid}|${locId}|${itemId}`;
      if (!snapMap.has(key)) {
        snapMap.set(key, {
          session_id: sid,
          location_id: locId,
          item_id: itemId,
          onhand_qty: 0,
          al_qty: r.alQty
        });
      }
      const item = snapMap.get(key);
      item.onhand_qty += r.onhand;

      if (r.lpn || r.lot || r.invStatus) {
        detailsList.push({
          session_id: sid,
          location_id: locId,
          item_id: itemId,
          license_plate: r.lpn || null,
          lot: r.lot || null,
          inventory_status: r.invStatus || null,
          qty: r.onhand
        });
      }
    });

    const snapList = Array.from(snapMap.values());
    const BATCH = 200;

    al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก Stock Snapshot (${snapList.length} รายการ)...</div>`;
    for (let i = 0; i < snapList.length; i += BATCH) {
      const { error } = await sb.from('stock_snapshot')
        .upsert(snapList.slice(i, i + BATCH), { onConflict: 'session_id,location_id,item_id' });
      if (error) throw error;
    }

    if (detailsList.length) {
      al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก LPN/Lot Details (${detailsList.length} รายการ)...</div>`;
      for (let i = 0; i < detailsList.length; i += BATCH) {
        const { error } = await sb.from('stock_snapshot_detail')
          .insert(detailsList.slice(i, i + BATCH));
        if (error) console.warn('Detail insert warning:', error);
      }
    }

    al.innerHTML = `<div class="alert alert-green">✅ Import ข้อมูลสำเร็จเรียบร้อย (${snapList.length} Unique Snapshots)</div>`;
    _xlsxRawRows = null;
    _xlsxParsed = null;
    if (Q('ixlsx')) Q('ixlsx').value = '';
    if (Q('ipreview')) Q('ipreview').style.display = 'none';
  } catch (err) {
    al.innerHTML = errBox(err.message || 'เกิดข้อผิดพลาดระหว่าง Import');
  } finally {
    btn.disabled = false;
  }
}

  if (error) { cnt().innerHTML = errBox(error.message); return; }

  let rows = (users || []).map(u => `
    <div class="row" style="cursor:default">
      <div class="row-body">

      </div>
      <select style="width:auto;font-size:12px;padding:6px 12px" onchange="updateUserRole('${u.id}', this.value)">

async function updateUserRole(uid, role) {
  const { error } = await sb.from('profiles').update({ role }).eq('id', uid);
  if (error) alert('อัปเดตสิทธิ์ไม่สำเร็จ: ' + error.message);
  else alert('✅ อัปเดตสิทธิ์เรียบร้อยแล้ว');
}
