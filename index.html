<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Count v65.1 - Edge Function Fix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Mitr:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
<!-- SheetJS สำหรับอ่านไฟล์ XLSX -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- html5-qrcode สำหรับสแกน Location -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
/* ── Neumorphism Soft UI Variables ── */
:root {
  --main-bg: #EDF6F9; 
  --neu-surface: #EDF6F9;
  
  --neu-shadow-dark: #d7e6ea; 
  --neu-shadow-light: #ffffff; 
  
  --sidebar-bg: linear-gradient(180deg, #83C5BE 0%, #006D77 100%);
  --sidebar-hover: rgba(255, 255, 255, 0.25);
  --sidebar-text: rgba(255, 255, 255, 0.9);
  --sidebar-active-bg: #ffffff;
  --sidebar-active-text: #006D77;
  
  --primary-blue: #006D77;
  --primary-grad: linear-gradient(135deg, #83C5BE 0%, #006D77 100%);
  --accent-green: #006D77;
  --accent-red: #E29578;
  --accent-amber: #FFDDD2;
  
  --text-main: #264653;
  --text-muted: #6f8a8d;
  
  --border-radius-xl: 32px;
  --border-radius-lg: 20px;
  --border-radius-md: 14px;
  --border-radius-sm: 8px;
  
  --sidebar-width: 260px;
  --sidebar-collapsed-width: 80px;
  --topbar-height: 70px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Mitr', 'Fredoka', 'Sarabun', sans-serif;
  background: var(--main-bg);
  color: var(--text-main);
  min-height: 100vh;
  font-size: 14px;
  overflow-x: hidden;
}

.app-container {
  display: flex;
  min-height: 100vh;
  width: 100vw;
  overflow: hidden;
  padding: 12px;
  gap: 15px;
}

/* ── Collapsible Modern Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 200;
  border-radius: var(--border-radius-xl);
  box-shadow: 12px 12px 30px rgba(78, 168, 222, 0.25), inset -4px -4px 10px rgba(255,255,255,0.2);
  position: relative;
  overflow: hidden;
}
.sidebar.collapsed {
  width: var(--sidebar-collapsed-width);
}
.sidebar.collapsed .sidebar-title,
.sidebar.collapsed .sidebar-sub,
.sidebar.collapsed .sidebar-footer,
.sidebar.collapsed .nav-item span:not(.nav-icon) {
  display: none;
}
.sidebar.collapsed .sidebar-header {
  padding: 24px 10px;
}
.sidebar.collapsed .nav-item {
  justify-content: center;
  padding: 14px;
}

.sidebar-header {
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}
.sidebar-logo-icon {
  width: 64px;
  height: 64px;
  background: #ffffff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #4ea8de;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 2px 2px 5px rgba(255,255,255,0.8);
}
.sidebar-title { font-size: 18px; font-weight: 700; color: #FFFFFF; font-family: 'Fredoka', sans-serif; letter-spacing: 0.5px; }
.sidebar-sub { font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 500; }

.sidebar-menu { padding: 10px 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

.nav-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 20px;
  border-radius: 20px;
  color: var(--sidebar-text);
  font-weight: 600; cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left; font-family: inherit; font-size: 15px;
  transition: all 0.25s ease;
}
.nav-item:hover { background: var(--sidebar-hover); color: #FFFFFF; transform: translateX(3px); }
.nav-item.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  box-shadow: 0 8px 20px rgba(0,0,0,0.12), inset 2px 2px 5px rgba(255,255,255,0.5);
  font-weight: 700;
}
.nav-icon { font-size: 20px; flex-shrink: 0; }
.nav-group { display:flex; flex-direction:column; gap:6px; }
.nav-parent { justify-content:flex-start; }
.nav-parent .nav-chevron { margin-left:auto; transition:transform .2s ease; font-size:13px; }
.nav-group.open .nav-chevron { transform:rotate(180deg); }
.nav-submenu { display:none; flex-direction:column; gap:5px; padding-left:18px; }
.nav-group.open .nav-submenu { display:flex; }
.nav-subitem { padding:11px 14px; border-radius:16px; font-size:13px; }
.nav-subitem .nav-icon { font-size:16px; }
.mobile-sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(20,35,50,.35); backdrop-filter:blur(2px); z-index:999; }
.mobile-sidebar-backdrop.show { display:block; }
.sidebar-footer { padding: 20px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.7); border-top: 1px solid rgba(255,255,255,0.15); margin: 0 16px 10px; }

/* ── Main Content Area ── */
.main-wrapper {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  height: calc(100vh - 24px); overflow-y: auto;
  background: transparent;
}

/* ── Topbar ── */
.topbar {
  height: var(--topbar-height);
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; flex-shrink: 0;
  background: var(--main-bg);
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.toggle-sidebar-btn {
  background: var(--neu-surface); border: none; font-size: 18px; cursor: pointer;
  color: var(--text-main); width: 44px; height: 44px; border-radius: 50%;
  box-shadow: 5px 5px 10px var(--neu-shadow-dark), -5px -5px 10px var(--neu-shadow-light);
  display: flex; align-items: center; justify-content: center;
  transition: 0.2s;
}
.toggle-sidebar-btn:active { box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); }
.topbar-title { font-size: 24px; font-weight: 700; color: var(--text-main); font-family: 'Fredoka', sans-serif;}
.page-back-btn {
  min-width: 86px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 15px;
  border: none;
  border-radius: 16px;
  background: var(--neu-surface);
  color: var(--text-main);
  box-shadow: 5px 5px 11px var(--neu-shadow-dark), -5px -5px 11px var(--neu-shadow-light);
  font-family: 'Mitr', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, color .18s ease;
  flex: 0 0 auto;
}
.page-back-btn:hover {
  color: var(--primary-blue);
  transform: translateX(-2px);
}
.page-back-btn:active {
  transform: translateX(-1px) scale(.98);
  box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light);
}
.page-back-btn svg {
  width: 19px;
  height: 19px;
  display: block;
  flex: 0 0 auto;
}

.topbar-right { display: flex; align-items: center; gap: 16px; }
.user-profile {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px;
  background: var(--neu-surface); border-radius: 30px;
  box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
}
.user-avatar {
  width: 32px; height: 32px; background: var(--primary-grad); color: white;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.user-name { font-weight: 600; font-size: 14px; color: var(--text-main); }

.top-out-btn {
  background: var(--neu-surface); border: none; color: var(--accent-red);
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer;
  box-shadow: 5px 5px 10px var(--neu-shadow-dark), -5px -5px 10px var(--neu-shadow-light);
  transition: all 0.2s ease;
}
.top-out-btn:active { box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); }

.page-content { padding: 20px; flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; }

/* ── Mobile Sidebar ── */
@media (max-width: 768px) {
  .app-container { padding: 0; }
  .sidebar {
    position: fixed; left: -300px; top: 0; bottom: 0; margin: 0;
    border-radius: 0 30px 30px 0; z-index: 1000;
  }
  .sidebar.mobile-open { left: 0; box-shadow:18px 0 40px rgba(0,0,0,.25); }
  .sidebar.collapsed { width:var(--sidebar-width); }
  .sidebar.collapsed .sidebar-title,
  .sidebar.collapsed .sidebar-sub,
  .sidebar.collapsed .sidebar-footer,
  .sidebar.collapsed .nav-item span:not(.nav-icon) { display:initial; }
  .sidebar.collapsed .nav-item { justify-content:flex-start; padding:14px 20px; }
  .main-wrapper { height: 100vh; width:100%; }
  .topbar { padding:0 12px; }
  .topbar-left { min-width:0; gap:8px; }
  .topbar-title { font-size:18px; max-width:48vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .page-back-btn {
    min-width: 42px;
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 14px;
  }
  .page-back-btn span { display:none; }
  .topbar-right { gap:8px; }
  .top-out-btn { padding:9px 12px; }
  .user-name { display: none; }
  .page-content { padding:14px 12px 28px; }
  .card { padding:18px; border-radius:22px; }
  .row { padding:15px 14px; }
  button, .nav-item, .tab-row, .btn { touch-action:manipulation; }
}

/* ── Neumorphic Cards ── */
.card {
  background: var(--neu-surface); border: none;
  border-radius: var(--border-radius-xl); margin-bottom: 24px; padding: 24px;
  box-shadow: 12px 12px 24px var(--neu-shadow-dark), -12px -12px 24px var(--neu-shadow-light);
  position: relative; overflow: hidden;
}
.card-flush { padding: 0; overflow: hidden; }

.sec {
  font-size: 13px; font-weight: 700; color: var(--text-muted);
  padding: 10px 24px; margin-bottom: 10px;
}

.row {
  display: flex; align-items: center; padding: 18px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.5);
  gap: 12px; transition: background 0.2s;
}
.row:last-child { border-bottom: none; }
.row.click { cursor: pointer; }
.row.click:hover { background: rgba(255, 255, 255, 0.4); }
.tab-row { cursor: pointer; transition: background .12s; border-radius: 16px; }
.tab-row:active { background: rgba(0,0,0,0.02); }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
.row-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
.caret { font-size: 20px; color: var(--text-muted); flex-shrink: 0; font-weight: bold; }

/* Status Badges */
.tag {
  display: inline-block; padding: 6px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
}
.tag-gray  { background: var(--neu-surface); color: var(--text-muted); }
.tag-blue  { background: var(--main-bg); color: var(--primary-blue); box-shadow: inset 2px 2px 5px rgba(255,255,255,0.5); }
.tag-amber { background: var(--accent-amber); color: #FFFFFF; }
.tag-red   { background: var(--accent-red); color: #FFFFFF; }
.tag-green { background: var(--accent-green); color: #FFFFFF; }

/* ── Neumorphic Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px; border-radius: 30px; font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer; border: none;
  box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light);
  transition: all 0.2s ease;
  color: var(--text-main); background: var(--neu-surface);
}
.btn:active:not(:disabled) { box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light); transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
.btn-blue  { background: var(--primary-blue); color: #FFFFFF; box-shadow: 5px 5px 15px rgba(114, 213, 246, 0.4); }
.btn-green { background: var(--accent-green); color: #FFFFFF; box-shadow: 5px 5px 15px rgba(74, 222, 128, 0.4); }
.btn-red   { background: var(--accent-red); color: #FFFFFF; }
.btn-amber { background: var(--accent-amber); color: #FFFFFF; }
.btn-ghost { }
.btn-dark { background: var(--text-main); color: #FFFFFF; }
.btn-sm { padding: 8px 18px; font-size: 13px; border-radius: 20px; }
.btn-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── Inputs & Alerts ── */
.fg { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
input, select, textarea {
  width: 100%; padding: 14px 18px; border: none; border-radius: var(--border-radius-lg);
  font-size: 14px; font-family: inherit; font-weight: 600; color: var(--text-main);
  background: var(--neu-surface); outline: none;
  box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
  transition: all 0.3s;
}
input:focus, select:focus, textarea:focus {
  box-shadow: inset 6px 6px 12px var(--neu-shadow-dark), inset -6px -6px 12px var(--neu-shadow-light);
}
select { appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: 0.65rem auto; }

.alert {
  padding: 14px 18px; border-radius: var(--border-radius-md); font-size: 13px; margin-bottom: 16px;
  font-weight: 600; box-shadow: inset 3px 3px 6px rgba(0,0,0,0.05), inset -3px -3px 6px rgba(255,255,255,0.5);
  border: none;
}
.alert-red   { background: #ffe4e6; color: #e11d48; }
.alert-green { background: #dcfce7; color: #16a34a; }
.alert-blue  { background: #e0f2fe; color: #0284c7; }
.alert-amber { background: #fef3c7; color: #d97706; }

/* ── Stats & Gauges ── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 24px; }
.stat {
  background: var(--neu-surface); border-radius: var(--border-radius-xl); padding: 24px 16px; text-align: center;
  box-shadow: 10px 10px 20px var(--neu-shadow-dark), -10px -10px 20px var(--neu-shadow-light);
}
.stat-n { font-size: 38px; font-weight: 800; line-height: 1; color: var(--primary-blue); font-family: 'Fredoka', sans-serif; }
.stat-l { font-size: 13px; color: var(--text-muted); margin-top: 8px; font-weight: 700; text-transform: uppercase;}

.prog { height: 16px; background: var(--neu-surface); border-radius: 20px; box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); overflow: hidden; }
.prog-fill { height: 100%; background: var(--primary-blue); border-radius: 20px; transition: width .45s ease; }

/* ── Count Entry & Widgets ── */
.count-items-card {
  display: grid;
  gap: 16px;
  overflow: visible;
  background: transparent;
  box-shadow: none;
}
.citem-wrap {
  overflow: hidden;
  background: #fff;
  border: 1px solid rgba(0, 109, 119, .10);
  border-radius: 24px;
  box-shadow: 0 12px 28px rgba(31, 78, 93, .10);
}
.citem { display: flex; align-items: center; padding: 22px 26px; gap: 18px; }
.citem-info { flex: 1; min-width: 0; }
.citem-code { font-size: 19px; font-weight: 800; font-family: 'Fredoka', monospace; color: #12384a; }
.citem-desc { font-size: 13px; color: #405f6d; margin-top: 4px; font-weight: 600; }
.citem-detail-scroll { margin-top: 12px; overflow-x: auto; }
.citem-detail-table { width: 100%; min-width: 590px; border-collapse: separate; border-spacing: 0; }
.citem-detail-table th {
  padding: 7px 10px;
  background: #e9f7f7;
  color: #006d77;
  font-size: 10px;
  font-weight: 800;
  text-align: left;
  white-space: nowrap;
}
.citem-detail-table th:first-child { border-radius: 10px 0 0 10px; }
.citem-detail-table th:last-child { border-radius: 0 10px 10px 0; }
.citem-detail-table td {
  padding: 9px 10px 4px;
  color: #244858;
  font-size: 12px;
  font-weight: 600;
  vertical-align: middle;
}
.citem-detail-table .num { text-align: right; color: #12384a; font-size: 13px; font-weight: 800; }
.citem-detail-table .uom { color: #006d77; font-weight: 800; white-space: nowrap; }
.count-value-stack { display:flex; flex-direction:column; align-items:center; gap:12px; flex:0 0 auto; }
.cqty {
  width: 108px; height: 64px; box-sizing: border-box; padding: 10px; border: 1px solid rgba(0, 109, 119, .08); border-radius: 18px;
  font-size: 24px; font-weight: 800; text-align: center; color: var(--text-main);
  font-family: 'Fredoka', monospace; background: #fff;
  box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
}
.cqty.ok { color: var(--primary-blue); }

.oh-badge {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 108px; height: 64px; box-sizing: border-box; padding: 5px 10px; border-radius: 18px; background: #fff;
  border: 1px solid rgba(0, 109, 119, .08);
  box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
}
.oh-badge-label { font-size: 10px; font-weight: 800; color: var(--text-muted); }
.oh-badge-val { font-size: 22px; font-weight: 800; color: var(--text-main); font-family: 'Fredoka', monospace; }
.oh-badge-al { font-size: 10px; font-weight: 700; color: var(--accent-amber); }

.oh-chip {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 6px 14px; border-radius: 12px;
  background: var(--neu-surface); box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); 
  font-size: 13px; font-weight: 800; color: var(--text-muted);
}
.oh-chip input { width: 50px; border: none; background: transparent; box-shadow: none; padding: 0; font-size: 14px; font-weight: 800; color: var(--text-main); text-align: center; }

.cname-pill-wrap { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.cname-pill {
  display: inline-flex; align-items: center; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  background: var(--neu-surface); color: var(--text-muted); 
  box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
  transition: all 0.2s;
}
.cname-pill:active { box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); }
.cname-pill.sel { background: var(--primary-blue); color: #FFFFFF; box-shadow: 3px 3px 10px rgba(114, 213, 246, 0.4); }

.count-header-card { overflow: visible; z-index: 30; }
.counter-picker { position: relative; z-index: 20; margin-top: 10px; }
.counter-picker-trigger {
  width: 100%;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 16px;
  border: 1px solid rgba(0, 109, 119, .10);
  border-radius: 18px;
  background: #fff;
  color: #12384a;
  box-shadow: inset 3px 3px 8px rgba(83, 122, 137, .12), inset -3px -3px 8px rgba(255,255,255,.92);
  cursor: pointer;
  text-align: left;
}
.counter-picker-trigger-copy { min-width:0; display:flex; flex-direction:column; gap:2px; }

/* WMS Summary Card */
.wms-summary-card {

function normalizeHexColor(value, fallback) {
  const color = String(value || '').trim().toUpperCase();
  return /^#[0-9A-F]{6}$/.test(color) ? color : fallback;
}

function normalizeLogoDataUrl(value) {
  const logo = String(value || '').trim();
  if (!logo) return '';
  return /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/i.test(logo) && logo.length <= 900000
    ? logo
    : '';
}

function normalizeBrandingSettings(input = {}) {
  const output = {};
  BRANDING_COLOR_FIELDS.forEach(({ key }) => {
    output[key] = normalizeHexColor(input?.[key], DEFAULT_BRANDING[key]);
  });
  output.systemName = String(input?.systemName || DEFAULT_BRANDING.systemName).trim().slice(0, 60) || DEFAULT_BRANDING.systemName;
  output.systemSubtitle = String(input?.systemSubtitle || DEFAULT_BRANDING.systemSubtitle).trim().slice(0, 100) || DEFAULT_BRANDING.systemSubtitle;
  output.logoDataUrl = normalizeLogoDataUrl(input?.logoDataUrl);
  return output;
}

function readLocalBrandingSettings() {
  try {
    const current = localStorage.getItem(BRANDING_STORAGE_KEY);
    const legacy = LEGACY_BRANDING_STORAGE_KEYS
      .map(key => localStorage.getItem(key))
      .find(Boolean);
    return normalizeBrandingSettings(JSON.parse(current || legacy || '{}'));
  } catch (_) {
    return { ...DEFAULT_BRANDING };
  }
}

async function protectedFunctionHeaders() {
  if (!sb) throw new Error('ระบบฐานข้อมูลยังไม่พร้อม กรุณารีเฟรชหน้าแล้วลองใหม่');

  let { data: sessionData, error: sessionError } = await sb.auth.getSession();
  let session = sessionData?.session;
  const expiresSoon = !session?.expires_at || (session.expires_at * 1000) <= (Date.now() + 60000);

  if (!sessionError && session?.refresh_token && expiresSoon) {
    const refreshed = await sb.auth.refreshSession({ refresh_token: session.refresh_token });
    sessionError = refreshed.error;
    session = refreshed.data?.session;
  }

  if (sessionError || !session?.access_token) {
    throw new Error('Session หมดอายุ กรุณาออกจากระบบแล้วเข้าสู่ระบบใหม่');
  }

  return {
    Authorization: `Bearer ${session.access_token}`,
    apikey: SUPA_KEY,
  };
}

  if (prof?.role !== 'admin') throw new Error('คำสั่งนี้ทำได้เฉพาะ Admin เท่านั้น');
  const headers = await protectedFunctionHeaders();
  const { data, error } = await sb.functions.invoke('admin-master-data', {
    body: { action, ...payload },
    headers,
  });
  if (error) {
    let message = error.message || 'เรียกใช้งานระบบ Admin ไม่สำเร็จ';
    try {
      const detail = await error.context?.json();
      message = detail?.error || detail?.message || message;

    throw new Error(message);
  }
  if (!data?.ok) throw new Error(data?.error || 'ระบบ Admin ทำรายการไม่สำเร็จ');
  return data;
}

async function boot() {
  try {
    if (new URLSearchParams(window.location.search).get('preview') === '1') {
      window.__CYCLE_COUNT_PREVIEW__ = true;
      prof = { role: 'admin', name: 'AuD' };
      S = { page: 'sv-dash', _dashTab: 'summary' };
      render();
      return;
    }
    if (typeof supabase === 'undefined') {
      Q('app').innerHTML = `<div class="lbox"><div class="lcard"><div class="alert alert-red">เชื่อมต่อกับระบบฐานข้อมูลไม่ได้จ้า (Supabase SDK missing)</div></div></div>`;
      return;
    }
    sb = supabase.createClient(SUPA_URL, SUPA_KEY);
    await loadPublicBrandingSettings();
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      me = session.user;
      await loadProf();
      go(home());
    } else {
      go('login');
    }
    sb.auth.onAuthStateChange((e, session) => {
      if (e === 'SIGNED_OUT') { me = null; prof = null; go('login'); }
      if (e === 'PASSWORD_RECOVERY') { me = session?.user || me; go('reset-password'); }
    });
  } catch (err) {
    Q('app').innerHTML = `<div class="lbox"><div class="lcard"><div class="alert alert-red">ระบบมีปัญหาตอนเริ่มต้น: ${err.message || err}</div></div></div>`;
  }
}

  try {
    const { data } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
    prof = data || {};
  } catch(e) {
    prof = {};
    console.error("Error loading profile:", e);
  }
}

  if (r === 'counter')    return 'c-tasks';
  if (r === 'supervisor') return 'sv-dash';
  if (r === 'admin')      return 'sv-dash';
  return 'login';
}

function syncNavigationStateGlobals() {
  if (S._dashTab) _dashTab = S._dashTab;
  if (S._manageTab) _manageTab = S._manageTab;
}

function go(page, extra = {}, navOptions = {}) {
  const currentPage = S?.page || '';
  if (currentPage === 'ad-branding' && page !== 'ad-branding' && S._brandingSavedSnapshot) {
    applyBrandingSettings(S._brandingSavedSnapshot, false);
    delete S._brandingSavedSnapshot;
  }
  const nextExtra = { ...extra };
  if (page !== 'sv-dash') delete nextExtra._dashAnchor;

  if (navOptions.resetHistory || page === 'login') _navStack = [];

  const previousState = _navStack[_navStack.length - 1];
  const isReturningToStoredPage =
    NAV_DETAIL_PAGES.has(currentPage) &&
    previousState?.page === page &&
    currentPage !== page;

  if (isReturningToStoredPage) {
    _navStack.pop();
    S = { ...previousState, ...nextExtra, page };
  } else {
    const shouldRememberCurrent =
      !navOptions.replace &&
      currentPage &&
      currentPage !== page &&
      NAV_DETAIL_PAGES.has(page);
    if (shouldRememberCurrent) {
      _navStack.push({ ...S });
      if (_navStack.length > 20) _navStack.shift();
    }
    S = { page, ...nextExtra };
  }

  syncNavigationStateGlobals();
  try {
    render();
    window.scrollTo(0, 0);
  } catch (err) {
    console.error("Render Error:", err);
    alert(`เกิดข้อผิดพลาดในการแสดงหน้าจอ: ${err.message}`);
  }
}

function goPrimary(page) {
  go(page, {}, { replace:true, resetHistory:true });
}

function goBack() {
  const previousState = _navStack.pop();
  if (previousState?.page) {
    S = { ...previousState };
    syncNavigationStateGlobals();
    render();
    window.scrollTo(0, 0);
    return;
  }

  const currentPage = S?.page;
  if (currentPage === 'c-count') return go('c-tasks', {}, { replace:true });
  if (currentPage === 'sv-detail') return go('sv-list', {}, { replace:true });
  if (currentPage === 'sv-list') {
    return go('sv-dash', { _dashTab:'variance', _dashSid:S._dashSid }, { replace:true });
  }
  if (currentPage === 'ad-txlog') return go('ad-history', {}, { replace:true });
  if (currentPage === 'ad-new') {
    return go('ad-manage', { _manageTab:'sessions' }, { replace:true });
  }
  go(home(), {}, { replace:true });
}

function toggleMobileSidebar() {

function actualCounterNamesFromRecords(records=[]) {
  return [...new Set(
    (records || []).flatMap(record => splitActualCounterNames(record?.actual_counter_name))
  )];
}

function actualCounterLabel(records=[]) {
  const names = actualCounterNamesFromRecords(records);
  return names.length ? names.join(', ') : 'ไม่ระบุคนนับ';

function buildActualCounterMap(records=[]) {
  const map = {};
  (records || []).forEach(record => {
    if (!record?.assignment_id) return;
    map[record.assignment_id] = map[record.assignment_id] || new Set();
    splitActualCounterNames(record.actual_counter_name)
      .forEach(name => map[record.assignment_id].add(name));
  });
  return Object.fromEntries(
    Object.entries(map).map(([assignmentId, names]) => [assignmentId, [...names]])
  );
}

function fillDependentSelect(id, values, allLabel='ทั้งหมด', preferredValue) {
  const select = Q(id);
  if (!select) return '';
  const current = preferredValue === undefined ? select.value : String(preferredValue || '');
  const cleanValues = [...new Set(
    [...values]
      .filter(value => value !== null && value !== undefined && String(value).trim() !== '')
      .map(value => String(value))
  )].sort((a, b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' }));

  select.replaceChildren();
  const allOption = document.createElement('option');
  allOption.value = '';
  allOption.textContent = allLabel;
  select.appendChild(allOption);
  cleanValues.forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });
  select.value = cleanValues.includes(current) ? current : '';
  return select.value;
}

function computeZone(locCode, desc) {
  if (!locCode) return '';
  const A = locCode.toString().trim().toUpperCase();
  const C = (desc || '').toString().trim().toUpperCase();
  const left  = (s,n) => s.substring(0,n);
  const right = (s,n) => s.substring(s.length-n);

  if (left(A,3)==='B-0' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='B-1' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='B-2' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='-CW') return '';
  if (left(A,4)==='ECOM') return 'Overfloor';
  if (left(A,3)==='B-D') return 'Overfloor';
  if (left(A,3)==='B-N') return 'Overfloor';
  if (left(A,3)==='B-L') return 'Overfloor';
  if (left(A,3)==='B-O') return 'Overfloor';
  if (left(C,3)==='PKV') return 'Cool Room Floor';
  if (left(A,2)==='AM' || left(A,2)==='AL') return 'Overfloor';
  if (left(A,2)==='RM') return 'Raw Material';
  if (left(A,4)==='B-A-') return 'Overfloor';
  if (left(A,3)==='B-0') return 'Selective';
  if (left(A,3)==='B-1') return 'Selective';
  if (left(A,3)==='B-2') return 'Selective';
  if (left(A,3)==='PRE') return 'Pre-Transfer';
  if (left(A,2)==='C-') return 'Cool Room Floor';
  if (left(A,2)==='DM') return 'DAMAGE';
  if (left(A,2)==='IS') return 'ISSUE';
  if (left(A,3)==='B-E') return 'Longspand E';
  if (left(A,3)==='B-F') return 'Longspand F';
  if (left(A,3)==='B-C') return 'Cool Room';
  if (left(A,3)==='B-G') return 'Microrack';
  if (left(A,3)==='B-3') return 'Consumable Rack';
  if (left(A,6)==='BORROW') return 'BORROW';
  if (left(A,2)==='LO') return 'LOST';
  return 'Overfloor';
}

function computeItemStatus(oh, r1, r2, r3, rules) {
  const cfg = Object.assign({ maxRounds: 3, repeatMatchAction: 'recount' }, rules || {});
  const has = v => v !== null && v !== undefined && v !== '';
  const num = v => has(v) ? +v : v;
  oh = num(oh); r1 = num(r1); r2 = num(r2); r3 = num(r3);

  if (!has(r1)) return '';
  const rounds = [r1, r2, r3].filter(has).slice(0, cfg.maxRounds);
  if (has(oh) && rounds.some(r => r === oh)) return 'OK';

  let repeatFound = false;
  for (let i = 0; i < rounds.length && !repeatFound; i++) {
    for (let j = i + 1; j < rounds.length; j++) {
      if (rounds[i] === rounds[j]) { repeatFound = true; break; }
    }
  }
  if (repeatFound) {
    if (cfg.repeatMatchAction === 'auto_pass') return 'OK';
    if (cfg.repeatMatchAction === 'send_variance') return 'Diff';
  }
  if (rounds.length < cfg.maxRounds) return 'PENDING';
  return 'Diff';
}

      .select('max_rounds,repeat_match_action').eq('id', sessionId).maybeSingle();

      maxRounds: data?.max_rounds || 3,
      repeatMatchAction: data?.repeat_match_action || 'recount',
    };
  } catch(e) {
    return { maxRounds: 3, repeatMatchAction: 'recount' };
  }
}

    button.classList.toggle('is-visible', !showing);
  }
}

function passwordRequirementText(role) {
  return role === 'admin'
    ? 'Admin: อย่างน้อย 12 ตัว มี A-Z, a-z, ตัวเลข และอักขระพิเศษ'
    : 'User/Supervisor: อย่างน้อย 10 ตัว มี A-Z, a-z และตัวเลข';
}

function validateManagedPassword(password, role) {
  const value = String(password || '');
  const minimum = role === 'admin' ? 12 : 10;
  if (value.length < minimum || value.length > 72) return passwordRequirementText(role);
  if (!/[a-z]/.test(value) || !/[A-Z]/.test(value) || !/[0-9]/.test(value)) {
    return passwordRequirementText(role);
  }
  if (role === 'admin' && !/[^A-Za-z0-9]/.test(value)) return passwordRequirementText(role);
  if (/^(password|password123|admin123|qwerty|12345678|123456789|welcome)$/i.test(value)) {
    return 'รหัสผ่านนี้เดาง่ายเกินไป กรุณาใช้รหัสผ่านอื่น';
  }
  return '';
}

  }
  const btn = Q('lb');

  const { data, error } = await sb.functions.invoke('login-by-id', {
    body: { login_id: loginId, password: pwd },

  if (error || !data?.ok || !data?.session?.access_token || !data?.session?.refresh_token) {
    Q('la').innerHTML = '<div class="alert alert-red">User ID หรือรหัสผ่านไม่ถูกต้อง</div>';
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  } else {
    const { error: sessionError } = await sb.auth.setSession({
      access_token: data.session.access_token,
      refresh_token: data.session.refresh_token,
    });
    if (sessionError) {
      Q('la').innerHTML = '<div class="alert alert-red">เปิด Session ไม่สำเร็จ กรุณาลองอีกครั้ง</div>';

}

function refreshMyTaskFilters() {
  const entries = (window._myTasks || []).map(a => {
    const parts = (a.locations?.code || '').split('-');
    return { row:parts[1] || '', position:parts[2] || '', level:parts[3] || '' };
  });
  const row = fillDependentSelect('mt-row', entries.map(entry => entry.row), 'ทั้งหมด', S._mtRow);
  S._mtRow = row;
  const rowEntries = entries.filter(entry => !row || entry.row === row);
  const position = fillDependentSelect('mt-pos', rowEntries.map(entry => entry.position), 'ทั้งหมด', S._mtPos);
  S._mtPos = position;
  const positionEntries = rowEntries.filter(entry => !position || entry.position === position);
  S._mtLvl = fillDependentSelect('mt-lvl', positionEntries.map(entry => entry.level), 'ทั้งหมด', S._mtLvl);
  renderMyTasks();
}

function renderMyTasks() {
  const list = Q('mt-list');
  if (!list) return;
  const asgns = window._myTasks || [];
  const rowF = Q('mt-row')?.value || '';
  const posF = Q('mt-pos')?.value || '';
  const lvlF = Q('mt-lvl')?.value || '';

  const filtered = asgns.filter(a => {
    const parts = (a.locations?.code || '').split('-');
    if (rowF && parts[1] !== rowF) return false;
    if (posF && parts[2] !== posF) return false;
    if (lvlF && parts[3] !== lvlF) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="load" style="padding:40px;font-size:14px;color:var(--text-muted);text-align:center;font-weight:600">ไม่มีงานที่ตรงกับตัวกรอง</div>`;
    return;
  }

  let html = '';
  for (const a of filtered) {
    const l   = a.locations;
    const si  = tagInfo(a.status);
    const can = !['completed','approved'].includes(a.status);
    const sub = [l.zone, l.area, l.row_no && 'Row '+l.row_no, l.level && 'Lv.'+l.level].filter(Boolean).join(' · ');
    html += `<div class="row ${can?'click':''}" ${can?`onclick="go('c-count',{aid:'${a.id}'})"`:''}>
      <div class="row-body">
        <div class="row-title mono">${l.code}</div>
        <div class="row-sub">${sub}</div>
        <div class="row-sub" style="margin-top:4px; font-weight:700; color:var(--primary-blue)">${a.count_sessions.name}</div>
      </div>
      <span class="tag ${si.cls}">${si.lbl}</span>
      ${can ? '<span class="caret">›</span>' : ''}
    </div>`;
  }
  list.innerHTML = html;
}

function openScanner() {
  if (typeof Html5Qrcode === 'undefined') { alert('ตัวสแกนยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'scan-overlay';
  overlay.id = 'scanOverlay';
  overlay.innerHTML = `
    <div class="scan-header">
      <span>📷 สแกน Location</span>
      <button onclick="closeScanner()">✕</button>
    </div>
    <div id="scanReader"></div>`;
  document.body.appendChild(overlay);

  _html5Qr = new Html5Qrcode('scanReader');
  _html5Qr.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 240 },
    (decodedText) => onScanSuccess(decodedText),
    () => {}
  ).catch(err => {
    alert('เปิดกล้องไม่ได้: ' + (err?.message || err));
    closeScanner();
  });
}

function closeScanner() {
  if (_html5Qr) {
    _html5Qr.stop().catch(() => {}).finally(() => { try { _html5Qr.clear(); } catch(e){} _html5Qr = null; });
  }
  const overlay = Q('scanOverlay');
  if (overlay) overlay.remove();
}

function onScanSuccess(text) {
  const code = (text || '').trim().toUpperCase();
  const tasks = window._myTasks || [];
  const match = tasks.find(a => a.locations?.code?.toUpperCase() === code);
  closeScanner();
  if (!match) { alert(`ไม่พบ Location "${code}" ในงานของคุณ`); return; }
  if (['completed','approved'].includes(match.status)) { alert(`Location "${code}" นับเสร็จแล้ว`); return; }
  go('c-count', { aid: match.id });
}

function renderCounterPicker() {
  const wrap = Q('counterNameOptions');
  const summary = Q('counterPickerSummary');
  const chips = Q('counterSelectedChips');
  if (!wrap || !summary || !chips) return;
  const names = window._counterNames || [];
  window._selectedCounters = window._selectedCounters || new Set();
  const selected = [...window._selectedCounters];

  summary.textContent = selected.length
    ? `${selected.length} คน: ${selected.join(', ')}`
    : 'เลือกผู้นับจริง';
  chips.innerHTML = selected.map(name =>
    `<span class="counter-selected-chip">✓ ${escapeWmsText(name)}</span>`
  ).join('');

  if (!names.length) {
    wrap.innerHTML = `<div style="font-size:13px;color:#587784;padding:8px 2px">ยังไม่มีชื่อในระบบ — เพิ่มชื่อใหม่ด้านล่างได้เลย</div>`;
    return;
  }
  wrap.innerHTML = names.map((c, index) => {
    const sel = window._selectedCounters.has(c.name);
    return `<button type="button" class="counter-option ${sel?'sel':''}" onclick="toggleCounterByIndex(${index})">
      <span class="counter-option-mark">${sel?'✓':''}</span>
      <span>${escapeWmsText(c.name)}</span>
    </button>`;
  }).join('');
}

  event?.stopPropagation();
  const menu = Q('counterPickerMenu');
  const trigger = Q('counterPickerTrigger');
  if (!menu || !trigger) return;
  const willOpen = menu.hidden;
  menu.hidden = !willOpen;
  trigger.setAttribute('aria-expanded', String(willOpen));

  const menu = Q('counterPickerMenu');
  const trigger = Q('counterPickerTrigger');
  if (menu) menu.hidden = true;
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
}

    const result = await invokeAdminMaster('counter_create', { name });

function prepareCountPhoto(file, maxSide = 1600, quality = .82) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//i.test(file.type || '')) {
      reject(new Error('กรุณาเลือกไฟล์รูปภาพ'));
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      reject(new Error('รูปภาพต้องมีขนาดไม่เกิน 25 MB'));
      return;
    }
    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error('ไม่สามารถอ่านรูปภาพนี้ได้'));
    };
    image.onload = () => {
      try {
        const ratio = Math.min(1, maxSide / Math.max(image.naturalWidth || 1, image.naturalHeight || 1));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
        const context = canvas.getContext('2d');
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(objectUrl);
          if (!blob) reject(new Error('ย่อรูปภาพไม่สำเร็จ'));
          else resolve(blob);
        }, 'image/jpeg', quality);
      } catch (error) {
        URL.revokeObjectURL(objectUrl);
        reject(error);
      }
    };
    image.src = objectUrl;
  });
}

async function handlePhoto(itemId, input) {
  const file = input.files[0];
  if (!file) return;
  const thumb = Q('thumb_'+itemId);
  if (thumb) { thumb.src = URL.createObjectURL(file); thumb.style.display = 'block'; }
  input.disabled = true;
  try {
    if (!me?.id) throw new Error('Session หมดอายุ กรุณาเข้าสู่ระบบใหม่');
    const preparedPhoto = await prepareCountPhoto(file);
    const fileName = `${me.id}/${Date.now()}_${itemId}.jpg`;
    const { error } = await sb.storage.from('count-photos').upload(fileName, preparedPhoto, {
      upsert:false,
      contentType:'image/jpeg',
      cacheControl:'3600',
    });
    if (error) throw error;
    const { data: urlData } = sb.storage.from('count-photos').getPublicUrl(fileName);
    window._photoMap = window._photoMap || {};
    window._photoMap[itemId] = urlData.publicUrl;
    const tg = Q('tg_'+itemId);
    if (tg) tg.classList.add('has');
  } catch(e) {
    alert('อัปโหลดรูปไม่สำเร็จ: ' + (e?.message || e));
  }
  input.disabled = false;
}

async function submitCount(aid, round, idsStr) {
  const ids = idsStr.split(',');
  const al  = Q('ca'), btn = Q('cb');

  const selectedNames = [...(window._selectedCounters || [])];
  if (!selectedNames.length) {
    al.innerHTML = `<div class="alert alert-red">⚠️ กรุณาเลือก "ผู้นับจริง" อย่างน้อย 1 คนก่อนบันทึกยอดนับ</div>`;
    return;
  }
  const actualCounterName = selectedNames.join(', ');

  const recs = [];
  for (const iid of ids) {
    const v = Q('q_'+iid)?.value;
    if (v === '' || v === undefined || v === null) {
      al.innerHTML = `<div class="alert alert-red">กรอกจำนวนให้ครบทุกรายการ (ถ้าไม่มีสินค้าให้กรอก 0)</div>`;
      return;
    }
    const remark   = getSelectedCountRemarks(iid).join('\n') || null;
    const photoUrl = (window._photoMap && window._photoMap[iid]) || null;
    recs.push({
      assignment_id: aid, item_id: iid, round,
      count_qty: parseFloat(v), counted_by: me.id,
      actual_counter_name: actualCounterName,
      remark, photo_url: photoUrl,
    });
  }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  const { error } = await sb.from('count_records')
    .upsert(recs, { onConflict:'assignment_id,item_id,round' });

  if (error) {
    al.innerHTML = errBox(error.message);
    btn.disabled = false; btn.textContent = `✅ ยืนยันรอบที่ ${round}`; return;
  }

  const { data: asgn } = await sb.from('assignments')
    .select('location_id,session_id').eq('id', aid).single();

  const [{ data: snaps }, { data: allRounds }, rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty')
      .eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('count_records').select('item_id,round,count_qty').eq('assignment_id', aid),
    getSessionRules(asgn.session_id),
  ]);

  const ohMap = Object.fromEntries(snaps?.map(s => [s.item_id, +s.onhand_qty]) || []);
  const byItem = {};
  allRounds?.forEach(r => {
    byItem[r.item_id] = byItem[r.item_id] || {};
    byItem[r.item_id][r.round] = +r.count_qty;
  });

  const itemStatuses = Object.entries(byItem).map(([iid, v]) =>
    computeItemStatus(ohMap[iid], v[1], v[2], v[3], rules));
  const anyPending = itemStatuses.some(st => st === 'PENDING');
  const anyDiff    = itemStatuses.some(st => st === 'Diff');
  const needsMore  = anyPending || anyDiff;

  let newStatus;
  if (anyPending)   newStatus = ['','round1_done','round2_done','round3_done'][round];
  else if (anyDiff) newStatus = 'round3_done';
  else              newStatus = 'completed';

  await sb.from('assignments').update({ status: newStatus }).eq('id', aid);
  window._photoMap = {};

  if (!needsMore) {
    alert('✅ ยอดตรงทุกรายการ! บันทึกสำเร็จ');
    go('c-tasks');
  } else if (anyPending) {
    alert(`⚠️ ยอดไม่ตรงกับระบบ — กรุณานับรอบที่ ${round+1} อีกครั้งอย่างระมัดระวัง`);
    go('c-count', { aid });
  } else {
    alert('⚠️ ยอดไม่ตรงกับระบบ — ส่ง Supervisor ตรวจสอบแล้ว');
    go('c-tasks');
  }
}

function nextRound(st) {
  if (['pending','in_progress'].includes(st)) return 1;
  if (st === 'round1_done') return 2;
  if (st === 'round2_done') return 3;
  return null;
}

async function loadSvDash() {
  const { data: sessions } = await sb.from('count_sessions')
    .select('id,name').eq('status','active').order('created_at',{ascending:false});

  if (!sessions?.length) {
    cnt().innerHTML = `<div class="card" style="text-align:center;padding:60px 40px">
      <div style="font-size:60px">🌴</div>
      <div style="margin-top:20px;color:var(--text-main);font-weight:700; font-size:16px;">ยังไม่มี Session ที่เปิดอยู่</div>
      ${ ['admin','supervisor'].includes(prof?.role) ? `<button class="btn btn-blue" style="margin-top:24px" onclick="go('ad-manage')">📂 ไปสร้าง Session</button>` : ''}
    </div>`; return;
  }

  const curSid = S._dashSid || sessions[0].id;
  S._dashSid = curSid;
  const curName = sessions.find(s=>s.id===curSid)?.name || sessions[0].name;
  const sessOpts = sessions.map(s=>`<option value="${s.id}" ${s.id===curSid?'selected':''}>${s.name}</option>`).join('');

  const [{ data: asgns }, { data: wmsRemarkRows }] = await Promise.all([
    sb.from('assignments')
      .select('id,status,assigned_to,location_id,locations(code,zone,row_no,level)')
      .eq('session_id', curSid)
      .order('status'),
    sb.from('remark_options').select('id,label').eq('context','wms').order('label'),
  ]);
  window._wmsNoteOptions = wmsRemarkRows?.length
    ? wmsRemarkRows
    : WMS_NOTE_PRESETS.map(label => ({ id:null, label }));

  if (!asgns?.length) {
    cnt().innerHTML = `
      <div class="card">
        <div class="fg" style="margin-bottom:0">
          <label>Session</label>
          <select onchange="S._dashSid=this.value;loadSvDash()">${sessOpts}</select>
        </div>
      </div>
      <div class="card">
        <div class="alert alert-blue">Session "${curName}" ยังไม่มีการ Assign งาน</div>
        ${ ['admin','supervisor'].includes(prof?.role) ? `<button class="btn btn-blue" style="margin-top:14px" onclick="go('ad-manage')">👥 ไปจ่ายงาน</button>` : ''}
      </div>`; return;
  }

  const total    = asgns.length;
  const done     = asgns.filter(a => ['completed','approved'].includes(a.status)).length;
  const varCount = asgns.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status)).length;
  const pending  = asgns.filter(a => ['pending','in_progress'].includes(a.status)).length;
  const pct      = Math.round(done / total * 100);

  const asgnInfoMap = {};
  asgns.forEach(a => { asgnInfoMap[a.id] = a; });

  const allAsgnIds = asgns.map(a => a.id);
  const [{ data: allCounts }, { data: allSnapshots }, rules] = await Promise.all([
    sb.from('count_records').select('assignment_id,item_id,round,count_qty,counted_at,actual_counter_name').in('assignment_id', allAsgnIds),
    sb.from('stock_snapshot').select('location_id,item_id,onhand_qty').eq('session_id', curSid),
    getSessionRules(curSid),
  ]);

  const ohMap = {};
  (allSnapshots||[]).forEach(s => { ohMap[s.location_id + '|' + s.item_id] = +s.onhand_qty; });

  const countByAsgn = {};
  (allCounts||[]).forEach(c => {
    if (!countByAsgn[c.assignment_id]) countByAsgn[c.assignment_id] = {};
    if (!countByAsgn[c.assignment_id][c.item_id]) countByAsgn[c.assignment_id][c.item_id] = {};
    countByAsgn[c.assignment_id][c.item_id][c.round] = +c.count_qty;
  });
  const actualCountersByAssignment = buildActualCounterMap(allCounts || []);

  const diffAssignments = [];
  for (const a of asgns) {
    if (!['round1_done','round2_done','round3_done'].includes(a.status)) continue;
    const itemCounts = countByAsgn[a.id] || {};
    const locId = a.location_id;
    let hasDiff = false, hasPending = false;
    for (const [itemId, rounds] of Object.entries(itemCounts)) {
      const oh = ohMap[locId + '|' + itemId];
      if (oh === undefined) continue;
      const st = computeItemStatus(oh, rounds[1], rounds[2], rounds[3], rules);
      if (st === 'Diff') hasDiff = true;
      if (st === 'PENDING') hasPending = true;
    }
    if (hasDiff || hasPending) diffAssignments.push({ ...a, _hasDiff: hasDiff, _hasPending: hasPending });
  }

  let wmsRows = [];
  let vaError = null;

  try {
    const { data: vaData, error: vaErr } = await sb.from('variance_approvals')
      .select('id,assignment_id,item_id,final_qty,variance,resolution,approved_by,wms_fixed,wms_fixed_at,wms_fixed_by')
      .in('assignment_id', allAsgnIds);

    if (vaErr) {
      vaError = vaErr;
      wmsRows = [];
    } else {
      wmsRows = (vaData || []).map(v => ({
        ...v,
        wms_fixed: v.wms_fixed ?? false,
        wms_fixed_at: v.wms_fixed_at ?? null,
        wms_fixed_by: v.wms_fixed_by ?? null,
        created_at: v.created_at ?? null,
        _fromVA: true
      }));
    }
  } catch (e) {
    vaError = e;
  }

  const allItemIds = [...new Set(wmsRows.map(v => v.item_id).filter(Boolean))];
  const allApproverIds = [...new Set(wmsRows.map(v => v.approved_by).filter(Boolean))];
  const [{ data: itemsData }, { data: approversData }, { data: wmsNoteRows, error: wmsNoteError }] = await Promise.all([
    allItemIds.length ? sb.from('items').select('id,code,description').in('id', allItemIds) : { data: [] },
    allApproverIds.length ? sb.from('profiles').select('id,name').in('id', allApproverIds) : { data: [] },
    sb.from('audit_log')
      .select('id,assignment_id,item_id,new_value,created_at')
      .eq('session_id', curSid)
      .eq('action', 'wms_note')
      .order('created_at', { ascending: true }),
  ]);
  const itemMap = Object.fromEntries((itemsData||[]).map(i => [i.id, i]));
  const approverMap = Object.fromEntries((approversData||[]).map(p => [p.id, p]));
  const wmsNoteMap = {};
  if (wmsNoteError) console.warn('โหลดหมายเหตุ WMS ไม่สำเร็จ:', wmsNoteError.message);
  (wmsNoteRows||[]).forEach(n => {
    const key = `${n.assignment_id}|${n.item_id}`;
    if (!wmsNoteMap[key]) wmsNoteMap[key] = [];
    wmsNoteMap[key].push({ id:n.id, text:n.new_value || '', created_at:n.created_at });
  });
  wmsRows.forEach(v => {
    v.items = itemMap[v.item_id] || { code: '?', description: '' };
    v.profiles = approverMap[v.approved_by] || { name: '?' };
    v.wms_notes = wmsNoteMap[`${v.assignment_id}|${v.item_id}`] || [];
  });

  const approvedAsgnIds = new Set(wmsRows.filter(v => v.wms_fixed).map(v => v.assignment_id));
  const pendingWmsRows = [];
  for (const a of diffAssignments) {
    if (approvedAsgnIds.has(a.id)) continue;
    const itemCounts = countByAsgn[a.id] || {};
    const locId = a.location_id;
    for (const [itemId, rounds] of Object.entries(itemCounts)) {
      const oh = ohMap[locId + '|' + itemId];
      if (oh === undefined) continue;
      const st = computeItemStatus(oh, rounds[1], rounds[2], rounds[3], rules);
      if (st !== 'Diff' && st !== 'PENDING') continue;
      const latestRound = rounds[3] !== undefined ? 3 : rounds[2] !== undefined ? 2 : 1;
      const countQty = rounds[latestRound];
      const variance = countQty - oh;
      pendingWmsRows.push({
        _isPending: true,
        assignment_id: a.id,
        item_id: itemId,
        final_qty: countQty,
        variance: variance,
        resolution: st === 'Diff' ? 'pending_diff' : 'pending_recount',
        approved_by: null,
        wms_fixed: false,
        wms_fixed_at: null,
        wms_fixed_by: null,
        created_at: null,
        items: { code: '?', description: '' },
        profiles: { name: '(ยังไม่คอนเฟิร์ม)' },
        wms_notes: wmsNoteMap[`${a.id}|${itemId}`] || [],
      });
    }
  }

  const pendingItemIds = [...new Set(pendingWmsRows.map(v => v.item_id).filter(Boolean))];
  if (pendingItemIds.length) {
    const { data: pendingItems } = await sb.from('items').select('id,code,description').in('id', pendingItemIds);
    const pItemMap = Object.fromEntries((pendingItems||[]).map(i => [i.id, i]));
    pendingWmsRows.forEach(v => { v.items = pItemMap[v.item_id] || { code: '?', description: '' }; });
  }

  const allWmsRows = [...wmsRows, ...pendingWmsRows];
  window._wmsRows = allWmsRows;
  window._wmsAsgnInfoMap = asgnInfoMap;
  window._actualCountersByAssignment = actualCountersByAssignment;

  let diffPlus = 0, diffMinus = 0;
  const gainItemKeys = new Set();
  const lostItemKeys = new Set();
  allWmsRows.forEach(v => {
    const d = +v.variance;
    const itemKey = `${v.assignment_id || ''}|${v.item_id || ''}`;

  const gainItemCount = gainItemKeys.size;
  const lostItemCount = lostItemKeys.size;

  let totalOHQty = 0;
  Object.values(ohMap).forEach(qty => totalOHQty += qty);

  let uniqueSKUs = new Set();
  let uniqueLocations = new Set();
  (allSnapshots||[]).forEach(s => {
    uniqueSKUs.add(s.item_id);
    uniqueLocations.add(s.location_id);

  let totalSKUs = uniqueSKUs.size;
  let totalLocations = uniqueLocations.size;

  let absVariance = diffPlus + diffMinus; 
  let stockAccuracy = totalOHQty > 0 ? Math.max(0, 100 - (absVariance / totalOHQty * 100)).toFixed(2) : 100;
  const stockAccuracyNum = Number(stockAccuracy) || 0;
  const diffPct = totalOHQty > 0 ? ((absVariance / totalOHQty) * 100).toFixed(2) : '0.00';
  const diffPctNum = Number(diffPct) || 0;

  const varianceRowsOnly = allWmsRows.filter(v => Number(v.variance) !== 0);
  const diffLocationSet = new Set();
  const diffItemSet = new Set();
  varianceRowsOnly.forEach(v => {
    const locKey = asgnInfoMap[v.assignment_id]?.location_id || asgnInfoMap[v.assignment_id]?.locations?.code || v.assignment_id;

    if (v.item_id) diffItemSet.add(v.item_id);
  });
  const diffLocationPct = totalLocations > 0 ? ((diffLocationSet.size / totalLocations) * 100).toFixed(2) : '0.00';
  const diffItemPct = totalSKUs > 0 ? ((diffItemSet.size / totalSKUs) * 100).toFixed(2) : '0.00';

  const countedAssignmentIds = new Set((allCounts || []).map(c => c.assignment_id).filter(Boolean));
  const countedAssignments = asgns.filter(a => countedAssignmentIds.has(a.id));
  const countedLocationSet = new Set();
  const countedCounterSet = new Set();
  countedAssignments.forEach(a => {
    if (a.location_id) countedLocationSet.add(a.location_id);
    else if (a.locations?.code) countedLocationSet.add(a.locations.code);
  });
  (allCounts || []).forEach(c => {
    splitActualCounterNames(c.actual_counter_name).forEach(name => countedCounterSet.add(name));
  });
  const countedItemSet = new Set();
  const countedOhKeys = new Set();
  (allCounts || []).forEach(c => {
    const asgn = asgnInfoMap[c.assignment_id];
    if (!asgn) return;
    if (c.item_id) countedItemSet.add(c.item_id);
    const locKey = asgn.location_id || asgn.locations?.code;
    if (locKey && c.item_id) countedOhKeys.add(locKey + '|' + c.item_id);
  });
  totalLocations = countedLocationSet.size;
  totalSKUs = countedItemSet.size;
  totalOHQty = 0;
  countedOhKeys.forEach(key => {
    if (ohMap[key] !== undefined) totalOHQty += Number(ohMap[key]) || 0;
  });
  const totalCounters = countedCounterSet.size;

  // Dashboard summary: Zone progress by unique locations.
  const zoneMap = {};
  asgns.forEach(a => {
    const zone = a.locations?.zone || 'ไม่ระบุ Zone';
    const locKey = a.location_id || a.locations?.code || a.id;
    if (!zoneMap[zone]) zoneMap[zone] = { all: new Set(), done: new Set() };
    zoneMap[zone].all.add(locKey);
    if (['completed','approved'].includes(a.status)) zoneMap[zone].done.add(locKey);
  });

  const zoneAccuracyMap = {};
  (allCounts || []).forEach(c => {
    const asgn = asgnInfoMap[c.assignment_id];
    if (!asgn) return;
    const zone = asgn.locations?.zone || 'ไม่ระบุ Zone';
    if (!zoneAccuracyMap[zone]) zoneAccuracyMap[zone] = { countedItems: new Set(), diffItems: new Set() };
    if (c.item_id) zoneAccuracyMap[zone].countedItems.add(`${c.assignment_id}|${c.item_id}`);
  });
  (allWmsRows || []).forEach(v => {
    const asgn = asgnInfoMap[v.assignment_id];
    if (!asgn) return;
    const zone = asgn.locations?.zone || 'ไม่ระบุ Zone';
    if (!zoneAccuracyMap[zone]) zoneAccuracyMap[zone] = { countedItems: new Set(), diffItems: new Set() };
    if (v.item_id) {
      const itemKey = `${v.assignment_id}|${v.item_id}`;
      zoneAccuracyMap[zone].countedItems.add(itemKey);
      zoneAccuracyMap[zone].diffItems.add(itemKey);
    }
  });

  const zoneStats = Object.entries(zoneMap).map(([zone, z]) => {
    const acc = zoneAccuracyMap[zone] || { countedItems: new Set(), diffItems: new Set() };
    const countedItems = acc.countedItems.size;
    const diffItems = acc.diffItems.size;
    const accuracyPct = countedItems ? Math.max(0, Math.round(((countedItems - diffItems) / countedItems) * 100)) : 0;
    return {
      zone,
      total: z.all.size,
      done: z.done.size,
      pct: z.all.size ? Math.round((z.done.size / z.all.size) * 100) : 0,

      accuracyPct,

  }).sort((a,b) => b.pct - a.pct || b.accuracyPct - a.accuracyPct || a.zone.localeCompare(b.zone, 'th'));

  const zoneCardsHtml = zoneStats.length ? zoneStats.map((z) => `
    <div class="summary-zone-row" title="${z.zone}: Progress ${z.pct}% · Accuracy ${z.accuracyPct}%">
      <div class="summary-zone-row-main">
        <div class="summary-zone-row-title">${z.zone}</div>
        <div class="summary-zone-row-meta">นับแล้ว <b>${z.done}</b> / <b>${z.total}</b> โลเคชั่น · Diff <b>${z.diffItems}</b> / <b>${z.countedItems}</b> ITEM</div>
      </div>
      <div class="summary-zone-row-bars">
        <div class="summary-zone-metric progress">
          <div class="summary-zone-metric-head"><span>Progress</span><b>${z.pct}%</b></div>

        </div>
        <div class="summary-zone-metric accuracy">
          <div class="summary-zone-metric-head"><span>Accuracy</span><b>${z.accuracyPct}%</b></div>
          <div class="summary-zone-track accuracy"><span style="width:${z.accuracyPct}%"></span></div>
        </div>
      </div>
    </div>`).join('') : `<div class="summary-empty">ยังไม่มีข้อมูล Zone</div>`;

  // Hourly chart: count each assignment once, using its latest count time on the latest counting date.
  const validCountRows = (allCounts || []).filter(c => c.counted_at && !Number.isNaN(new Date(c.counted_at).getTime()));
  const localDateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let latestCountDateKey = '';
  let latestCountDate = null;
  validCountRows.forEach(c => {
    const d = new Date(c.counted_at);
    if (!latestCountDate || d > latestCountDate) {
      latestCountDate = d;
      latestCountDateKey = localDateKey(d);

  });

  const firstCountByLocation = {};
  validCountRows.forEach(c => {
    const d = new Date(c.counted_at);
    const asgn = asgnInfoMap[c.assignment_id];
    const locKey = asgn?.location_id || asgn?.locations?.code;
    if (!locKey) return;
    const prev = firstCountByLocation[locKey];
    if (!prev || d < prev) firstCountByLocation[locKey] = d;
  });

  const hourlyRaw = Array(24).fill(0);
  Object.values(firstCountByLocation).forEach(d => { hourlyRaw[d.getHours()]++; });
  const nonZeroHours = hourlyRaw.map((n,h) => n ? h : -1).filter(h => h >= 0);
  let chartStartHour = 8, chartEndHour = 19;
  if (nonZeroHours.length) {
    chartStartHour = Math.max(0, Math.min(...nonZeroHours) - 1);
    chartEndHour = Math.min(23, Math.max(...nonZeroHours) + 1);
    while (chartEndHour - chartStartHour < 7) {
      if (chartEndHour < 23) chartEndHour++;
      else if (chartStartHour > 0) chartStartHour--;
      else break;
    }
  }
  const chartHours = Array.from({length: chartEndHour - chartStartHour + 1}, (_,i) => chartStartHour + i);
  const dayCountTotal = Object.keys(firstCountByLocation).length;
  const regularCount = hourlyRaw.slice(0, 17).reduce((a,b) => a + b, 0);
  const otCount = hourlyRaw.slice(17).reduce((a,b) => a + b, 0);
  const activeHourSpan = nonZeroHours.length ? (Math.max(...nonZeroHours) - Math.min(...nonZeroHours) + 1) : 0;
  const avgLocationsPerHour = activeHourSpan > 0 ? Math.round(dayCountTotal / activeHourSpan) : 0;
  const svgWidth = 1200;
  const svgHeight = 220;
  const m = { top: 28, right: 18, bottom: 34, left: 18 };
  const plotW = svgWidth - m.left - m.right;
  const plotH = svgHeight - m.top - m.bottom;
  const stepX = chartHours.length > 1 ? plotW / (chartHours.length - 1) : plotW;
  const maxHourly = Math.max(...chartHours.map(h => hourlyRaw[h] || 0), 1);
  const points = chartHours.map((h, i) => {
    const v = hourlyRaw[h] || 0;
    const x = m.left + (i * stepX);
    const y = m.top + plotH - ((v / maxHourly) * (plotH - 8));
    return { h, v, x, y };
  });
  // Catmull-Rom → cubic Bézier: gentle curve that still passes through every real data point.
  const smoothHourlyPath = chartPoints => {
    if (!chartPoints.length) return '';
    if (chartPoints.length === 1) return `M ${chartPoints[0].x} ${chartPoints[0].y}`;
    const curveStrength = .16;
    const clampY = value => Math.max(m.top, Math.min(m.top + plotH, value));
    let path = `M ${chartPoints[0].x} ${chartPoints[0].y}`;
    for (let i = 0; i < chartPoints.length - 1; i++) {
      const p0 = chartPoints[i - 1] || chartPoints[i];
      const p1 = chartPoints[i];
      const p2 = chartPoints[i + 1];
      const p3 = chartPoints[i + 2] || p2;
      const c1x = p1.x + ((p2.x - p0.x) * curveStrength);
      const c1y = clampY(p1.y + ((p2.y - p0.y) * curveStrength));
      const c2x = p2.x - ((p3.x - p1.x) * curveStrength);
      const c2y = clampY(p2.y - ((p3.y - p1.y) * curveStrength));
      path += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return path;
  };
  const linePath = smoothHourlyPath(points);
  const chartBaseY = m.top + plotH;
  const areaPath = points.length
    ? `${linePath} L ${points[points.length - 1].x} ${chartBaseY} L ${points[0].x} ${chartBaseY} Z`
    : '';
  const pointLabels = points.map(p => p.v ? `<text x="${p.x}" y="${p.y - 12}" text-anchor="middle" class="summary-hour-svg-label">${p.v}</text>` : '').join('');
  const pointDots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="${p.v ? 4.5 : 2.5}" class="summary-hour-dot ${p.v ? 'active' : ''}"/>`).join('');
  const axisLabels = points.map(p => `<text x="${p.x}" y="${svgHeight - 8}" text-anchor="middle" class="summary-hour-axis-text">${String(p.h).padStart(2,'0')}</text>`).join('');
  const hourlyChartSvg = `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="xMidYMid meet" class="summary-hour-svg" aria-label="Hourly counting chart">
    <path d="${areaPath}" class="summary-hour-area"/>
    <path d="${linePath}" class="summary-hour-line"/>
    ${pointDots}
    ${pointLabels}
    ${axisLabels}
  </svg>`;
  const latestCountDateLabel = latestCountDate
    ? latestCountDate.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' })
    : 'ยังไม่มีข้อมูล';
  // สร้าง label หลังจาก latestCountDateLabel ถูกกำหนดแล้ว เพื่อป้องกัน Temporal Dead Zone
  const hourRangeLabel = latestCountDateLabel || 'ข้อมูลที่นับจริง';

  const doneAngle = total ? (done / total) * 360 : 0;
  const varianceAngle = total ? (varCount / total) * 360 : 0;
  const statusGradient = `conic-gradient(#62dbe7 0deg ${doneAngle}deg, #ffbd59 ${doneAngle}deg ${doneAngle + varianceAngle}deg, #e6e3e5 ${doneAngle + varianceAngle}deg 360deg)`;

  const byCounter = {};
  (allCounts || []).forEach(record => {
    const assignment = asgnInfoMap[record.assignment_id];
    if (!assignment) return;
    splitActualCounterNames(record.actual_counter_name).forEach(counterName => {
      if (!byCounter[counterName]) byCounter[counterName] = { name:counterName, assignmentMap:new Map() };
      byCounter[counterName].assignmentMap.set(assignment.id, assignment);
    });
  });

  let peopleRows = '';
  Object.values(byCounter).sort((a,b) => a.name.localeCompare(b.name, 'th')).forEach((counter, idx) => {
    const items = [...counter.assignmentMap.values()];
    const u = {
      name: counter.name,
      items,
      total: items.length,
      done: items.filter(a => ['completed','approved'].includes(a.status)).length,
      var: items.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status)).length,
    };
    const p = Math.round(u.done / u.total * 100);
    peopleRows += `<div class="tab-row" style="border-bottom:1px solid rgba(0,0,0,0.06);padding:14px 10px" onclick="toggleCounterDetail('${idx}')">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:700;color:var(--text-main)">👤 คนนับ: ${escapeWmsText(u.name)}</div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <span class="tag tag-green">${u.done} เสร็จ</span>
            ${u.var ? `<span class="tag tag-amber">${u.var} variance</span>` : ''}
            <span class="tag tag-gray">${u.total - u.done - u.var} รอ</span>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:26px;font-weight:800;color:var(--primary-blue);font-family:'Fredoka'">${p}%</div>
          <div style="font-size:12px;color:var(--text-muted);font-weight:700">${u.done}/${u.total}</div>
        </div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--text-muted);font-weight:700;margin-top:10px">▾ ดูรายการ</div>
    </div>
    <div id="udetail_${idx}" style="display:none;background:rgba(255,255,255,0.7);padding:14px 18px;border-radius:16px;margin:8px 0 14px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.03)">
      ${u.items.map(a => {
        const si = tagInfo(a.status);
        const l = a.locations;
        const loc = [l?.zone,l?.row_no,l?.level].filter(Boolean).join(' · ');
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.04);gap:8px">
          <div style="min-width:0">
            <div class="mono" style="font-size:14px;font-weight:700; color:var(--text-main);">${l?.code||'?'}</div>
            <div style="font-size:11px;color:var(--text-muted); margin-top:2px;">${loc}</div>
          </div>
          <span class="tag ${si.cls}" style="font-size:10px;flex-shrink:0">${si.lbl}</span>
        </div>`;
      }).join('')}
    </div>`;
  });

  _svDashOpenVarianceIdx = null;
  const needsFollowUp = asgns.filter(a => ['round1_done','round2_done','round3_done'].includes(a.status));
  const varianceRowsHtml = needsFollowUp.length ? needsFollowUp.map((a, i) => {
    const si = tagInfo(a.status);
    const l = a.locations;
    return `<div style="border-bottom:1px solid rgba(0,0,0,0.06);padding:14px 0">
      <div class="tab-row" style="display:flex;align-items:center;gap:12px; padding: 10px;" onclick="toggleVarianceDetail('${a.id}',${i})">
        <div style="flex:1;min-width:0">
          <div class="mono" style="font-size:16px;font-weight:800;color:var(--text-main)">${l?.code||'?'}</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:4px;font-weight:600">👤 คนนับจริง: ${escapeWmsText((actualCountersByAssignment[a.id] || []).join(', ') || 'ไม่ระบุคนนับ')} · ${[l?.zone,l?.row_no,l?.level].filter(Boolean).join(' · ')}</div>
        </div>
        <span class="tag ${si.cls}">${si.lbl}</span>
        <span class="caret" style="font-size:18px">▾</span>
      </div>
      <div id="vdetail_${i}" style="display:none;background:rgba(255,255,255,0.7);margin-top:12px;border-radius:16px;overflow:hidden; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.03)"></div>
    </div>`;
  }).join('') : `<div style="padding:40px 0;text-align:center;color:var(--text-muted);font-size:15px; font-weight:600;">🎉 ไม่มี Variance ที่ต้องตรวจสอบตอนนี้</div>`;

  const tab = S._dashTab || _dashTab;
  _dashTab = tab;
  let varianceReportRows = '';
  const recentVars = allWmsRows.filter(v => +v.variance !== 0).slice(0, 5);
  if (recentVars.length > 0) {
    varianceReportRows = recentVars.map(v => {
      const d = +v.variance;
      const color = d > 0 ? 'var(--accent-green)' : 'var(--accent-red)';
      const sign = d > 0 ? '+' : '';
      const loc = asgnInfoMap[v.assignment_id]?.locations?.code || '?';
      return `
        <div class="row" style="padding: 14px 20px;">
          <div class="row-body">
            <div class="row-title mono" style="font-size: 14px; color: var(--text-main);">${loc}</div>
            <div class="row-sub" style="font-size: 12px;">${v.items?.code||'?'} · 👤 User ผู้อนุมัติ: ${escapeWmsText(v.profiles?.name||'?')}</div>
          </div>

            <div style="font-size: 18px; font-weight: 800; font-family: 'Fredoka'; color: ${color};">${sign}${d}</div>

          </div>

    }).join('');
  } else {
    varianceReportRows = `<div style="padding:30px; text-align:center; color:var(--text-muted); font-size:13px; font-weight:600;">🎉 เยี่ยมมาก! ยังไม่มีรายการ Variance</div>`;
  }

  const summaryWmsTotalCount = allWmsRows.length;
  const summaryWmsFixedCount = allWmsRows.filter(v => v.wms_fixed).length;
  const summaryWmsUnfixedCount = summaryWmsTotalCount - summaryWmsFixedCount;
  const summaryWmsFixedPercent = summaryWmsTotalCount > 0 ? Math.round((summaryWmsFixedCount / summaryWmsTotalCount) * 100) : 0;
  const summaryWmsUnfixedPercent = summaryWmsTotalCount > 0 ? 100 - summaryWmsFixedPercent : 0;

  const summaryTabHtml = `
    <section class="summary-dashboard-grid">
      <article class="summary-card summary-accuracy-card summary-accuracy-stack">
        <div class="summary-accuracy-layer summary-accuracy-layer-bottom"></div>
        <div class="summary-accuracy-layer summary-accuracy-layer-back"></div>
        <div class="summary-accuracy-layer summary-accuracy-layer-mid"></div>
        <div class="summary-accuracy-core">
          <div class="summary-card-heading">
            <div>
              <div class="summary-card-kicker">STOCK ACCURACY</div>
              <h2>ความแม่นยำสต็อก</h2>
            </div>
            <span class="summary-card-chip">Session นี้</span>

            <div class="summary-accuracy-ring" style="--accuracy-angle:${stockAccuracyNum * 3.6}deg">
              <div class="summary-accuracy-ring-inner">
                <strong>${stockAccuracy}%</strong>
              </div>
            </div>
          </div>
          <div class="summary-gain-loss-grid summary-gain-loss-grid-tight">
            <div class="summary-gain-loss gain">
              <span>GAIN</span><strong>▲ +${diffPlus.toLocaleString('th-TH')}</strong><small>${gainItemCount.toLocaleString('th-TH')} ITEM</small>
            </div>
            <div class="summary-gain-loss loss">
              <span>LOST</span><strong>▼ -${diffMinus.toLocaleString('th-TH')}</strong><small>${lostItemCount.toLocaleString('th-TH')} ITEM</small>
            </div>
          </div>
        </div>

async function toggleWmsFixed(vaId, checked) {
  try {
    if (!vaId || vaId === 'undefined') { alert('ไม่พบ ID รายการ'); return; }
    const updates = { wms_fixed: checked };
    if (checked) { updates.wms_fixed_at = new Date().toISOString(); updates.wms_fixed_by = me.id; } 
    else { updates.wms_fixed_at = null; updates.wms_fixed_by = null; }
    const { data, error } = await sb.from('variance_approvals').update(updates).eq('id', vaId).select('id,wms_fixed');

    loadSvDash();
  } catch (e) {
    console.error(e); alert('Error: ' + e.message);
  }
}

function closeWmsNoteMenus(exceptKey='') {
  document.querySelectorAll('.wms-note-menu').forEach(menu => {
    if (!exceptKey || menu.id !== `wms_note_menu_${exceptKey}`) menu.hidden = true;
  });
}

function toggleWmsNoteMenu(event, key) {
  event?.preventDefault();
  event?.stopPropagation();
  const menu = Q(`wms_note_menu_${key}`);
  if (!menu) return;
  const willOpen = menu.hidden;
  closeWmsNoteMenus(key);
  menu.hidden = !willOpen;
  if (willOpen) setTimeout(() => Q(`wms_note_custom_${key}`)?.focus(), 30);
}

async function addCustomWmsNoteOption(event, key) {
  event?.preventDefault();
  event?.stopPropagation();
  if (prof?.role !== 'admin') { adminOnlyMessage(); return; }
  const input = Q(`wms_note_custom_${key}`);
  const list = Q(`wms_note_options_${key}`);
  const text = (input?.value || '').trim();
  if (!text || !list) return;
  const exists = [...list.querySelectorAll('input[type="checkbox"]')]
    .some(box => box.value.toLocaleLowerCase('th-TH') === text.toLocaleLowerCase('th-TH'));
  try {
    if (exists) {
      const existing = [...list.querySelectorAll('input[type="checkbox"]')]
        .find(box => box.value.toLocaleLowerCase('th-TH') === text.toLocaleLowerCase('th-TH'));
      if (existing) existing.checked = true;
    } else {
      const result = await invokeAdminMaster('remark_create', { context:'wms', label:text });
      window._wmsNoteOptions = window._wmsNoteOptions || [];
      window._wmsNoteOptions.push(result.row);
      const label = document.createElement('label');
      label.className = 'wms-note-option';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = result.row.label;
      checkbox.checked = true;
      const span = document.createElement('span');
      span.textContent = result.row.label;
      label.append(checkbox, span);
      list.appendChild(label);
    }
    input.value = '';
    input.focus();
  } catch (error) {
    alert('เพิ่มหมายเหตุไม่สำเร็จ: ' + error.message);
  }
}

async function saveWmsNotes(assignmentId, itemId, key) {
  const menu = Q(`wms_note_menu_${key}`);
  const saveBtn = Q(`wms_note_save_${key}`);
  if (!menu) return;
  const notes = [...new Set(
    [...menu.querySelectorAll('.wms-note-option input[type="checkbox"]')]
      .filter(box => box.checked)
      .map(box => box.value.trim())
      .filter(Boolean)
  )];
  if (!notes.length) {
    alert('กรุณาเลือกหรือเพิ่มหมายเหตุอย่างน้อย 1 ข้อ');
    return;
  }

  const assignment = window._wmsAsgnInfoMap?.[assignmentId];
  const rows = notes.map(note => ({
    session_id: S._dashSid || assignment?.session_id || null,
    location_id: assignment?.location_id || null,
    item_id: itemId || null,
    assignment_id: assignmentId || null,
    action: 'wms_note',
    old_value: null,
    new_value: note,
    performed_by: me?.id || null,
  }));

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = 'กำลังบันทึก...';
    }
    const { error } = await sb.from('audit_log').insert(rows);
    if (error) throw error;

    const target = (window._wmsRows || [])
      .find(v => v.assignment_id === assignmentId && v.item_id === itemId);
    if (target) {
      target.wms_notes = [
        ...(target.wms_notes || []),
        ...rows.map((n, index) => ({
          id: n.id || `new_${Date.now()}_${index}`,
          text: n.new_value,
          created_at: n.created_at || new Date().toISOString(),
        })),
      ];
    }
    renderWmsList();
  } catch (error) {
    console.error(error);
    alert('บันทึกหมายเหตุไม่สำเร็จ: ' + (error.message || error));
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = `${wmsIconSvg('reviewed', 17)} บันทึกหมายเหตุ`;
    }
  }
}

function refreshWmsDependentFilters() {
  const rows = window._wmsRows || [];
  const asgnInfoMap = window._wmsAsgnInfoMap || {};
  const zone = Q('wms-zone')?.value || S._wmsZone || '';
  const levels = rows
    .map(row => asgnInfoMap[row.assignment_id]?.locations)
    .filter(location => location && (!zone || location.zone === zone))
    .map(location => location.level);
  const selectedLevel = fillDependentSelect('wms-level', levels);
  S._wmsLevel = selectedLevel;
}

function updateWmsFilter(key, value) {
  S['_wms'+key] = value;
  if (key === 'Zone') refreshWmsDependentFilters();
  renderWmsList();
}

function renderWmsList() {
  const container = Q('wms-list');
  if (!container) return;
  const wmsRows = window._wmsRows || [];
  const asgnInfoMap = window._wmsAsgnInfoMap || {};
  const filterStatus = S._wmsFilter || 'unfixed';
  const filterZone = S._wmsZone || '';
  const filterLevel = S._wmsLevel || '';
  const filterUser = S._wmsUser || '';
  const searchLoc = (S._wmsLocSearch || '').trim().toLowerCase();

  const filtered = wmsRows.filter(v => {
    if (filterStatus === 'unfixed' && v.wms_fixed) return false;
    if (filterStatus === 'fixed' && !v.wms_fixed) return false;
    if (filterStatus === 'pending' && !v._isPending) return false;
    if (filterStatus !== 'all' && filterStatus !== 'pending' && v._isPending) return false;
    const loc = asgnInfoMap[v.assignment_id]?.locations;
    if (filterZone && loc?.zone !== filterZone) return false;
    if (filterLevel && loc?.level !== filterLevel) return false;
    if (filterUser === '_pending' && !v._isPending) return false;
    if (filterUser && filterUser !== '_pending' && v.approved_by !== filterUser) return false;
    if (searchLoc && !(loc?.code||'').toLowerCase().includes(searchLoc)) return false;
    return true;
  });

  if (!filtered.length) {
    const msg = filterStatus==='unfixed' ? '🎉 ไม่มีรายการที่ยังไม่ได้ตรวจสอบ' 
      : filterStatus==='fixed' ? 'ยังไม่มีรายการที่ตรวจสอบแล้ว' 
      : filterStatus==='pending' ? '⏳ ไม่มีรายการที่รอคอนเฟิร์ม'
      : 'ไม่พบรายการตามตัวกรองที่เลือก';
    container.innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--text-muted);font-size:14px; font-weight:600;">${msg}</div>`;
    return;
  }

  container.innerHTML = filtered.map(v => {
    const loc = asgnInfoMap[v.assignment_id]?.locations;
    const isFixed = !!v.wms_fixed;
    const isPending = !!v._isPending;
    const varAmt = +v.variance;
    const noteKey = wmsDomKey(v.assignment_id, v.item_id);
