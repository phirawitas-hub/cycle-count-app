const MY_TASK_FILTER_STORAGE_KEY = 'cycle_count_my_task_filters_v1';
const MY_TASK_FILTER_FIELDS = ['_mtJob','_mtSession','_mtStatus','_mtZone','_mtRow','_mtPos','_mtLvl'];

function readMyTaskFilters() {
  try {
    const value = JSON.parse(localStorage.getItem(MY_TASK_FILTER_STORAGE_KEY) || '{}');
    return value && typeof value === 'object' ? value : {};
  } catch (_) {
    return {};
  }
}

function persistMyTaskFilters() {
  const filters = Object.fromEntries(
    MY_TASK_FILTER_FIELDS.map(field => [field,String(S[field] || '')])
  );
  try { localStorage.setItem(MY_TASK_FILTER_STORAGE_KEY,JSON.stringify(filters)); } catch (_) {}
}

function setMyTaskFilter(field,value) {
  if (!MY_TASK_FILTER_FIELDS.includes(field)) return;
  S[field] = String(value || '');
  const downstream = {
    _mtSession:['_mtJob','_mtStatus','_mtZone','_mtRow','_mtPos','_mtLvl'],
    _mtJob:['_mtStatus','_mtZone','_mtRow','_mtPos','_mtLvl'],
    _mtStatus:['_mtZone','_mtRow','_mtPos','_mtLvl'],
    _mtZone:['_mtRow','_mtPos','_mtLvl'],
    _mtRow:['_mtPos','_mtLvl'],
    _mtPos:['_mtLvl'],
  };
  (downstream[field] || []).forEach(key => { S[key] = ''; });
  persistMyTaskFilters();
  refreshMyTaskFilters();
}

async function loadCTasks() {
  let workspace = null;
  const workspaceResult = await sb.rpc('get_my_tasks_workspace');
  if (!workspaceResult.error && workspaceResult.data && typeof workspaceResult.data === 'object') {
    workspace = workspaceResult.data;
  } else if (workspaceResult.error) {
    console.warn('Fast My Tasks workspace unavailable; using compatible fallback:',workspaceResult.error.message);
  }

  const [normalResult,annualResult] = workspace
    ? [
        { data:workspace.assignments || [],error:null },
        { data:workspace.annual_jobs || [],error:null },
      ]
    : await Promise.all([
        fetchPagedSupabaseRows(
          'assignments',
          'id,status,location_id,session_id,locations(code,zone,area,row_no,level),count_sessions(name,status)',
          query => query.eq('assigned_to',me.id).order('created_at'),
        ),
        fetchPagedSupabaseRows(
          'annual_count_jobs',
          'id,job_no,job_code,status,session_id,count_sessions(name,status)',
          query => query.eq('assigned_to',me.id).order('job_no'),
        ),
      ]);

  if (normalResult.error || annualResult.error) {
    cnt().innerHTML = errBox((normalResult.error || annualResult.error).message);
    return;
  }

  let asgns = normalResult.data || [];
  const annualJobs = annualResult.data || [];
  const annualItemsResult = workspace
    ? { data:workspace.annual_items || [],error:null }
    : annualJobs.length
    ? await fetchSupabaseRowsByValues(
        'annual_count_job_items',
        'id,job_id,session_id,location_id,item_id,sort_order,locations(code,zone,area,row_no,level),items(code,description)',
        'job_id',
        annualJobs.map(job => job.id),
      )
    : { data:[],error:null };

  if (annualItemsResult.error) {
    cnt().innerHTML = errBox(annualItemsResult.error.message);
    return;
  }

  if (asgns.length) {
    const assignmentIds = asgns.map(assignment => assignment.id);
    const sessionIds = [...new Set(asgns.map(assignment => assignment.session_id).filter(Boolean))];
    const [countResult,snapshotResult,sessionRules] = workspace
      ? [
          { data:workspace.counts || [],error:null },
          { data:workspace.snapshots || [],error:null },
          (workspace.session_rules || []).map(row => [
            row.id,
            {
              maxRounds:row.max_rounds || 3,
              repeatMatchAction:row.repeat_match_action || 'recount',
            },
          ]),
        ]
      : await Promise.all([
          fetchSupabaseRowsByValues(
            'count_records',
            'assignment_id,item_id,round,count_qty',
            'assignment_id',
            assignmentIds,
          ),
          fetchSnapshotsForAssignmentScopes(asgns,'session_id,location_id,item_id,onhand_qty'),
          Promise.all(sessionIds.map(async sessionId => [sessionId,await getSessionRules(sessionId)])),
        ]);
    if (countResult.error || snapshotResult.error) {
      cnt().innerHTML = errBox((countResult.error || snapshotResult.error).message);
      return;
    }
    const rulesBySession = Object.fromEntries(sessionRules);
    const countsByAssignment = {};
    (countResult.data || []).forEach(record => {
      countsByAssignment[record.assignment_id] = countsByAssignment[record.assignment_id] || {};
      countsByAssignment[record.assignment_id][record.item_id] =
        countsByAssignment[record.assignment_id][record.item_id] || {};
      countsByAssignment[record.assignment_id][record.item_id][record.round] = Number(record.count_qty);
    });
    const snapshotsByScope = {};
    (snapshotResult.data || []).forEach(snapshot => {
      const key = `${snapshot.session_id}|${snapshot.location_id}`;
      snapshotsByScope[key] = snapshotsByScope[key] || [];
      snapshotsByScope[key].push(snapshot);
    });
    asgns = asgns.map(assignment => {
      const workflow = deriveAssignmentWorkflowStatus(
        snapshotsByScope[`${assignment.session_id}|${assignment.location_id}`] || [],
        countsByAssignment[assignment.id] || {},
        rulesBySession[assignment.session_id],
        assignment.status,
      );
      return {
        ...assignment,
        _storedStatus:assignment.status,
        _workflow:workflow,
        status:workflow.effectiveStatus,
      };
    });

    const assignmentByScope = new Map(
      asgns.map(assignment => [
        annualAssignmentKey(assignment.session_id,assignment.location_id),
        assignment,
      ])
    );
    const annualItems = annualItemsResult.data || [];
    annualJobs.forEach(job => {
      const relatedAssignments = [
        ...new Map(
          annualItems
            .filter(item => item.job_id === job.id)
            .map(item => {
              const assignment = assignmentByScope.get(
                annualAssignmentKey(job.session_id,item.location_id)
              );
              return assignment ? [assignment.id,assignment] : null;
            })
            .filter(Boolean)
        ).values(),
      ];
      if (!relatedAssignments.length) return;
      if (relatedAssignments.every(assignment =>
        ['completed','approved'].includes(assignment.status)
      )) {
        job.status = 'completed';
      } else if (relatedAssignments.some(assignment => assignment.status !== 'pending')) {
        job.status = 'in_progress';
      } else {
        job.status = 'pending';
      }
    });
  }

  if (!asgns.length && !annualJobs.length) {
    cnt().innerHTML = `<div class="card" style="text-align:center;padding:60px 40px">
      <div style="font-size:60px">📋</div>
      <div style="margin-top:20px;color:var(--text-muted);font-weight:600;font-size:16px">ยังไม่มีงานที่ได้รับมอบหมาย</div>
      <button class="found-work-button" style="margin-top:22px" type="button"
        onclick="go('c-found')">＋ เจองานเพิ่ม</button>
    </div>`; return;
  }

  window._myTasks = asgns;
  window._myAnnualJobs = annualJobs;
  window._myAnnualJobItems = annualItemsResult.data || [];
  const storedFilters = readMyTaskFilters();
  MY_TASK_FILTER_FIELDS.forEach(field => {
    if (S[field] === undefined) S[field] = String(storedFilters[field] || '');
  });

  const done = asgns.filter(a => ['completed','approved'].includes(a.status)).length
    + annualJobs.filter(job => job.status === 'completed').length;
  const total = asgns.length + annualJobs.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const jobFilterHtml = annualJobs.length ? `<div class="fg" style="margin:0">
    <label style="font-size:11px">JOB</label>
    <select id="mt-job" onchange="setMyTaskFilter('_mtJob',this.value)" style="font-size:14px;"></select>
  </div>` : '';
  const normalHtml = (asgns.length || annualJobs.length) ? `
    <div class="card">
      <div class="task-filter-head">
        <div style="font-size:13px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">🔍 กรองงาน Cycle Count</div>
        <div class="task-filter-actions">
          <button class="found-work-button" type="button"
            onclick="go('c-found',{sid:Q('mt-session')?.value||''})">＋ เจองานเพิ่ม</button>
          ${locationSortControlHtml(true)}
        </div>
      </div>
      <div class="grid-3">
        ${jobFilterHtml}
        <div class="fg" style="margin:0">
          <label style="font-size:11px">SESSION</label>
          <select id="mt-session" onchange="setMyTaskFilter('_mtSession',this.value)" style="font-size:14px;"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:11px">สถานะงาน</label>
          <select id="mt-status" onchange="setMyTaskFilter('_mtStatus',this.value)" style="font-size:14px;"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:11px">ZONE</label>
          <select id="mt-zone" onchange="setMyTaskFilter('_mtZone',this.value)" style="font-size:14px;"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:11px">ROW</label>
          <select id="mt-row" onchange="setMyTaskFilter('_mtRow',this.value)" style="font-size:14px;"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:11px">POSITION</label>
          <select id="mt-pos" onchange="setMyTaskFilter('_mtPos',this.value)" style="font-size:14px;"></select>
        </div>
        <div class="fg" style="margin:0">
          <label style="font-size:11px">LEVEL</label>
          <select id="mt-lvl" onchange="setMyTaskFilter('_mtLvl',this.value)" style="font-size:14px;"></select>
        </div>
      </div>
    </div>
    <div class="card card-flush" id="mt-list" data-location-sort-group></div>` : '';

  cnt().innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:14px;font-weight:700;color:var(--text-muted)">ความคืบหน้า</span>
        <span style="font-size:18px;font-weight:800;color:var(--primary-blue);font-family:'Fredoka'">${done} / ${total}</span>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>
      ${(asgns.length || annualJobs.length) ? `<button class="btn btn-blue" style="margin-top:24px;width:100%" onclick="openScanner()">📷 สแกน Location</button>` : ''}
    </div>
    ${normalHtml}`;

  if (asgns.length || annualJobs.length) refreshMyTaskFilters();
}

function annualAssignmentKey(sessionId,locationId) {
  return `${sessionId || ''}|${locationId || ''}`;
}

async function ensureAnnualJobAssignments(jobIds,userId) {
  const uniqueJobIds = [...new Set((jobIds || []).filter(Boolean))];
  if (!uniqueJobIds.length) return [];
  const [jobsResult,itemsResult] = await Promise.all([
    fetchSupabaseRowsByValues(
      'annual_count_jobs',
      'id,session_id,assigned_to',
      'id',
      uniqueJobIds,
    ),
    fetchSupabaseRowsByValues(
      'annual_count_job_items',
      'job_id,session_id,location_id',
      'job_id',
      uniqueJobIds,
    ),
  ]);
  if (jobsResult.error || itemsResult.error) throw (jobsResult.error || itemsResult.error);

  const jobsById = Object.fromEntries((jobsResult.data || []).map(job => [job.id,job]));
  const wanted = new Map();
  (itemsResult.data || []).forEach(item => {
    const job = jobsById[item.job_id];
    const sessionId = item.session_id || job?.session_id;
    if (!sessionId || !item.location_id) return;
    const key = annualAssignmentKey(sessionId,item.location_id);
    if (!wanted.has(key)) {
      wanted.set(key,{
        session_id:sessionId,
        location_id:item.location_id,
        assigned_to:userId || job?.assigned_to || null,
      });
    }
  });
  if (!wanted.size) return [];

  const locationIds = [...new Set([...wanted.values()].map(row => row.location_id))];
  const existingResult = await fetchSupabaseRowsByValues(
    'assignments',
    'id,session_id,location_id,assigned_to,status',
    'location_id',
    locationIds,
  );
  if (existingResult.error) throw existingResult.error;
  const existingKeys = new Set(
    (existingResult.data || []).map(row => annualAssignmentKey(row.session_id,row.location_id))
  );
  const missingRows = [...wanted.entries()]
    .filter(([key]) => !existingKeys.has(key))
    .map(([,row]) => row);

  const batchSize = 200;
  for (let start=0; start<missingRows.length; start+=batchSize) {
    const { error } = await sb.from('assignments').insert(missingRows.slice(start,start+batchSize));
    if (error) throw error;
  }
  if (!missingRows.length) return existingResult.data || [];

  const refreshedResult = await fetchSupabaseRowsByValues(
    'assignments',
    'id,session_id,location_id,assigned_to,status',
    'location_id',
    locationIds,
  );
  if (refreshedResult.error) throw refreshedResult.error;
  return refreshedResult.data || [];
}

async function openAnnualJobCount(jobId,jobItemId) {
  const job = (window._myAnnualJobs || []).find(row => row.id === jobId);
  const item = (window._myAnnualJobItems || []).find(row => row.job_id === jobId && row.id === jobItemId);
  if (!job || !item?.location_id) {
    alert('ไม่พบข้อมูล JOB หรือ Location ที่ต้องนับ กรุณาโหลดหน้าใหม่');
    return;
  }
  try {
    const assignments = await ensureAnnualJobAssignments([jobId],job.assigned_to || me?.id);
    const assignment = assignments.find(row =>
      row.session_id === job.session_id && row.location_id === item.location_id
    );
    if (!assignment) throw new Error('ไม่พบ Assignment สำหรับ Location นี้');
    go('c-count',{ aid:assignment.id,jid:job.id,jitemid:item.id });
  } catch (error) {
    alert(`เปิดหน้าบันทึกการนับไม่ได้: ${error.message || error}\n\nกรุณาให้หัวหน้ากดจ่าย JOB นี้ใหม่อีกครั้ง`);
  }
}

function fillMyTaskOptionSelect(id,options,selectedValue='') {
  const select = Q(id);
  if (!select) return '';
  const unique = [];
  const seen = new Set();
  (options || []).forEach(option => {
    const value = String(option?.value || '');
    if (!value || seen.has(value)) return;
    seen.add(value);
    unique.push({ value,label:String(option?.label || value) });
  });
  const selected = unique.some(option => option.value === String(selectedValue || ''))
    ? String(selectedValue || '')
    : '';
  select.innerHTML = `<option value="">ทั้งหมด</option>${unique.map(option =>
    `<option value="${escapeWmsText(option.value)}" ${option.value===selected?'selected':''}>${escapeWmsText(option.label)}</option>`
  ).join('')}`;
  select.value = selected;
  return selected;
}

function refreshMyTaskFilters() {
  const cycleEntries = (window._myTasks || []).map(assignment => {
    const code = assignment.locations?.code || '';
    const parts = code.split('-');
    return {
      assignment,
      sessionId:assignment.session_id || '',
      sessionName:assignment.count_sessions?.name || 'ไม่ระบุ Session',
      status:assignment.status || 'pending',
      zone:assignment.locations?.zone || '',
      row:String(assignment.locations?.row_no ?? parts[1] ?? ''),
      position:parts[2] || '',
      level:String(assignment.locations?.level ?? parts[3] ?? ''),
    };
  });
  const jobEntries = (window._myAnnualJobs || []).map(job => ({
    job,
    jobId:job.id,
    jobCode:job.job_code || `JOB ${job.job_no}`,
    sessionId:job.session_id || '',
    sessionName:job.count_sessions?.name || 'ไม่ระบุ Session',
    status:job.status || 'pending',
  }));
  const allEntries = [...cycleEntries,...jobEntries];
  S._mtSession = fillMyTaskOptionSelect(
    'mt-session',
    [...allEntries]
      .sort((a,b) => a.sessionName.localeCompare(b.sessionName,'th'))
      .map(entry => ({ value:entry.sessionId,label:entry.sessionName })),
    S._mtSession,
  );
  const sessionCycleEntries = cycleEntries.filter(entry => !S._mtSession || entry.sessionId === S._mtSession);
  const sessionJobEntries = jobEntries.filter(entry => !S._mtSession || entry.sessionId === S._mtSession);
  if (Q('mt-job')) {
    S._mtJob = fillMyTaskOptionSelect(
      'mt-job',
      [...sessionJobEntries]
        .sort((a,b) => String(a.jobCode).localeCompare(String(b.jobCode),undefined,{numeric:true}))
        .map(entry => ({ value:entry.jobId,label:entry.jobCode })),
      S._mtJob,
    );
  } else {
    S._mtJob = '';
  }
  const selectedJobEntries = sessionJobEntries.filter(entry => !S._mtJob || entry.jobId === S._mtJob);
  const statusEntries = S._mtJob
    ? selectedJobEntries
    : (sessionCycleEntries.length ? sessionCycleEntries : sessionJobEntries);
  const statusOrder = ['pending','in_progress','round1_done','round2_done','round3_done','completed','approved'];
  S._mtStatus = fillMyTaskOptionSelect(
    'mt-status',
    statusOrder
      .filter(status => statusEntries.some(entry => entry.status === status))
      .map(status => ({ value:status,label:tagInfo(status).lbl })),
    S._mtStatus,
  );
  const baseEntries = S._mtJob
    ? []
    : sessionCycleEntries.filter(entry => !S._mtStatus || entry.status === S._mtStatus);
  const zone = fillDependentSelect('mt-zone', baseEntries.map(entry => entry.zone), 'ทั้งหมด', S._mtZone);
  S._mtZone = zone;
  const zoneEntries = baseEntries.filter(entry => !zone || entry.zone === zone);
  const row = fillDependentSelect('mt-row', zoneEntries.map(entry => entry.row), 'ทั้งหมด', S._mtRow);
  S._mtRow = row;
  const rowEntries = zoneEntries.filter(entry => !row || entry.row === row);
  const position = fillDependentSelect('mt-pos', rowEntries.map(entry => entry.position), 'ทั้งหมด', S._mtPos);
  S._mtPos = position;
  const positionEntries = rowEntries.filter(entry => !position || entry.position === position);
  S._mtLvl = fillDependentSelect('mt-lvl', positionEntries.map(entry => entry.level), 'ทั้งหมด', S._mtLvl);
  persistMyTaskFilters();
  renderMyTasks();
}

function renderMyTasks() {
  const list = Q('mt-list');
  if (!list) return;
  const asgns = window._myTasks || [];
  const annualJobs = window._myAnnualJobs || [];
  const annualJobItems = window._myAnnualJobItems || [];
  const jobF = Q('mt-job')?.value || '';
  const sessionF = Q('mt-session')?.value || '';
  const statusF = Q('mt-status')?.value || '';
  const zoneF = Q('mt-zone')?.value || '';
  const rowF = Q('mt-row')?.value || '';
  const posF = Q('mt-pos')?.value || '';
  const lvlF = Q('mt-lvl')?.value || '';
  const hasCycleInSession = asgns.some(a => !sessionF || a.session_id === sessionF);
  const hasJobsInSession = annualJobs.some(job => !sessionF || job.session_id === sessionF);
  const showJobRows = Boolean(jobF) || (!hasCycleInSession && hasJobsInSession);

  if (showJobRows) {
    const filteredJobs = annualJobs
      .filter(job => {
        if (jobF && job.id !== jobF) return false;
        if (sessionF && job.session_id !== sessionF) return false;
        if (statusF && job.status !== statusF) return false;
        return true;
      })
      .sort((a,b) => Number(a.job_no || 0)-Number(b.job_no || 0));
    if (!filteredJobs.length) {
      list.innerHTML = `<div class="load" style="padding:40px;font-size:14px;color:var(--text-muted);text-align:center;font-weight:600">ไม่มี JOB ที่ตรงกับตัวกรอง</div>`;
      return;
    }
    list.innerHTML = filteredJobs.map(job => {
      const status = tagInfo(job.status);
      const jobItems = annualJobItems
        .filter(item => item.job_id === job.id)
        .sort((a,b) => {
          const orderDiff = Number(a.sort_order || 0) - Number(b.sort_order || 0);
          if (orderDiff) return orderDiff;
          return String(a.locations?.code || '').localeCompare(String(b.locations?.code || ''),undefined,{ numeric:true });
        });
      const locationGroups = [];
      const locationGroupMap = new Map();
      jobItems.forEach(item => {
        const locationKey = item.location_id || item.locations?.code || item.id;
        if (!locationGroupMap.has(locationKey)) {
          const group = { location:item.locations || {},items:[] };
          locationGroupMap.set(locationKey,group);
          locationGroups.push(group);
        }
        locationGroupMap.get(locationKey).items.push(item);
      });
      const itemRows = locationGroups.length
        ? locationGroups.map((group,index) => {
            const item = group.items[0];
            const location = group.location;
            const productCodes = group.items
              .map(row => row.items?.code)
              .filter(Boolean);
            const productSummary = productCodes.length
              ? `${productCodes.slice(0,3).join(', ')}${productCodes.length>3?` +${productCodes.length-3}`:''}`
              : 'โหลดสินค้าทั้งหมดเมื่อเริ่มนับ';
            const locationMeta = [
              location.zone && `Zone ${location.zone}`,
              location.row_no && `ROW ${location.row_no}`,
              location.level && `Level ${location.level}`,
            ].filter(Boolean).join(' · ');
            return `<div class="my-job-work-row click" role="button" tabindex="0"
              data-location-sort-code="${escapeWmsText(location.code || '')}"
              onclick="openAnnualJobCount('${job.id}','${item.id}')"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openAnnualJobCount('${job.id}','${item.id}')}">
              <span class="my-job-work-seq">${String(index+1).padStart(2,'0')}</span>
              <div class="row-body">
                <div class="my-job-work-location mono">${escapeWmsText(location.code || 'ไม่ระบุ Location')}</div>
                <div class="my-job-work-item"><strong>${group.items.length.toLocaleString('th-TH')} ITEM ใน JOB</strong> · ${escapeWmsText(productSummary)}</div>
                ${locationMeta ? `<div class="row-sub">${escapeWmsText(locationMeta)}</div>` : ''}
              </div>
              <span class="my-job-count-label">เริ่มนับ ›</span>
            </div>`;
          }).join('')
        : `<div class="my-job-work-empty">JOB นี้ยังไม่มีรายการ Location / ITEM ที่ต้องนับ</div>`;
      return `<section class="my-job-work-group" data-location-sort-code="${escapeWmsText(job.job_code || '')}">
        <div class="my-job-work-header">
          <div class="row-body">
            <div class="row-title mono">${escapeWmsText(job.job_code || `JOB ${job.job_no}`)}</div>
            <div class="row-sub">${escapeWmsText(job.count_sessions?.name || 'ไม่ระบุ Session')} · ${locationGroups.length.toLocaleString('th-TH')} Location · ${jobItems.length.toLocaleString('th-TH')} ITEM</div>
          </div>
          <span class="tag ${status.cls}">${status.lbl}</span>
        </div>
        <div class="my-job-work-items">${itemRows}</div>
      </section>`;
    }).join('');
    return;
  }

  const filtered = sortRowsByLocation(asgns.filter(a => {
    const parts = (a.locations?.code || '').split('-');
    if (sessionF && a.session_id !== sessionF) return false;
    if (statusF && a.status !== statusF) return false;
    if (zoneF && a.locations?.zone !== zoneF) return false;
    if (rowF && String(a.locations?.row_no ?? parts[1] ?? '') !== String(rowF)) return false;
    if (posF && parts[2] !== posF) return false;
    if (lvlF && String(a.locations?.level ?? parts[3] ?? '') !== String(lvlF)) return false;
    return true;
  }), a => a.locations?.code);

  if (!filtered.length) {
    list.innerHTML = `<div class="load" style="padding:40px;font-size:14px;color:var(--text-muted);text-align:center;font-weight:600">ไม่มีงานที่ตรงกับตัวกรอง</div>`;
    return;
  }

  let html = '';
  for (const a of filtered) {
    const l   = a.locations;
    const si  = tagInfo(a.status);
    const can = !['completed','approved'].includes(a.status);
    const sub = [l.zone, l.area, l.row_no && 'Row '+l.row_no, l.level && 'Lv.'+l.level].filter(Boolean).join(' · ');
    html += `<div class="row ${can?'click':''}" data-location-sort-code="${escapeWmsText(l.code || '')}" ${can?`onclick="go('c-count',{aid:'${a.id}'})"`:''}>
      <div class="row-body">
        <div class="row-title mono">${l.code}</div>
        <div class="row-sub">${sub}</div>
        <div class="row-sub" style="margin-top:4px; font-weight:700; color:var(--primary-blue)">${a.count_sessions.name}</div>
      </div>
      <span class="tag ${si.cls}">${si.lbl}</span>
      ${can ? '<span class="caret">›</span>' : ''}
    </div>`;
  }
  list.innerHTML = html;
}

function allHtml5BarcodeFormats() {
  if (typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  return [
    'QR_CODE','AZTEC','CODABAR','CODE_39','CODE_93','CODE_128','DATA_MATRIX',
    'MAXICODE','ITF','EAN_13','EAN_8','PDF_417','RSS_14','RSS_EXPANDED',
    'UPC_A','UPC_E','UPC_EAN_EXTENSION',
  ].map(name => Html5QrcodeSupportedFormats[name]).filter(value => Number.isInteger(value));
}

function scannerPolicyAllowsCamera() {
  const policy = document.permissionsPolicy || document.featurePolicy;
  if (!policy || typeof policy.allowsFeature !== 'function') return true;
  try {
    return policy.allowsFeature('camera');
  } catch (_) {
    return true;
  }
}

async function scanBarcodeImageFile(input) {
  const file = input?.files?.[0];
  if (!file || !_html5Qr || _scannerLocked) return;
  const scanner = _html5Qr;
  try {
    if (_html5QrCameraRunning) {
      await scanner.stop();
      _html5QrCameraRunning = false;
    }
    const reader = Q('scanReader');
    if (reader) reader.innerHTML = '';
    scannerFallbackMessage('กำลังอ่าน Barcode จากรูป...');
    const decodedText = await scanner.scanFile(file,true);
    await finishBarcodeScan(decodedText);
  } catch (error) {
    scannerFallbackMessage(`ยังอ่าน Barcode จากรูปไม่ได้: ${error?.message || error} · ลองถ่ายให้ชัดขึ้น หรือกรอกด้วย Scanner ด้านล่าง`);
    Q('scannerManualValue')?.focus();
  } finally {
    if (input) input.value = '';
  }
}

async function openBarcodeScanner({ title='สแกน Barcode', onDetected=null }={}) {
  if (typeof Html5Qrcode === 'undefined') {
    alert('ตัวสแกนยังโหลดไม่เสร็จ กรุณาลองใหม่อีกครั้ง');
    return;
  }
  await closeScanner();
  _scannerCallback = typeof onDetected === 'function' ? onDetected : null;
  _scannerLocked = false;

  const overlay = document.createElement('div');
  overlay.className = 'scan-overlay';
  overlay.id = 'scanOverlay';
  overlay.innerHTML = `
    <div class="scan-header">
      <span>📷 ${escapeWmsText(title)}</span>
      <button type="button" onclick="closeScanner()" aria-label="ปิดกล้อง">✕</button>
    </div>
    <div id="scanReader"></div>
    <div class="scanner-fallback">
      <div class="scanner-fallback-message" id="scannerFallbackMessage">กำลังตรวจสอบสิทธิ์กล้อง...</div>
      <button class="btn btn-ghost btn-sm scanner-file-button" type="button" onclick="openScannerImagePicker()">📷 ถ่ายรูป / เลือกรูปเพื่อสแกน</button>
      <input id="scannerImageInput" type="file" accept="image/*" capture="environment" hidden
        onchange="scanBarcodeImageFile(this)">
    </div>
    <div class="scanner-manual">
      <input id="scannerManualValue" autocomplete="off" placeholder="หรือพิมพ์ / ยิง Scanner แล้วกดยืนยัน"
        onkeydown="if(event.key==='Enter'){event.preventDefault();commitManualScan();}">
      <button class="btn btn-blue btn-sm" type="button" onclick="commitManualScan()">ยืนยัน</button>
    </div>`;
  document.body.appendChild(overlay);
  _scannerPreviousOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';

  const formatsToSupport = allHtml5BarcodeFormats();
  _html5Qr = new Html5Qrcode('scanReader', {
    ...(formatsToSupport?.length ? { formatsToSupport } : {}),
    useBarCodeDetectorIfSupported:true,
    verbose:false,
  });
  const policyAllowsCamera = scannerPolicyAllowsCamera();
  const secureCameraContext = window.isSecureContext || ['localhost','127.0.0.1'].includes(location.hostname);
  if (!policyAllowsCamera) {
    scannerUnavailablePanel('Host ปิดสิทธิ์กล้องสด','ยังสแกนได้ด้วยการถ่ายรูป/เลือกรูป หรือยิง Scanner ในช่องด้านล่าง');
    scannerFallbackMessage('หน้าที่เปิดอยู่ถูก Host ปิดสิทธิ์กล้องสดไว้ · ใช้ “ถ่ายรูป / เลือกรูปเพื่อสแกน” หรือเครื่องสแกนด้านล่างได้ทันที');
    Q('scannerManualValue')?.focus();
    return;
  }
  if (!secureCameraContext) {
    scannerUnavailablePanel('หน้านี้ไม่ได้เปิดผ่าน HTTPS','กล้องสดต้องใช้ HTTPS แต่ยังสแกนจากรูปหรือเครื่องสแกนได้');
    scannerFallbackMessage('กล้องสดต้องเปิดผ่าน HTTPS · ใช้ “ถ่ายรูป / เลือกรูปเพื่อสแกน” หรือเครื่องสแกนด้านล่าง');
    Q('scannerManualValue')?.focus();
    return;
  }
  scannerFallbackMessage('กำลังเปิดกล้อง...');
  const scanner = _html5Qr;
  scanner.start(
    { facingMode:{ ideal:'environment' } },
    { fps:12, qrbox:{ width:260, height:180 }, aspectRatio:1.333334, disableFlip:false },
    decodedText => finishBarcodeScan(decodedText),
    () => {},
  ).then(() => {
    if (_html5Qr !== scanner) {
      scanner.stop().catch(() => {});
      return;
    }
    _html5QrCameraRunning = true;
    scannerFallbackMessage('เล็ง Barcode ให้อยู่กลางกรอบ หรือใช้รูปภาพ/Scanner ด้านล่าง');
  }).catch(error => {
    _html5QrCameraRunning = false;
    scannerUnavailablePanel('เปิดกล้องสดไม่ได้','กรุณาตรวจสิทธิ์ Camera แล้วลองใหม่ หรือใช้รูปภาพ/Scanner ด้านล่าง');
    scannerFallbackMessage(`เปิดกล้องสดไม่ได้: ${error?.message || error} · ใช้ “ถ่ายรูป / เลือกรูปเพื่อสแกน” หรือเครื่องสแกนด้านล่าง`);
    Q('scannerManualValue')?.focus();
  });
}

async function closeScanner() {
  const scanner = _html5Qr;
  const hadOverlay = Boolean(Q('scanOverlay'));
  _html5Qr = null;
  if (scanner) {
    if (_html5QrCameraRunning) {
      try { await scanner.stop(); } catch (_) {}
    }
    _html5QrCameraRunning = false;
    try { scanner.clear(); } catch (_) {}
  }
  Q('scanOverlay')?.remove();
  if (hadOverlay) {
    document.body.style.overflow = _scannerPreviousOverflow;
    _scannerPreviousOverflow = '';
  }
  _scannerLocked = false;
}

async function finishBarcodeScan(text) {
  const value = String(text || '').trim();
  if (!value || _scannerLocked) return;
  _scannerLocked = true;
  const callback = _scannerCallback;
  _scannerCallback = null;
  await closeScanner();
  if (callback) callback(value);
}

function commitManualScan() {
  finishBarcodeScan(Q('scannerManualValue')?.value || '');
}

function scanIntoField(targetId, label='ข้อมูล') {

      input.dispatchEvent(new Event('input',{ bubbles:true }));
      input.dispatchEvent(new Event('change',{ bubbles:true }));
      input.focus();
    },
  });
}

function onTaskLocationScanned(text) {
  const code = (text || '').trim().toUpperCase();

  const match = tasks.find(a => a.locations?.code?.toUpperCase() === code);
  if (match) {
    if (['completed','approved'].includes(match.status)) { alert(`Location "${code}" นับเสร็จแล้ว`); return; }
    go('c-count', { aid: match.id });

const _dataInfoMatchCache = new Map();
const _dataInfoMatchCacheTime = new Map();
const _dataInfoMatchTimers = new Map();
const DATA_INFO_CACHE_TTL_MS = 5 * 60 * 1000;

function dataInfoAttributesObject(info) {
  if (!info?.attributes) return {};
  if (typeof info.attributes === 'object' && !Array.isArray(info.attributes)) return info.attributes;
  try {
    const parsed = JSON.parse(info.attributes);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch (_) {
    return {};
  }
}

function isDataInfoBarcodeAttribute(key) {
  return ['BARCODE','BARCODENO','EAN','EAN13','UPC','GTIN','ITEMBARCODE']
    .includes(normalizeImportHeader(key));
}

function sanitizeDataInfoAttributes(input) {
  const attributes = dataInfoAttributesObject({ attributes:input });
  return Object.fromEntries(
    Object.entries(attributes).filter(([key]) => !isDataInfoBarcodeAttribute(key))
  );
}

function dataInfoCategory(info) {
  if (info?.category) return String(info.category).trim();
  const attributes = dataInfoAttributesObject(info);
  const categoryKey = Object.keys(attributes).find(key =>
    ['CATEGORY','ITEMCATEGORY','PRODUCTCATEGORY','PRODUCTGROUP','ITEMCLASS'].includes(normalizeImportHeader(key))
  );
  const value = categoryKey ? attributes[categoryKey] : '';
  return String(Array.isArray(value) ? value[0] : value || '').trim();
}

async function findDataInfo(rawCode) {
  const code = importCodeKey(rawCode);
  if (!code) return null;
  if (_dataInfoMatchCache.has(code)
      && Date.now() - Number(_dataInfoMatchCacheTime.get(code) || 0) < DATA_INFO_CACHE_TTL_MS) {
    return _dataInfoMatchCache.get(code);
  }
  _dataInfoMatchCache.delete(code);
  _dataInfoMatchCacheTime.delete(code);

  let row = null;
  const byItem = await sb.from('data_info_items')
    .select('item_code,description,uom,attributes')
    .eq('item_code',code)
    .maybeSingle();
  if (!byItem.error) row = byItem.data;

  if (!row) {
    const itemResult = await sb.from('items')
      .select('code,description,uom,category')
      .eq('code',code)
      .maybeSingle();
    if (!itemResult.error && itemResult.data) {
      row = {
        item_code:itemResult.data.code,
        description:itemResult.data.description,
        uom:itemResult.data.uom,
        category:itemResult.data.category || '',
        attributes:{ source:'items' },
      };
    }
  }
  if (row) {
    row.category = dataInfoCategory(row);
    const cacheKeys = [
      code,
      row.item_code ? importCodeKey(row.item_code) : '',
    ].filter(Boolean);
    cacheKeys.forEach(cacheKey => {
      _dataInfoMatchCache.set(cacheKey,row);
      _dataInfoMatchCacheTime.set(cacheKey,Date.now());
    });
  }
  return row || null;
}

async function matchDataInfoForFields(itemInputId,descriptionInputId,uomInputId,cardId) {
  const itemInput = Q(itemInputId);
  const descriptionInput = Q(descriptionInputId);
  const uomInput = Q(uomInputId);
  const card = Q(cardId);
  const rawCode = itemInput?.value || '';
  const requestKey = importCodeKey(rawCode);
  if (!requestKey) {
    if (descriptionInput) descriptionInput.value = '';
    if (uomInput) uomInput.value = '';
    if (card) {
      card.classList.add('is-missing');
      card.innerHTML = '<strong>รอสแกนหรือกรอก Item</strong><span>Description และ UOM จะดึงจาก Item Master อัตโนมัติ</span>';
    }
    return null;
  }

  if (card) {
    card.classList.remove('is-missing');
    card.innerHTML = '<strong>กำลัง Match Item Master...</strong><span>ตรวจ Item Code และ CATEGORY</span>';
  }
  const info = await findDataInfo(requestKey);
  if (importCodeKey(itemInput?.value) !== requestKey) return null;
  if (info) {
    if (itemInput) itemInput.value = info.item_code || requestKey;
    if (descriptionInput) descriptionInput.value = info.description || '';
    if (uomInput) uomInput.value = info.uom || '';
    if (card) {
      card.classList.remove('is-missing');
      card.innerHTML = `<strong>${escapeWmsText(info.description || 'ไม่ระบุ Description')}</strong>
        <span>UOM: <b>${escapeWmsText(info.uom || '—')}</b>${info.category ? ` · CATEGORY: ${escapeWmsText(info.category)}` : ''}</span>`;
    }
    return info;
  }
  if (descriptionInput) descriptionInput.value = '';
  if (uomInput) uomInput.value = '';
  if (card) {
    card.classList.add('is-missing');
    card.innerHTML = `<strong>ไม่พบ ${escapeWmsText(requestKey)} ใน Item Master</strong>
      <span>ยังส่งงานให้ Supervisor ตรวจสอบได้ แต่ Description / UOM จะว่าง</span>`;
  }
  return null;
}

function scheduleDataInfoMatch(itemInputId,descriptionInputId,uomInputId,cardId) {
  const key = `${itemInputId}|${cardId}`;
  clearTimeout(_dataInfoMatchTimers.get(key));
  _dataInfoMatchTimers.set(key,setTimeout(
    () => matchDataInfoForFields(itemInputId,descriptionInputId,uomInputId,cardId),
    280,
  ));
}

async function createFoundItemRecord(payload) {
  const licensePlate = normalizeImportText(payload?.license_plate);
  if (!licensePlate) throw new Error('กรุณากรอก LPN ให้ครบ');
  payload.license_plate = licensePlate;
  if (payload.assignment_id && payload.source_type === 'empty_location') {
    let existingQuery = sb.from('found_items')
      .select('id,status')
      .eq('assignment_id',payload.assignment_id)
      .eq('item_code',payload.item_code)
      .eq('source_type','empty_location')
      .eq('status','pending_review');
    existingQuery = existingQuery.eq('license_plate',payload.license_plate);
    const existing = await existingQuery
      .limit(1)
      .maybeSingle();
    if (!existing.error && existing.data) return existing.data;
  }
  const { data,error } = await sb.from('found_items').insert(payload).select('id,status').single();
  if (error?.code === '23505') {
    throw new Error('รายการ Location / LPN / Item นี้อยู่ในคิวตรวจของ Supervisor แล้ว');
  }
  if (error) throw error;
  return data;
}

async function submitFoundWork() {
  const alertBox = Q('found_alert');
  const button = Q('found_submit');
  const sessionId = Q('found_session')?.value || '';
  const locationCode = importCodeKey(Q('found_location')?.value);
  const licensePlate = normalizeImportText(Q('found_lpn')?.value) || null;
  const rawItemCode = importCodeKey(Q('found_item')?.value);
  const qty = Number(Q('found_qty')?.value);
  const selectedCounters = [...(window._selectedCounters || [])];

  if (!sessionId || !locationCode || !licensePlate || !rawItemCode || !Number.isFinite(qty) || qty <= 0) {
    alertBox.innerHTML = '<div class="alert alert-red">กรอก Session, Location, LPN, Item และ QTY มากกว่า 0 ให้ครบ</div>';
    return;
  }
  if (!selectedCounters.length) {
    alertBox.innerHTML = '<div class="alert alert-red">กรุณาเลือกผู้นับจริงอย่างน้อย 1 คน</div>';
    return;
  }

  button.disabled = true;
  button.textContent = 'กำลังส่งให้ Supervisor...';
  alertBox.innerHTML = '<div class="alert alert-blue">⏳ กำลังตรวจสอบ Item Master และบันทึกงาน...</div>';
  try {
    const info = await findDataInfo(rawItemCode);
    const itemCode = importCodeKey(info?.item_code || rawItemCode);
    const [locationResult,itemResult] = await Promise.all([
      sb.from('locations').select('id,code').eq('code',locationCode).maybeSingle(),
      sb.from('items').select('id,code,description,uom').eq('code',itemCode).maybeSingle(),
    ]);
    if (locationResult.error) throw locationResult.error;
    if (itemResult.error) throw itemResult.error;

    await createFoundItemRecord({
      session_id:sessionId,
      assignment_id:null,
      location_id:locationResult.data?.id || null,
      location_code:locationCode,
      license_plate:licensePlate,
      item_id:itemResult.data?.id || null,
      item_code:itemCode,
      description:info?.description || itemResult.data?.description || Q('found_description')?.value || null,
      uom:info?.uom || itemResult.data?.uom || Q('found_uom')?.value || null,
      qty,
      remark:getSelectedCountRemarks('found').join('\n') || null,
      photo_url:window._photoMap?.found || null,
      actual_counter_name:selectedCounters.join(', '),
      source_type:'ad_hoc',
      status:'pending_review',
      discovered_by:me.id,
    });
    alertBox.innerHTML = '<div class="alert alert-green">✅ บันทึกแล้ว · งานเข้าคิว Supervisor ทันที</div>';
    setTimeout(() => go('c-tasks'),900);
  } catch (error) {
    alertBox.innerHTML = errBox(error.message || error);
    button.disabled = false;
    button.textContent = '✅ บันทึกและส่ง Supervisor ตรวจสอบ';
  }
}

async function loadCCount() {
  const { aid } = S;
  let jid = S.jid || '';
  let jitemid = S.jitemid || '';
  let annualMode = Boolean(jid && jitemid);

  const { data: asgn } = await sb.from('assignments')
    .select('id,status,location_id,session_id,locations(code,zone,area,row_no,level),count_sessions(name)')
    .eq('id', aid).single();

  if (!asgn) { go('c-tasks'); return; }

  // ป้องกัน route ของ JOB หลุดเมื่อย้อนกลับ/สแกน/รีโหลด:
  // ตรวจจากฐานข้อมูลซ้ำว่า Location นี้อยู่ใน JOB ของ User ปัจจุบันหรือไม่
  if (!annualMode) {
    const itemResult = await fetchPagedSupabaseRows(
      'annual_count_job_items',
      'id,job_id,session_id,location_id,item_id,sort_order',
      query => query.eq('session_id',asgn.session_id).eq('location_id',asgn.location_id).order('sort_order'),
    );
    const candidateItems = itemResult.data || [];
    if (!itemResult.error && candidateItems.length) {
      const jobResult = await fetchSupabaseRowsByValues(
        'annual_count_jobs',
        'id,job_code,assigned_to,status,session_id',
        'id',
        candidateItems.map(item => item.job_id),
      );
      const allowedJobs = (jobResult.data || []).filter(job =>
        job.session_id === asgn.session_id &&
        (job.assigned_to === me?.id || ['admin','supervisor'].includes(prof?.role))
      );
      const inferredJob = allowedJobs[0];
      const inferredItem = candidateItems.find(item => item.job_id === inferredJob?.id);
      if (inferredJob && inferredItem) {
        jid = inferredJob.id;
        jitemid = inferredItem.id;
        annualMode = true;
        S.jid = jid;
        S.jitemid = jitemid;
      }
    }
  }

  let annualJob = null;
  let annualJobItems = [];
  if (annualMode) {
    const [jobResult,itemResult] = await Promise.all([
      sb.from('annual_count_jobs')
        .select('id,job_code,assigned_to,status,session_id')
        .eq('id',jid).maybeSingle(),
      sb.from('annual_count_job_items')
        .select('id,job_id,session_id,location_id,item_id,sort_order')
        .eq('job_id',jid)
        .eq('location_id',asgn.location_id)
        .order('sort_order'),
    ]);
    if (jobResult.error || itemResult.error) {
      cnt().innerHTML = errBox((jobResult.error || itemResult.error).message);
      return;
    }
    annualJob = jobResult.data;
    annualJobItems = itemResult.data || [];
    const selectedItem = annualJobItems.find(item => item.id === jitemid);
    const canOpen = annualJob &&
      annualJob.session_id === asgn.session_id &&
      selectedItem &&
      (annualJob.assigned_to === me?.id || ['admin','supervisor'].includes(prof?.role));
    if (!canOpen) {
      cnt().innerHTML = `<div class="card"><div class="alert alert-red">JOB นี้ไม่ได้ถูกจ่ายให้ User ปัจจุบัน หรือข้อมูล Assignment ไม่ตรงกัน</div></div>`;
      return;
    }
  }

  let round = annualMode ? 1 : nextRound(asgn.status);
  if (!round) { go('c-tasks'); return; }

  const l   = asgn.locations;
  const sub = [l.zone, l.area, l.row_no && 'Row '+l.row_no, l.level && 'Lv.'+l.level].filter(Boolean).join(' · ');

  const [{ data: rawSnaps }, { data: rawDetails }, { data: sessInfo }, { data: counterNames }, { data: countRemarkRows }, rules] = await Promise.all([
    sb.from('stock_snapshot')
      .select('item_id,onhand_qty,al_qty,items(id,code,description)')
      .eq('session_id', asgn.session_id)
      .eq('location_id', asgn.location_id),
    sb.from('stock_snapshot_detail')
      .select('item_id,license_plate,lot,inventory_status,qty,uom')
      .eq('session_id', asgn.session_id)
      .eq('location_id', asgn.location_id),
    sb.from('count_sessions').select('show_oh').eq('id', asgn.session_id).single(),
    sb.from('counter_names').select('id,name').order('name'),
    sb.from('remark_options').select('id,label').eq('context','count').order('label'),
    getSessionRules(asgn.session_id),
  ]);
  // การนับแบบ JOB ใช้ขอบเขตงานระดับ Location เหมือนงานปกติ:
  // โหลดสินค้ากับรายละเอียดทั้งหมดของ Location ไม่ตัดเหลือเฉพาะ ITEM ที่ใช้แบ่ง JOB
  const snaps = rawSnaps || [];
  const details = rawDetails || [];
  const annualItemIds = new Set(snaps.map(item => item.item_id).filter(Boolean));

  window._counterNames = counterNames || [];
  window._countRemarkOptions = countRemarkRows?.length
    ? countRemarkRows
    : COUNT_REMARK_PRESETS.map(label => ({ id:null, label }));
  // การมองเห็นยอดยึดตาม Session เดียวกันทั้งงานปกติและ JOB
  const showOH = sessInfo?.show_oh === true;

  if (!snaps?.length) {
    cnt().innerHTML = `<div class="card">
      <div class="alert alert-amber">ไม่พบรายการสินค้าสำหรับ Location นี้ — กรุณาติดต่อ Admin</div>
    </div>`; return;
  }

  const detailByItem = {};
  (details||[]).forEach(d => {
    detailByItem[d.item_id] = detailByItem[d.item_id] || [];
    detailByItem[d.item_id].push(d);
  });

  let prev = [];
  let allPhotoRecs = [];
  if (annualMode) {
    const { data: annualCounts,error:annualCountError } = await sb.from('count_records')
      .select('item_id,round,count_qty,remark,photo_url')
      .eq('assignment_id',aid)
      .in('item_id',[...annualItemIds])
      .order('round');
    if (annualCountError) {
      cnt().innerHTML = errBox(annualCountError.message);
      return;
    }
    const countRows = annualCounts || [];
    const roundsByItem = {};
    countRows.forEach(record => {
      roundsByItem[record.item_id] = roundsByItem[record.item_id] || {};
      roundsByItem[record.item_id][record.round] = Number(record.count_qty);
    });
    const itemStatuses = snaps.map(snapshot => {
      const counted = roundsByItem[snapshot.item_id] || {};
      return computeItemStatus(snapshot.onhand_qty,counted[1],counted[2],counted[3],rules);
    });
    if (itemStatuses.length && itemStatuses.every(status => status === 'OK' || status === 'Diff')) {
      alert('รายการใน Location นี้นับครบแล้ว');
      go('c-tasks');
      return;
    }
    const highestRound = countRows.reduce((max,record) => Math.max(max,Number(record.round) || 0),0);
    round = Math.min(Number(rules.maxRounds) || 3,highestRound + 1);
    prev = countRows.filter(record => Number(record.round) === round);
    allPhotoRecs = countRows.filter(record => record.photo_url);
  } else {
    const [prevResult,photoResult] = await Promise.all([
      sb.from('count_records')
        .select('item_id,count_qty,remark,photo_url').eq('assignment_id', aid).eq('round', round),
      sb.from('count_records')
        .select('item_id,round,photo_url').eq('assignment_id', aid).not('photo_url', 'is', null).order('round'),
    ]);
    prev = prevResult.data || [];
    allPhotoRecs = photoResult.data || [];
  }
  const prevMap = Object.fromEntries(prev?.map(r => [r.item_id, r]) || []);

  window._prevPhotoMap = {};
  allPhotoRecs?.forEach(r => { window._prevPhotoMap[r.item_id] = r.photo_url; });

  window._photoMap = {};
  window._emptyCountItemIds = new Set();
  window._countFoundContext = {
    assignmentId:aid,
    sessionId:asgn.session_id,
    locationId:asgn.location_id,
    locationCode:l.code,
  };

  let items = '';
  for (const s of snaps) {
    const it   = s.items;
    const emptyLocation = isEmptyLocationItem(it?.code);
    if (emptyLocation) window._emptyCountItemIds.add(String(it.id));
    const pr   = prevMap[it.id];
    const v    = pr?.count_qty;
    const dets = detailByItem[it.id] || [];

    let detHtml = '';
    const alQty = s.al_qty ?? null;
    const ohDisplay = showOH
      ? `<div class="oh-badge">
          <span class="oh-badge-label">OH</span>
          <span class="oh-badge-val">${s.onhand_qty ?? 0}</span>
          <span class="oh-badge-al">AL ${alQty ?? '—'}</span>
        </div>`
      : `<div class="oh-badge is-blind"><span class="oh-badge-blind">🔒 Blind<br>Count</span></div>`;
    
    if (dets.length) {
      const rows = dets.map(d => `
        <tr>
          <td style="font-family:ui-monospace,monospace">${escapeWmsText(d.license_plate||'—')}</td>
          <td>${escapeWmsText(d.lot||'—')}</td>
          <td><span class="tag tag-gray" style="font-size:10px">${escapeWmsText(d.inventory_status||'—')}</span></td>
          <td class="num">${showOH ? (d.qty ?? '—') : '<span class="blind-qty">Blind Count</span>'}</td>
          <td class="uom">${escapeWmsText(d.uom||'—')}</td>
        </tr>`).join('');
      detHtml = `<div class="citem-detail-scroll">
        <table class="citem-detail-table">
          <thead><tr>
            <th>LICENSE PLATE</th>
            <th>LOT</th>
            <th>STATUS</th>
            <th style="text-align:right">QTY</th>
            <th>UNIT</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    const photoUrl = pr?.photo_url || window._prevPhotoMap?.[it.id] || null;
    if (photoUrl && !window._photoMap) window._photoMap = {};
    if (photoUrl) window._photoMap[it.id] = photoUrl;

    const hasExtra = !!(pr?.remark || photoUrl);
    const selectedRemarks = parseCountRemarks(pr?.remark);
    const remarkChoices = [...(window._countRemarkOptions || [])];
    selectedRemarks.forEach(label => {
      if (!remarkChoices.some(option => option.label === label)) remarkChoices.push({ id:null, label });
    });
    const remarkOptions = remarkChoices.map(option => `
      <label class="count-remark-option">
        <input type="checkbox" value="${escapeWmsText(option.label)}"
          ${selectedRemarks.includes(option.label)?'checked':''}
          onchange="refreshCountRemarkSummary('${it.id}')">
        <span>${escapeWmsText(option.label)}</span>
      </label>`).join('');

    items += `<div class="citem-wrap">
      <div class="citem">
        <div class="citem-info">
          ${emptyLocation
            ? `<div class="citem-code"><span class="tag tag-blue">Location ว่าง</span></div>
               <div class="citem-desc">ถ้ายังว่างให้กรอก QTY = 0 · ถ้าพบสินค้าจริงให้สแกน Location / LPN / Item แล้วกรอก QTY</div>
               <div class="found-form-grid" style="margin-top:14px">
                 <div class="fg" style="margin:0">
                   <label>LOCATION</label>
                   <div class="scan-input-row">
                     <input id="empty_location_${it.id}" value="${escapeWmsText(l.code)}"
                       autocomplete="off" oninput="this.value=this.value.toUpperCase()">
                     <button type="button" class="scan-field-button"
                       onclick="scanIntoField('empty_location_${it.id}','Location')" title="สแกน Location">${barcodeScanIconSvg()}</button>
                   </div>
                 </div>
                 <div class="fg" style="margin:0">
                   <label>LPN <span style="color:var(--accent-red)">*</span></label>
                   <div class="scan-input-row">
                     <input id="empty_lpn_${it.id}" autocomplete="off" placeholder="สแกนหรือกรอก LPN">
                     <button type="button" class="scan-field-button"
                       onclick="scanIntoField('empty_lpn_${it.id}','LPN')" title="สแกน LPN">${barcodeScanIconSvg()}</button>
                   </div>
                 </div>
                 <div class="fg span-2" style="margin:0">
                   <label>ITEM</label>
                   <div class="scan-input-row">
                     <input id="empty_item_${it.id}" autocomplete="off" placeholder="สแกนหรือกรอก Item Code"
                       oninput="this.value=this.value.toUpperCase();scheduleDataInfoMatch('empty_item_${it.id}','empty_desc_${it.id}','empty_uom_${it.id}','empty_info_${it.id}')">
                     <button type="button" class="scan-field-button"
                       onclick="scanIntoField('empty_item_${it.id}','Item')" title="สแกน Item">${barcodeScanIconSvg()}</button>
                   </div>
                 </div>
                 <div class="span-2">
                   <input id="empty_desc_${it.id}" type="hidden">
                   <input id="empty_uom_${it.id}" type="hidden">
                   <div class="info-match-card is-missing" id="empty_info_${it.id}">
                     <strong>รอสแกนหรือกรอก Item</strong>
                     <span>Description และ UOM จะดึงจาก Item Master อัตโนมัติ</span>
                   </div>
                 </div>
               </div>`
            : `<div class="citem-code">${escapeWmsText(it?.code || '')}</div>
               <div class="citem-desc">${escapeWmsText(it?.description || '')}</div>`}
          ${detHtml}
        </div>
        <button class="item-toggle ${hasExtra?'has':''}" id="tg_${it.id}" onclick="toggleExtra('${it.id}')" title="หมายเหตุ/รูป">📝</button>
        <div class="count-value-stack">
          <input type="number" class="cqty ${v !== undefined ? 'ok' : ''}"
            id="q_${it.id}" min="0" step="1"
            value="${v !== undefined ? v : ''}" placeholder="0"
            oninput="this.classList.add('ok')">
          ${ohDisplay}
        </div>
      </div>
      <div class="item-extra ${hasExtra?'open':''}" id="extra_${it.id}">
        <label style="font-size:12px">หมายเหตุ (ไม่บังคับ) — เลือกได้หลายข้อ</label>
        <div class="count-remark-picker" id="count_remark_picker_${it.id}">
          <button type="button" class="count-remark-trigger" id="count_remark_trigger_${it.id}"
            aria-haspopup="true" aria-expanded="false"
            onclick="toggleCountRemarkDropdown(event,'${it.id}')">
            <strong id="count_remark_summary_${it.id}">
              ${selectedRemarks.length ? `${selectedRemarks.length} ข้อ: ${escapeWmsText(selectedRemarks.join(', '))}` : 'เลือกหมายเหตุ'}
            </strong>
            <span class="counter-picker-chevron">⌄</span>
          </button>
          <div class="count-remark-menu" id="count_remark_menu_${it.id}" hidden onclick="event.stopPropagation()">
            <div class="count-remark-menu-head">
              <span>เลือกหมายเหตุได้หลายข้อ</span>
              <button type="button" onclick="toggleCountRemarkDropdown(event,'${it.id}')" aria-label="ปิด">✕</button>
            </div>
            <div class="count-remark-options" id="count_remark_options_${it.id}">${remarkOptions}</div>
            ${prof?.role === 'admin' ? `<div class="count-remark-add-row">
              <input type="text" id="count_remark_custom_${it.id}" placeholder="เพิ่มหมายเหตุใหม่..."
                onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomCountRemark(event,'${it.id}');}">
              <button type="button" class="btn btn-green"
                onclick="addCustomCountRemark(event,'${it.id}')" aria-label="เพิ่มหมายเหตุ">+</button>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px"
              onclick="go('ad-users')">⚙️ แก้ไข / ลบรายการหมายเหตุ</button>` : ''}
          </div>
        </div>
        <div style="margin-top:14px">
          <label style="font-size:12px">รูปถ่าย (ไม่บังคับ)</label><br>
          <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-ghost btn-sm" onclick="openCameraFor('${it.id}')">📷 กล้อง</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="openGalleryFor('${it.id}')">🖼 เลือกรูป</button>
          </div>
          <input type="file" accept="image/*" capture="environment" id="cam_${it.id}"
            style="display:none" onchange="handlePhoto('${it.id}', this)">
          <input type="file" accept="image/*" id="gal_${it.id}"
            style="display:none" onchange="handlePhoto('${it.id}', this)">
          <img id="thumb_${it.id}" class="photo-thumb" src="${photoUrl||''}" style="${photoUrl?'':'display:none'}">
        </div>
      </div>
    </div>`;
  }

  const ids = snaps.map(s => s.item_id).join(',');

  cnt().innerHTML = `
    <div class="card count-header-card">
      <div class="mono" style="font-size:22px;font-weight:800;color:var(--text-main)">${l.code}</div>
      <div style="font-size:14px;color:var(--text-muted);margin-top:4px; font-weight:600;">${sub}</div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <span class="tag tag-blue">รอบที่ ${round}</span>
        <span class="tag tag-gray">${asgn.count_sessions.name}</span>
        ${annualMode ? `<span class="tag tag-green">${escapeWmsText(annualJob.job_code)}</span>` : ''}
        <span class="tag ${showOH?'tag-green':'tag-gray'}">${showOH?'OH + AL':'🔒 Blind Count'}</span>
      </div>
      ${round > 1 ? `<div class="alert alert-amber" style="margin-top:16px">
        🔄 ยอดไม่ตรงจากรอบที่ ${round-1} — กรุณานับใหม่อย่างระมัดระวัง
      </div>` : ''}
      <div class="fg" style="margin-top:20px;margin-bottom:0">
        <label>ผู้นับจริง (ทีมนับ)</label>
        <div class="counter-picker" id="counterPicker">
          <button type="button" class="counter-picker-trigger" id="counterPickerTrigger"
            aria-haspopup="true" aria-expanded="false" onclick="toggleCounterDropdown(event)">
            <span class="counter-picker-trigger-copy">
              <small>เลือกได้หลายคน</small>
              <strong id="counterPickerSummary">เลือกผู้นับจริง</strong>
            </span>
            <span class="counter-picker-chevron">⌄</span>
          </button>
          <div class="counter-picker-menu" id="counterPickerMenu" hidden onclick="event.stopPropagation()">
            <div class="counter-picker-title">รายชื่อผู้นับ <span>แตะเพื่อเลือก / ยกเลิก</span></div>
            <div id="counterNameOptions" class="counter-option-list"></div>
            ${prof?.role === 'admin' ? `<div class="counter-add-row">
              <input type="text" id="counterNameNewInput" placeholder="เพิ่มชื่อผู้นับใหม่..."
                onkeydown="if(event.key==='Enter'){event.preventDefault();confirmNewCounterName();}">
              <button type="button" class="btn btn-green" onclick="confirmNewCounterName()" aria-label="เพิ่มชื่อผู้นับ">+</button>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px"
              onclick="go('ad-users')">⚙️ แก้ไข / ลบรายชื่อคนนับ</button>` : ''}
          </div>
        </div>
        <div id="counterSelectedChips" class="counter-selected-chips"></div>
      </div>
    </div>
      <div class="sec">📦 ${snaps.length} รายการ — กรอกจำนวนที่นับได้จริง (Location ว่างให้กรอก 0)</div>
    <div class="card card-flush count-items-card">${items}</div>
    <div style="padding:16px 20px">
      <div id="ca"></div>
      <button class="btn btn-green" id="cb" style="width:100%"
        onclick="submitCount('${aid}',${round},'${ids}','${annualMode ? jid : ''}')">
        ✅ ยืนยันรอบที่ ${round} · ${snaps.length} รายการ
      </button>
    </div>`;

  window._selectedCounters = new Set((window._lastPickedCounterNames||[]).filter(n => (window._counterNames||[]).some(c=>c.name===n)));
  renderCounterPicker();

  if (annualMode && annualJob.status === 'pending') {
    await sb.from('annual_count_jobs').update({ status:'in_progress' }).eq('id',jid);
  } else if (!annualMode && asgn.status === 'pending') {
    await sb.from('assignments').update({ status:'in_progress' }).eq('id', aid);
  }
}

function renderCounterPicker() {
  const wrap = Q('counterNameOptions');
  const summary = Q('counterPickerSummary');
  const chips = Q('counterSelectedChips');
  if (!wrap || !summary || !chips) return;
  const names = window._counterNames || [];
  window._selectedCounters = window._selectedCounters || new Set();
  const selected = [...window._selectedCounters];

  summary.textContent = selected.length
    ? `${selected.length} คน: ${selected.join(', ')}`
    : 'เลือกผู้นับจริง';
  chips.innerHTML = selected.map(name =>
    `<span class="counter-selected-chip">✓ ${escapeWmsText(name)}</span>`
  ).join('');

  if (!names.length) {
    wrap.innerHTML = `<div style="font-size:13px;color:#587784;padding:8px 2px">ยังไม่มีชื่อในระบบ — เพิ่มชื่อใหม่ด้านล่างได้เลย</div>`;
    return;
  }
  wrap.innerHTML = names.map((c, index) => {
    const sel = window._selectedCounters.has(c.name);
    return `<button type="button" class="counter-option ${sel?'sel':''}" onclick="toggleCounterByIndex(${index})">
      <span class="counter-option-mark">${sel?'✓':''}</span>
      <span>${escapeWmsText(c.name)}</span>
    </button>`;
  }).join('');
}
