<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Count v95 - Sidebar Center & Correct Backup Totals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Mitr:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
<!-- SheetJS สำหรับอ่านไฟล์ XLSX -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- html5-qrcode สำหรับสแกน Location -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
/* ── Neumorphism Soft UI Variables ── */
:root {
  --main-bg: #EDF6F9; 
  --neu-surface: #EDF6F9;
  
  --neu-shadow-dark: #d7e6ea; 
  --neu-shadow-light: #ffffff; 
  
  --sidebar-bg: linear-gradient(180deg, #83C5BE 0%, #006D77 100%);
  --sidebar-hover: rgba(255, 255, 255, 0.25);
  --sidebar-text: rgba(255, 255, 255, 0.9);
  --sidebar-active-bg: #ffffff;
  --sidebar-active-text: #006D77;
  
  --primary-blue: #006D77;
  --primary-grad: linear-gradient(135deg, #83C5BE 0%, #006D77 100%);
  --accent-green: #006D77;
  --accent-red: #E29578;
  --accent-amber: #FFDDD2;
  
  --text-main: #264653;
  --text-muted: #6f8a8d;
  
  --border-radius-xl: 32px;
  --border-radius-lg: 20px;
  --border-radius-md: 14px;
  --border-radius-sm: 8px;
  
  --sidebar-width: 260px;
  --sidebar-collapsed-width: 80px;
  --topbar-height: 70px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Mitr', 'Fredoka', 'Sarabun', sans-serif;
  background: var(--main-bg);
  color: var(--text-main);
  min-height: 100vh;
  font-size: 14px;
  overflow-x: hidden;
}

.app-container {
  display: flex;
  min-height: 100vh;
  width: 100vw;
  overflow: hidden;
  padding: 12px;
  gap: 15px;
}

/* ── Collapsible Modern Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 200;
  border-radius: var(--border-radius-xl);
  box-shadow: 12px 12px 30px rgba(78, 168, 222, 0.25), inset -4px -4px 10px rgba(255,255,255,0.2);
  position: relative;
  overflow: hidden;
}
.sidebar.collapsed {
  width: var(--sidebar-collapsed-width);
}
.sidebar.collapsed .sidebar-title,
.sidebar.collapsed .sidebar-sub,
.sidebar.collapsed .sidebar-footer,
.sidebar.collapsed .nav-item span:not(.nav-icon) {
  display: none;
}
.sidebar.collapsed .sidebar-header {
  padding: 24px 10px;
}
.sidebar.collapsed .nav-item {
  justify-content: center;
  padding: 14px;
}

.sidebar-header {
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}
.sidebar-logo-icon {
  width: 64px;
  height: 64px;
  background: #ffffff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #4ea8de;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 2px 2px 5px rgba(255,255,255,0.8);
}
.sidebar-title { font-size: 18px; font-weight: 700; color: #FFFFFF; font-family: 'Fredoka', sans-serif; letter-spacing: 0.5px; }
.sidebar-sub { font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 500; }

.sidebar-menu { padding: 10px 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

.nav-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 20px;
  border-radius: 20px;
  color: var(--sidebar-text);
  font-weight: 600; cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left; font-family: inherit; font-size: 15px;
  transition: all 0.25s ease;
}
.nav-item:hover { background: var(--sidebar-hover); color: #FFFFFF; transform: translateX(3px); }
.nav-item.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  box-shadow: 0 8px 20px rgba(0,0,0,0.12), inset 2px 2px 5px rgba(255,255,255,0.5);
  font-weight: 700;
}
.nav-icon { font-size: 20px; flex-shrink: 0; }
.nav-group { display:flex; flex-direction:column; gap:6px; }
.nav-parent { justify-content:flex-start; }
.nav-parent .nav-chevron { margin-left:auto; transition:transform .2s ease; font-size:13px; }
.nav-group.open .nav-chevron { transform:rotate(180deg); }
.nav-submenu { display:none; flex-direction:column; gap:5px; padding-left:18px; }
.nav-group.open .nav-submenu { display:flex; }
.nav-subitem { padding:11px 14px; border-radius:16px; font-size:13px; }
.nav-subitem .nav-icon { font-size:16px; }
.mobile-sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(20,35,50,.35); backdrop-filter:blur(2px); z-index:999; }
.mobile-sidebar-backdrop.show { display:block; }
.sidebar-footer { padding: 20px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.7); border-top: 1px solid rgba(255,255,255,0.15); margin: 0 16px 10px; }

/* ── Main Content Area ── */
.main-wrapper {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  height: calc(100vh - 24px); overflow-y: auto;
  background: transparent;
}

/* ── Topbar ── */
.topbar {
  height: var(--topbar-height);
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; flex-shrink: 0;
  background: var(--main-bg);
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.toggle-sidebar-btn {
  background: var(--neu-surface); border: none; font-size: 18px; cursor: pointer;
  color: var(--text-main); width: 44px; height: 44px; border-radius: 50%;
  box-shadow: 5px 5px 10px var(--neu-shadow-dark), -5px -5px 10px var(--neu-shadow-light);
  display: flex; align-items: center; justify-content: center;
  transition: 0.2s;
}
.toggle-sidebar-btn:active { box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); }
.topbar-title { font-size: 24px; font-weight: 700; color: var(--text-main); font-family: 'Fredoka', sans-serif;}
.page-back-btn {
  min-width: 86px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 15px;
  border: none;
  border-radius: 16px;
  background: var(--neu-surface);
  color: var(--text-main);
  box-shadow: 5px 5px 11px var(--neu-shadow-dark), -5px -5px 11px var(--neu-shadow-light);
  font-family: 'Mitr', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, color .18s ease;
  flex: 0 0 auto;
}
.page-back-btn:hover {
  color: var(--primary-blue);
  transform: translateX(-2px);
}
.page-back-btn:active {
  transform: translateX(-1px) scale(.98);
  box-shadow: inset 3px 3px 7px var(--neu-shadow-dark), inset -3px -3px 7px var(--neu-shadow-light);
}
.page-back-btn svg {
  width: 19px;
  height: 19px;
  display: block;
  flex: 0 0 auto;
}

.topbar-right { display: flex; align-items: center; gap: 16px; }
.user-profile {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px;
  background: var(--neu-surface); border-radius: 30px;
  box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
}
.user-avatar {
  width: 32px; height: 32px; background: var(--primary-grad); color: white;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.user-name { font-weight: 600; font-size: 14px; color: var(--text-main); }

.top-out-btn {
  background: var(--neu-surface); border: none; color: var(--accent-red);
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer;
  box-shadow: 5px 5px 10px var(--neu-shadow-dark), -5px -5px 10px var(--neu-shadow-light);
  transition: all 0.2s ease;
}
.top-out-btn:active { box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); }

.page-content { padding: 20px; flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; }

/* ── Mobile Sidebar ── */
@media (max-width: 768px) {
  .app-container { padding: 0; }
  .sidebar {
    position: fixed; left: -300px; top: 0; bottom: 0; margin: 0;
    border-radius: 0 30px 30px 0; z-index: 1000;
  }
  .sidebar.mobile-open { left: 0; box-shadow:18px 0 40px rgba(0,0,0,.25); }
  .sidebar.collapsed { width:var(--sidebar-width); }
  .sidebar.collapsed .sidebar-title,
  .sidebar.collapsed .sidebar-sub,
  .sidebar.collapsed .sidebar-footer,
  .sidebar.collapsed .nav-item span:not(.nav-icon) { display:initial; }
  .sidebar.collapsed .nav-item { justify-content:flex-start; padding:14px 20px; }
  .main-wrapper { height: 100vh; width:100%; }
  .topbar { padding:0 12px; }
  .topbar-left { min-width:0; gap:8px; }
  .topbar-title { font-size:18px; max-width:48vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .page-back-btn {
    min-width: 42px;
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 14px;
  }
  .page-back-btn span { display:none; }
  .topbar-right { gap:8px; }
  .top-out-btn { padding:9px 12px; }
  .user-name { display: none; }
  .page-content { padding:14px 12px 28px; }
  .card { padding:18px; border-radius:22px; }
  .row { padding:15px 14px; }
  button, .nav-item, .tab-row, .btn { touch-action:manipulation; }
}

/* ── Neumorphic Cards ── */
.card {
  background: var(--neu-surface); border: none;
  border-radius: var(--border-radius-xl); margin-bottom: 24px; padding: 24px;
  box-shadow: 12px 12px 24px var(--neu-shadow-dark), -12px -12px 24px var(--neu-shadow-light);
  position: relative; overflow: hidden;
}
.card-flush { padding: 0; overflow: hidden; }

.sec {
  font-size: 13px; font-weight: 700; color: var(--text-muted);
  padding: 10px 24px; margin-bottom: 10px;
}

.row {
  display: flex; align-items: center; padding: 18px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.5);
  gap: 12px; transition: background 0.2s;
}
.row:last-child { border-bottom: none; }
.row.click { cursor: pointer; }
.row.click:hover { background: rgba(255, 255, 255, 0.4); }
.tab-row { cursor: pointer; transition: background .12s; border-radius: 16px; }
.tab-row:active { background: rgba(0,0,0,0.02); }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
.row-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
.caret { font-size: 20px; color: var(--text-muted); flex-shrink: 0; font-weight: bold; }

/* Status Badges */
.tag {
  display: inline-block; padding: 6px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  box-shadow: 3px 3px 6px var(--neu-shadow-dark), -3px -3px 6px var(--neu-shadow-light);
}
.tag-gray  { background: var(--neu-surface); color: var(--text-muted); }
.tag-blue  { background: var(--main-bg); color: var(--primary-blue); box-shadow: inset 2px 2px 5px rgba(255,255,255,0.5); }
.tag-amber { background: var(--accent-amber); color: #FFFFFF; }
.tag-red   { background: var(--accent-red); color: #FFFFFF; }
.tag-green { background: var(--accent-green); color: #FFFFFF; }

/* ── Neumorphic Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px; border-radius: 30px; font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer; border: none;
  box-shadow: 6px 6px 12px var(--neu-shadow-dark), -6px -6px 12px var(--neu-shadow-light);
  transition: all 0.2s ease;
  color: var(--text-main); background: var(--neu-surface);
}
.btn:active:not(:disabled) { box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light); transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
.btn-blue  { background: var(--primary-blue); color: #FFFFFF; box-shadow: 5px 5px 15px rgba(114, 213, 246, 0.4); }
.btn-green { background: var(--accent-green); color: #FFFFFF; box-shadow: 5px 5px 15px rgba(74, 222, 128, 0.4); }
.btn-red   { background: var(--accent-red); color: #FFFFFF; }
.btn-amber { background: var(--accent-amber); color: #FFFFFF; }
.btn-ghost { }
.btn-dark { background: var(--text-main); color: #FFFFFF; }
.btn-sm { padding: 8px 18px; font-size: 13px; border-radius: 20px; }
.btn-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── Inputs & Alerts ── */
.fg { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
input, select, textarea {
  width: 100%; padding: 14px 18px; border: none; border-radius: var(--border-radius-lg);
  font-size: 14px; font-family: inherit; font-weight: 600; color: var(--text-main);
  background: var(--neu-surface); outline: none;
  box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
  transition: all 0.3s;
}
input:focus, select:focus, textarea:focus {
  box-shadow: inset 6px 6px 12px var(--neu-shadow-dark), inset -6px -6px 12px var(--neu-shadow-light);
}
select { appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: 0.65rem auto; }

.alert {
  padding: 14px 18px; border-radius: var(--border-radius-md); font-size: 13px; margin-bottom: 16px;
  font-weight: 600; box-shadow: inset 3px 3px 6px rgba(0,0,0,0.05), inset -3px -3px 6px rgba(255,255,255,0.5);
  border: none;
}
.alert-red   { background: #ffe4e6; color: #e11d48; }
.alert-green { background: #dcfce7; color: #16a34a; }
.alert-blue  { background: #e0f2fe; color: #0284c7; }
.alert-amber { background: #fef3c7; color: #d97706; }

/* ── Stats & Gauges ── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 24px; }
.stat {
  background: var(--neu-surface); border-radius: var(--border-radius-xl); padding: 24px 16px; text-align: center;
  box-shadow: 10px 10px 20px var(--neu-shadow-dark), -10px -10px 20px var(--neu-shadow-light);
}
.stat-n { font-size: 38px; font-weight: 800; line-height: 1; color: var(--primary-blue); font-family: 'Fredoka', sans-serif; }
.stat-l { font-size: 13px; color: var(--text-muted); margin-top: 8px; font-weight: 700; text-transform: uppercase;}

.prog { height: 16px; background: var(--neu-surface); border-radius: 20px; box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); overflow: hidden; }
.prog-fill { height: 100%; background: var(--primary-blue); border-radius: 20px; transition: width .45s ease; }

/* ── Count Entry & Widgets ── */
.count-items-card {
  display: grid;
  gap: 16px;
  overflow: visible;
  background: transparent;
  box-shadow: none;
}
.citem-wrap {
  overflow: hidden;
  background: #fff;
  border: 1px solid rgba(0, 109, 119, .10);
  border-radius: 24px;
  box-shadow: 0 12px 28px rgba(31, 78, 93, .10);
}
.citem { display: flex; align-items: center; padding: 22px 26px; gap: 18px; }
.citem-info { flex: 1; min-width: 0; }
.citem-code { font-size: 19px; font-weight: 800; font-family: 'Fredoka', monospace; color: #12384a; }
.citem-desc { font-size: 13px; color: #405f6d; margin-top: 4px; font-weight: 600; }
.citem-detail-scroll { margin-top: 12px; overflow-x: auto; }
.citem-detail-table { width: 100%; min-width: 590px; border-collapse: separate; border-spacing: 0; }
.citem-detail-table th {
  padding: 7px 10px;
  background: #e9f7f7;
  color: #006d77;
  font-size: 10px;
  font-weight: 800;
  text-align: left;
  white-space: nowrap;
}
.citem-detail-table th:first-child { border-radius: 10px 0 0 10px; }
.citem-detail-table th:last-child { border-radius: 0 10px 10px 0; }
.citem-detail-table td {
  padding: 9px 10px 4px;
  color: #244858;
  font-size: 12px;
  font-weight: 600;
  vertical-align: middle;
}
.citem-detail-table .num { text-align: right; color: #12384a; font-size: 13px; font-weight: 800; }
.citem-detail-table .uom { color: #006d77; font-weight: 800; white-space: nowrap; }
.count-value-stack { display:flex; flex-direction:column; align-items:center; gap:12px; flex:0 0 auto; }
.cqty {
  width: 108px; height: 64px; box-sizing: border-box; padding: 10px; border: 1px solid rgba(0, 109, 119, .08); border-radius: 18px;
  font-size: 24px; font-weight: 800; text-align: center; color: var(--text-main);
  font-family: 'Fredoka', monospace; background: #fff;
  box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
}
.cqty.ok { color: var(--primary-blue); }

.oh-badge {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 108px; height: 64px; box-sizing: border-box; padding: 5px 10px; border-radius: 18px; background: #fff;
  border: 1px solid rgba(0, 109, 119, .08);
  box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
}
.oh-badge-label { font-size: 10px; font-weight: 800; color: var(--text-muted); }
.oh-badge-val { font-size: 22px; font-weight: 800; color: var(--text-main); font-family: 'Fredoka', monospace; }
.oh-badge-al { font-size: 10px; font-weight: 700; color: var(--accent-amber); }

.oh-chip {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 6px 14px; border-radius: 12px;
  background: var(--neu-surface); box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); 
  font-size: 13px; font-weight: 800; color: var(--text-muted);
}
.oh-chip input { width: 50px; border: none; background: transparent; box-shadow: none; padding: 0; font-size: 14px; font-weight: 800; color: var(--text-main); text-align: center; }

.cname-pill-wrap { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.cname-pill {
  display: inline-flex; align-items: center; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  background: var(--neu-surface); color: var(--text-muted); 
  box-shadow: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
  transition: all 0.2s;
}
.cname-pill:active { box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light); }
.cname-pill.sel { background: var(--primary-blue); color: #FFFFFF; box-shadow: 3px 3px 10px rgba(114, 213, 246, 0.4); }

.count-header-card { overflow: visible; z-index: 30; }
.counter-picker { position: relative; z-index: 20; margin-top: 10px; }
.counter-picker-trigger {
  width: 100%;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 16px;
  border: 1px solid rgba(0, 109, 119, .10);
  border-radius: 18px;
  background: #fff;
  color: #12384a;
  box-shadow: inset 3px 3px 8px rgba(83, 122, 137, .12), inset -3px -3px 8px rgba(255,255,255,.92);
  cursor: pointer;
  text-align: left;
}
.counter-picker-trigger-copy { min-width:0; display:flex; flex-direction:column; gap:2px; }

body.app-shell-mode {
  background:
    radial-gradient(circle at 14% 12%, rgba(255,255,255,.34), transparent 24%),
    linear-gradient(135deg, var(--brand-sidebar-start) 0%, var(--brand-page-bg) 100%) !important;
}

.sidebar {
  background: linear-gradient(180deg, var(--brand-sidebar-start) 0%, var(--brand-sidebar-end) 100%) !important;
}

.nav-item.active,
.nav-subitem.active {
  background: var(--brand-menu-active-bg) !important;
  color: var(--brand-menu-active-text) !important;
}

.nav-item.active .nav-icon,
.nav-subitem.active .nav-icon,
.nav-item.active span,
.nav-subitem.active span {
  color: var(--brand-menu-active-text) !important;
}

.topbar-title,
.section-title,
.row-title,
.scan-header,
.counter-picker-title,
.wms-note-menu-title,
.backup-panel-title,
.admin-master-group-title,
.summary-card h2,
.summary-zone-row-title,
.session-thermo-title,
.summary-metric-title,
.summary-greeting {
  color: var(--brand-heading) !important;
}

.card,
.panel,
.content-card,
.summary-card:not(.summary-accuracy-card),
.summary-metric-card:not(.tone-mint):not(.tone-lilac):not(.tone-sand):not(.tone-peach),
.settings-card,
.profile-card,
.table-shell,
.table-card,
.sheet-card,
.form-card,
.lcard {
  background-color: var(--brand-card-bg) !important;
  border-color: color-mix(in srgb, var(--brand-border) 34%, transparent) !important;
}

.summary-session-search,
input,
select,
textarea {
  border-color: color-mix(in srgb, var(--brand-border) 44%, transparent) !important;
}

.btn-blue,
.btn-primary,
.primary,
button.primary,
.action-btn.primary,
.primary-btn,
.apply-btn,
.save-btn {
  background: linear-gradient(135deg, var(--brand-sidebar-start) 0%, var(--brand-primary) 100%) !important;
  color: #FFFFFF !important;
}

.btn-red,
.btn-danger,
.danger,
.delete-btn {
  background: var(--brand-accent) !important;
}

.sidebar-logo-icon.has-custom-logo,
.login-brand-logo.has-custom-logo {
  padding: 8px !important;
  overflow: hidden;
}

.brand-logo-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: inherit;
}

.login-brand-logo {
  width: 92px;
  height: 92px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  border-radius: 50%;
  color: var(--brand-primary);
  background: var(--brand-card-bg);
  box-shadow: 10px 10px 20px var(--neu-shadow-dark), -10px -10px 20px var(--neu-shadow-light);
}

.login-brand-logo svg {
  width: 44px;
  height: 44px;
}

.admin-settings-shell {
  display: grid;
  gap: 18px;
}

.admin-settings-card {
  padding: 22px;
  border: 1px solid color-mix(in srgb, var(--brand-border) 34%, transparent);
  border-radius: 24px;
  background: var(--brand-card-bg);
  box-shadow: 0 14px 30px rgba(0,109,119,.08);
}

.admin-settings-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

.admin-settings-head h2 {
  color: var(--brand-heading) !important;
  font-size: 18px !important;
  font-weight: 700 !important;
}

.admin-settings-head p {
  margin-top: 5px;
  color: var(--v61-detail);
  font-size: 12px;
  font-weight: 500;
}

.theme-editor-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
}

.theme-color-field {
  display: grid;
  grid-template-columns: 46px minmax(0,1fr);
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 12px;
  border: 1px solid color-mix(in srgb, var(--brand-border) 28%, transparent);
  border-radius: 16px;
  background: color-mix(in srgb, var(--brand-card-bg) 88%, var(--brand-page-bg));
}

.theme-color-field label {
  grid-column: 1 / -1;
  color: var(--brand-heading) !important;
  font-size: 12px !important;
  font-weight: 700 !important;
}

.theme-color-picker {
  width: 46px !important;
  height: 42px;
  min-height: 42px;
  padding: 3px !important;
  border-radius: 12px !important;
  cursor: pointer;
}

.theme-hex-input {
  width: 100%;
  min-width: 0;
  height: 42px;
  text-transform: uppercase;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important;
  font-size: 14px !important;
  font-weight: 700;
}

.brand-preview {
  display: grid;
  grid-template-columns: minmax(190px,.7fr) minmax(260px,1.3fr);
  gap: 16px;
  min-height: 230px;
}

.brand-preview-sidebar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  border-radius: 24px;
  color: #FFFFFF;
  background: linear-gradient(180deg, var(--brand-sidebar-start), var(--brand-sidebar-end));
}

.brand-preview-menu {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  color: var(--brand-menu-active-text);
  background: var(--brand-menu-active-bg);
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

.brand-preview-content {
  padding: 18px;
  border-radius: 24px;
  background: var(--brand-page-bg);
}

.brand-preview-card {
  height: 100%;
  display: grid;
  place-items: center;
  padding: 20px;
  border: 2px solid var(--brand-border);
  border-radius: 20px;
  color: var(--brand-heading);
  background: var(--brand-card-bg);
  text-align: center;
  font-weight: 700;
}

.logo-admin-layout {
  display: grid;
  grid-template-columns: 150px minmax(0,1fr);
  gap: 20px;
  align-items: center;
}

.logo-admin-preview {
  width: 140px;
  height: 140px;
  display: grid;
  place-items: center;
  padding: 18px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--brand-border) 36%, transparent);
  border-radius: 28px;
  color: var(--brand-primary);
  background: var(--brand-card-bg);
}

.logo-admin-preview svg {
  width: 68px;
  height: 68px;
}

.admin-user-create-grid,
.admin-user-row-grid {
  display: grid;
  grid-template-columns: minmax(180px,1.1fr) minmax(190px,1.25fr) minmax(135px,.75fr) auto;
  gap: 10px;
  align-items: end;
}

.admin-user-create-grid {
  grid-template-columns: minmax(180px,1fr) minmax(190px,1.15fr) minmax(135px,.7fr) minmax(160px,.8fr) auto;
}

.admin-user-field {
  min-width: 0;
}

.admin-user-field label {
  display: block;
  margin-bottom: 6px;
}

.admin-user-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.admin-user-meta {
  margin-top: 8px;
  color: var(--v61-detail);
  font-size: 11px;
  font-weight: 500;
}

.admin-inline-password {
  display: none;
  grid-template-columns: minmax(180px,1fr) auto;
  gap: 8px;
  margin-top: 12px;
}

.admin-inline-password.open {
  display: grid;
}

.admin-save-bar {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

@media (max-width: 980px) {
  .theme-editor-grid,
  .admin-user-create-grid,
  .admin-user-row-grid {
    grid-template-columns: 1fr 1fr;
  }

  .admin-user-actions {
    grid-column: 1 / -1;
  }
}

@media (max-width: 640px) {
  .theme-editor-grid,
  .brand-preview,
  .logo-admin-layout,
  .admin-user-create-grid,
  .admin-user-row-grid {
    grid-template-columns: 1fr;
  }

  .logo-admin-preview {
    justify-self: center;
  }

  .admin-settings-card {
    padding: 16px;
  }
}

/* ══════════════════════════════════════════════════════════
   v63 — complete branding surface, live preview and user IDs
   Color-only overrides intentionally preserve the V61 card geometry.
   ══════════════════════════════════════════════════════════ */
:root {
  --brand-sidebar-text:#FFFFFF;
  --brand-sidebar-hover:#DCEFF1;
  --brand-app-frame:#FFFFFF;
  --brand-body-text:#16383C;
  --brand-muted-text:#638083;
  --brand-input-bg:#F5FAFB;
  --brand-input-text:#16383C;
  --brand-primary-text:#FFFFFF;
  --brand-secondary-bg:#E3F1F3;
  --brand-secondary-text:#006D77;
  --brand-success:#2A9D8F;
  --brand-warning:#E9C46A;
  --brand-danger:#E29578;
  --brand-kpi-mint:#83C5BE;
  --brand-kpi-sku:#3AA6A5;
  --brand-kpi-blush:#FFD9CF;
  --brand-kpi-coral:#E29578;
  --brand-chart-line:#007B83;
  --brand-chart-area:#D9EEF0;
  --brand-progress-start:#68D7D4;
  --brand-progress-end:#34BEE0;
  --brand-accuracy-start:#83C5BE;
  --brand-accuracy-end:#006D77;
  --brand-accuracy-layer-back:#A8D5C7;
  --brand-accuracy-layer-bottom:#E7AB8E;
  --brand-accuracy-ring-main:#E29578;
  --brand-accuracy-ring-diff:#FFD9CF;
}

body,
.main-wrapper,
.page-content,
.lbox { color:var(--brand-body-text) !important; }

.page-content h1,
.page-content h2,
.page-content h3,
.page-content h4,
.page-content .card-title,
.page-content .panel-title {
  color:var(--brand-heading) !important;
  font-weight:700 !important;
}

.app-shell,
.main-wrapper { background-color:var(--brand-app-frame) !important; }

.sidebar .nav-item:not(.active),
.sidebar .nav-subitem:not(.active),
.sidebar-title,
.sidebar-sub { color:var(--brand-sidebar-text) !important; }

.sidebar .nav-item:not(.active):hover,
.sidebar .nav-subitem:not(.active):hover {
  background:var(--brand-sidebar-hover) !important;
  color:var(--brand-secondary-text) !important;
}

p, small, .muted, .subtext, .helper-text, .admin-user-meta,
.summary-greeting-sub, .summary-card-kicker, .summary-metric-label,
.summary-zone-count, .summary-accuracy-label {
  color:var(--brand-muted-text) !important;
}

input, select, textarea {
  color:var(--brand-input-text) !important;
  background-color:var(--brand-input-bg) !important;
}

input::placeholder, textarea::placeholder {
  color:color-mix(in srgb,var(--brand-muted-text) 72%,transparent) !important;
}

.btn-blue, .btn-primary, .primary, button.primary, .action-btn.primary,
.primary-btn, .apply-btn, .save-btn {
  color:var(--brand-primary-text) !important;
  background:var(--brand-primary) !important;
}

.btn-ghost, .btn-secondary, .secondary-btn {
  color:var(--brand-secondary-text) !important;
  background:var(--brand-secondary-bg) !important;
}

.btn-green, .alert-green, .tag-green { --accent-green:var(--brand-success); }
.btn-green { color:#fff !important; background:var(--brand-success) !important; }
.btn-red, .btn-danger, .danger, .delete-btn { color:#fff !important; background:var(--brand-danger) !important; }
.alert-amber, .tag-amber { border-color:var(--brand-warning) !important; }

#dash-content .summary-metrics-grid-minimal .summary-metric-card.tone-mint,
.summary-metric-card.tone-mint { background:var(--brand-kpi-mint) !important; }
#dash-content .summary-metrics-grid-minimal .summary-metric-card.tone-lilac,
.summary-metric-card.tone-lilac { background:var(--brand-kpi-sku) !important; }
#dash-content .summary-metrics-grid-minimal .summary-metric-card.tone-sand,
.summary-metric-card.tone-sand { background:var(--brand-kpi-blush) !important; }
#dash-content .summary-metrics-grid-minimal .summary-metric-card.tone-peach,
.summary-metric-card.tone-peach { background:var(--brand-kpi-coral) !important; }
#dash-content .summary-zone-track span,
#dash-content .summary-wms-linear-progress span,
.summary-zone-track span,
.summary-progress-fill,
.summary-wms-linear-progress span,
.prog-fill,
.backup-progress span,
.session-thermo-fill { background:linear-gradient(90deg,var(--brand-progress-start),var(--brand-progress-end)) !important; }
#dash-content .summary-hour-line,
.summary-hourly-line, .summary-chart-line, .summary-hour-line { stroke:var(--brand-chart-line) !important; }
#dash-content .summary-hour-area,
.summary-hourly-area, .summary-chart-area, .summary-hour-area { fill:var(--brand-chart-area) !important; }
.session-thermo-gauge {
  background:conic-gradient(var(--brand-chart-line) 0 var(--session-angle),var(--brand-chart-area) var(--session-angle) 360deg) !important;
}
.session-thermo-row.active { color:var(--brand-primary-text) !important; background:var(--brand-primary) !important; }
.summary-accuracy-core { background:linear-gradient(180deg,var(--brand-accuracy-start),var(--brand-accuracy-end)) !important; }
.summary-accuracy-layer-back { background:var(--brand-accuracy-layer-back) !important; }
.summary-accuracy-layer-bottom { background:var(--brand-accuracy-layer-bottom) !important; }
.summary-accuracy-stack .summary-accuracy-ring {
  background:conic-gradient(var(--brand-accuracy-ring-main) 0 89.1%,var(--brand-accuracy-ring-diff) 89.1% 100%) !important;
}

.theme-settings-toolbar {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.theme-settings-group {
  overflow:hidden;
  border:1px solid color-mix(in srgb,var(--brand-border) 34%,transparent);
  border-radius:18px;
  background:color-mix(in srgb,var(--brand-card-bg) 92%,var(--brand-page-bg));
}

.theme-settings-group + .theme-settings-group { margin-top:10px; }
.theme-settings-group > summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  cursor:pointer;
  color:var(--brand-heading);
  font-size:14px;
  font-weight:700;
  list-style:none;
}
.theme-settings-group > summary::-webkit-details-marker { display:none; }
.theme-settings-group > summary::after { content:'＋'; font-size:17px; }
.theme-settings-group[open] > summary::after { content:'−'; }
.theme-settings-group .theme-editor-grid { padding:0 14px 14px; }

.system-name-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}

.brand-preview-v63 {
  overflow:hidden;
  border:2px solid var(--brand-border);
  border-radius:24px;
  background:var(--brand-app-frame);
  box-shadow:0 12px 28px rgba(0,0,0,.08);
}

.brand-preview-v63.hidden-preview { display:none; }
.brand-preview-shell {
  display:grid;
  grid-template-columns:112px minmax(560px,1fr);
  min-height:430px;
  overflow:auto;
  background:var(--brand-page-bg);
}
.brand-preview-side {
  padding:18px 10px;
  color:var(--brand-sidebar-text);
  background:linear-gradient(180deg,var(--brand-sidebar-start),var(--brand-sidebar-end));
}
.brand-preview-side .sidebar-logo-icon { margin:0 auto 12px; }
.brand-preview-side-title { text-align:center; font-size:13px; font-weight:700; }
.brand-preview-side-sub { text-align:center; margin-top:2px; font-size:8px; font-weight:600; opacity:.88; }
.brand-preview-side-menu {
  margin-top:20px;
  display:grid;
  gap:8px;
}
.brand-preview-side-menu span {
  display:block;
  padding:10px 8px;
  border-radius:11px;
  text-align:center;
  font-size:9px;
  font-weight:700;
}
.brand-preview-side-menu span:first-child {
  color:var(--brand-menu-active-text);
  background:var(--brand-menu-active-bg);
}
.brand-preview-side-menu span:last-child { color:var(--brand-sidebar-text); }

.brand-preview-main { padding:20px; }
.brand-preview-title { color:var(--brand-heading); font-size:18px; font-weight:700; }
.brand-preview-sub { margin-top:3px; color:var(--brand-muted-text); font-size:10px; font-weight:500; }
.brand-preview-kpis {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:16px 0;
}
.brand-preview-kpi {
  display:grid;
  place-items:center;
  min-height:70px;
  border-radius:16px;
  color:var(--brand-body-text);
  font-size:24px;
  font-weight:700;
}
.brand-preview-kpi:nth-child(1){background:var(--brand-kpi-mint)}
.brand-preview-kpi:nth-child(2){background:var(--brand-kpi-sku);color:#fff}
.brand-preview-kpi:nth-child(3){background:var(--brand-kpi-blush)}
.brand-preview-kpi:nth-child(4){background:var(--brand-kpi-coral);color:#fff}
.brand-preview-panels {
  display:grid;
  grid-template-columns:minmax(170px,.7fr) minmax(300px,1.3fr);
  gap:12px;
}
.brand-preview-accuracy,
.brand-preview-chart {
  padding:16px;
  border:1px solid color-mix(in srgb,var(--brand-border) 34%,transparent);
  border-radius:18px;
  background:var(--brand-card-bg);
}
.brand-preview-accuracy {
  color:#fff;
  background:linear-gradient(180deg,var(--brand-accuracy-start),var(--brand-accuracy-end));
}
.brand-preview-ring {
  width:90px;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  margin:14px auto;
  border-radius:50%;
  background:conic-gradient(var(--brand-accuracy-ring-main) 0 88%,var(--brand-accuracy-ring-diff) 88%);
}
.brand-preview-ring::after {
  content:'99.1%';
  width:62px;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--brand-accuracy-end);
  font-size:14px;
  font-weight:700;
}
.brand-preview-chart svg { width:100%; height:105px; }
.brand-preview-chart .area { fill:var(--brand-chart-area); }
.brand-preview-chart .line { fill:none; stroke:var(--brand-chart-line); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.brand-preview-progress {
  height:8px;
  margin-top:12px;
  overflow:hidden;
  border-radius:999px;
  background:color-mix(in srgb,var(--brand-border) 16%,var(--brand-card-bg));
}
.brand-preview-progress span {
  display:block;
  width:72%;
  height:100%;
  background:linear-gradient(90deg,var(--brand-progress-start),var(--brand-progress-end));
}
.brand-preview-actions { display:flex; gap:8px; margin-top:14px; }
.brand-preview-actions button { min-height:34px; padding:6px 13px; border:0; border-radius:10px; font-weight:700; }
.brand-preview-actions .main { color:var(--brand-primary-text); background:var(--brand-primary); }
.brand-preview-actions .minor { color:var(--brand-secondary-text); background:var(--brand-secondary-bg); }

.password-input-wrap { position:relative; }
.password-input-wrap input { width:100%; padding-right:46px !important; }
.password-eye-btn {
  position:absolute;
  top:50%;
  right:6px;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  padding:0;
  transform:translateY(-50%);
  border:0;
  border-radius:10px;
  color:var(--brand-secondary-text);
  background:transparent;
  cursor:pointer;
}
.password-eye-btn:hover { background:var(--brand-secondary-bg); }
.password-eye-btn svg { width:20px; height:20px; }

.admin-avatar-editor {
  display:grid;
  grid-template-columns:68px minmax(0,1fr);
  align-items:center;
  gap:10px;
}
.admin-avatar-preview,
.user-avatar.has-photo {
  overflow:hidden;
  padding:0 !important;
  background:var(--brand-secondary-bg) !important;
}
.admin-avatar-preview {
  width:64px;
  height:64px;
  display:grid;
  place-items:center;
  border:2px solid color-mix(in srgb,var(--brand-border) 44%,transparent);
  border-radius:50%;
  color:var(--brand-secondary-text);
  font-size:22px;
  font-weight:700;
}
.admin-avatar-preview img,
.user-avatar.has-photo img { width:100%; height:100%; object-fit:cover; }
.admin-avatar-controls { min-width:0; }
.admin-avatar-file { width:100%; font-size:11px !important; }
.admin-avatar-remove { margin-top:5px; }

.admin-user-create-grid {
  grid-template-columns:minmax(170px,1fr) minmax(145px,.8fr) minmax(125px,.7fr) minmax(170px,.9fr) minmax(210px,1.1fr) auto;
}
.admin-user-create-grid > .btn { min-width:145px; white-space:nowrap; }
.admin-user-row-grid {
  grid-template-columns:minmax(170px,1fr) minmax(145px,.8fr) minmax(125px,.7fr) minmax(210px,1.1fr) auto;
}

@media (max-width:1200px) {
  .admin-user-create-grid,
  .admin-user-row-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .admin-user-actions { grid-column:1/-1; }
}

@media (max-width:700px) {
  .system-name-grid,
  .admin-user-create-grid,
  .admin-user-row-grid { grid-template-columns:1fr; }
  .brand-preview-shell { grid-template-columns:92px minmax(500px,1fr); }
  .admin-user-actions { grid-column:auto; }
}

/* ══════════════════════════════════════════════════════════
   v64 — three-part theme editor and complete color coverage
   Geometry remains unchanged; these rules only control colors.
   ══════════════════════════════════════════════════════════ */
.theme-settings-area {
  overflow:hidden;
  border:2px solid color-mix(in srgb,var(--brand-border) 48%,transparent);
  border-radius:22px;
  background:var(--brand-card-bg);
}
.theme-settings-area + .theme-settings-area { margin-top:14px; }
.theme-settings-area > summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:18px 20px;

function fmtDMY(value) {
  if (!value) return '';
  const d = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function localDateKey(date) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '';
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function parseLocalDateKey(value) {
  const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return null;
  const date = new Date(+match[1], +match[2]-1, +match[3], 12, 0, 0, 0);
  return Number.isNaN(date.getTime()) ? null : date;
}

function addLocalDays(date, amount) {
  const next = new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount, 12);
  return next;
}

function dashboardDateRange() {
  const fromDate = parseLocalDateKey(selectedDateFrom);
  const toDate = parseLocalDateKey(selectedDateTo || selectedDateFrom);
  if (!fromDate || !toDate) return null;
  const start = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate(), 0, 0, 0, 0);
  const end = new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate(), 23, 59, 59, 999);
  return { from:selectedDateFrom, to:selectedDateTo || selectedDateFrom, start, end };
}

function filterRowsByDashboardDate(rows, dateField = 'counted_at') {
  const range = dashboardDateRange();
  if (!range) return rows || [];
  return (rows || []).filter(row => {
    const time = Date.parse(row?.[dateField] || '');
    return Number.isFinite(time) && time >= range.start.getTime() && time <= range.end.getTime();
  });
}

function shortDashboardDate(value) {
  const date = parseLocalDateKey(value);
  return date
    ? date.toLocaleDateString('th-TH-u-ca-gregory', { day:'numeric', month:'short', year:'numeric' })
    : '';
}

  if (!selectedDateFrom) return 'ทุกวันที่';

async function supabaseFetchWithTimeout(input, init = {}) {
  const requestController = new AbortController();
  const pageSignal = _activePageRequestController?.signal;
  const sourceSignal = init.signal || (typeof Request !== 'undefined' && input instanceof Request ? input.signal : null);
  let didTimeout = false;

  const forwardAbort = () => requestController.abort();
  if (pageSignal) {
    if (pageSignal.aborted) requestController.abort();
    else pageSignal.addEventListener('abort', forwardAbort, { once:true });
  }
  if (sourceSignal) {
    if (sourceSignal.aborted) requestController.abort();
    else sourceSignal.addEventListener('abort', forwardAbort, { once:true });
  }

  const timeoutId = setTimeout(() => {
    didTimeout = true;
    requestController.abort();
  }, SUPABASE_REQUEST_TIMEOUT_MS);

  try {
    return await fetch(input, { ...init, signal:requestController.signal });
  } catch (error) {
    if (didTimeout) {

      timeoutError.code = 'REQUEST_TIMEOUT';
      throw timeoutError;
    }
    throw error;

    clearTimeout(timeoutId);

    sourceSignal?.removeEventListener('abort', forwardAbort);
  }
}

function normalizeHexColor(value, fallback) {
  const color = String(value || '').trim().toUpperCase();
  return /^#[0-9A-F]{6}$/.test(color) ? color : fallback;
}

function normalizeLogoDataUrl(value) {
  const logo = String(value || '').trim();
  if (!logo) return '';
  return /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/i.test(logo) && logo.length <= 900000
    ? logo
    : '';
}

function normalizeBrandingSettings(input = {}) {
  const output = {};
  BRANDING_COLOR_FIELDS.forEach(({ key }) => {
    output[key] = normalizeHexColor(input?.[key], DEFAULT_BRANDING[key]);
  });
  output.systemName = String(input?.systemName || DEFAULT_BRANDING.systemName).trim().slice(0, 60) || DEFAULT_BRANDING.systemName;
  output.systemSubtitle = String(input?.systemSubtitle || DEFAULT_BRANDING.systemSubtitle).trim().slice(0, 100) || DEFAULT_BRANDING.systemSubtitle;
  output.printFormStyle = input?.printFormStyle === 'detailed' ? 'detailed' : 'compact';
  output.printPaperSize = ['A4','A3','Letter'].includes(input?.printPaperSize) ? input.printPaperSize : DEFAULT_BRANDING.printPaperSize;
  output.printOrientation = ['auto','portrait','landscape'].includes(input?.printOrientation) ? input.printOrientation : DEFAULT_BRANDING.printOrientation;
  output.printMarginMm = Math.max(3,Math.min(20,Number(input?.printMarginMm) || DEFAULT_BRANDING.printMarginMm));
  output.printCompactRows = Math.max(8,Math.min(60,Math.floor(Number(input?.printCompactRows) || DEFAULT_BRANDING.printCompactRows)));
  output.printAccentColor = normalizeHexColor(input?.printAccentColor, DEFAULT_BRANDING.printAccentColor);
  output.printFormTitle = String(input?.printFormTitle || '').trim().slice(0, 120);
  output.printLogoDataUrl = normalizeLogoDataUrl(input?.printLogoDataUrl);
  output.printShowLogo = input?.printShowLogo !== false;
  output.printShowDate = input?.printShowDate !== false;
  output.printShowPageNumber = input?.printShowPageNumber !== false;
  output.printShowSignatures = input?.printShowSignatures !== false;
  output.printAutoOpenDialog = input?.printAutoOpenDialog !== false;
  output.logoDataUrl = normalizeLogoDataUrl(input?.logoDataUrl);
  return output;
}

function readLocalBrandingSettings() {
  try {
    const current = localStorage.getItem(BRANDING_STORAGE_KEY);
    const legacy = LEGACY_BRANDING_STORAGE_KEYS
      .map(key => localStorage.getItem(key))
      .find(Boolean);
    return normalizeBrandingSettings(JSON.parse(current || legacy || '{}'));
  } catch (_) {
    return { ...DEFAULT_BRANDING };
  }
}

async function loadPublicBrandingSettings() {

function dashboardCalendarHtml(monthDate) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthTitle = monthDate.toLocaleDateString('th-TH-u-ca-gregory', { month:'short', year:'numeric' });
  const weekdays = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  const todayKey = localDateKey(new Date());
  const from = _datePickerDraftFrom;
  const to = _datePickerDraftTo || _datePickerDraftFrom;
  let cells = '';

  for (let index = 0; index < 42; index++) {
    const day = index - firstWeekday + 1;
    if (day < 1 || day > daysInMonth) {
      cells += '<span class="date-calendar-empty"></span>';
      continue;
    }
    const value = localDateKey(new Date(year, month, day, 12));
    const inRange = Boolean(from && to && value >= from && value <= to);
    const classes = [
      'date-calendar-day',
      value === todayKey ? 'is-today' : '',
      inRange ? 'in-range' : '',
      value === from ? 'range-start' : '',
      value === to ? 'range-end' : '',
    ].filter(Boolean).join(' ');
    cells += `<button class="${classes}" type="button" onclick="selectDashboardCalendarDay('${value}')">${day}</button>`;
  }

  return `<div class="date-calendar">
    <div class="date-calendar-title">${monthTitle}</div>
    <div class="date-calendar-weekdays">${weekdays.map(day => `<span>${day}</span>`).join('')}</div>
    <div class="date-calendar-grid">${cells}</div>
  </div>`;
}

function toggleDashboardDatePicker(event) {

  const willOpen = popover.hidden;
  document.querySelectorAll('.date-range-popover').forEach(item => { item.hidden = true; });
  if (!willOpen) return;
  _datePickerDraftFrom = selectedDateFrom;
  _datePickerDraftTo = selectedDateTo;
  const anchor = parseLocalDateKey(selectedDateFrom) || new Date();
  _datePickerCursor = new Date(anchor.getFullYear(), anchor.getMonth(), 1, 12);
  popover.hidden = false;
  event?.currentTarget?.setAttribute('aria-expanded', 'true');
  renderDashboardDatePicker();
}

function closeDashboardDatePicker() {

function selectDashboardCalendarDay(value) {
  if (!_datePickerDraftFrom || _datePickerDraftTo) {
    _datePickerDraftFrom = value;
    _datePickerDraftTo = '';
  } else if (value < _datePickerDraftFrom) {
    _datePickerDraftTo = _datePickerDraftFrom;
    _datePickerDraftFrom = value;
  } else {
    _datePickerDraftTo = value;
  }
  renderDashboardDatePicker();
}

function setDashboardDatePreset(preset) {
  const today = new Date();
  let from = '', to = '';
  if (preset === 'today') from = to = localDateKey(today);
  if (preset === 'yesterday') from = to = localDateKey(addLocalDays(today, -1));
  if (preset === 'month') {
    from = localDateKey(new Date(today.getFullYear(), today.getMonth(), 1, 12));
    to = localDateKey(new Date(today.getFullYear(), today.getMonth() + 1, 0, 12));
  }
  if (preset === 'last7') {
    from = localDateKey(addLocalDays(today, -6));
    to = localDateKey(today);
  }
  _datePickerDraftFrom = from;
  _datePickerDraftTo = to;
  if (from) _datePickerCursor = new Date(parseLocalDateKey(from).getFullYear(), parseLocalDateKey(from).getMonth(), 1, 12);
  applyDashboardDateRange();
}

      pageRequestScope?.abort();
      const error = new Error('หน้าใช้เวลาโหลดเกิน 22 วินาที กรุณาลองใหม่');
      error.code = 'PAGE_LOAD_TIMEOUT';
      reject(error);
    },PAGE_LOAD_TIMEOUT_MS);
  });
  try {
    return await Promise.race([Promise.resolve().then(loader),timeout]);
  } finally {
    clearTimeout(timeoutId);
  }
}

}

const EDGE_FUNCTION_TOKEN_SAFE_LENGTH = 16000;
let _protectedSessionRefresh = null;

function isInvalidAuthError(error) {
  const status = Number(error?.status || error?.statusCode || 0);
  const message = String(error?.message || error || '');
  return [400, 401, 403].includes(status)
    || /refresh token|jwt|session.*(?:expired|missing|invalid|not found)|invalid.*session/i.test(message);
}

async function clearLocalAuthSession() {
  try {
    const { error } = await sb?.auth?.signOut({ scope: 'local' }) || {};
    if (error) throw error;
  } catch (_) {
    try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (_) {}
  }
  me = null;
  prof = null;
}

async function requireNewLogin(message = 'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่') {
  await clearLocalAuthSession();
  if (typeof go === 'function') go('login');
  const error = new Error(message);
  error.code = 'AUTH_SESSION_INVALID';
  throw error;
}

async function refreshProtectedSession(refreshToken) {
  if (_protectedSessionRefresh) return _protectedSessionRefresh;
  const pending = sb.auth.refreshSession({ refresh_token: refreshToken });
  _protectedSessionRefresh = pending;
  try {
    return await pending;
  } finally {
    if (_protectedSessionRefresh === pending) _protectedSessionRefresh = null;
  }
}

async function protectedFunctionHeaders() {
  if (!sb) throw new Error('ระบบฐานข้อมูลยังไม่พร้อม กรุณารีเฟรชหน้าแล้วลองใหม่');

  let { data: sessionData, error: sessionError } = await sb.auth.getSession();
  let session = sessionData?.session;
  if (sessionError || !session?.access_token || !session?.refresh_token) {
    return requireNewLogin();
  }

  const expiresSoon = !session?.expires_at || (session.expires_at * 1000) <= (Date.now() + 60000);
  const authMetadataHasAvatar = Boolean(
    session?.user?.user_metadata
    && Object.prototype.hasOwnProperty.call(session.user.user_metadata, 'avatar_data_url')
  );
  const accessTokenTooLarge = String(session?.access_token || '').length > EDGE_FUNCTION_TOKEN_SAFE_LENGTH;

  // V65 temporarily stored the Base64 avatar in Auth user_metadata. Supabase
  // embeds that metadata in the JWT, which can make the Authorization header
  // too large and cause an HTTP 400 at the Edge gateway before CORS/Function
  // code runs. Force one refresh after the server-side metadata is compacted.
  if (!sessionError && session?.refresh_token && (expiresSoon || authMetadataHasAvatar || accessTokenTooLarge)) {
    const refreshed = await refreshProtectedSession(session.refresh_token);
    sessionError = refreshed.error;
    session = refreshed.data?.session;
  }

  if (sessionError || !session?.access_token) {
    if (isInvalidAuthError(sessionError)) return requireNewLogin();
    throw new Error('เชื่อมต่อระบบตรวจสอบ Session ไม่สำเร็จ กรุณาลองใหม่');
  }

  const verified = await sb.auth.getUser(session.access_token);
  if (verified.error || !verified.data?.user) {
    if (isInvalidAuthError(verified.error)) return requireNewLogin('Session ไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่');
    throw new Error('เชื่อมต่อระบบยืนยันตัวตนไม่สำเร็จ กรุณาลองใหม่');
  }

  me = verified.data.user;
  return {
    Authorization: `Bearer ${session.access_token}`,
    apikey: SUPA_KEY,
    'x-client-info': 'cycle-count-v95',
  };
}

async function invokeProtectedEdge(functionName, action, payload = {}) {
  const headers = await protectedFunctionHeaders();
  let response;
  try {
    response = await fetch(`${SUPA_URL}/functions/v1/${encodeURIComponent(functionName)}`, {
      method: 'POST',
      headers: {
        ...headers,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ action, ...payload }),
    });
  } catch (_) {
    throw new Error(`เชื่อมต่อ ${functionName} ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่`);
  }

  const raw = await response.text();
  let data = {};
  try {
    data = raw ? JSON.parse(raw) : {};
  } catch (_) {
    data = { error: raw };
  }

  if (!response.ok) {
    throw new Error(data?.error || data?.message || `${functionName} ตอบกลับ HTTP ${response.status}`);
  }
  if (!data?.ok) {
    throw new Error(data?.error || `${functionName} ทำรายการไม่สำเร็จ`);
  }
  return data;
}

async function boot() {
  try {
    if (new URLSearchParams(window.location.search).get('preview') === '1') {
      window.__CYCLE_COUNT_PREVIEW__ = true;
      prof = { role: 'admin', name: 'AuD' };
      S = { page: 'sv-dash', _dashTab: 'summary' };
      render();
      return;
    }
    if (typeof supabase === 'undefined') {
      Q('app').innerHTML = `<div class="lbox"><div class="lcard"><div class="alert alert-red">เชื่อมต่อกับระบบฐานข้อมูลไม่ได้จ้า (Supabase SDK missing)</div></div></div>`;
      return;
    }
    try {
      [AUTH_STORAGE_KEY,...LEGACY_AUTH_STORAGE_KEYS].forEach(key => localStorage.removeItem(key));
    } catch (_) {}
    sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
      auth: {
        storageKey: AUTH_STORAGE_KEY,
        // Keep authentication only in the current page. Reloading or opening
        // the system again must always return to the login screen.
        persistSession: false,
        autoRefreshToken: true,
        detectSessionInUrl: true,
      },
      db: {
        // v2.102+ retries network failures automatically. Disable that here
        // so a DNS failure does not keep every menu on the loading screen.
        retry: false,
      },
      global: {
        fetch: supabaseFetchWithTimeout,
      },
    });
    await loadPublicBrandingSettings();
    const { data: { session }, error: sessionError } = await sb.auth.getSession();
    if (sessionError) {
      await clearLocalAuthSession();
      go('login');
      return;
    }
    if (session?.user) {
      const verified = await sb.auth.getUser(session.access_token);
      if (verified.error || !verified.data?.user) {
        if (isInvalidAuthError(verified.error)) {
          await clearLocalAuthSession();
          go('login');
          return;
        }
        throw verified.error || new Error('ตรวจสอบ Session ไม่สำเร็จ');
      }
      me = verified.data.user;
      await loadProf();
      go(home());
    } else {
      go('login');
    }
    sb.auth.onAuthStateChange((e, session) => {
      if (e === 'SIGNED_OUT') { me = null; prof = null; go('login'); }
      if (e === 'PASSWORD_RECOVERY') { me = session?.user || me; go('reset-password'); }
    });
  } catch (err) {
    Q('app').innerHTML = `<div class="lbox"><div class="lcard"><div class="alert alert-red">ระบบมีปัญหาตอนเริ่มต้น: ${err.message || err}</div></div></div>`;
  }
}

async function loadProf() {
  try {
    const { data } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
    prof = data || {};
  } catch(e) {
    prof = {};
    console.error("Error loading profile:", e);
  }
}

function home() {
  const r = prof?.role;
  if (r === 'counter')    return 'c-tasks';
  if (r === 'supervisor') return 'sv-dash';

  return 'login';
}

function syncNavigationStateGlobals() {
  if (S._dashTab) _dashTab = S._dashTab;
  if (S._manageTab) _manageTab = S._manageTab;
}

function go(page, extra = {}, navOptions = {}) {
  const currentPage = S?.page || '';
  if (currentPage === 'ad-branding' && page !== 'ad-branding' && S._brandingSavedSnapshot) {
    applyBrandingSettings(S._brandingSavedSnapshot, false);
    delete S._brandingSavedSnapshot;
  }
  const nextExtra = { ...extra };
  if (page !== 'sv-dash') delete nextExtra._dashAnchor;

  if (navOptions.resetHistory || page === 'login') _navStack = [];

  const previousState = _navStack[_navStack.length - 1];
  const isReturningToStoredPage =
    NAV_DETAIL_PAGES.has(currentPage) &&
    previousState?.page === page &&
    currentPage !== page;

  if (isReturningToStoredPage) {
    _navStack.pop();
    S = { ...previousState, ...nextExtra, page };
  } else {
    const shouldRememberCurrent =
      !navOptions.replace &&
      currentPage &&
      currentPage !== page &&
      NAV_DETAIL_PAGES.has(page);
    if (shouldRememberCurrent) {
      _navStack.push({ ...S });
      if (_navStack.length > 20) _navStack.shift();
    }
    S = { page, ...nextExtra };
  }

  syncNavigationStateGlobals();
  try {
    render();
    window.scrollTo(0, 0);
  } catch (err) {
    console.error("Render Error:", err);
    alert(`เกิดข้อผิดพลาดในการแสดงหน้าจอ: ${err.message}`);
  }
}

function goPrimary(page) {
  go(page, {}, { replace:true, resetHistory:true });
}

function goBack() {
  const previousState = _navStack.pop();
  if (previousState?.page) {
    S = { ...previousState };
    syncNavigationStateGlobals();
    render();
    window.scrollTo(0, 0);
    return;
  }

  const currentPage = S?.page;
  if (currentPage === 'c-count') return go('c-tasks', {}, { replace:true });
  if (currentPage === 'c-found') return go('c-tasks', {}, { replace:true });
  if (currentPage === 'sv-detail') return go('sv-list', {}, { replace:true });
  if (currentPage === 'sv-found') return go('sv-list', {}, { replace:true });
  if (currentPage === 'sv-list') {
    return go('sv-dash', { _dashTab:'variance', _dashSid:S._dashSid }, { replace:true });
  }
  if (currentPage === 'ad-txlog') return go('ad-history', {}, { replace:true });
  if (currentPage === 'ad-new') {
    return go('ad-manage', { _manageTab:'sessions' }, { replace:true });
  }
  go(home(), {}, { replace:true });
}

const STABLE_UI_ICON_PATTERN = new RegExp(
  `(${Object.keys(STABLE_UI_ICON_TOKENS)
    .map(token => token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))
    .join('|')})\\uFE0F?`,
  'gu'
);

function replaceUnstableEmojiIcons(root) {
  if (!root) return;
  const blockedTags = new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION','SVG','TITLE']);
  const scanRoot = root.nodeType === Node.TEXT_NODE ? root.parentNode : root;
  if (!scanRoot || blockedTags.has(scanRoot.nodeName)) return;
  const walker = document.createTreeWalker(scanRoot,NodeFilter.SHOW_TEXT,{
    acceptNode(node) {
      if (!node.nodeValue || !STABLE_UI_ICON_PATTERN.test(node.nodeValue)) {
        STABLE_UI_ICON_PATTERN.lastIndex = 0;
        return NodeFilter.FILTER_REJECT;
      }
      STABLE_UI_ICON_PATTERN.lastIndex = 0;
      const parent = node.parentElement;
      if (!parent || blockedTags.has(parent.tagName) || parent.closest('[data-stable-icon]')) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);
  targets.forEach(node => {
    const source = node.nodeValue || '';
    const parts = source.split(STABLE_UI_ICON_PATTERN);
    if (parts.length < 2) return;
    const fragment = document.createDocumentFragment();
    parts.forEach(part => {
      const token = part.replace(/\uFE0F/g,'');
      const type = STABLE_UI_ICON_TOKENS[token];
      if (!type) {
        if (part) fragment.appendChild(document.createTextNode(part));
        return;
      }
      const icon = document.createElement('span');
      icon.className = 'ui-inline-icon';
      icon.dataset.stableIcon = type;
      icon.setAttribute('aria-hidden','true');
      icon.innerHTML = stableUiIconSvg(type);
      fragment.appendChild(icon);
    });
    node.replaceWith(fragment);
  });
}

let _stableIconObserver = null;
function startStableUiIconGuard() {
  if (_stableIconObserver || !document.body) return;
  replaceUnstableEmojiIcons(document.body);
  _stableIconObserver = new MutationObserver(mutations => {
    mutations.forEach(mutation => {
      if (mutation.type === 'characterData') {
        replaceUnstableEmojiIcons(mutation.target);
        return;
      }
      mutation.addedNodes.forEach(node => {
        if (node.nodeType === Node.TEXT_NODE || node.nodeType === Node.ELEMENT_NODE) {
          replaceUnstableEmojiIcons(node);
        }
      });
    });
  });
  _stableIconObserver.observe(document.body,{subtree:true,childList:true,characterData:true});
}

function metricValueClass(value) {
  const len = String(value ?? '').replace(/\s+/g, '').length;
  if (len >= 8) return 'metric-value xs';
  if (len >= 6) return 'metric-value sm';
  if (len >= 5) return 'metric-value md';
  return 'metric-value';
}

const LOCATION_SORT_STORAGE_KEY = 'cycle_count_location_sort_direction_v1';
let locationSortDirection = (() => {
  try { return localStorage.getItem(LOCATION_SORT_STORAGE_KEY) === 'desc' ? 'desc' : 'asc'; }
  catch (_) { return 'asc'; }
})();

function locationCodeOf(value) {
  if (typeof value === 'string' || typeof value === 'number') return String(value || '').trim();
  return String(value?.locations?.code ?? value?.location?.code ?? value?.locCode ?? value?.code ?? '').trim();
}

function compareLocationCodes(left, right, direction = locationSortDirection) {
  const factor = direction === 'desc' ? -1 : 1;
  const leftCode = locationCodeOf(left);
  const rightCode = locationCodeOf(right);
  const natural = leftCode.localeCompare(
    rightCode,
    'en',
    { numeric:true, sensitivity:'base' },
  );
  if (natural) return factor * natural;
  return factor * leftCode.localeCompare(rightCode, 'en', { sensitivity:'base' });
}

function sortRowsByLocation(rows, selector = locationCodeOf, direction = locationSortDirection) {
  return [...(rows || [])].sort((left, right) => {
    const byLocation = compareLocationCodes(selector(left), selector(right), direction);
    if (byLocation) return byLocation;
    return String(left?.id || left?.item_id || '').localeCompare(
      String(right?.id || right?.item_id || ''),
      'en',
      { numeric:true, sensitivity:'base' },
    );
  });
}

function locationSortControlHtml(compact = false) {
  const ascActive = locationSortDirection === 'asc';
  return `<div class="location-sort-control ${compact ? 'is-compact' : ''}" role="group" aria-label="เรียง Location ตามตัวอักษร">
    <span class="location-sort-label">เรียง Location</span>
    <span class="location-sort-buttons">
      <button type="button" class="location-sort-button ${ascActive?'is-active':''}" data-location-sort-direction="asc"
        onclick="setLocationSortDirection('asc')" aria-pressed="${ascActive}">A → Z</button>
      <button type="button" class="location-sort-button ${!ascActive?'is-active':''}" data-location-sort-direction="desc"
        onclick="setLocationSortDirection('desc')" aria-pressed="${!ascActive}">Z → A</button>
    </span>
  </div>`;
}

function sortLocationOptions(select) {
  if (!select) return;
  const selectedValue = select.value;
  const options = [...select.options];
  const fixed = options.filter(option => option.dataset.locationSortFixed === 'true' || !option.value);
  const sortable = options.filter(option => !fixed.includes(option));
  sortable.sort((left, right) => compareLocationCodes(
    left.dataset.locationCode || left.textContent,
    right.dataset.locationCode || right.textContent,
  ));
  select.replaceChildren(...fixed, ...sortable);
  select.value = selectedValue;
}

function sortLocationDomGroups(root = document) {
  root.querySelectorAll?.('[data-location-sort-group]').forEach(group => {
    const sortable = [...group.children].filter(child => child.hasAttribute('data-location-sort-code'));
    sortable.sort((left, right) => compareLocationCodes(
      left.getAttribute('data-location-sort-code'),
      right.getAttribute('data-location-sort-code'),
    ));
    sortable.forEach(child => group.appendChild(child));
  });
  root.querySelectorAll?.('select[data-location-sort-select]').forEach(sortLocationOptions);
}

function syncLocationSortControls(root = document) {
  root.querySelectorAll?.('[data-location-sort-direction]').forEach(button => {
    const active = button.dataset.locationSortDirection === locationSortDirection;
    button.classList.toggle('is-active', active);
    button.setAttribute('aria-pressed', String(active));
  });
}

function sortCachedDashboardViews() {
  if (!_dashboardViewCache?.views) return;
  Object.keys(_dashboardViewCache.views).forEach(key => {
    const template = document.createElement('template');
    template.innerHTML = _dashboardViewCache.views[key];
    sortLocationDomGroups(template.content);
    syncLocationSortControls(template.content);
    _dashboardViewCache.views[key] = template.innerHTML;
  });
}

function setLocationSortDirection(direction) {
  locationSortDirection = direction === 'desc' ? 'desc' : 'asc';
  try { localStorage.setItem(LOCATION_SORT_STORAGE_KEY, locationSortDirection); } catch (_) {}
  syncLocationSortControls();
  sortLocationDomGroups();
  sortCachedDashboardViews();
}

function actualCounterNamesFromRecords(records=[]) {
  return [...new Set(
    (records || []).flatMap(record => splitActualCounterNames(record?.actual_counter_name))
  )];
}

function actualCounterLabel(records=[]) {
  const names = actualCounterNamesFromRecords(records);
  return names.length ? names.join(', ') : 'ไม่ระบุคนนับ';
}

function buildActualCounterMap(records=[]) {
  const map = {};
  (records || []).forEach(record => {
    if (!record?.assignment_id) return;
    map[record.assignment_id] = map[record.assignment_id] || new Set();
    splitActualCounterNames(record.actual_counter_name)
      .forEach(name => map[record.assignment_id].add(name));
  });
  return Object.fromEntries(
    Object.entries(map).map(([assignmentId, names]) => [assignmentId, [...names]])
  );
}

function wmsDomKey(assignmentId, itemId) {
  return `${assignmentId}_${itemId}`.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function fillDependentSelect(id, values, allLabel='ทั้งหมด', preferredValue) {
  const select = Q(id);
  if (!select) return '';
  const current = preferredValue === undefined ? select.value : String(preferredValue || '');
  const cleanValues = [...new Set(
    [...values]
      .filter(value => value !== null && value !== undefined && String(value).trim() !== '')
      .map(value => String(value))
  )].sort((a, b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' }));

  select.replaceChildren();
  const allOption = document.createElement('option');
  allOption.value = '';
  allOption.textContent = allLabel;
  select.appendChild(allOption);
  cleanValues.forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });
  select.value = cleanValues.includes(current) ? current : '';
  return select.value;
}

function fillDependentOptionSelect(id, options, allLabel='ทั้งหมด', preferredValue) {
  const select = Q(id);
  if (!select) return '';
  const current = preferredValue === undefined ? select.value : String(preferredValue || '');
  const unique = [];
  const seen = new Set();
  (options || []).forEach(option => {
    const value = String(option?.value ?? '').trim();
    if (!value || seen.has(value)) return;
    seen.add(value);
    unique.push({ value,label:String(option?.label ?? value) });
  });
  unique.sort((a,b) => a.label.localeCompare(b.label,'th',{numeric:true,sensitivity:'base'}));
  select.replaceChildren();
  const allOption = document.createElement('option');
  allOption.value = '';
  allOption.textContent = allLabel;
  select.appendChild(allOption);
  unique.forEach(option => {
    const element = document.createElement('option');
    element.value = option.value;
    element.textContent = option.label;
    select.appendChild(element);
  });
  select.value = seen.has(current) ? current : '';
  return select.value;
}

function computeZone(locCode, desc) {
  if (!locCode) return '';
  const A = locCode.toString().trim().toUpperCase();
  const C = (desc || '').toString().trim().toUpperCase();
  const left  = (s,n) => s.substring(0,n);
  const right = (s,n) => s.substring(s.length-n);

  if (left(A,3)==='B-0' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='B-1' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='B-2' && right(A,1)==='A') return 'Selective A';
  if (left(A,3)==='-CW') return '';
  if (left(A,4)==='ECOM') return 'Overfloor';
  if (left(A,3)==='B-D') return 'Overfloor';
  if (left(A,3)==='B-N') return 'Overfloor';
  if (left(A,3)==='B-L') return 'Overfloor';
  if (left(A,3)==='B-O') return 'Overfloor';
  if (left(C,3)==='PKV') return 'Cool Room Floor';
  if (left(A,2)==='AM' || left(A,2)==='AL') return 'Overfloor';
  if (left(A,2)==='RM') return 'Raw Material';
  if (left(A,4)==='B-A-') return 'Overfloor';
  if (left(A,3)==='B-0') return 'Selective';
  if (left(A,3)==='B-1') return 'Selective';
  if (left(A,3)==='B-2') return 'Selective';
  if (left(A,3)==='PRE') return 'Pre-Transfer';
  if (left(A,2)==='C-') return 'Cool Room Floor';
  if (left(A,2)==='DM') return 'DAMAGE';
  if (left(A,2)==='IS') return 'ISSUE';
  if (left(A,3)==='B-E') return 'Longspand E';
  if (left(A,3)==='B-F') return 'Longspand F';
  if (left(A,3)==='B-C') return 'Cool Room';
  if (left(A,3)==='B-G') return 'Microrack';
  if (left(A,3)==='B-3') return 'Consumable Rack';
  if (left(A,6)==='BORROW') return 'BORROW';
  if (left(A,2)==='LO') return 'LOST';
  return 'Overfloor';
}

function computeItemStatus(oh, r1, r2, r3, rules) {
  const cfg = Object.assign({ maxRounds: 3, repeatMatchAction: 'recount' }, rules || {});
  const has = v => v !== null && v !== undefined && v !== '';
  const num = v => has(v) ? +v : v;
  oh = num(oh); r1 = num(r1); r2 = num(r2); r3 = num(r3);

  if (!has(r1)) return '';
  const rounds = [r1, r2, r3].filter(has).slice(0, cfg.maxRounds);
  if (has(oh) && rounds.some(r => r === oh)) return 'OK';

  let repeatFound = false;
  for (let i = 0; i < rounds.length && !repeatFound; i++) {
    for (let j = i + 1; j < rounds.length; j++) {
      if (rounds[i] === rounds[j]) { repeatFound = true; break; }
    }
  }
  if (repeatFound) {
    if (cfg.repeatMatchAction === 'auto_pass') return 'OK';
    if (cfg.repeatMatchAction === 'send_variance') return 'Diff';
  }
  if (rounds.length < cfg.maxRounds) return 'PENDING';
  return 'Diff';
}

function deriveAssignmentWorkflowStatus(snapshotRows, itemRounds, rules, storedStatus='pending') {
  const snapshots = snapshotRows || [];
  const roundsByItem = itemRounds || {};
  if (storedStatus === 'approved') {
    return {
      effectiveStatus:'approved',
      itemStatuses:[],
      hasDiff:false,
      hasPending:false,
      started:true,
      highestRound:3,
    };
  }
  if (!snapshots.length) {
    return {
      effectiveStatus:storedStatus || 'pending',
      itemStatuses:[],
      hasDiff:false,
      hasPending:false,
      started:false,
      highestRound:0,
    };
  }

  let highestRound = 0;
  let started = false;
  const itemStatuses = snapshots.map(snapshot => {
    const rounds = roundsByItem[snapshot.item_id] || {};
    [1,2,3].forEach(round => {
      if (rounds[round] !== undefined && rounds[round] !== null && rounds[round] !== '') {
        started = true;
        highestRound = Math.max(highestRound,round);
      }
    });
    return computeItemStatus(
      snapshot.onhand_qty,
      rounds[1],
      rounds[2],
      rounds[3],
      rules,
    );
  });
  const hasDiff = itemStatuses.some(status => status === 'Diff');
  const hasPending = itemStatuses.some(status => status === 'PENDING');
  const allOK = itemStatuses.length > 0 && itemStatuses.every(status => status === 'OK');

  let effectiveStatus = storedStatus || 'pending';
  if (hasDiff) effectiveStatus = 'round3_done';
  else if (allOK) effectiveStatus = 'completed';
  else if (started) effectiveStatus = highestRound >= 2 ? 'round2_done' : 'round1_done';

  return { effectiveStatus, itemStatuses, hasDiff, hasPending, started, highestRound };
}

}

function passwordRequirementText(role) {
  return role === 'admin'
    ? 'Admin: อย่างน้อย 12 ตัว มี A-Z, a-z, ตัวเลข และอักขระพิเศษ'
    : 'User/Supervisor: อย่างน้อย 10 ตัว มี A-Z, a-z และตัวเลข';
}

function validateManagedPassword(password, role) {
  const value = String(password || '');
  const minimum = role === 'admin' ? 12 : 10;
  if (value.length < minimum || value.length > 72) return passwordRequirementText(role);
  if (!/[a-z]/.test(value) || !/[A-Z]/.test(value) || !/[0-9]/.test(value)) {
    return passwordRequirementText(role);
  }
  if (role === 'admin' && !/[^A-Za-z0-9]/.test(value)) return passwordRequirementText(role);
  if (/^(password|password123|admin123|qwerty|12345678|123456789|welcome)$/i.test(value)) {
    return 'รหัสผ่านนี้เดาง่ายเกินไป กรุณาใช้รหัสผ่านอื่น';
  }
  return '';
}

async function doLogin() {
  const loginId = Q('le').value.trim().toLowerCase(), pwd = Q('lp').value;
  if (!loginId || !pwd) { Q('la').innerHTML = '<div class="alert alert-amber">กรอก User ID และรหัสผ่านให้ครบ</div>'; return; }
  if (!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(loginId)) {
    Q('la').innerHTML = '<div class="alert alert-red">รูปแบบ User ID ไม่ถูกต้อง</div>';
    return;
  }
  const btn = Q('lb');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  const { data, error } = await sb.functions.invoke('login-by-id', {
    body: { login_id: loginId, password: pwd },
  });
  if (error || !data?.ok || !data?.session?.access_token || !data?.session?.refresh_token) {
    Q('la').innerHTML = '<div class="alert alert-red">User ID หรือรหัสผ่านไม่ถูกต้อง</div>';
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  } else {
    const { error: sessionError } = await sb.auth.setSession({
      access_token: data.session.access_token,
      refresh_token: data.session.refresh_token,
    });
    if (sessionError) {
      Q('la').innerHTML = '<div class="alert alert-red">เปิด Session ไม่สำเร็จ กรุณาลองอีกครั้ง</div>';
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      return;
    }
    me = (await sb.auth.getUser()).data.user;
    await loadProf();
    go(home());
  }
}
