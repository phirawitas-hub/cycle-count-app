let _historyLoadRequestId = 0;

function setHistoryFilter(key,value) {
  if (key === 'session') {
    S._histSid = value;
    S._histCounterName = '';
    S._histSt = '';
  } else if (key === 'counter') {
    S._histCounterName = value;
    S._histSt = '';
  } else if (key === 'status') {
    S._histSt = value;
  }
  loadAdHistory();
}

async function loadAdHistory() {
  if (!['admin','supervisor'].includes(prof?.role)) { go('c-tasks'); return; }
  const requestId = ++_historyLoadRequestId;
  let sid = String(S._histSid || '');
  let counterName = String(S._histCounterName || '');
  let status = String(S._histSt || '');
  const searchQ = String(S._histSearch || '');

  cnt().innerHTML = `<div class="card"><div class="load" style="padding:30px;text-align:center">⏳ กำลังโหลดตัวกรองประวัติการนับ...</div></div>`;
  const [sessionResult,assignmentResult] = await Promise.all([
    fetchPagedSupabaseRows(
      'count_sessions',
      'id,name,created_at',
      query => query.order('created_at',{ascending:false}),
    ),
    fetchPagedSupabaseRows(
      'assignments',
      'id,status,created_at,location_id,session_id,locations(code,zone),count_sessions(name)',
      query => {
        let filtered = query.order('created_at',{ascending:false}).order('id');
        if (sid) filtered = filtered.eq('session_id',sid);
        return filtered;
      },
    ),
  ]);
  if (requestId !== _historyLoadRequestId) return;
  if (sessionResult.error || assignmentResult.error) {
    cnt().innerHTML = errBox((sessionResult.error || assignmentResult.error).message);
    return;
  }
  const sessions = sessionResult.data || [];
  if (sid && !sessions.some(session => session.id === sid)) {
    sid = '';
    S._histSid = '';
  }
  let scopedAssignments = assignmentResult.data || [];
  const countResult = await fetchSupabaseRowsByValues(
    'count_records',
    'assignment_id,actual_counter_name',
    'assignment_id',
    scopedAssignments.map(assignment => assignment.id),
  );
  if (requestId !== _historyLoadRequestId) return;
  if (countResult.error) {
    cnt().innerHTML = errBox(countResult.error.message);
    return;
  }
  const historyCounterMap = buildActualCounterMap(countResult.data || []);
  const availableCounters = [...new Set(
    Object.values(historyCounterMap).flat().filter(Boolean)
  )].sort((a,b) => a.localeCompare(b,'th',{numeric:true,sensitivity:'base'}));
  if (counterName && !availableCounters.includes(counterName)) {
    counterName = '';
    S._histCounterName = '';
  }
  const counterScopedAssignments = counterName
    ? scopedAssignments.filter(assignment =>
        (historyCounterMap[assignment.id] || []).includes(counterName)
      )
    : scopedAssignments;
  const statusOrder = ['pending','in_progress','round1_done','round2_done','round3_done','completed','approved'];
  const availableStatuses = new Set(counterScopedAssignments.map(assignment => assignment.status));
  if (status && !availableStatuses.has(status)) {
    status = '';
    S._histSt = '';
  }

  const sessionOptions = '<option value="">ทุก Session</option>' + sessions.map(session =>
    `<option value="${session.id}" ${session.id===sid?'selected':''}>${escapeWmsText(session.name)}</option>`
  ).join('');
  const counterOptions = '<option value="">คนนับทั้งหมด</option>' + availableCounters.map(name =>
    `<option value="${escapeWmsText(name)}" ${name===counterName?'selected':''}>${escapeWmsText(name)}</option>`
  ).join('');
  const statusOptions = '<option value="">ทั้งหมด</option>' + statusOrder
    .filter(value => availableStatuses.has(value))
    .map(value => {
      const info = tagInfo(value);
      return `<option value="${value}" ${value===status?'selected':''}>${escapeWmsText(info.lbl)}</option>`;
    }).join('');

  cnt().innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <div style="font-size:14px;font-weight:800;color:var(--text-main)">🔍 กรองประวัติการนับ</div>
        ${locationSortControlHtml(true)}
      </div>
      <div class="fg" style="margin-bottom:14px">
        <label style="font-size:12px">ค้นหา Location / Item / LPN</label>
        <div style="display:flex;gap:10px">
          <input id="hist-search" value="${escapeWmsText(searchQ)}" placeholder="เช่น B-EA-001-A, 2H002981..." onkeydown="if(event.key==='Enter'){S._histSearch=this.value;loadAdHistory();}">
          <button class="btn btn-blue btn-sm" onclick="S._histSearch=Q('hist-search').value;loadAdHistory()" style="flex-shrink:0; padding:10px 20px;">ค้นหา</button>
        </div>
      </div>
      <div class="grid-3" style="margin-bottom:10px">
        <div><label style="font-size:11px">SESSION</label><select id="hist-sess" onchange="setHistoryFilter('session',this.value)">${sessionOptions}</select></div>
        <div><label style="font-size:11px">คนนับจริง</label><select id="hist-cnt" onchange="setHistoryFilter('counter',this.value)">${counterOptions}</select></div>
        <div><label style="font-size:11px">สถานะ</label><select id="hist-st" onchange="setHistoryFilter('status',this.value)">${statusOptions}</select></div>
      </div>
    </div>
    <div id="hist-list"><div class="load" style="text-align:center; padding:20px; font-weight:600;">⏳ กำลังค้นหา...</div></div>`;

  let assignments = counterScopedAssignments.filter(assignment =>
    !status || assignment.status === status
  );
  const term = searchQ.trim();
  if (term && assignments.length) {
    const termLower = term.toLowerCase();
    const candidateLocationIds = [...new Set(assignments.map(assignment => assignment.location_id).filter(Boolean))];
    const assignmentIdsByScope = new Map();
    assignments.forEach(assignment => {
      const key = `${assignment.session_id}|${assignment.location_id}`;
      assignmentIdsByScope.set(key,[...(assignmentIdsByScope.get(key) || []),assignment.id]);
    });
    const matchedAssignmentIds = new Set(
      assignments
        .filter(assignment => (assignment.locations?.code || '').toLowerCase().includes(termLower))
        .map(assignment => assignment.id)
    );
    if (candidateLocationIds.length) {
      const [itemResult,snapshotSearchResult,lpnSearchResult] = await Promise.all([
        sb.from('items').select('id').ilike('code',`%${term}%`),
        fetchSupabaseRowsByValues(
          'stock_snapshot',
          'session_id,location_id,item_id',
          'location_id',
          candidateLocationIds,
        ),
        fetchSupabaseRowsByValues(
          'stock_snapshot_detail',
          'session_id,location_id,license_plate',
          'location_id',
          candidateLocationIds,
        ),
      ]);
      if (requestId !== _historyLoadRequestId) return;
      const searchError = itemResult.error || snapshotSearchResult.error || lpnSearchResult.error;
      if (searchError) {
        Q('hist-list').innerHTML = errBox(searchError.message);
        return;
      }
      const itemIds = new Set((itemResult.data || []).map(item => item.id));
      (snapshotSearchResult.data || []).forEach(snapshot => {
        if (!itemIds.has(snapshot.item_id)) return;
        (assignmentIdsByScope.get(`${snapshot.session_id}|${snapshot.location_id}`) || [])
          .forEach(id => matchedAssignmentIds.add(id));
      });
      (lpnSearchResult.data || []).forEach(detail => {
        if (!String(detail.license_plate || '').toLowerCase().includes(termLower)) return;
        (assignmentIdsByScope.get(`${detail.session_id}|${detail.location_id}`) || [])
          .forEach(id => matchedAssignmentIds.add(id));
      });
    }
    assignments = assignments.filter(assignment => matchedAssignmentIds.has(assignment.id));
  }

  const historyList = Q('hist-list');
  if (!historyList || requestId !== _historyLoadRequestId) return;
  assignments = sortRowsByLocation(assignments.slice(0,100),assignment => assignment.locations?.code);
  if (!assignments.length) {
    historyList.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--text-muted);font-weight:600">ไม่พบข้อมูลตามตัวกรองที่เลือก</div>`;
    return;
  }
  historyList.innerHTML = '<div class="card card-flush" data-location-sort-group>' + assignments.map(assignment => {
    const info = tagInfo(assignment.status);
    const countedBy = (historyCounterMap[assignment.id] || []).join(', ') || 'ไม่ระบุคนนับ';
    return `<div class="row click" data-location-sort-code="${escapeWmsText(assignment.locations?.code || '')}" onclick="go('ad-txlog',{aid:'${assignment.id}'})"><div class="row-body"><div class="row-title mono">${escapeWmsText(assignment.locations?.code || '?')}</div><div class="row-sub"><span style="color:var(--primary-blue);font-weight:700">${escapeWmsText(assignment.count_sessions?.name || '')}</span> · คนนับจริง: ${escapeWmsText(countedBy)}</div><div class="row-sub">${new Date(assignment.created_at).toLocaleString('th-TH')}</div></div><span class="tag ${info.cls}">${info.lbl}</span><span class="caret">›</span></div>`;
  }).join('') + '</div>';
}

async function loadAdTxLog() {
  const { aid } = S; if (!aid) { go('ad-history'); return; }
  const [{ data: asgn }, { data: recs }, { data: approvals, error: apprErr }] = await Promise.all([
    sb.from('assignments').select('id,status,location_id,session_id,locations(code,zone),count_sessions(name)').eq('id', aid).single(),
    sb.from('count_records').select('item_id,round,count_qty,counted_at,remark,photo_url,actual_counter_name,items(code,description)').eq('assignment_id', aid).order('counted_at'),
    sb.from('variance_approvals').select('item_id,final_qty,variance,resolution,approved_by,created_at,items(code,description),profiles!approved_by(name)').eq('assignment_id', aid).order('created_at'),
  ]);
  if (!asgn) { go('ad-history'); return; }

  const [{ data: snaps }, { data: auditRows, error: auditErr }, rules] = await Promise.all([
    sb.from('stock_snapshot').select('item_id,onhand_qty,al_qty').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id),
    sb.from('audit_log').select('action,old_value,new_value,item_id,created_at,items(code,description),profiles!performed_by(name)').eq('session_id', asgn.session_id).eq('location_id', asgn.location_id).order('created_at'),
    getSessionRules(asgn.session_id),
  ]);
  const ohMap = {}; (snaps||[]).forEach(s => { ohMap[s.item_id] = { oh: +s.onhand_qty, al: s.al_qty }; });

  const byItemRounds = {};
  (recs||[]).forEach(r => { byItemRounds[r.item_id] = byItemRounds[r.item_id] || {}; byItemRounds[r.item_id][r.round] = r.count_qty; });
  const mismatchItems = [];
  Object.entries(byItemRounds).forEach(([itemId, v]) => {
    const ohInfo = ohMap[itemId]; if (!ohInfo) return;
    const st = computeItemStatus(ohInfo.oh, v[1], v[2], v[3], rules);
    if (st === 'PENDING' || st === 'Diff') mismatchItems.push(itemId);
  });
  const showMismatchWarning = asgn.status === 'completed' && mismatchItems.length > 0;

  const events = [];
  (recs||[]).forEach(r => events.push({ type:'count', at: r.counted_at, data: r }));
  if (!apprErr) (approvals||[]).forEach(a => events.push({ type:'approval', at: a.created_at, data: a }));
  if (!auditErr) (auditRows||[]).forEach(a => events.push({ type:'audit', at: a.created_at, data: a }));
  events.sort((a,b) => new Date(a.at||0) - new Date(b.at||0));

  const si = tagInfo(asgn.status);
  const pageCounterLabel = actualCounterLabel(recs || []);
  const ACTION_META = { oh_edit: { icon:'✏️', label:'แก้ไขยอด OH' }, reassign: { icon:'🔄', label:'เปลี่ยน User ผู้รับงาน' } };
  let rows = '';
  for (const ev of events) {
    if (ev.type === 'count') {
      const r = ev.data; const ohInfo = ohMap[r.item_id];
      const itemLabel = isEmptyLocationItem(r.items?.code) ? 'Location ว่าง' : escapeWmsText(r.items?.code || '');
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap"><div class="row-body"><div class="row-title mono" style="font-size:14px">${itemLabel}</div><div class="row-sub">${escapeWmsText(r.items?.description||'')}</div><div class="row-sub">รอบ ${r.round} · คนนับจริง: ${escapeWmsText(r.actual_counter_name || 'ไม่ระบุคนนับ')}</div><div class="row-sub">${r.counted_at ? new Date(r.counted_at).toLocaleString('th-TH') : ''}</div>${r.remark ? `<div class="row-sub" style="color:var(--primary-blue); font-weight:600;">📝 ${escapeWmsText(r.remark)}</div>` : ''}${r.photo_url ? `<a href="${r.photo_url}" target="_blank" style="color:var(--accent-red)">📷 ดูรูป</a>` : ''}</div><div style="text-align:right;flex-shrink:0"><div style="font-size:32px;font-weight:800;font-family:'Fredoka';color:var(--text-main)">${r.count_qty}</div><span class="tag tag-blue" style="font-size:10px">R${r.round}</span>${ohInfo ? `<div class="oh-chip" style="margin-top:8px;font-size:12px;padding:4px 10px">OH: ${ohInfo.oh}${ohInfo.al!=null?` <span class="al-part">· AL ${ohInfo.al}</span>`:''}</div>` : ''}</div></div>`;
    } else if (ev.type === 'approval') {
      const a = ev.data; const isOk = a.resolution === 'ok';
      const itemLabel = isEmptyLocationItem(a.items?.code) ? 'Location ว่าง' : escapeWmsText(a.items?.code || '');
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap;background:${isOk?'rgba(74, 222, 128, 0.08)':'rgba(251, 113, 133, 0.08)'}"><div class="row-body"><div class="row-title mono" style="font-size:14px">${itemLabel}</div><div class="row-sub">${escapeWmsText(a.items?.description||'')}</div><div class="row-sub">${isOk?'✅':'❌'} คอนเฟิร์มยอดโดย User: <span style="font-weight:700;">${escapeWmsText(a.profiles?.name||'?')}</span></div><div class="row-sub">${a.created_at ? new Date(a.created_at).toLocaleString('th-TH') : ''}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:32px;font-weight:800;font-family:'Fredoka';color:var(--text-main)">${a.final_qty}</div><span class="tag ${isOk?'tag-green':'tag-red'}" style="font-size:10px">${a.variance>0?'+':''}${a.variance}</span></div></div>`;
    } else {
      const a = ev.data; const meta = ACTION_META[a.action] || { icon:'📝', label: a.action };
      rows += `<div class="row" style="cursor:default;flex-wrap:wrap;background:rgba(114, 213, 246, 0.1)"><div class="row-body"><div class="row-title mono" style="font-size:14px">${a.items?.code || meta.label}</div>${a.items?.code ? `<div class="row-sub" style="font-weight:700; color:var(--primary-blue);">${meta.icon} ${meta.label}</div>` : ''}<div class="row-sub">ดำเนินการโดย User: ${escapeWmsText(a.profiles?.name||'?')}</div><div class="row-sub">${a.created_at ? new Date(a.created_at).toLocaleString('th-TH') : ''}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:16px;font-weight:800;color:var(--text-main)">${a.old_value ?? '—'} → ${a.new_value ?? '—'}</div><span class="tag tag-blue" style="font-size:10px; margin-top:6px;">${meta.icon} ${meta.label}</span></div></div>`;
    }
  }

  cnt().innerHTML = `
    <div class="card">
      <div class="mono" style="font-size:22px;font-weight:800">${asgn.locations?.code}</div>
      <div style="font-size:14px;color:var(--text-muted);margin-top:6px; font-weight:600;"><span style="color:var(--primary-blue)">${asgn.count_sessions?.name||''}</span> · คนนับจริง: ${escapeWmsText(pageCounterLabel)}</div>
      <div style="margin-top:12px"><span class="tag ${si.cls}">${si.lbl}</span></div>
      ${showMismatchWarning ? `<div class="alert alert-red" style="margin-top:16px">⚠️ พบ ${mismatchItems.length} รายการที่ยอดนับไม่ตรงกับ OH ปัจจุบัน</div><button class="btn btn-red btn-sm" onclick="sendBackToVariance('${aid}')">📤 ส่งกลับไปตรวจสอบใน Variance</button>` : ''}
    </div>
    <div class="sec">Transaction Log (${events.length} รายการ)</div>
    <div class="card card-flush">${rows || '<div class="load" style="padding:40px;text-align:center; font-weight:600; color:var(--text-muted);">ยังไม่มีการนับ</div>'}</div>`;
}

  if (!confirm('ส่งงานนี้กลับไปให้ Supervisor ตรวจสอบใน Variance?')) return;
  const { error } = await sb.from('assignments').update({ status: 'round3_done' }).eq('id', aid);

async function createSess() {
  const name = Q('nn').value.trim(); if (!name) return;
  const { data:created,error } = await sb.from('count_sessions').insert({
    name,
    created_by:me.id,
    status:'draft',
    show_oh:false,
    max_rounds:3,
    repeat_match_action:'recount',
    count_mode:'cycle',
    annual_items_per_job:20,

async function updateSessionLifecycle(id,updates) {
  const { data,error } = await sb.from('count_sessions')
    .update(updates)
    .eq('id',id)
    .select('id,status');
  if (error) { alert(`อัปเดต Session ไม่สำเร็จ: ${error.message}`); return false; }
  if (!data?.length) { alert('อัปเดต Session ไม่สำเร็จ: ระบบไม่พบรายการที่แก้ไข'); return false; }
  invalidateDashboardCache();

}

async function activateSess(id) {

async function closeSess(id) {

async function reopenSess(id) {

let _deleteFilterScopeRequestId = 0;
let _deleteFilterLoadingSession = false;
const _deleteSessionLocationCache = new Map();

async function loadDeleteZoneFilters() {
  const [locationResult,sessionResult] = await Promise.all([
    fetchPagedSupabaseRows(
      'locations',
      'id,code,zone,row_no',
      query => query.order('id'),
    ),
    fetchPagedSupabaseRows(
      'count_sessions',
      'id,name,created_at',
      query => query.order('created_at',{ascending:false}),
    ),
  ]);
  const error = locationResult.error || sessionResult.error;
  if (error) {
    const preview = Q('del-preview');
    if (preview) preview.innerHTML = `<span style="color:var(--accent-red)">${escapeWmsText(error.message)}</span>`;
    return;
  }
  window._deleteFilterLocations = locationResult.data || [];
  window._deleteScopedLocations = window._deleteFilterLocations;
  _deleteSessionLocationCache.clear();
  const sEl = Q('del-session');
  if (sEl) {
    sEl.innerHTML = '<option value="">ทุก Session (ลบ Location ออกจากระบบจริง)</option>' +
      (sessionResult.data || []).map(session =>
        `<option value="${session.id}">${escapeWmsText(session.name)}</option>`
      ).join('');
  }
  await handleDeleteFilterChange('load');
}

async function getDeleteSessionLocations(sessionId) {
  if (!sessionId) return window._deleteFilterLocations || [];
  if (_deleteSessionLocationCache.has(sessionId)) {
    return _deleteSessionLocationCache.get(sessionId);
  }
  const [snapshotResult,assignmentResult] = await Promise.all([
    fetchPagedSupabaseRows(
      'stock_snapshot',
      'location_id,item_id',
      query => query.eq('session_id',sessionId).order('location_id').order('item_id'),
    ),
    fetchPagedSupabaseRows(
      'assignments',
      'location_id',
      query => query.eq('session_id',sessionId).order('location_id'),
    ),
  ]);
  if (snapshotResult.error || assignmentResult.error) {
    throw (snapshotResult.error || assignmentResult.error);
  }
  const locationIds = new Set([
    ...(snapshotResult.data || []).map(row => row.location_id),
    ...(assignmentResult.data || []).map(row => row.location_id),
  ].filter(Boolean));
  const scoped = (window._deleteFilterLocations || []).filter(location =>
    locationIds.has(location.id)
  );
  _deleteSessionLocationCache.set(sessionId,scoped);
  return scoped;
}

async function handleDeleteFilterChange(key) {
  if (key === 'session') {
    if (Q('del-zone')) Q('del-zone').value = '';
    if (Q('del-row')) Q('del-row').value = '';
    if (Q('del-code')) Q('del-code').value = '';
  } else if (key === 'zone') {
    if (Q('del-row')) Q('del-row').value = '';
    if (Q('del-code')) Q('del-code').value = '';
  } else if (key === 'row') {
    if (Q('del-code')) Q('del-code').value = '';
  }
  const requestId = ++_deleteFilterScopeRequestId;
  const sessionId = Q('del-session')?.value || '';
  const preview = Q('del-preview');
  const button = Q('del-btn');
  _deleteFilterLoadingSession = true;
  if (preview && sessionId) preview.innerHTML = '<span style="color:var(--text-muted)">⏳ กำลังโหลด Location ของ Session...</span>';
  if (button) button.disabled = true;
  try {
    const locations = await getDeleteSessionLocations(sessionId);
    if (requestId !== _deleteFilterScopeRequestId || (Q('del-session')?.value || '') !== sessionId) return;
    _deleteFilterLoadingSession = false;
    window._deleteScopedLocations = locations;
    refreshDeleteDependentFilters();
    refreshDeleteZonePreview();
  } catch (error) {
    if (requestId !== _deleteFilterScopeRequestId) return;
    _deleteFilterLoadingSession = false;
    if (preview) preview.innerHTML = `<span style="color:var(--accent-red)">${escapeWmsText(error.message || error)}</span>`;
  }
}

function refreshDeleteDependentFilters() {
  const locations = window._deleteScopedLocations || [];
  const zone = fillDependentSelect(
    'del-zone',
    locations.map(location => location.zone),
    'ทั้งหมด',
    Q('del-zone')?.value,
  );
  const zoneLocations = locations.filter(location => !zone || location.zone === zone);
  const row = fillDependentSelect(
    'del-row',
    zoneLocations.map(location => location.row_no),
    'ทั้งหมด',
    Q('del-row')?.value,
  );
  const rowLocations = zoneLocations.filter(location =>
    !row || String(location.row_no ?? '') === String(row)
  );
  const datalist = Q('del-location-options');
  if (datalist) {
    datalist.replaceChildren();
    const sessionId = Q('del-session')?.value || '';
    const sortedLocations = sortRowsByLocation(rowLocations,location => location.code);
    const suggestions = row || sessionId
      ? sortedLocations
      : (zone ? sortedLocations.slice(0,1000) : []);
    suggestions.forEach(location => {
      const option = document.createElement('option');
      option.value = location.code || '';
      datalist.appendChild(option);
    });
  }
}

function matchesDeleteLocationCode(locationCode, pattern) {
  const source = String(locationCode || '');
  const rawPattern = String(pattern || '').trim();
  if (!rawPattern) return true;
  const escaped = rawPattern
    .replace(/[.+^${}()|[\]\\]/g,'\\$&')
    .replace(/%/g,'.*')
    .replace(/_/g,'.');
  return new RegExp(`^${escaped}$`,'i').test(source);
}

function getDeleteMatchedLocations() {
  const zone = Q('del-zone')?.value || '';
  const row = Q('del-row')?.value || '';
  const code = Q('del-code')?.value.trim() || '';
  return (window._deleteScopedLocations || []).filter(location => {
    if (zone && location.zone !== zone) return false;
    if (row && String(location.row_no ?? '') !== String(row)) return false;
    if (!matchesDeleteLocationCode(location.code,code)) return false;
    return true;
  });
}

function buildDelLocQuery(zone, row, code, selectCols, selectOpts) {
  let q = sb.from('locations').select(selectCols, selectOpts);
  if (zone) q = q.eq('zone', zone); if (row) q = q.eq('row_no', row); if (code) q = q.ilike('code', code);
  return q;
}

async function refreshDeleteZonePreview() {
  refreshDeleteDependentFilters();
  const sid = Q('del-session')?.value || ''; const zone = Q('del-zone')?.value || ''; const row = Q('del-row')?.value || ''; const code = Q('del-code')?.value.trim() || '';
  const prev = Q('del-preview'), btn = Q('del-btn'); if (!prev || !btn) return;
  if (_deleteFilterLoadingSession) {
    prev.innerHTML = '<span style="color:var(--text-muted)">⏳ กำลังโหลด Location ของ Session...</span>';
    btn.disabled = true;
    return;
  }

const XLSX_IMPORT_COLUMN_RULES = Object.freeze({
  location:{
    label:'Location',
    exact:['LOCATION','LOCATIONCODE','LOCCODE','LOC','WAREHOUSELOCATION'],
    contains:['LOCATIONCODE','WAREHOUSELOCATION'],
  },
  item:{
    label:'Item',
    exact:['ITEM','ITEMCODE','ITEMNUMBER','SKU','ARTICLE','MATERIAL','MATERIALNUMBER','PRODUCTNUMBER'],
    contains:['ITEMCODE','ITEMNUMBER','MATERIALNUMBER','PRODUCTNUMBER'],
  },
  description:{
    label:'Description',
    exact:['ITEMDESC','ITEMDESCRIPTION','DESCRIPTION','PRODUCTNAME','ITEMNAME','NAME'],
    contains:['ITEMDESCRIPTION','DESCRIPTION','PRODUCTNAME'],
  },
  onhand:{
    label:'OH',
    exact:['OH','SUMOFOH','ONHAND','ONHANDQTY','ONHANDQUANTITY','QTY','QUANTITY','PHYSICALINVENTORY','AVAILABLEPHYSICAL','AVAILABLEQUANTITY','STOCKONHAND','STOCK'],
    contains:['SUMOFOH','ONHANDQTY','ONHANDQUANTITY','PHYSICALINVENTORY','AVAILABLEPHYSICAL','STOCKONHAND'],
  },
  allocated:{
    label:'AL',
    exact:['AL','SUMOFAL','ALQTY','ALLOCATED','ALLOCATEDQTY','ALLOCATEDQUANTITY'],
    contains:['SUMOFAL','ALLOCATEDQTY','ALLOCATEDQUANTITY'],
  },
  licensePlate:{
    label:'License Plate',
    exact:['LICENSEPLATE','LPN','LICENSEPLATENUMBER','LPNNO','PALLET','PALLETID','HANDLINGUNIT','HANDLINGUNITID'],
    contains:['LICENSEPLATE','HANDLINGUNIT'],
  },
  lot:{
    label:'Lot',
    exact:['LOT','LOTNUMBER','BATCH','BATCHNUMBER'],
    contains:['LOTNUMBER','BATCHNUMBER'],
  },
  status:{
    label:'Status',
    exact:['STATUS','INVSTATUS','INVENTORYSTATUS','INVENTORYSTATUSCODE'],
    contains:['INVENTORYSTATUS'],
  },
  uom:{
    label:'UOM',
    exact:['UOM','UNIT','UNITOFMEASURE','STOCKUNIT','INVENTORYUNIT'],
    contains:['UNITOFMEASURE','INVENTORYUNIT'],
  },
});

function normalizeImportHeader(value) {
  return String(value || '').trim().toUpperCase().replace(/[^A-Z0-9ก-๙]+/g,'');
}

function normalizeImportText(value) {
  return String(value ?? '').replace(/\u00a0/g,' ').trim();
}

function importCodeKey(value) {
  return normalizeImportText(value).toLocaleUpperCase('en-US');
}

function isEmptyLocationItem(value) {
  return normalizeImportText(value) === '';
}

function resolveImportColumn(headers, rule) {
  const normalizedHeaders = headers.map(header => ({ header, normalized:normalizeImportHeader(header) }));
  for (const term of rule.exact || []) {
    const normalizedTerm = normalizeImportHeader(term);
    const match = normalizedHeaders.find(entry => entry.normalized === normalizedTerm);
    if (match) return match.header;
  }
  for (const term of rule.contains || []) {
    const normalizedTerm = normalizeImportHeader(term);
    const match = normalizedHeaders.find(entry => normalizedTerm && entry.normalized.includes(normalizedTerm));
    if (match) return match.header;
  }
  return '';
}

function parseImportNumber(value) {
  const normalized = normalizeImportText(value).replace(/,/g,'');
  if (!normalized) return null;
  const negative = /^\(.+\)$/.test(normalized);
  const parsedValue = Number.parseFloat(normalized.replace(/[()]/g,''));
  return Number.isFinite(parsedValue) ? (negative ? -parsedValue : parsedValue) : null;
}

function importLocationFilterRegex(value) {
  const source = normalizeImportText(value);
  if (!source) return null;
  const escaped = source.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*');
  return new RegExp(`^${escaped}`,'i');
}

function analyzeXlsxImportRows(rows, locFilter='') {
  const headers = [...new Set((rows || []).flatMap(row => Object.keys(row || {})))];
  const columns = Object.fromEntries(
    Object.entries(XLSX_IMPORT_COLUMN_RULES).map(([key,rule]) => [key,resolveImportColumn(headers,rule)])
  );
  const missingRequired = ['location','item','onhand'].filter(key => !columns[key]);
  const errors = missingRequired.map(key => `ไม่พบคอลัมน์ ${XLSX_IMPORT_COLUMN_RULES[key].label}`);
  const parsed = [];
  const rejected = [];
  let ignoredByFilter = 0;
  const locationRegex = importLocationFilterRegex(locFilter);

  (rows || []).forEach((row,index) => {
    const value = key => columns[key] ? normalizeImportText(row?.[columns[key]]) : '';
    const locCode = value('location');
    if (locationRegex && locCode && !locationRegex.test(locCode)) {
      ignoredByFilter++;
      return;
    }
    const itemCode = value('item');
    const onhandRaw = value('onhand');
    const onhandValue = parseImportNumber(onhandRaw);
    const reasons = [];
    if (!locCode) reasons.push('Location ว่าง');
    if (onhandRaw && onhandValue === null) reasons.push(`OH ไม่ใช่ตัวเลข (${onhandRaw})`);
    if (reasons.length) {
      rejected.push({ rowNumber:index + 2, reasons, locCode, itemCode, onhandRaw });
      return;
    }
    const allocatedRaw = value('allocated');
    parsed.push({
      sourceRow:index + 2,
      locCode,
      itemCode,
      itemDesc:itemCode ? value('description') : '',
      isEmptyLocation:isEmptyLocationItem(itemCode),
      onhand:onhandValue ?? 0,
      alQty:parseImportNumber(allocatedRaw),
      lpn:value('licensePlate'),
      lot:value('lot'),
      invStatus:value('status'),
      uom:value('uom'),
    });
  });

  const metrics = {
    rows:parsed.length,
    items:new Set(parsed.map(row => importCodeKey(row.itemCode)).filter(Boolean)).size,
    locations:new Set(parsed.map(row => importCodeKey(row.locCode))).size,
    licensePlates:columns.licensePlate
      ? new Set(parsed.map(row => importCodeKey(row.lpn)).filter(Boolean)).size
      : 0,
    sumOH:parsed.reduce((sum,row) => sum + (Number(row.onhand) || 0),0),
    emptyLocations:new Set(
      parsed.filter(row => row.isEmptyLocation).map(row => importCodeKey(row.locCode))
    ).size,
    emptyLocationRows:parsed.filter(row => row.isEmptyLocation).length,
  };
  return { headers, columns, errors, parsed, rejected, ignoredByFilter, metrics };
}

function renderXlsxImportPreview(analysis) {
  const mappedColumns = Object.entries(analysis.columns)
    .filter(([,column]) => column)
    .map(([key,column]) => `${XLSX_IMPORT_COLUMN_RULES[key].label}: ${column}`)
    .join(' · ');
  const metric = (value,maximumFractionDigits=0) =>
    Number(value || 0).toLocaleString('th-TH',{ maximumFractionDigits });
  const rejectionRows = analysis.rejected.slice(0,6).map(row =>
    `แถว ${row.rowNumber}: ${row.reasons.join(', ')}`
  );
  const hasBlockingProblem = analysis.errors.length || analysis.rejected.length;
  return `
    <div class="alert ${hasBlockingProblem ? 'alert-red' : 'alert-green'}" style="font-size:13px;line-height:1.6">
      <strong>${hasBlockingProblem ? '❌ ไฟล์ยังไม่พร้อม Import' : '✅ ตรวจข้อมูลก่อน Import ผ่าน'}</strong>
      ${_xlsxWorksheetName ? `<br>ชีตที่อ่าน: <strong>${escapeWmsText(_xlsxWorksheetName)}</strong>` : ''}
      <br>แถวพร้อม Import ${metric(analysis.metrics.rows)} จาก ${metric(_xlsxRawRows?.length || 0)} แถว
      ${analysis.ignoredByFilter ? ` · ไม่อยู่ใน Filter ${metric(analysis.ignoredByFilter)} แถว` : ''}
    </div>
    <div class="backup-count-grid" style="margin:12px 0">
      <div class="backup-count-chip"><strong>${metric(analysis.metrics.items)}</strong><span>Distinct Item</span></div>
      <div class="backup-count-chip"><strong>${metric(analysis.metrics.locations)}</strong><span>Distinct Location</span></div>
      <div class="backup-count-chip"><strong>${metric(analysis.metrics.licensePlates)}</strong><span>Distinct License Plate</span></div>
      <div class="backup-count-chip"><strong>${metric(analysis.metrics.sumOH,2)}</strong><span>SUM OH</span></div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);line-height:1.55;overflow-wrap:anywhere">
      หัวคอลัมน์ที่จับคู่: ${escapeWmsText(mappedColumns || 'ไม่พบ')}
      <br>ช่อง Description / UOM ที่ว่าง จะ Match จาก Item Master ตอน Import
    </div>
    ${analysis.errors.length ? `<div class="alert alert-red" style="font-size:12px;margin-top:10px">${analysis.errors.map(escapeWmsText).join('<br>')}</div>` : ''}
    ${analysis.metrics.emptyLocationRows ? `<div class="alert alert-blue" style="font-size:12px;margin-top:10px;line-height:1.6">
      พบ Location ว่าง ${metric(analysis.metrics.emptyLocations)} Location
      (${metric(analysis.metrics.emptyLocationRows)} แถว) — ระบบจะนำเข้าและสร้างงานนับตามปกติ
      โดยคง Item และ Description เป็นค่าว่าง
    </div>` : ''}
    ${analysis.rejected.length ? `<div class="alert alert-red" style="font-size:12px;margin-top:10px">
      พบแถวผิดปกติ ${metric(analysis.rejected.length)} แถว ระบบหยุดไว้เพื่อไม่ให้ยอดหาย<br>
      ${rejectionRows.map(escapeWmsText).join('<br>')}
      ${analysis.rejected.length > rejectionRows.length ? '<br>… และแถวอื่นอีก' : ''}
    </div>` : ''}`;
}

function readXlsxFile(e) {
  const file = e.target.files[0];
  const btn = Q('ibtn');
  const prev = Q('ipreview');
  _xlsxRawRows = null;
  _xlsxParsed = null;
  _xlsxImportAnalysis = null;
  _xlsxWorksheetName = '';
  if (btn) btn.disabled = true;
  if (!file) {
    if (prev) prev.style.display = 'none';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type:'array', cellDates:false });
      const filterValue = Q('ilocfilter')?.value || '';
      const candidates = workbook.SheetNames.map((sheetName,index) => {
        const worksheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, {
          defval:'',
          raw:false,
          blankrows:false,
        });
        const analysis = analyzeXlsxImportRows(rows,filterValue);
        const score = (analysis.errors.length ? -1000000 : 0) + analysis.parsed.length;
        return { sheetName, rows, analysis, score, index };
      }).sort((a,b) => b.score - a.score || a.index - b.index);
      const selected = candidates[0];
      if (!selected?.rows?.length) throw new Error('ไม่พบข้อมูลในไฟล์ Excel');
      _xlsxWorksheetName = selected.sheetName;
      _xlsxRawRows = selected.rows;
      _xlsxImportAnalysis = selected.analysis;
      refreshXlsxPreview();
    } catch (error) {
      if (prev) {
        prev.style.display = 'block';
        prev.innerHTML = errBox(error.message || 'อ่านไฟล์ Excel ไม่สำเร็จ');
      }
    }
  };
  reader.onerror = function() {
    if (prev) {
      prev.style.display = 'block';
      prev.innerHTML = errBox('อ่านไฟล์ Excel ไม่สำเร็จ');
    }
  };
  reader.readAsArrayBuffer(file);
}

function refreshXlsxPreview() {
  const btn = Q('ibtn');
  const prev = Q('ipreview');
  if (!_xlsxRawRows || !_xlsxRawRows.length) {
    if (prev) prev.style.display = 'none';
    if (btn) btn.disabled = true;
    return;
  }
  const analysis = analyzeXlsxImportRows(_xlsxRawRows,Q('ilocfilter')?.value || '');
  _xlsxImportAnalysis = analysis;
  _xlsxParsed = analysis.parsed;
  if (prev) {
    prev.style.display = 'block';
    prev.innerHTML = renderXlsxImportPreview(analysis);
  }
  if (btn) {
    btn.disabled = !analysis.parsed.length || Boolean(analysis.errors.length) || Boolean(analysis.rejected.length);
  }
}

async function fetchImportedScopeRows(table,columns,sessionId,locationIds) {
  const output = [];
  const cleanLocationIds = [...new Set((locationIds || []).filter(Boolean))];
  for (let locationStart = 0; locationStart < cleanLocationIds.length; locationStart += 50) {
    const locationBatch = cleanLocationIds.slice(locationStart,locationStart + 50);
    for (let from = 0; ; from += 1000) {
      const { data,error } = await sb.from(table)
        .select(columns.join(','))
        .eq('session_id',sessionId)
        .in('location_id',locationBatch)
        .range(from,from + 999);
      if (error) throw error;
      output.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
  }
  return output;
}

async function doImportXlsx() {
  const sid = Q('is')?.value;
  const al = Q('ia');
  const btn = Q('ibtn');
  const analysis = _xlsxImportAnalysis;
  if (!sid) { alert('กรุณาเลือก Session ก่อน'); return; }
  if (!analysis?.parsed?.length) { alert('ไม่มีข้อมูลที่พร้อม Import'); return; }
  if (analysis.errors.length || analysis.rejected.length) {
    alert('ไฟล์ยังไม่ผ่านการตรวจ กรุณาแก้แถวหรือหัวคอลัมน์ที่แจ้งก่อน Import');
    return;
  }
  btn.disabled = true;
  al.innerHTML = `<div class="alert alert-blue">⏳ กำลังประมวลผล ${analysis.parsed.length.toLocaleString()} แถว...</div>`;
  try {
    const parsedRows = analysis.parsed;
    const itemCodesForInfo = [...new Set(parsedRows.map(row => importCodeKey(row.itemCode)).filter(Boolean))];
    const infoResult = await fetchSupabaseRowsByValues(
      'data_info_items',
      'item_code,description,uom',
      'item_code',
      itemCodesForInfo,
    );
    if (infoResult.error) throw infoResult.error;
    const infoByItem = new Map(
      (infoResult.data || []).map(row => [importCodeKey(row.item_code),row])
    );
    parsedRows.forEach(row => {
      const info = infoByItem.get(importCodeKey(row.itemCode));
      if (!info) return;
      if (!row.itemDesc) row.itemDesc = info.description || '';
      if (!row.uom) row.uom = info.uom || '';
    });

    const uniqueLocsMap = new Map();
    const uniqueItemsMap = new Map();
    parsedRows.forEach(row => {
      const locKey = importCodeKey(row.locCode);
      const itemKey = importCodeKey(row.itemCode);
      if (!uniqueLocsMap.has(locKey)) {
        uniqueLocsMap.set(locKey,{ code:row.locCode, zone:computeZone(row.locCode,row.itemDesc) });
      }
      if (!uniqueItemsMap.has(itemKey)) {
        uniqueItemsMap.set(itemKey,{ code:row.itemCode, description:row.itemDesc, uom:row.uom || null });
      } else {
        const master = uniqueItemsMap.get(itemKey);
        if (!master.description && row.itemDesc) master.description = row.itemDesc;
        if (!master.uom && row.uom) master.uom = row.uom;
      }
    });

    const { data:dbLocs,error:eLoc } = await sb.from('locations')
      .upsert(Array.from(uniqueLocsMap.values()),{ onConflict:'code' })
      .select('id,code');
    if (eLoc) throw eLoc;
    const locIdMap = new Map((dbLocs || []).map(row => [importCodeKey(row.code),row.id]));
    if (locIdMap.size !== uniqueLocsMap.size) {
      throw new Error(`Location บันทึกไม่ครบ: ต้องได้ ${uniqueLocsMap.size} แต่ได้ ${locIdMap.size}`);
    }

    const { data:dbItems,error:eItem } = await sb.from('items')
      .upsert(Array.from(uniqueItemsMap.values()),{ onConflict:'code' })
      .select('id,code');
    if (eItem) throw eItem;
    const itemIdMap = new Map((dbItems || []).map(row => [importCodeKey(row.code),row.id]));
    if (itemIdMap.size !== uniqueItemsMap.size) {
      throw new Error(`Item บันทึกไม่ครบ: ต้องได้ ${uniqueItemsMap.size} แต่ได้ ${itemIdMap.size}`);
    }

    const snapMap = new Map();
    const detailsList = [];
    parsedRows.forEach(row => {
      const locId = locIdMap.get(importCodeKey(row.locCode));
      const itemId = itemIdMap.get(importCodeKey(row.itemCode));
      if (!locId || !itemId) throw new Error(`จับคู่ ID ไม่สำเร็จที่แถว ${row.sourceRow}`);
      const key = `${locId}|${itemId}`;
      if (!snapMap.has(key)) {
        snapMap.set(key,{
          session_id:sid,
          location_id:locId,
          item_id:itemId,
          onhand_qty:0,
          al_qty:row.alQty,
        });
      }
      snapMap.get(key).onhand_qty += Number(row.onhand) || 0;
      if (!row.isEmptyLocation && (row.lpn || row.lot || row.invStatus || row.uom)) {
        detailsList.push({
          session_id:sid,
          location_id:locId,
          item_id:itemId,
          license_plate:row.lpn || null,
          lot:row.lot || null,
          inventory_status:row.invStatus || null,
          qty:Number(row.onhand) || 0,
          uom:row.uom || null,
        });
      }
    });

    const snapList = Array.from(snapMap.values());
    const importedLocationIds = [...new Set(snapList.map(row => row.location_id).filter(Boolean))];
    const BATCH = 200;
    al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึก Stock Snapshot (${snapList.length.toLocaleString()} รายการ)...</div>`;
    for (let start = 0; start < snapList.length; start += BATCH) {
      const { error } = await sb.from('stock_snapshot')
        .upsert(snapList.slice(start,start + BATCH),{ onConflict:'session_id,location_id,item_id' });
      if (error) throw error;
    }

    for (let start = 0; start < importedLocationIds.length; start += BATCH) {
      const { error } = await sb.from('stock_snapshot_detail')
        .delete()
        .eq('session_id',sid)
        .in('location_id',importedLocationIds.slice(start,start + BATCH));
      if (error) throw error;
    }
    if (detailsList.length) {
      al.innerHTML = `<div class="alert alert-blue">⏳ กำลังบันทึกรายละเอียด (${detailsList.length.toLocaleString()} แถว)...</div>`;
      for (let start = 0; start < detailsList.length; start += BATCH) {
        const { error } = await sb.from('stock_snapshot_detail').insert(detailsList.slice(start,start + BATCH));
        if (error) throw error;
      }
    }

    al.innerHTML = `<div class="alert alert-blue">⏳ กำลังตรวจยอดหลัง Import...</div>`;
    let [savedSnapshots,savedDetails] = await Promise.all([
      fetchImportedScopeRows('stock_snapshot',['id','location_id','item_id','onhand_qty'],sid,importedLocationIds),
      fetchImportedScopeRows('stock_snapshot_detail',['id','location_id','item_id','license_plate','qty'],sid,importedLocationIds),
    ]);
    const expectedPairKeys = new Set(snapList.map(row => `${row.location_id}|${row.item_id}`));
    const staleSnapshotIds = savedSnapshots
      .filter(row => !expectedPairKeys.has(`${row.location_id}|${row.item_id}`))
      .map(row => row.id)
      .filter(Boolean);
    for (let start = 0; start < staleSnapshotIds.length; start += BATCH) {
      const { error } = await sb.from('stock_snapshot')
        .delete()
        .eq('session_id',sid)
        .in('id',staleSnapshotIds.slice(start,start + BATCH));
      if (error) throw error;
    }
    if (staleSnapshotIds.length) {
      savedSnapshots = savedSnapshots.filter(row => expectedPairKeys.has(`${row.location_id}|${row.item_id}`));
    }
    if (savedSnapshots.length !== snapList.length) {
      throw new Error(`ตรวจยอดหลัง Import ไม่ผ่าน: Stock Snapshot ต้องได้ ${snapList.length} รายการ แต่พบ ${savedSnapshots.length}`);
    }
    const savedSnapshotMap = new Map(savedSnapshots.map(row => [`${row.location_id}|${row.item_id}`,row]));
    const snapshotMismatch = snapList.find(expected => {
      const actual = savedSnapshotMap.get(`${expected.location_id}|${expected.item_id}`);
      return !actual || Math.abs((Number(actual.onhand_qty) || 0) - expected.onhand_qty) > 0.000001;
    });
    if (snapshotMismatch) throw new Error('ตรวจยอดหลัง Import ไม่ผ่าน: Stock Snapshot หรือ OH ไม่ตรงกับไฟล์');
    if (savedDetails.length !== detailsList.length) {
      throw new Error(`ตรวจยอดหลัง Import ไม่ผ่าน: รายละเอียดต้องได้ ${detailsList.length} แถว แต่พบ ${savedDetails.length}`);
    }
    const expectedDistinctLP = new Set(detailsList.map(row => importCodeKey(row.license_plate))).size;
    const actualDistinctLP = new Set(savedDetails.map(row => importCodeKey(row.license_plate))).size;
    if (actualDistinctLP !== expectedDistinctLP) {
      throw new Error(`ตรวจยอดหลัง Import ไม่ผ่าน: License Plate ต้องได้ ${expectedDistinctLP} แต่พบ ${actualDistinctLP}`);
    }

    const metrics = analysis.metrics;
    al.innerHTML = `<div class="alert alert-green" style="line-height:1.65">
      ✅ Import และตรวจยอดสำเร็จ<br>
      Item ${metrics.items.toLocaleString()} · Location ${metrics.locations.toLocaleString()} ·
      License Plate ${metrics.licensePlates.toLocaleString()} · SUM OH ${Number(metrics.sumOH).toLocaleString('th-TH',{ maximumFractionDigits:2 })}
      ${metrics.emptyLocations ? `<br>Location ว่างที่สร้างงานนับได้ ${metrics.emptyLocations.toLocaleString()} Location` : ''}
    </div>`;
    _xlsxRawRows = null;
    _xlsxParsed = null;
    _xlsxImportAnalysis = null;
    _xlsxWorksheetName = '';
    if (Q('ixlsx')) Q('ixlsx').value = '';
    if (Q('ipreview')) Q('ipreview').style.display = 'none';
  } catch (err) {
    al.innerHTML = errBox(err.message || 'เกิดข้อผิดพลาดระหว่าง Import');
  } finally {
    btn.disabled = !_xlsxImportAnalysis?.parsed?.length
      || Boolean(_xlsxImportAnalysis?.errors?.length)
      || Boolean(_xlsxImportAnalysis?.rejected?.length);
  }
}

async function refreshBackupScopeSummary() {
  const sessionIds = backupSelectedSessionIds();
  const scopeKey = backupSessionScopeKey(sessionIds);
  const requestSerial = ++_backupScopeRequestSerial;
  const container = Q('backup-scope-summary');
  const button = Q('backup-export-btn');
  if (!container || !button || !sessionIds.length) return;
  button.disabled = true;
  container.innerHTML = `<div class="load" style="padding:15px">กำลังตรวจจำนวนข้อมูล...</div>`;
  let ready = false;
  try {
    const counts = await backupScopeCountsWithItemLocation(sessionIds);
    if (requestSerial !== _backupScopeRequestSerial || scopeKey !== backupSessionScopeKey()) return;
    window._backupScopeCounts = counts;
    window._backupScopeKey = scopeKey;
    container.innerHTML = backupCountCards(counts);
    ready = Number(counts.Sessions || 0) === sessionIds.length;
    if (!ready) throw new Error('ตรวจพบ Session ไม่ครบ กรุณาโหลดหน้าใหม่ก่อน Backup');
  } catch (error) {
    if (requestSerial !== _backupScopeRequestSerial || scopeKey !== backupSessionScopeKey()) return;
    container.innerHTML = errBox(error.message);
  } finally {
    if (requestSerial === _backupScopeRequestSerial && scopeKey === backupSessionScopeKey()) {
      button.disabled = !ready;
    }
  }
}

async function fetchAllBackupRows(table, columns, applyFilter) {
  const output = [];
  const orderColumn = table === 'data_info_items' ? 'item_code' : 'id';
  for (let from = 0; ; from += 1000) {
    let query = sb.from(table).select(columns.join(',')).order(orderColumn).range(from, from + 999);
    if (applyFilter) query = applyFilter(query);
    const { data, error } = await query;
    if (error) throw new Error(`อ่าน ${table} ไม่สำเร็จ: ${error.message}`);
    output.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return output;
}

async function fetchBackupRowsByValues(table, columns, filterColumn, values) {
  const cleanValues = [...new Set((values || []).filter(Boolean))];
  if (!cleanValues.length) return [];
  const output = [];
  for (let start = 0; start < cleanValues.length; start += 50) {
    const batch = cleanValues.slice(start, start + 50);
    const rows = await fetchAllBackupRows(table, columns, query =>
      batch.length === 1 ? query.eq(filterColumn,batch[0]) : query.in(filterColumn,batch));
    output.push(...rows);
  }
  return output;
}

async function fetchBackupExactCountByValues(table, filterColumn, values) {
  const cleanValues = [...new Set((values || []).filter(Boolean))];
  if (!cleanValues.length) return 0;
  let total = 0;
  for (let start = 0; start < cleanValues.length; start += 50) {
    const batch = cleanValues.slice(start,start+50);
    let query = sb.from(table).select('id',{ count:'exact',head:true });
    query = batch.length === 1
      ? query.eq(filterColumn,batch[0])
      : query.in(filterColumn,batch);
    const { count, error } = await query;
    if (error) throw new Error(`ตรวจจำนวน ${table} ไม่สำเร็จ: ${error.message}`);
    total += Number(count || 0);
  }
  return total;
}

async function fetchBackupExactCount(table, selectColumn='id') {
  const { count, error } = await sb.from(table).select(selectColumn,{ count:'exact',head:true });
  if (error) throw new Error(`ตรวจจำนวน ${table} ไม่สำเร็จ: ${error.message}`);
  return Number(count || 0);
}

async function backupScopeCountsWithItemLocation(sessionIds) {
  const cleanSessionIds = [...new Set((sessionIds || []).filter(Boolean))];
  const [sessionCount,assignmentRows,stockRows,annualJobs,annualJobItems,stockDetailRows,foundRows,dataInfoCount,auditCount] = await Promise.all([
    fetchBackupExactCountByValues('count_sessions','id',cleanSessionIds),
    fetchBackupRowsByValues('assignments',['id','location_id'],'session_id',cleanSessionIds),
    fetchBackupRowsByValues('stock_snapshot',['id','item_id','location_id','onhand_qty','items(code)'],'session_id',cleanSessionIds),
    fetchBackupExactCountByValues('annual_count_jobs','session_id',cleanSessionIds),
    fetchBackupExactCountByValues('annual_count_job_items','session_id',cleanSessionIds),
    fetchBackupRowsByValues('stock_snapshot_detail',['id','license_plate'],'session_id',cleanSessionIds),
    fetchBackupRowsByValues('found_items',['id','location_id','item_id','photo_url'],'session_id',cleanSessionIds),
    fetchBackupExactCount('data_info_items','item_code'),
    fetchBackupExactCountByValues('audit_log','session_id',cleanSessionIds),
  ]);
  const assignmentIds = assignmentRows.map(row => row.id).filter(Boolean);
  const [countRows,approvalCount] = await Promise.all([
    fetchBackupRowsByValues('count_records',['id','photo_url'],'assignment_id',assignmentIds),
    fetchBackupExactCountByValues('variance_approvals','assignment_id',assignmentIds),
  ]);
  return {
    Sessions:sessionCount,
    Assignments:assignmentRows.length,
    Annual_Jobs:annualJobs,
    Annual_Job_Items:annualJobItems,
    Items:new Set(
      stockRows
        .filter(row => !isEmptyLocationItem(row.items?.code))
        .map(row => row.item_id)
        .filter(Boolean)
        .concat(foundRows.map(row => row.item_id).filter(Boolean))
    ).size,
    Locations:new Set([
      ...stockRows.map(row => row.location_id),
      ...assignmentRows.map(row => row.location_id),
      ...foundRows.map(row => row.location_id),
    ].filter(Boolean)).size,
    Stock:stockRows.length,
    Stock_Qty:stockRows.reduce((sum,row) => sum + (Number(row.onhand_qty) || 0),0),
    Stock_Detail:stockDetailRows.length,
    Stock_Detail_Distinct:new Set(
      stockDetailRows.map(row => importCodeKey(row.license_plate))
        .filter(Boolean)
    ).size,
    Counts:countRows.length,
    Approvals:approvalCount,
    Found_Items:foundRows.length,
    Data_Info:dataInfoCount,
    Audit:auditCount,
    Photos:new Set([
      ...countRows.map(row => String(row.photo_url || '').trim()),
      ...foundRows.map(row => String(row.photo_url || '').trim()),
    ].filter(Boolean)).size,
  };
}

function backupCanonicalValue(value) {
  if (value === null || value === undefined) return 'N;';
  if (value === true) return 'B:1;';
  if (value === false) return 'B:0;';
  if (typeof value === 'number') {
    return Number.isFinite(value) ? `D:${String(value)};` : 'D:INVALID;';
  }
  if (typeof value === 'object') {
    try { value = JSON.stringify(value); }
    catch (_) { value = String(value); }
  }
  const source = String(value).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  return `S:${source.length}:${source};`;
}

function backupCanonicalValueV1(value) {
  if (value === null || value === undefined || value === '') return '<NULL>';
  if (value === true) return '<TRUE>';
  if (value === false) return '<FALSE>';
  if (typeof value === 'number') return Number.isFinite(value) ? String(value) : '<INVALID>';
  return String(value).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function backupRowsChecksum(rows, columns, formatVersion=BACKUP_FORMAT_VERSION) {
  let hash = 2166136261;
  const canonicalValue = String(formatVersion) === '1'
    ? backupCanonicalValueV1
    : backupCanonicalValue;
  const update = text => {
    const source = String(text);
    for (let i = 0; i < source.length; i++) {
      hash ^= source.charCodeAt(i);
      hash = Math.imul(hash, 16777619) >>> 0;
    }
  };
  update(columns.join('\t')); update('\n');
  (rows || []).forEach(row => {
    columns.forEach(column => { update(canonicalValue(row[column])); update('\t'); });
    update('\n');
  });
  return hash.toString(16).padStart(8,'0');
}

function backupSplitExcelText(value, chunkSize=BACKUP_EXCEL_CHUNK_SIZE) {
  const text = String(value ?? '');
  if (!text.length) return [''];
  const chunks = [];
  let offset = 0;
  while (offset < text.length) {
    let end = Math.min(text.length, offset + chunkSize);
    if (end < text.length) {
      const lastCode = text.charCodeAt(end - 1);
      if (lastCode >= 0xD800 && lastCode <= 0xDBFF) end--;
    }
    chunks.push(text.slice(offset,end));
    offset = end;
  }
  return chunks;
}

function backupTeamCellValue(value) {
  if (value === null || value === undefined) return '';
  let output = value;
  if (typeof value === 'object' && !(value instanceof Date)) {
    try { output = JSON.stringify(value); }
    catch (_) { output = String(value); }
  }
  if (typeof output !== 'string' || output.length <= BACKUP_EXCEL_CELL_LIMIT) return output;
  const suffix = '\n[ข้อความยาวเกินข้อจำกัด Excel — ข้อมูลเต็มอยู่ในชีตระบบแบบแบ่งส่วน]';
  return output.slice(0,BACKUP_EXCEL_CELL_LIMIT - suffix.length) + suffix;
}

function backupRowsForExcel(rows, columns, formatVersion=BACKUP_FORMAT_VERSION) {
  if (Number(formatVersion) < 3) return { rows:rows || [], columns:[...columns] };
  const maxParts = Object.fromEntries(columns.map(column => [column,1]));
  const preparedRows = (rows || []).map(row => {
    const output = {};
    columns.forEach(column => {
      let value = row?.[column];
      if (value && typeof value === 'object' && !(value instanceof Date)) {
        try { value = JSON.stringify(value); }
        catch (_) { value = String(value); }
      }
      if (typeof value !== 'string' || value.length <= BACKUP_EXCEL_CHUNK_SIZE) {
        output[column] = value;
        return;
      }
      const parts = backupSplitExcelText(value);
      maxParts[column] = Math.max(maxParts[column],parts.length);
      output[column] = parts[0];
      for (let part = 1; part < parts.length; part++) {
        output[`${column}${BACKUP_CHUNK_MARKER}${part + 1}`] = parts[part];
      }
    });
    return output;
  });
  const excelColumns = columns.flatMap(column => {
    const output = [column];
    for (let part = 2; part <= maxParts[column]; part++) {
      output.push(`${column}${BACKUP_CHUNK_MARKER}${part}`);
    }
    return output;
  });
  return { rows:preparedRows, columns:excelColumns };
}

function backupRowsFromExcel(rows, columns, formatVersion) {
  if (Number(formatVersion) < 3) {
    return (rows || []).map(row => Object.fromEntries(columns.map(column => [column,row?.[column] ?? null])));
  }
  return (rows || []).map(row => Object.fromEntries(columns.map(column => {
    const baseValue = row?.[column] ?? null;
    const partPrefix = `${column}${BACKUP_CHUNK_MARKER}`;
    const partKeys = Object.keys(row || {})
      .filter(key => key.startsWith(partPrefix))
      .sort((a,b) => Number(a.slice(partPrefix.length)) - Number(b.slice(partPrefix.length)));
    const hasContinuation = partKeys.some(key =>
      row[key] !== null && row[key] !== undefined && String(row[key]) !== '');
    if (!hasContinuation) return [column,baseValue];
    const restored = [baseValue ?? '',...partKeys.map(key => row[key] ?? '')].map(String).join('');
    return [column,restored];
  })));
}

function backupManifestRowsForExcel(entries, formatVersion) {
  if (Number(formatVersion) < 3) return entries;
  return (entries || []).flatMap(entry => {
    const parts = backupSplitExcelText(entry.value);
    return parts.map((value,index) => ({
      key:index === 0 ? entry.key : `${entry.key}${BACKUP_CHUNK_MARKER}${index + 1}`,
      value,
    }));
  });
}

function backupManifestRowsFromExcel(entries, formatVersion) {
  if (Number(formatVersion) < 3) return entries;
  const entryMap = new Map((entries || []).map(entry => [entry.key,entry.value]));
  return (entries || [])
    .filter(entry => !entry.key.includes(BACKUP_CHUNK_MARKER))
    .map(entry => {
      let value = String(entry.value ?? '');
      for (let part = 2; ; part++) {
        const key = `${entry.key}${BACKUP_CHUNK_MARKER}${part}`;
        if (!entryMap.has(key)) break;
        value += String(entryMap.get(key) ?? '');
      }
      return { key:entry.key, value };
    });
}

function backupScopeSet(values) {
  return new Set((values || []).map(value => String(value || '').trim()).filter(Boolean));
}

function sanitizeBackupDataForSessions(dataBySheet, sessionIds) {
  const selectedSessionIds = backupScopeSet(sessionIds);
  if (!selectedSessionIds.size) throw new Error('ไม่พบ Session ที่เลือกสำหรับ Backup');
  const output = Object.fromEntries(BACKUP_SHEET_SPECS.map(spec =>
    [spec.sheet,[...(dataBySheet?.[spec.sheet] || [])]]));
  const inSelectedSession = row => selectedSessionIds.has(String(row?.session_id || ''));

  output.Sessions = output.Sessions.filter(row => selectedSessionIds.has(String(row?.id || '')));
  ['Assignments','Annual_Jobs','Annual_Job_Items','Stock','Stock_Detail','Found_Items','Audit']
    .forEach(sheet => { output[sheet] = output[sheet].filter(inSelectedSession); });

  const assignmentIds = backupScopeSet(output.Assignments.map(row => row.id));
  output.Counts = output.Counts.filter(row => assignmentIds.has(String(row?.assignment_id || '')));
  output.Approvals = output.Approvals.filter(row => assignmentIds.has(String(row?.assignment_id || '')));

  const annualJobIds = backupScopeSet(output.Annual_Jobs.map(row => row.id));
  output.Annual_Job_Items = output.Annual_Job_Items.filter(row =>
    inSelectedSession(row) && annualJobIds.has(String(row?.job_id || '')));

  const locationIds = backupScopeSet([
    ...output.Assignments.map(row => row.location_id),
    ...output.Annual_Job_Items.map(row => row.location_id),
    ...output.Stock.map(row => row.location_id),
    ...output.Stock_Detail.map(row => row.location_id),
    ...output.Found_Items.map(row => row.location_id),
    ...output.Audit.map(row => row.location_id),
  ]);
  const itemIds = backupScopeSet([
    ...output.Annual_Job_Items.map(row => row.item_id),
    ...output.Stock.map(row => row.item_id),
    ...output.Stock_Detail.map(row => row.item_id),
    ...output.Counts.map(row => row.item_id),
    ...output.Approvals.map(row => row.item_id),
    ...output.Found_Items.flatMap(row => [row.item_id,row.promoted_item_id]),
    ...output.Audit.map(row => row.item_id),
  ]);
  output.Locations = output.Locations.filter(row => locationIds.has(String(row?.id || '')));
  output.Items = output.Items.filter(row => itemIds.has(String(row?.id || '')));

  const profileIds = backupScopeSet([
    ...output.Sessions.map(row => row.created_by),
    ...output.Assignments.flatMap(row => [row.assigned_to]),
    ...output.Annual_Jobs.flatMap(row => [row.assigned_to,row.created_by]),
    ...output.Counts.map(row => row.counted_by),
    ...output.Approvals.flatMap(row => [row.approved_by,row.wms_fixed_by]),
    ...output.Found_Items.flatMap(row => [row.discovered_by,row.reviewed_by]),
    ...output.Audit.map(row => row.performed_by),
  ]);
  const counterIds = backupScopeSet([
    ...output.Assignments.flatMap(row => [row.counter_r2_id,row.counter_r3_id]),
    ...output.Counts.map(row => row.actual_counter_id),
  ]);
  output.Profiles = output.Profiles.filter(row => profileIds.has(String(row?.id || '')));
  output.Counters = output.Counters.filter(row => counterIds.has(String(row?.id || '')));

  validateBackupDataScope(output,[...selectedSessionIds]);
  return output;
}

function validateBackupDataScope(dataBySheet, sessionIds) {
  const selectedSessionIds = backupScopeSet(sessionIds);
  const actualSessionIds = backupScopeSet((dataBySheet.Sessions || []).map(row => row.id));
  const missingSessionIds = [...selectedSessionIds].filter(id => !actualSessionIds.has(id));
  const extraSessionIds = [...actualSessionIds].filter(id => !selectedSessionIds.has(id));
  const problems = [];
  if (missingSessionIds.length) problems.push(`ไม่พบ Session ที่เลือก ${missingSessionIds.length} รายการ`);
  if (extraSessionIds.length) problems.push(`พบ Session นอกขอบเขต ${extraSessionIds.length} รายการ`);

  ['Assignments','Annual_Jobs','Annual_Job_Items','Stock','Stock_Detail','Found_Items','Audit'].forEach(sheet => {
    const invalid = (dataBySheet[sheet] || []).filter(row =>
      !selectedSessionIds.has(String(row?.session_id || ''))).length;
    if (invalid) problems.push(`${sheet} ข้าม Session ${invalid} แถว`);
  });

  const assignmentIds = backupScopeSet((dataBySheet.Assignments || []).map(row => row.id));
  ['Counts','Approvals'].forEach(sheet => {
    const invalid = (dataBySheet[sheet] || []).filter(row =>
      !assignmentIds.has(String(row?.assignment_id || ''))).length;
    if (invalid) problems.push(`${sheet} ไม่ตรงกับงานที่เลือก ${invalid} แถว`);
  });
  const invalidFoundAssignments = (dataBySheet.Found_Items || []).filter(row =>
    (row?.assignment_id && !assignmentIds.has(String(row.assignment_id)))
    || (row?.promoted_assignment_id && !assignmentIds.has(String(row.promoted_assignment_id)))).length;
  if (invalidFoundAssignments) {
    problems.push(`Found_Items ไม่ตรงกับงานที่เลือก ${invalidFoundAssignments} แถว`);
  }

  const annualJobIds = backupScopeSet((dataBySheet.Annual_Jobs || []).map(row => row.id));
  const invalidJobItems = (dataBySheet.Annual_Job_Items || []).filter(row =>
    !annualJobIds.has(String(row?.job_id || ''))).length;
  if (invalidJobItems) problems.push(`Annual_Job_Items ไม่ตรงกับ JOB ที่เลือก ${invalidJobItems} แถว`);

  if (problems.length) {
    throw new Error(`หยุดสร้างไฟล์เพื่อป้องกันข้อมูลข้าม Session: ${problems.join(' · ')}`);
  }
  return true;
}

async function collectBackupData(sessionIds) {
  const cleanSessionIds = [...backupScopeSet(sessionIds)];
  if (!cleanSessionIds.length) throw new Error('กรุณาเลือก Session ก่อน Backup');
  const dataBySheet = {};
  for (let index = 0; index < BACKUP_SHEET_SPECS.length; index++) {
    const spec = BACKUP_SHEET_SPECS[index];
    setBackupProgress(Math.round(index / BACKUP_SHEET_SPECS.length * 72),
      `กำลังอ่าน ${spec.sheet} (${index + 1}/${BACKUP_SHEET_SPECS.length})...`, 'export');
    let rows = [];
    if (spec.scope === 'master' || spec.scope === 'reference') {
      rows = await fetchAllBackupRows(spec.table, spec.columns);
    } else if (spec.scope === 'session') {
      const filterColumn = spec.table === 'count_sessions' ? 'id' : 'session_id';
      rows = await fetchBackupRowsByValues(spec.table, spec.columns, filterColumn, cleanSessionIds);
    } else {
      const assignmentIds = (dataBySheet.Assignments || []).map(row => row.id);
      rows = await fetchBackupRowsByValues(spec.table, spec.columns, 'assignment_id', assignmentIds);
    }
    if (rows.length > 1048575 - 1) {
      throw new Error(`${spec.sheet} มีมากกว่า 1,048,574 แถว เกินขนาดสูงสุดของ Excel กรุณา Backup แยก Session`);
    }
    dataBySheet[spec.sheet] = rows;
  }
  return sanitizeBackupDataForSessions(dataBySheet,cleanSessionIds);
}

function backupSafeFilePart(value) {
  return String(value || 'sessions')
    .replace(/[\\/:*?"<>|]/g,'_')
    .replace(/\s+/g,'_')
    .slice(0,50);
}

function backupTimestampForFile(date=new Date()) {
  const pad = value => String(value).padStart(2,'0');
  return `${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}`;
}

function backupHasValue(value) {
  return value !== null && value !== undefined && value !== '';
}

function backupNumber(value) {
  if (!backupHasValue(value)) return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function backupDateForTeam(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  try {
    return new Intl.DateTimeFormat('sv-SE', {
      timeZone:'Asia/Bangkok',
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit',
      hour12:false,
    }).format(date);
  } catch (_) {
    return date.toISOString().replace('T',' ').slice(0,19);
  }
}

function backupLatestRecord(rows, dateColumn='counted_at') {
  return (rows || []).reduce((latest,row) => {
    if (!latest) return row;
    const latestTime = Date.parse(latest?.[dateColumn] || '') || 0;
    const rowTime = Date.parse(row?.[dateColumn] || '') || 0;
    return rowTime >= latestTime ? row : latest;
  }, null);
}
